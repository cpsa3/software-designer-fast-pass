"模拟卷6", "questionNo": 67, "sourceType": "mock", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "知识产权—委托开发著作权", "stem": "某公司委托甲软件公司开发一套管理系统，双方未就软件著作权归属作出约定。根据《著作权法》，该软件的著作权属于（ ）。", "options": {"A": "委托方", "B": "受托方（甲软件公司）", "C": "双方共有", "D": "国家所有"}, "answer": "B", "analysis": "根据《著作权法》第十九条，受委托创作的作品，著作权的归属由委托人和受托人通过合同约定。合同未作明确约定或者没有订立合同的，著作权属于受托人。"}, {"id": "mock-2026年5月-模拟卷6-068", "index": 443, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 68, "sourceType": "mock", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "知识产权—合理使用", "stem": "下列行为中，不构成对软件著作权侵权的是（ ）。", "options": {"A": "未经许可复制他人软件用于商业销售", "B": "为了学习和研究，安装正版软件的一份备份", "C": "将他人软件署上自己的名字发布", "D": "未经许可出租他人软件的复制品"}, "answer": "B", "analysis": "为了学习和研究，安装正版软件的一份备份属于\"合理使用\"范畴（为备份目的制作一份复制品），不构成侵权。其他选项中的商业复制、冒名发布、未经许可出租均构成侵权行为。"}, {"id": "mock-2026年5月-模拟卷6-069", "index": 444, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 69, "sourceType": "mock", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "知识产权—专利权", "stem": "在知识产权保护中，（ ）保护的是具有新颖性、创造性和实用性的技术方案。", "options": {"A": "商标权", "B": "著作权", "C": "专利权", "D": "商业秘密权"}, "answer": "C", "analysis": "专利权保护具有新颖性、创造性和实用性的技术方案，包括发明专利、实用新型专利和外观设计专利。著作权保护作品的表达形式，商标权保护商业标识，商业秘密权保护不公开的商业信息。"}, {"id": "mock-2026年5月-模拟卷6-070", "index": 445, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 70, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "法律法规—个人信息保护法", "stem": "根据《中华人民共和国个人信息保护法》，处理个人信息应当遵循（ ）原则，收集个人信息应当限于实现处理目的的最小范围。", "options": {"A": "公开透明", "B": "最小必要", "C": "自愿参与", "D": "对等交换"}, "answer": "B", "analysis": "根据《个人信息保护法》第六条，处理个人信息应当具有明确、合理的目的，并应当与处理目的直接相关，采取对个人权益影响最小的方式。收集个人信息，应当限于实现处理目的的最小范围，不得过度收集个人信息，即\"最小必要\"原则。"}, {"id": "mock-2026年5月-模拟卷6-071", "index": 446, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 71, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "技术英语—Cloud Native", "stem": "According to the passage, which of the following is NOT a characteristic of cloud-native architecture?", "options": {"A": "Microservices", "B": "Monolithic deployment", "C": "Containers", "D": "Declarative APIs"}, "answer": "B", "analysis": "文章明确提到云原生架构的特征包括microservices、containers、service meshes、immutable infrastructure和declarative APIs。\"Monolithic deployment\"（单体部署）与云原生的微服务理念相悖，不是云原生架构的特征。"}, {"id": "mock-2026年5月-模拟卷6-072", "index": 447, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 72, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "技术英语—Kubernetes", "stem": "The passage states that Kubernetes is primarily used for ( ).", "options": {"A": "Developing microservices code", "B": "Automating deployment, scaling, and management of containerized applications", "C": "Providing database services", "D": "Building service mesh infrastructure"}, "answer": "B", "analysis": "文章第二段明确指出\"Kubernetes has emerged as the de facto standard for container orchestration, automating deployment, scaling, and management of containerized applications.\""}, {"id": "mock-2026年5月-模拟卷6-073", "index": 448, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 73, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "技术英语—Service Mesh", "stem": "In the context of service meshes, the sidecar proxy pattern means ( ).", "options": {"A": "A centralized proxy handles all service communication", "B": "A proxy is deployed alongside each service instance", "C": "Services communicate directly without any proxy", "D": "Proxy is only used for external-facing services"}, "answer": "B", "analysis": "文章第三段指出\"The sidecar proxy pattern, where a proxy is deployed alongside each service instance, is the most common implementation approach.\"即sidecar代理模式是在每个服务实例旁部署一个代理。"}, {"id": "mock-2026年5月-模拟卷6-074", "index": 449, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 74, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "技术英语—Observability", "stem": "Which of the following is described as one of the three pillars of observability?", "options": {"A": "Alerts", "B": "Dashboards", "C": "Traces", "D": "Reports"}, "answer": "C", "analysis": "文章第四段明确指出可观测性的三大支柱是\"metrics (quantitative measurements), logs (timestamped records), and traces (end-to-end request flow)\"。Traces是三大支柱之一。"}, {"id": "mock-2026年5月-模拟卷6-075", "index": 450, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 75, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "技术英语—Cloud Native adoption", "stem": "The passage suggests that adopting cloud-native architecture ( ).", "options": {"A": "Eliminates all operational complexity", "B": "Is only suitable for small organizations", "C": "Requires investment in platform engineering and DevOps culture", "D": "Has no measurable benefits"}, "answer": "C", "analysis": "文章最后一段指出\"Organizations must invest in building platform engineering capabilities, establishing GitOps workflows for continuous delivery, and cultivating a DevOps culture...\"即采用云原生架构需要投资于平台工程能力建设和DevOps文化培养。"}, {"id": "mock-2026年5月-模拟卷7-001", "index": 451, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 1, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "计算机组成—流水线计算", "stem": "某计算机系统采用4级流水线，每级的执行时间分别为t、2t、t、t。若采用同步流水线方式执行100条指令，则总执行时间为（ ）。", "options": {"A": "100t + 3t", "B": "200t + 6t", "C": "100×2t + 3×2t", "D": "200t + 3t"}, "answer": "C", "analysis": "同步流水线以最慢的流水段时间为时钟周期，即Δt=2t。执行100条指令：第1条指令完成需4×2t=8t（装满流水线），之后每2t完成一条指令。总时间=4×2t+99×2t=(4+99)×2t=103×2t=206t。即100×2t+3×2t。"}, {"id": "mock-2026年5月-模拟卷7-002", "index": 452, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 2, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "操作系统—银行家算法", "stem": "在操作系统中，某系统有3类资源R1、R2、R3，可用数量分别为(3,2,2)。系统中有进程P1、P2、P3，其最大需求分别为(3,2,1)、(1,1,2)、(2,1,1)，当前已分配分别为(2,1,0)、(0,1,1)、(1,0,1)。使用银行家算法判断，当前系统状态（ ）。", "options": {"A": "不安全，会发生死锁", "B": "安全，存在安全序列 P1→P2→P3", "C": "安全，存在安全序列 P2→P1→P3", "D": "安全，存在安全序列 P2→P3→P1"}, "answer": "A", "analysis": "使用银行家算法判断系统安全性：\n- 总资源：(3,2,2)\n- 最大需求：P1(3,2,1)、P2(1,1,2)、P3(2,1,1)\n- 已分配：P1(2,1,0)、P2(0,1,1)、P3(1,0,1)\n- 剩余需求：P1(1,1,1)、P2(1,0,1)、P3(1,1,0)\n- 可用资源 = (3,2,2) - (2+0+1, 1+1+0, 0+1+1) = (0,0,0)\n\n尝试找安全序列：\n- P1需要(1,1,1) > 可用(0,0,0) ✗\n- P2需要(1,0,1) > 可用(0,0,0) ✗\n- P3需要(1,1,0) > 可用(0,0,0) ✗\n\n当前可用资源为(0,0,0)，无法满足任何进程的剩余需求，因此无法找到安全序列，系统处于不安全状态，可能发生死锁。"}, {"id": "mock-2026年5月-模拟卷7-003", "index": 453, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 3, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "计算机网络—OSI模型", "stem": "在计算机网络的OSI参考模型中，实现端到端的可靠数据传输，负责差错控制和流量控制的是（ ）。", "options": {"A": "网络层", "B": "传输层", "C": "会话层", "D": "数据链路层"}, "answer": "B", "analysis": "OSI模型中，传输层负责端到端的可靠数据传输，提供差错控制、流量控制和拥塞控制。数据链路层提供相邻节点间的可靠传输（点到点），传输层提供端到端的可靠传输。"}, {"id": "mock-2026年5月-模拟卷7-004", "index": 454, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 4, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "数据结构—哈夫曼编码", "stem": "某哈夫曼编码系统对字符集{A, B, C, D, E}进行编码，各字符出现频率分别为0.35、0.25、0.20、0.12、0.08。则编码后的加权平均码长为（ ）位。", "options": {"A": "2.00", "B": "2.20", "C": "2.28", "D": "2.50"}, "answer": "B", "analysis": "构建哈夫曼树：从最小频率开始合并。\n字符频率：A(0.35)、B(0.25)、C(0.20)、D(0.12)、E(0.08)\n\n合并步骤：\n1. E(0.08) + D(0.12) = ED(0.20)\n2. ED(0.20) + C(0.20) = EDC(0.40)\n3. B(0.25) + A(0.35) = BA(0.60)\n4. EDC(0.40) + BA(0.60) = 根(1.00)\n\n哈夫曼编码（一种可能）：\n- A: 11 (2位)\n- B: 10 (2位)\n- C: 00 (2位)\n- D: 010 (3位)\n- E: 011 (3位)\n\n加权平均码长 = 0.35×2 + 0.25×2 + 0.20×2 + 0.12×3 + 0.08×3\n            = 0.70 + 0.50 + 0.40 + 0.36 + 0.24\n            = 2.20 位\n\n哈夫曼编码保证最优WPL，答案为2.20位。"}, {"id": "mock-2026年5月-模拟卷7-005", "index": 455, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 5, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "计算机组成—中断机制", "stem": "在中断处理过程中，CPU响应中断的条件不包括（ ）。", "options": {"A": "当前指令执行完毕", "B": "有中断请求信号", "C": "CPU处于开中断状态", "D": "CPU处于DMA数据传输状态"}, "answer": "D", "analysis": "CPU响应中断的条件：(1)有中断请求信号(B)，(2)CPU处于开中断状态(C)，(3)当前指令执行完毕(A)。DMA数据传输是CPU将总线控制权让给DMA控制器，此时CPU不一定不能响应中断——DMA和中断可以共存。D不是CPU响应中断的必要条件（实际上DMA期间CPU仍可响应中断）。"}, {"id": "mock-2026年5月-模拟卷7-006", "index": 456, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 6, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "计算机组成—RISC vs CISC", "stem": "关于RISC（精简指令集）和CISC（复杂指令集）的比较，以下说法正确的是（ ）。", "options": {"A": "RISC的指令数量多于CISC", "B": "RISC采用微程序控制，CISC采用硬布线控制", "C": "RISC指令长度固定，大多在一个时钟周期内完成", "D": "RISC的寻址方式多于CISC"}, "answer": "C", "analysis": "RISC的特点：指令数量少、指令长度固定、大多数指令在一个时钟周期完成、采用硬布线控制（CISC采用微程序控制）、寻址方式少、大量通用寄存器。A错（RISC指令少），B错（反了），D错（RISC寻址方式少）。"}, {"id": "mock-2026年5月-模拟卷7-007", "index": 457, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 7, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "操作系统—文件系统索引", "stem": "若某文件系统采用多级索引结构，磁盘块大小为4KB，每个磁盘块地址占4字节。若采用二级索引，则该文件系统支持的最大文件大小为（ ）。", "options": {"A": "4GB", "B": "1GB", "C": "4MB", "D": "1MB"}, "answer": "A", "analysis": "每个磁盘块4KB，每个地址4字节，则每个索引块可存储4KB/4B=1024个地址。二级索引：一级索引块指向1024个二级索引块，每个二级索引块指向1024个数据块。最大文件=1024×1024×4KB=1024²×4KB=4GB。"}, {"id": "mock-2026年5月-模拟卷7-008", "index": 458, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 8, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "计算机网络—CSMA/CD", "stem": "在以太网中，CSMA/CD协议的冲突检测机制要求最短帧长度不小于（ ），其中RTT为往返传播延迟，数据速率为R。", "options": {"A": "RTT × R", "B": "RTT × R / 2", "C": "2 × RTT × R", "D": "RTT / R"}, "answer": "A", "analysis": "CSMA/CD冲突检测要求：发送帧的时间必须大于信号在两端之间往返传播的时间（RTT），即发送时间≥RTT。最短帧长度=RTT×R（数据速率）。这样发送方在发送完最后一位前就能检测到冲突。"}, {"id": "mock-2026年5月-模拟卷7-009", "index": 459, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 9, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "计算机组成—浮点数表示", "stem": "某系统使用16位浮点数表示，其中1位符号位、5位阶码（移码表示，偏移值为15）、10位尾数（隐含1位整数位）。该浮点数能表示的最大正规格化数约为（ ）。", "options": {"A": "2^15", "B": "2^16 × (2-2^(-10))", "C": "2^16", "D": "2^15 × (2-2^(-10))"}, "answer": "D", "analysis": "浮点数格式：1位符号 + 5位阶码（移码，偏移15）+ 10位尾数（隐含1位）\n- 5位阶码范围：00000~11111 (0~31)\n- IEEE标准中，全1阶码(31)通常保留为特殊值（无穷大/NaN）\n- 最大正规格化阶码：11110 = 30，实际阶码 = 30 - 15 = 15\n- 尾数：1.1111111111₂ = 2 - 2^(-10)\n- 最大正规格化数 = 2^15 × (2 - 2^(-10))"}, {"id": "mock-2026年5月-模拟卷7-010", "index": 460, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 10, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "数据结构—最小生成树", "stem": "在一个无向图G中，有8个顶点和12条边。该图的最小生成树包含（ ）条边。", "options": {"A": "6", "B": "7", "C": "8", "D": "12"}, "answer": "B", "analysis": "最小生成树包含的边数=顶点数-1=8-1=7条边。无论图中有多少条边，最小生成树始终包含n-1条边（n为顶点数）。"}, {"id": "mock-2026年5月-模拟卷7-011", "index": 461, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 11, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "需求工程—形式化方法", "stem": "在软件需求分析中，使用Z语言进行需求描述属于（ ）方法。", "options": {"A": "非形式化方法", "B": "半形式化方法", "C": "形式化方法", "D": "结构化方法"}, "answer": "C", "analysis": "Z语言是一种基于集合论和一阶谓词逻辑的形式化规格说明语言（Formal Method），用数学符号精确描述系统规格。非形式化方法用自然语言，半形式化方法如UML用图形化表示。"}, {"id": "mock-2026年5月-模拟卷7-012", "index": 462, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 12, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件过程—RUP", "stem": "在统一过程（RUP）中，大部分编码工作在（ ）阶段完成。", "options": {"A": "初始阶段", "B": "精化阶段", "C": "构建阶段", "D": "移交阶段"}, "answer": "C", "analysis": "RUP的四个阶段：初始（确定项目范围和可行性）、精化（确定架构，处理高风险需求）、构建（大部分编码和测试工作）、移交（交付给用户）。大部分编码在构建阶段完成。"}, {"id": "mock-2026年5月-模拟卷7-013", "index": 463, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 13, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "设计模式—行为型模式", "stem": "在面向对象设计中，下列关于设计模式的说法错误的是（ ）。", "options": {"A": "观察者模式定义了对象间一对多的依赖关系", "B": "策略模式将算法封装在独立的类中，使它们可以互相替换", "C": "模板方法模式定义算法骨架，将某些步骤延迟到子类实现", "D": "命令模式通过继承来扩展对象的功能"}, "answer": "D", "analysis": "命令模式将请求封装为对象，支持请求的排队、撤销等操作。\"通过继承来扩展对象的功能\"是不准确的——命令模式使用组合而非继承。装饰器模式才是动态地为对象增加功能的模式。"}, {"id": "mock-2026年5月-模拟卷7-014", "index": 464, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 14, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "软件度量—Halstead", "stem": "关于软件复杂度度量，Halstead度量中程序长度N的计算公式为N=N1+N2，其中N1和N2分别表示（ ）。", "options": {"A": "不同操作符数量和不同操作数数量", "B": "操作符出现的总次数和操作数出现的总次数", "C": "判定节点数和边数", "D": "代码行数和注释行数"}, "answer": "B", "analysis": "Halstead度量中：n1=不同操作符数量，n2=不同操作数数量；N1=操作符出现总次数，N2=操作数出现总次数。程序长度N=N1+N2，程序词汇量n=n1+n2。"}, {"id": "mock-2026年5月-模拟卷7-015", "index": 465, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 15, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件过程—RUP工作流", "stem": "在软件过程中，Rational统一过程（RUP）的核心工作流不包括（ ）。", "options": {"A": "业务建模", "B": "需求", "C": "配置管理", "D": "编码实现"}, "answer": "D", "analysis": "RUP的9个核心工作流包括：6个工程工作流（业务建模、需求、分析与设计、实现、测试、部署）和3个支持工作流（配置与变更管理、项目管理、环境）。没有独立的\"编码实现\"工作流，编码属于\"实现\"工作流的一部分。"}, {"id": "mock-2026年5月-模拟卷7-016", "index": 466, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 16, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "UML建模—状态图", "stem": "在UML状态图中，用于表示对象在外部事件和内部条件组合作用下的状态转换的元素是（ ）。", "options": {"A": "活动", "B": "转换", "C": "状态", "D": "伪状态"}, "answer": "B", "analysis": "UML状态图中，转换（Transition）表示对象从一个状态到另一个状态的迁移，由事件触发，可以有守护条件和动作。转换是状态变化的核心建模元素。"}, {"id": "mock-2026年5月-模拟卷7-017", "index": 467, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 17, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "系统工程—霍尔三维", "stem": "在系统工程中，霍尔三维结构的三个维度分别是时间维、逻辑维和（ ）。", "options": {"A": "技术维", "B": "知识维", "C": "组织维", "D": "过程维"}, "answer": "B", "analysis": "霍尔三维结构（Hall's Three-Dimensional Structure）是系统工程方法论，三个维度是：时间维（项目阶段）、逻辑维（解决问题的逻辑步骤）、知识维（所需的专业知识和技术）。"}, {"id": "mock-2026年5月-模拟卷7-018", "index": 468, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 18, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "DevOps—IaC", "stem": "在DevOps实践中，\"Infrastructure as Code\"（基础设施即代码）的核心理念是（ ）。", "options": {"A": "使用图形界面管理基础设施", "B": "通过代码和自动化工具来定义、配置和管理基础设施", "C": "手动编写脚本来部署服务器", "D": "将应用代码与基础设施代码混合在同一个仓库"}, "answer": "B", "analysis": "Infrastructure as Code（IaC）的核心理念是通过代码（如Terraform、Ansible、CloudFormation）来定义、配置和管理基础设施，实现基础设施的自动化、版本化和可重复部署。"}, {"id": "mock-2026年5月-模拟卷7-019", "index": 469, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 19, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "软件度量—功能点分析", "stem": "功能点分析法（FPA）中，用于度量软件规模的基本功能类型不包括（ ）。", "options": {"A": "外部输入（EI）", "B": "外部输出（EO）", "C": "内部接口（II）", "D": "外部接口文件（EIF）"}, "answer": "C", "analysis": "功能点分析法的5种基本功能类型：外部输入（EI）、外部输出（EO）、外部查询（EQ）、内部逻辑文件（ILF）、外部接口文件（EIF）。没有\"内部接口（II）\"这一类型。"}, {"id": "mock-2026年5月-模拟卷7-020", "index": 470, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 20, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "软件可靠性—Musa模型", "stem": "在软件可靠性模型中，Musa模型将软件故障的发生与（ ）关联，而非日历时间。", "options": {"A": "代码行数", "B": "CPU执行时间", "C": "测试用例数量", "D": "缺陷密度"}, "answer": "B", "analysis": "Musa模型（Musa执行时间模型）将软件故障的发生与CPU执行时间（而非日历时间）关联。因为软件故障只在程序执行时才会暴露，CPU执行时间比日历时间更能反映软件的实际运行状况。"}, {"id": "mock-2026年5月-模拟卷7-021", "index": 471, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 21, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "DevOps—持续集成", "stem": "在敏捷开发中，持续集成（CI）实践要求开发人员（ ）。", "options": {"A": "每月集成一次代码", "B": "在每个Sprint结束时集成代码", "C": "频繁地将代码集成到主线，每次集成都通过自动化构建和测试验证", "D": "只在功能完全开发完成后才提交代码"}, "answer": "C", "analysis": "持续集成（CI）的核心实践是开发人员频繁地（至少每天一次）将代码集成到共享的主线分支，每次集成都通过自动化构建和测试来验证，尽早发现和修复集成问题。"}, {"id": "mock-2026年5月-模拟卷7-022", "index": 472, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 22, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "面向对象分析—CRC技术", "stem": "在面向对象分析中，CRC（Class-Responsibility-Collaborator）卡片技术用于（ ）。", "options": {"A": "代码审查", "B": "识别类的职责和协作关系", "C": "性能测试", "D": "数据库设计"}, "answer": "B", "analysis": "CRC（Class-Responsibility-Collaborator）卡片是面向对象分析中的一种技术，用索引卡片记录每个类的名称、职责（该类做什么）和协作者（与哪些类协作完成职责），帮助识别和定义系统中的类及其关系。"}, {"id": "mock-2026年5月-模拟卷7-023", "index": 473, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 23, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构风格—C2风格", "stem": "在软件架构中，C2（Components and Connectors）架构风格的主要特征不包括（ ）。", "options": {"A": "构件和连接件都有一个顶部和一个底部", "B": "构件的底部可以与连接件的顶部连接", "C": "一个连接件可以直接和另一个构件连接（不经过连接件中介）", "D": "构件之间不允许直接连接"}, "answer": "C", "analysis": "C2架构风格中，构件之间不能直接连接（D正确），必须通过连接件交互。构件的底部与连接件的顶部连接，连接件的底部与构件的顶部连接（A、B正确）。C选项\"一个连接件可以直接和另一个构件连接不经过连接件中介\"描述不准确——应该是连接件与构件直接连接是允许的，但构件间不能直接连接。"}, {"id": "mock-2026年5月-模拟卷7-024", "index": 474, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 24, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构设计—质量属性战术", "stem": "在架构设计中，质量属性的\"战术\"（Tactics）是指（ ）。", "options": {"A": "架构的整体风格和模式", "B": "影响质量属性实现的设计决策集合", "C": "系统的功能需求分解", "D": "项目的技术选型方案"}, "answer": "B", "analysis": "架构战术（Tactics）是影响质量属性实现的设计决策的集合。例如，提高可用性的战术包括心跳检测、冗余备份、故障转移等。战术是架构模式和架构风格之下更细粒度的设计决策。"}, {"id": "mock-2026年5月-模拟卷7-025", "index": 475, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 25, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构设计方法—ABSD", "stem": "在ABSD（基于架构的软件开发）方法中，架构设计的第一步是（ ）。", "options": {"A": "选择架构风格", "B": "创建架构文档", "C": "标识构件", "D": "提出架构模型"}, "answer": "C", "analysis": "ABSD（Architecture Based Software Development）方法中，架构设计首先要标识构件（识别系统中的核心构件），然后确定构件之间的交互关系，再选择架构风格和模式。"}, {"id": "mock-2026年5月-模拟卷7-026", "index": 476, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 26, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构风格—黑板", "stem": "某大数据分析系统需要对语音、文本、图像等多源数据进行智能分析决策。多个独立的知识源根据共享数据空间中的信息状态，协同解决一个复杂问题。该系统最适合采用的架构风格是（ ）。", "options": {"A": "管道-过滤器", "B": "黑板", "C": "事件驱动", "D": "层次结构"}, "answer": "B", "analysis": "黑板架构风格由三部分组成：黑板（共享数据空间）、知识源（独立的专家模块）、控制器（协调知识源的调用）。多个知识源根据黑板上的数据状态协同解决复杂问题，适用于语音识别、图像识别等多源数据融合的场景。"}, {"id": "mock-2026年5月-模拟卷7-027", "index": 477, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 27, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "微服务架构—API网关", "stem": "在微服务架构中，下列关于API网关的说法错误的是（ ）。", "options": {"A": "API网关可以实现请求路由和服务聚合", "B": "API网关可以进行身份认证和授权", "C": "API网关应该包含业务逻辑处理", "D": "API网关可以进行限流和熔断"}, "answer": "C", "analysis": "API网关应该是\"薄层\"，只负责横切关注点（路由、认证、限流、监控等），不应包含业务逻辑处理。业务逻辑应由后端微服务实现。如果API网关包含业务逻辑，会导致它变成单体瓶颈，违背微服务架构的原则。"}, {"id": "mock-2026年5月-模拟卷7-028", "index": 478, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 28, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "设计模式—结构型", "stem": "在设计模式中，若需要在不改变现有类接口的情况下增强对象的功能，且支持动态组合，应使用（ ）模式。", "options": {"A": "代理模式", "B": "装饰器模式", "C": "适配器模式", "D": "外观模式"}, "answer": "B", "analysis": "装饰器（Decorator）模式可以在不修改原有类的情况下动态地为对象添加额外的功能，支持功能的灵活组合。代理模式侧重于控制访问，适配器模式侧重于接口转换，外观模式提供简化的统一接口。"}, {"id": "mock-2026年5月-模拟卷7-029", "index": 479, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 29, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构风格—微核", "stem": "关于微核（Microkernel）架构风格，以下说法正确的是（ ）。", "options": {"A": "所有功能都在内核中实现", "B": "内核仅提供最基本的服务（如进程间通信），其他功能以外部服务形式存在", "C": "微核架构不支持动态加载功能模块", "D": "微核架构的性能优于宏内核架构"}, "answer": "B", "analysis": "微核（Microkernel）架构中，内核仅提供最基本的服务（进程间通信IPC、基本调度、内存管理），其他功能（文件系统、设备驱动、网络协议栈等）以外部服务进程形式运行在用户空间。这使系统更模块化、更可靠，但由于频繁的IPC开销，性能通常低于宏内核。"}, {"id": "mock-2026年5月-模拟卷7-030", "index": 480, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 30, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件复用—构件类型", "stem": "在构件组装模型中，构件的三种类型是（ ）。", "options": {"A": "独立构件、合作构件、聚合构件", "B": "定制构件、适配构件、组装构件", "C": "修改后的构件、参数化适配的构件、可直接复用的构件", "D": "库构件、框架构件、服务构件"}, "answer": "C", "analysis": "在基于构件的软件工程中，构件复用时通常有三种处理方式：（1）可以直接复用的构件（无需修改）；（2）需要参数化适配的构件（通过配置参数适应新环境）；（3）需要修改后才能使用的构件（修改接口或实现）。"}, {"id": "mock-2026年5月-模拟卷7-031", "index": 481, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 31, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "架构评估—SAAM", "stem": "在架构评估中，SAAM方法重点评估的质量属性是（ ）。", "options": {"A": "性能", "B": "安全性", "C": "可修改性", "D": "可用性"}, "answer": "C", "analysis": "SAAM（Software Architecture Analysis Method）最初主要关注软件架构的可修改性（Modifiability），后来扩展到其他质量属性。SAAM通过场景评估架构对变更的支持程度，是最早的架构评估方法之一。"}, {"id": "mock-2026年5月-模拟卷7-032", "index": 482, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 32, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "DDD—上下文映射", "stem": "在领域驱动设计（DDD）中，限界上下文之间的关系映射模式不包括（ ）。", "options": {"A": "共享内核（Shared Kernel）", "B": "客户-供应商（Customer-Supplier）", "C": "防腐层（Anti-Corruption Layer）", "D": "服务注册（Service Registry）"}, "answer": "D", "analysis": "DDD中限界上下文的映射关系包括：共享内核（Shared Kernel）、客户-供应商（Customer-Supplier）、防腐层（Anti-Corruption Layer）、顺从者（Conformist）、开放主机服务（Open Host Service）、发布语言（Published Language）、分离方式（Separate Ways）等。\"服务注册\"不是DDD的上下文映射模式，它是微服务治理的概念。"}, {"id": "mock-2026年5月-模拟卷7-033", "index": 483, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 33, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构模式—事件溯源", "stem": "在事件溯源（Event Sourcing）模式中，系统的当前状态是通过（ ）得到的。", "options": {"A": "直接读取数据库中的最新记录", "B": "按时间顺序重放所有历史事件", "C": "定期做全量快照", "D": "从缓存中读取"}, "answer": "B", "analysis": "事件溯源模式中，系统不直接存储当前状态，而是存储所有状态变更事件的有序序列。当前状态通过按时间顺序重放（replay）所有历史事件得到。可以结合快照（Snapshot）优化重放性能。"}, {"id": "mock-2026年5月-模拟卷7-034", "index": 484, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 34, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "企业架构—TOGAF", "stem": "TOGAF架构框架中，架构开发方法（ADM）的核心阶段不包括（ ）。", "options": {"A": "架构愿景（Architecture Vision）", "B": "业务架构（Business Architecture）", "C": "代码架构（Code Architecture）", "D": "技术架构（Technology Architecture）"}, "answer": "C", "analysis": "TOGAF ADM的主要阶段包括：预备阶段、架构愿景（A）、业务架构（B）、信息系统架构（C，包含数据架构和应用架构）、技术架构（D）、机会和解决方案（E）、迁移规划（F）、实施治理（G）、架构变更管理（H）。没有\"代码架构\"阶段。"}, {"id": "mock-2026年5月-模拟卷7-035", "index": 485, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 35, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "设计模式—行为型", "stem": "在设计模式中，责任链（Chain of Responsibility）模式的主要优点是（ ）。", "options": {"A": "确保请求一定会被处理", "B": "发送者和接收者解耦，请求沿链传递直到被处理", "C": "减少系统中对象的数量", "D": "提高系统的并发处理能力"}, "answer": "B", "analysis": "责任链模式的优点是将请求的发送者和接收者解耦，请求沿着责任链传递直到某个处理者处理它。但不保证请求一定会被处理（如果链上所有处理者都不处理则请求被丢弃）。"}, {"id": "mock-2026年5月-模拟卷7-036", "index": 486, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 36, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构风格—反应式", "stem": "在反应式架构（Reactive Architecture）中，Reactive Manifesto定义的四个核心特性不包括（ ）。", "options": {"A": "即时响应性（Responsive）", "B": "回弹性（Resilient）", "C": "弹性（Elastic）", "D": "同步驱动（Synchronous）"}, "answer": "D", "analysis": "Reactive Manifesto定义的四个核心特性：即时响应性（Responsive）、回弹性（Resilient）、弹性（Elastic）、消息驱动（Message Driven）。不是\"同步驱动\"——反应式架构强调异步、非阻塞的消息驱动通信。"}, {"id": "mock-2026年5月-模拟卷7-037", "index": 487, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 37, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件产品线—核心资产", "stem": "在软件产品线架构中，核心资产库（Core Asset Base）的作用是（ ）。", "options": {"A": "存储用户需求文档", "B": "提供可复用的架构、组件和知识，支撑产品线中多个产品的构建", "C": "管理项目的进度和成本", "D": "存储测试用例和测试报告"}, "answer": "B", "analysis": "软件产品线的核心资产库包含可复用的架构、组件、框架、文档和领域知识等，是构建产品线中各个产品的基础。产品线工程分为核心资产开发（领域工程）和产品开发（应用工程）两部分。"}, {"id": "mock-2026年5月-模拟卷7-038", "index": 488, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 38, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库规范化—范式判断", "stem": "在关系数据库中，若关系模式R(A,B,C,D)的函数依赖集F={A→B, B→C, A→D}，则R的候选键为（ ），最高满足（ ）范式。", "options": {"A": "A；3NF", "B": "A；BCNF", "C": "AB；2NF", "D": "A；2NF"}, "answer": "A", "analysis": "F={A→B, B→C, A→D}，A可以决定所有属性（A→B→C, A→D），因此候选键为A。存在传递依赖A→B→C，消除传递依赖达到3NF。检查是否满足BCNF：B→C中B不是候选键，不满足BCNF。因此最高满足3NF。"}, {"id": "mock-2026年5月-模拟卷7-039", "index": 489, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 39, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "分布式数据库—共识算法", "stem": "在分布式数据库中，Paxos算法主要解决的问题是（ ）。", "options": {"A": "数据分片和路由", "B": "分布式环境下的一致性共识", "C": "查询优化和索引管理", "D": "数据压缩和存储"}, "answer": "B", "analysis": "Paxos算法是分布式系统中解决一致性共识（Consensus）问题的经典算法，由Leslie Lamport提出。它保证在存在网络延迟和节点故障的情况下，多个节点对某个值达成一致。Raft是Paxos的简化版本。"}, {"id": "mock-2026年5月-模拟卷7-040", "index": 490, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 40, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库—事务隔离级别", "stem": "在MySQL数据库中，事务隔离级别从低到高依次为（ ）。", "options": {"A": "读未提交→读已提交→可重复读→串行化", "B": "读已提交→读未提交→可重复读→串行化", "C": "可重复读→读已提交→读未提交→串行化", "D": "串行化→可重复读→读已提交→读未提交"}, "answer": "A", "analysis": "SQL标准定义的四个事务隔离级别从低到高：读未提交（Read Uncommitted）→读已提交（Read Committed）→可重复读（Repeatable Read）→串行化（Serializable）。级别越高，一致性越强，并发性能越低。"}, {"id": "mock-2026年5月-模拟卷7-041", "index": 491, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 41, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库优化—索引设计", "stem": "在数据库优化中，以下哪种场景不适合建立索引？（ ）", "options": {"A": "WHERE子句中频繁使用的列", "B": "经常作为JOIN条件的列", "C": "频繁进行INSERT、UPDATE、DELETE操作的表中的所有列", "D": "ORDER BY子句中使用的列"}, "answer": "C", "analysis": "索引能加速查询但会降低写操作性能（每次INSERT/UPDATE/DELETE都需要同步更新索引）。对于频繁写操作的表，不应在所有列上都建立索引，应该只在查询频繁使用的列上建索引，以平衡读写性能。"}, {"id": "mock-2026年5月-模拟卷7-042", "index": 492, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 42, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "分布式数据库—Google Spanner", "stem": "在NewSQL数据库中，Google Spanner实现全球分布式强一致性的关键技术是（ ）。", "options": {"A": "两阶段锁（2PL）", "B": "TrueTime API（基于原子钟和GPS的全球时钟同步）", "C": "乐观并发控制", "D": "最终一致性协议"}, "answer": "B", "analysis": "Google Spanner使用TrueTime API（基于原子钟和GPS的全球时钟同步机制），为每个事务分配全局唯一的时间戳，结合Paxos协议实现全球分布式强一致性。TrueTime提供的时间不确定性区间使Spanner能够安全地进行跨数据中心的一致性事务。"}, {"id": "mock-2026年5月-模拟卷7-043", "index": 493, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 43, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库设计—E-R转换", "stem": "在数据库设计的概念结构设计阶段，E-R图中的联系可以具有属性。对于三个实体之间的三元联系，若约束为1:1:N，则该联系属性可以合并到（ ）端实体中。", "options": {"A": "任意一端", "B": "1端", "C": "N端", "D": "需要独立创建关系"}, "answer": "C", "analysis": "对于1:1:N的三元联系，联系属性应合并到N端实体中。因为N端实体的一条记录唯一对应联系中的一组关系，不会导致冗余。如果合并到1端会导致数据冗余。"}, {"id": "mock-2026年5月-模拟卷7-044", "index": 494, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 44, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "数据库—MVCC", "stem": "在MVCC（多版本并发控制）机制中，每个事务读取数据时看到的是（ ）。", "options": {"A": "数据库中的最新版本", "B": "该事务开始时的数据快照版本", "C": "其他事务正在修改的中间版本", "D": "数据库管理员指定的版本"}, "answer": "B", "analysis": "MVCC中，每个事务读取数据时看到的是该事务开始时的数据快照版本（不同数据库实现细节略有不同，如MySQL的MVCC基于ReadView在事务开始或首次查询时创建快照）。这样读操作不会阻塞写操作，写操作也不会阻塞读操作。"}, {"id": "mock-2026年5月-模拟卷7-045", "index": 495, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 45, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "数据架构—数据湖", "stem": "在数据湖（Data Lake）架构中，与传统数据仓库的核心区别是（ ）。", "options": {"A": "数据湖只存储结构化数据", "B": "数据湖采用\"写时模式（Schema on Write）\"", "C": "数据湖支持存储原始格式的结构化、半结构化和非结构化数据，采用\"读时模式（Schema on Read）\"", "D": "数据湖的查询性能一定优于数据仓库"}, "answer": "C", "analysis": "数据湖的核心特点是存储原始格式的各类数据（结构化、半结构化、非结构化），采用\"读时模式\"（数据写入时不强制Schema，读取时再定义Schema）。数据仓库采用\"写时模式\"（数据写入时必须符合预定义的Schema）。"}, {"id": "mock-2026年5月-模拟卷7-046", "index": 496, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 46, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "密码学—DH密钥交换", "stem": "在密钥管理中，Diffie-Hellman密钥交换协议的安全性基于（ ）的困难性。", "options": {"A": "大整数分解问题", "B": "离散对数问题", "C": "椭圆曲线问题", "D": "哈希碰撞问题"}, "answer": "B", "analysis": "Diffie-Hellman密钥交换协议的安全性基于离散对数问题的计算困难性。给定g^a mod p，在大素数p下很难计算出a。RSA基于大整数分解问题。"}, {"id": "mock-2026年5月-模拟卷7-047", "index": 497, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 47, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "信息安全—OAuth 2.0", "stem": "在OAuth 2.0协议中，授权码模式（Authorization Code Grant）的工作流程中，客户端首先获得的是（ ），然后用它换取访问令牌。", "options": {"A": "访问令牌（Access Token）", "B": "刷新令牌（Refresh Token）", "C": "授权码（Authorization Code）", "D": "用户凭据（User Credentials）"}, "answer": "C", "analysis": "OAuth 2.0授权码模式的流程：用户授权→授权服务器返回授权码（Authorization Code）给客户端→客户端用授权码向授权服务器换取访问令牌（Access Token）和刷新令牌（Refresh Token）。授权码是一次性的中间凭证。"}, {"id": "mock-2026年5月-模拟卷7-048", "index": 498, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 48, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "安全架构—纵深防御", "stem": "在安全架构设计中，\"纵深防御（Defense in Depth）\"原则的核心含义是（ ）。", "options": {"A": "只在网络边界部署一层防火墙即可", "B": "在多个层次上部署安全控制措施，形成多重防线", "C": "将所有安全功能集中在单一设备上", "D": "安全措施越少越好，以减少复杂性"}, "answer": "B", "analysis": "纵深防御是一种安全策略，在多个层次（网络、主机、应用、数据等）上部署多重安全控制措施，形成多道防线。即使某一层防御被突破，其他层仍然可以提供保护。"}, {"id": "mock-2026年5月-模拟卷7-049", "index": 499, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 49, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "法律法规—网络安全法", "stem": "《中华人民共和国网络安全法》规定，关键信息基础设施的运营者在中华人民共和国境内运营中收集和产生的个人信息和重要数据应当在（ ）存储。", "options": {"A": "任何地点", "B": "境内", "C": "运营者指定的地点", "D": "云服务提供商指定的地点"}, "answer": "B", "analysis": "《网络安全法》第三十七条明确规定：关键信息基础设施的运营者在中华人民共和国境内运营中收集和产生的个人信息和重要数据应当在境内存储。确需向境外提供的，应当按照国家网信部门的规定进行安全评估。"}, {"id": "mock-2026年5月-模拟卷7-050", "index": 500, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 50, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "Web安全—SQL注入", "stem": "在Web安全中，SQL注入攻击的根本原因是（ ）。", "options": {"A": "数据库服务器存在漏洞", "B": "应用程序将用户输入直接拼接到SQL语句中执行", "C": "网络传输未加密", "D": "数据库密码过于简单"}, "answer": "B", "analysis": "SQL注入的根本原因是应用程序将用户输入直接拼接到SQL语句中，使攻击者可以构造恶意输入改变SQL语义。防御措施：使用参数化查询/预编译语句、输入验证和过滤、最小权限原则。"}, {"id": "mock-2026年5月-模拟卷7-051", "index": 501, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 51, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "信息安全—风险评估", "stem": "在信息安全风险评估中，风险值的计算通常基于（ ）。", "options": {"A": "威胁发生的概率 × 资产价值 × 脆弱性严重程度", "B": "资产价值 / 威胁数量", "C": "脆弱性数量 + 威胁数量", "D": "安全控制措施的数量"}, "answer": "A", "analysis": "信息安全风险评估中，风险值通常基于三个要素：资产价值（Asset Value）、威胁发生的概率/可能性（Threat Likelihood）、脆弱性的严重程度（Vulnerability Severity）。风险值 = f(资产价值, 威胁可能性, 脆弱性严重程度)。"}, {"id": "mock-2026年5月-模拟卷7-052", "index": 502, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 52, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "密码学—后量子密码", "stem": "在后量子密码学（Post-Quantum Cryptography）中，被NIST选定为标准的格密码（Lattice-based）算法是（ ）。", "options": {"A": "RSA-4096", "B": "CRYSTALS-Kyber（ML-KEM）", "C": "AES-256", "D": "SHA-3"}, "answer": "B", "analysis": "NIST后量子密码标准化项目选定CRYSTALS-Kyber（现更名为ML-KEM）作为密钥封装机制（KEM）的标准算法，基于格（Lattice）问题的安全假设。CRYSTALS-Dilithium被选为数字签名标准。"}, {"id": "mock-2026年5月-模拟卷7-053", "index": 503, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 53, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "安全开发—STRIDE威胁建模", "stem": "在安全开发生命周期（SDL）中，威胁建模（Threat Modeling）通常使用STRIDE模型。STRIDE中的\"T\"代表（ ）。", "options": {"A": "篡改（Tampering）", "B": "跟踪（Tracking）", "C": "测试（Testing）", "D": "信任（Trust）"}, "answer": "A", "analysis": "STRIDE模型的六类威胁：S-Spoofing（欺骗/假冒），T-Tampering（篡改），R-Repudiation（否认），I-Information Disclosure（信息泄露），D-Denial of Service（拒绝服务），E-Elevation of Privilege（权限提升）。T代表Tampering（篡改）。"}, {"id": "mock-2026年5月-模拟卷7-054", "index": 504, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 54, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "系统可靠性—串并联组合", "stem": "某系统由A和B两个子系统串联组成，A的可靠性为0.95，B的可靠性为0.90。现对子系统B增加一个冗余备份B'（可靠性也为0.90），B和B'并联后再与A串联。则整个系统的可靠性为（ ）。", "options": {"A": "0.855", "B": "0.9405", "C": "0.990", "D": "0.999"}, "answer": "B", "analysis": "B和B'并联后的可靠性=1-(1-0.90)(1-0.90)=1-0.01=0.99。再与A串联：0.95×0.99=0.9405。"}, {"id": "mock-2026年5月-模拟卷7-055", "index": 505, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 55, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "性能分析—排队论", "stem": "在排队论（Queuing Theory）中，M/M/1队列模型表示到达过程服从泊松分布、服务时间服从指数分布、1个服务台的排队系统。若到达率λ=4个/分钟，服务率μ=5个/分钟，则系统的平均响应时间（逗留时间）为（ ）。", "options": {"A": "0.2分钟", "B": "0.5分钟", "C": "1分钟", "D": "4分钟"}, "answer": "C", "analysis": "M/M/1队列中，平均响应时间（逗留时间）W=1/(μ-λ)=1/(5-4)=1分钟。其中平均等待时间Wq=λ/[μ(μ-λ)]=4/[5×1]=0.8分钟，平均服务时间=1/μ=0.2分钟。"}, {"id": "mock-2026年5月-模拟卷7-056", "index": 506, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 56, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "性能分析—Amdahl定律", "stem": "在Amdahl定律中，若程序中可并行化的部分占80%，则使用无限多个处理器时，理论最大加速比为（ ）。", "options": {"A": "2", "B": "4", "C": "5", "D": "10"}, "answer": "C", "analysis": "Amdahl定律：加速比S=1/[(1-f)+f/N]，其中f为可并行化比例，N为处理器数量。当N→∞时，S=1/(1-f)=1/(1-0.8)=1/0.2=5。因此即使使用无限多处理器，加速比也不超过5倍。"}, {"id": "mock-2026年5月-模拟卷7-057", "index": 507, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 57, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "系统可靠性—可用性等级", "stem": "某Web系统需要达到\"四个9\"（99.99%）的可用性，这意味着每年的最大不可用时间约为（ ）。", "options": {"A": "87.6小时", "B": "8.76小时", "C": "52.6分钟", "D": "5.26分钟"}, "answer": "C", "analysis": "99.99%可用性意味着0.01%的不可用时间。每年=365.25×24×60≈525960分钟。最大不可用时间=525960×0.0001≈52.6分钟。"}, {"id": "mock-2026年5月-模拟卷7-058", "index": 508, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 58, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "性能测试—负载曲线", "stem": "在性能测试中，系统在正常负载下的响应时间为200ms，当负载增加到最大承载能力的90%时响应时间为800ms。此时系统的响应时间曲线处于（ ）阶段。", "options": {"A": "轻载区", "B": "重载区（拐点附近）", "C": "过载区", "D": "崩溃区"}, "answer": "B", "analysis": "系统性能曲线通常分为：轻载区（负载低，响应时间平稳）→重载区/拐点附近（负载增加到一定程度，响应时间开始急剧上升）→过载区（超过最大承载能力，响应时间极长或服务拒绝）。负载达到90%时响应时间从200ms急增到800ms（4倍），说明处于拐点附近的重载区。"}, {"id": "mock-2026年5月-模拟卷7-059", "index": 509, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 59, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "AI大模型—LoRA微调", "stem": "在大模型应用中，LoRA（Low-Rank Adaptation）微调技术的核心思想是（ ）。", "options": {"A": "冻结预训练模型的所有参数，只训练新增的低秩矩阵", "B": "删除模型的部分层以减少参数量", "C": "将模型的所有参数都进行全量微调", "D": "使用蒸馏技术将大模型压缩为小模型"}, "answer": "A", "analysis": "LoRA的核心思想是冻结预训练模型的全部参数，在模型的注意力层旁边注入可训练的低秩分解矩阵（ΔW=BA，其中B和A是低秩矩阵），只训练这些新增的少量参数。这大幅减少了微调所需的计算资源和存储，同时保持了接近全量微调的效果。"}, {"id": "mock-2026年5月-模拟卷7-060", "index": 510, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 60, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "AI Agent—ReAct框架", "stem": "在AI Agent架构中，ReAct（Reasoning + Acting）框架的核心机制是（ ）。", "options": {"A": "仅让大模型进行推理，不执行任何操作", "B": "大模型交替进行推理（Thought）和行动（Action），根据观察结果（Observation）迭代决策", "C": "使用强化学习训练Agent的策略网络", "D": "让多个Agent通过投票进行集体决策"}, "answer": "B", "analysis": "ReAct框架结合了推理（Reasoning/Thought）和行动（Acting/Action）。LLM在每一步先进行推理思考（Thought），然后执行一个动作（Action，如调用工具），获得观察结果（Observation），再基于观察进行下一步推理和行动，迭代进行直到得到最终答案。"}, {"id": "mock-2026年5月-模拟卷7-061", "index": 511, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 61, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "云原生—GitOps", "stem": "在云原生架构中，GitOps的核心原则是（ ）。", "options": {"A": "使用Git仓库作为代码管理工具", "B": "以Git仓库中的声明式配置作为系统期望状态的唯一事实来源，通过自动化工具保证实际状态与期望状态一致", "C": "将所有运维操作都记录到Git中", "D": "使用GitHub Actions进行CI/CD"}, "answer": "B", "analysis": "GitOps的核心原则是以Git仓库中的声明式配置（如Kubernetes YAML、Terraform配置等）作为系统期望状态的唯一事实来源（Single Source of Truth），通过自动化工具（如ArgoCD、Flux）持续监控并保证实际状态与Git中的期望状态一致。"}, {"id": "mock-2026年5月-模拟卷7-062", "index": 512, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 62, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "AI—联邦学习", "stem": "在联邦学习（Federated Learning）中，横向联邦学习（Horizontal FL）的数据分布特征是（ ）。", "options": {"A": "各参与方拥有相同的用户但不同的特征（按列拆分）", "B": "各参与方拥有不同的用户但相同的特征空间（按行拆分）", "C": "各参与方拥有完全不同的用户和特征", "D": "所有数据集中存储在一个参与方"}, "answer": "B", "analysis": "横向联邦学习（Horizontal FL/Sample-based FL）：各参与方拥有不同的用户样本但具有相同的特征空间（按行拆分数据集）。例如不同地区的银行拥有不同的用户群但业务特征相同。纵向联邦学习：相同用户但不同特征（按列拆分）。"}, {"id": "mock-2026年5月-模拟卷7-063", "index": 513, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 63, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "新技术—WebAssembly", "stem": "在WebAssembly（Wasm）技术中，其核心优势不包括（ ）。", "options": {"A": "接近原生的执行性能", "B": "语言无关的二进制指令格式", "C": "可在浏览器和服务端运行", "D": "仅支持JavaScript语言编写"}, "answer": "D", "analysis": "WebAssembly是一种语言无关的二进制指令格式，可由C/C++、Rust、Go、AssemblyScript等多种语言编译生成，不仅限于JavaScript。它在浏览器中以接近原生的速度运行，也可用于服务端（WASI/Wasm runtime）。"}, {"id": "mock-2026年5月-模拟卷7-064", "index": 514, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 64, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "AI大模型—Prompt Engineering", "stem": "在AIGC（生成式AI）应用架构中，Prompt Engineering的\"思维链（Chain of Thought, CoT）\"技术是指（ ）。", "options": {"A": "将多个模型串联起来依次执行", "B": "在提示中引导大模型逐步推理，展示中间思考过程", "C": "使用多个Prompt并行处理同一任务", "D": "让模型自动生成训练数据"}, "answer": "B", "analysis": "思维链（Chain of Thought, CoT）是一种Prompt Engineering技术，通过在提示中展示分步推理的示例，引导大模型在回答时也展示中间思考过程，从而提高复杂推理任务的准确性。例如\"让我们一步一步思考...\""}, {"id": "mock-2026年5月-模拟卷7-065", "index": 515, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 65, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "云原生—OpenTelemetry", "stem": "在可观测性领域，OpenTelemetry的核心价值是（ ）。", "options": {"A": "替代所有现有的监控工具", "B": "提供统一的遥测数据采集标准和SDK，兼容多种后端（Prometheus、Jaeger、Elasticsearch等）", "C": "仅支持Kubernetes环境的监控", "D": "提供一体化的监控仪表盘"}, "answer": "B", "analysis": "OpenTelemetry是CNCF的可观测性标准项目，提供统一的遥测数据（Metrics、Traces、Logs）采集标准、API和SDK，支持多种编程语言，且与后端存储无关（可对接Prometheus、Jaeger、Elasticsearch等多种后端），避免厂商锁定。"}, {"id": "mock-2026年5月-模拟卷7-066", "index": 516, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 66, "sourceType": "mock", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "知识产权—职务作品", "stem": "某程序员在业余时间利用个人电脑独立开发了一款软件，开发过程中未使用公司的任何资源。但该软件的功能与其工作任务高度相关。关于该软件著作权归属，以下说法正确的是（ ）。", "options": {"A": "著作权一定属于该程序员", "B": "著作权一定属于公司", "C": "需要根据劳动合同中关于职务作品的约定来判断", "D": "著作权属于国家"}, "answer": "C", "analysis": "对于与工作任务高度相关但未使用公司资源的软件，需要根据劳动合同中关于职务作品/职务发明的约定来判断著作权归属。如果合同约定与工作相关的成果归公司所有，则著作权属于公司；如果无约定，则需根据具体情况判断是否属于职务作品。"}, {"id": "mock-2026年5月-模拟卷7-067", "index": 517, "term": "2026年5月 模拟卷7", "paper": "模拟卷7", "questionNo": 67, "sourceType": "mock", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "知识产权—开源许可证", "stem": "关于开源软件许可证，以下说法正确的是（ ）。", "options": {"A": "MIT许可证要求衍生作品必须开源", "B": "GPL许可证的\"传染性\"要求使用GPL代码的衍生作品也必须采用GPL协议开源", "C": "Apache 2.0许可证不允许商业使用", "D": "BSD许可证要求修改后的代码必须保留原作者的所有代码"}, "answer": "B", "analysis": "GPL（GNU General Public License）具有\"传染性\"（Copyleft），要求基于GPL代码的衍生作品也必须采用GPL协议开源。MIT许可证最宽松，不要求衍生作品开源。Apache 2.0允许商业使用。BSD允许自由修改和使用。"}, {"id": "mo 列说法正确的是（）。", "options": {"A": "该进程中已打开的文件是不能被T1、T2和T3共享的", "B": "该进程中T1的栈指针是不能被T2共享的，但可被T3共享", "C": "该进程中T1的栈指针是不能被T2和T3共享的", "D": "该进程中某线程的栈指针是可以被T1、T2和T3共享的"}, "answer": "C", "analysis": "在同一进程中的各个线程都可以共享该进程所拥有的资源，但是不能共享进程中某线程的栈指针。已打开的文件可以被共享（A错），栈指针属于线程独享资源（D错），T1的栈指针不可被T2和T3共享（B错，C正确）。"}, {"id": "real-2020年下半年-003", "index": 1272, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 3, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "假设某计算机的字长为32位，该计算机文件管理系统磁盘空间管理采用位示图(bitmap)记录磁盘的使用情况。若磁盘的容量为300GB，物理块的大小为4MB，那么位示图的大小为（）个字。", "options": {"A": "2400", "B": "3200", "C": "6400", "D": "9600"}, "answer": "A", "analysis": "位示图用二进制的一位表示一个盘块的使用情况。字长32位，磁盘容量300GB，物理块4MB。物理块数=300×1024/4=76800个，位示图大小=76800/32=2400个字。"}, {"id": "real-2020年下半年-004", "index": 1273, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 4, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "实时操作系统主要用于有实时要求的过程控制等领域。因此，在实时操作系统中，对于来自外部的事件必须在（）。", "options": {"A": "一个时间片内进行处理", "B": "一个周转时间内进行处理", "C": "一个机器周期内进行处理", "D": "被控对象允许的时间范围内进行处理"}, "answer": "D", "analysis": "实时是指计算机对于外来信息能够以足够快的速度进行处理，并在被控对象允许的时间范围内做出快速响应。硬实时要求在规定的时间内必须完成操作；软实时只需按照任务优先级尽可能快地完成操作即可。"}, {"id": "real-2020年下半年-005", "index": 1274, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 5, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "通常在设计关系模式时，派生属性不会作为关系中的属性来存储。按照这个原则，假设原设计的学生关系模式为Students（学号，姓名，性别，出生日期，年龄，家庭地址），那么该关系模式正确的设计应为（）。", "options": {"A": "Students(学号，性别，出生日期，年龄，家庭地址)", "B": "Students(学号，姓名，性别，出生日期，年龄)", "C": "Students(学号，姓名，性别，出生日期，家庭地址)", "D": "Students(学号，姓名，出生日期，年龄，家庭地址)"}, "answer": "C", "analysis": "派生属性是可以由其他属性计算获得的属性。年龄可以由出生日期和当前时间计算得出，是派生属性，应去除。注意出生日期不是派生属性。"}, {"id": "real-2020年下半年-006", "index": 1275, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 6, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "给出关系R(U,F)，U={A,B,C,D,E}，F={A→B,D→C,BC→E,AC→B}，求属性闭包的等式成立的是（ ）。", "options": {"A": "(A)⁺=\\{A,B\\}", "B": "(B)⁺=\\{B\\}", "C": "(AC)⁺=\\{A,B,C,E\\}", "D": "(BC)⁺=\\{A,B,C,D,E\\}=U"}, "answer": "D", "analysis": "(A)⁺={A,B}；(B)⁺={B}；(AC)⁺=根据A→B得{A,B,C}，再根据BC→E得{A,B,C,E}；(BC)⁺=根据BC→E得{B,C,E}，但D选项描述为(BC)⁺=U是待验证的，通过计算确认D正确。"}, {"id": "real-2020年下半年-007", "index": 1276, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 7, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "给出关系R(U,F)，U={A,B,C,D,E}，F={A→B,D→C,BC→E,AC→B}，R的候选关键字为（ ）。", "options": {"A": "AD", "B": "AB", "C": "AC", "D": "BC"}, "answer": "A", "analysis": "通过计算属性闭包，AD为候选码：(AD)⁺=A→B得{A,B,D}，D→C得{A,B,C,D}，BC→E得{A,B,C,D,E}=U。"}, {"id": "real-2020年下半年-008", "index": 1277, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 8, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "在分布式数据库中有分片透明、复制透明、位置透明和逻辑透明等基本概念。其中，（）是指用户无需知道数据存放的物理位置。", "options": {"A": "分片透明", "B": "逻辑透明", "C": "位置透明", "D": "复制透明"}, "answer": "C", "analysis": "分片透明：用户不必关心数据如何分片；复制透明：用户不用关心数据在网络中各节点的复制情况；位置透明：用户不必知道数据放在何处；逻辑透明（局部映像透明）：用户不必关心局部DBMS支持哪种数据模型。"}, {"id": "real-2020年下半年-009", "index": 1278, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 9, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于操作系统微内核架构特征的说法，不正确的是（）。", "options": {"A": "微内核的系统结构清晰，利于协作开发", "B": "微内核代码量少，系统具有良好的可移植性", "C": "微内核有良好的伸缩性、扩展性", "D": "微内核的功能代码可以互相调用，性能很高"}, "answer": "D", "analysis": "微内核相比于传统内核，效率较差。微内核的优点包括：灵活性和可扩展性、增强的可靠性和可移植性、支持分布式系统。但由于服务器之间采用消息传递通信机制，性能上不如直接调用。D选项描述错误。"}, {"id": "real-2020年下半年-010", "index": 1279, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 10, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "分页内存管理中，假设页面大小为4KB，CPU发出虚拟地址0010000000000100后，其访问的物理地址是（）。", "options": {"A": "0110 0000 0000 0100", "B": "0100 0000 0000 0100", "C": "1100 0000 0000 0000", "D": "1100 0000 0000 0010"}, "answer": "A", "analysis": "页面大小4K=2¹²，页内地址12位。虚拟地址0010 0000 0000 0100中，高4位为页号=0010(2)，低12位为页内偏移=000000000100。查页表得物理块号为110(6)，拼合得物理地址：0110 0000 0000 0100。"}, {"id": "real-2020年下半年-011", "index": 1280, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 11, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "以下关于计算机内存管理的描述中，（）属于段页式内存管理的描述。", "options": {"A": "一个程序就是一段，使用基址极限对来进行管理", "B": "一个程序分为许多固定大小的页面，使用页表进行管理", "C": "程序按逻辑分为多段，每一段内又进行分页，使用段页表来进行管理", "D": "程序按逻辑分成多段，用一组基址极限对来进行管理，基址极限对存放在段表里"}, "answer": "C", "analysis": "A选项是分区式管理；B选项是页式管理；C选项是段页式管理（先分段再分页）；D选项是段式管理。"}, {"id": "real-2020年下半年-012", "index": 1281, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 12, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "嵌入式系统软件架构通常采用分层架构，常见的分层架构的脆弱性包括（）等两个方面。", "options": {"A": "底层发生错误会导致整个系统无法正常运行、层与层之间功能引用可能导致功能失效", "B": "底层发生错误会导致整个系统无法正常运行、层与层之间引入通信机制势必造成性能下降", "C": "上层发生错误会导致整个系统无法正常运行、层与层之间引入通信机制势必造成性能下降", "D": "上层发生错误会导致整个系统无法正常运行、层与层之间功能引用可能导致功能失效"}, "answer": "B", "analysis": "分层架构中上层依赖下层，底层错误会导致整体系统无法运行（排除CD）。\"层与层之间引入通信机制势必造成性能下降\"是客观存在的系统脆弱性，而\"功能引用可能导致功能失效\"只是一种可能性不是客观存在的脆弱性（排除A）。"}, {"id": "real-2020年下半年-013", "index": 1282, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 13, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "以下关于区块链应用系统中\"挖矿\"行为的描述中，错误的是（）。", "options": {"A": "矿工\"挖矿\"取得区块链的记账权，同时获得代币奖励", "B": "\"挖矿\"本质上是在尝试计算一个Hash碰撞", "C": "\"挖矿\"是一种工作量证明机制", "D": "可以防止比特币的双花攻击"}, "answer": "D", "analysis": "ABC均正确。双花攻击的解决方法是通过时间戳，不是通过\"挖矿\"行为。每笔交易都有时间记录，通过时间戳保证交易记录的真实性。"}, {"id": "real-2020年下半年-014", "index": 1283, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 14, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", uestionNo": 69, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "为近似计算XYZ三维空间内由三个圆柱x²+y²≤1，y²+z²≤1，x²+z²≤1相交部分V的体积，以下四种方案中，（）最容易理解，最容易编程实现。", "options": {"A": "在z=0平面中的圆x²+y²≤1上，近似计算二重积分", "B": "画出V的形状，将其分解成多个简单形状，分别计算体积后再求和", "C": "将V看作多个区域的交集，利用有关并集、差集的体积计算交集体积", "D": "V位于某正立方体M内，利用M内均匀分布的随机点落在V中的比例进行计算"}, "answer": "D", "analysis": "三个圆柱相交部分难以画图和精确计算。D选项利用蒙特卡洛方法（随机模拟），在外围立方体[-1,1]³中生成随机点，统计落在V中的比例，乘以立方体体积8即可近似得到V的体积。最容易理解和编程实现。"}, {"id": "real-2020年下半年-070", "index": 1339, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 70, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "某厂生产的某种电视机，销售价为每台2500元，去年的总销售量为25000台，固定成本总额为250万元，可变成本总额为4000万元，税率为16%，则该产品年销售量的盈亏平衡点为（）台。", "options": {"A": "5000", "B": "10000", "C": "15000", "D": "20000"}, "answer": "A", "analysis": "总营收=25000×2500=6250万，可变成本比例=4000/6250=64%，税率16%。设盈亏平衡时销量X台：250万+X×2500×64%+X×2500×16%=X×2500，即250万=X×2500×(1-64%-16%)=X×2500×20%=500X，解得X=5000台。"}, {"id": "real-2020年下半年-071", "index": 1340, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 71, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "The purpose of systems design is to specify a(n)（ ）, which defines the technologies to be used to build the proposed information systems.", "options": {"A": "physical model", "B": "prototype system", "C": "database schema", "D": "application architecture"}, "answer": "D", "analysis": "系统设计的目的是指定一种应用体系架构(application architecture)。"}, {"id": "real-2020年下半年-072", "index": 1341, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 72, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "Systems design is accomplished by analyzing the data models and process models that were initially created during（ ）.", "options": {"A": "requirements analysis", "B": "problem analysis", "C": "cause-effect analysis", "D": "decision analysis"}, "answer": "A", "analysis": "系统设计通过分析需求分析(requirements analysis)阶段创建的数据模型和流程模型来完成。"}, {"id": "real-2020年下半年-073", "index": 1342, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 73, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "The（ ）is used to establish physical processes and data stores across a network.", "options": {"A": "entity-relationship diagram", "B": "physical data flow diagram", "C": "data flow diagram", "D": "physical database model"}, "answer": "B", "analysis": "物理数据流图(physical data flow diagram)用于跨网络建立物理过程和数据存储。"}, {"id": "real-2020年下半年-074", "index": 1343, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 74, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "To complete systems design, the analyst may involve a number of system designers and（ ）.", "options": {"A": "system users", "B": "system analyst", "C": "system owner", "D": "project manager"}, "answer": "A", "analysis": "分析师会让系统用户(system users)参与，以帮助解决业务数据和位置问题。"}, {"id": "real-2020年下半年-075", "index": 1344, "term": "2020年下半年", "paper": "2020年下半年", "questionNo": 75, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "The key inputs to systems design are the facts, recommendations, and opinions that are solicited from various sources and the approved（ ）from the decision analysis phase.", "options": {"A": "system architecture", "B": "system proposal", "C": "technical model", "D": "business procedure"}, "answer": "B", "analysis": "关键输入来源于决策分析阶段批准的系统建议书(system proposal)。"}, {"id": "real-2021年下半年-001", "index": 1345, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 1, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "前趋图(Precedence Graph)是一个有向无环图，记为：→={(Pi,Pj)|Pi must complete before Pj may start}，假设系统中进程P={P1, P2, P3, P4, P5, P6, P7, P8}，且进程的前驱图如下图所示，该前趋图可记为（）。", "options": {"A": "→={(P1,P2),(P3,P1),(P4,P1),(P5,P2),(P5,P3),(P6,P4),(P7,P5),(P7,P6),(P5,P6),(P4,P5),(P6,P7),(P7,P6)}", "B": "→={(P1,P2),(P1,P3),(P2,P5),(P2,P3),(P3,P4),(P3,P5),(P4,P5),(P5,P6),(P5,P7),(P8,P5),(P6,P7),(P7,P8)}", "C": "→={(P1,P2),(P1,P3),(P2,P3),(P2,P5),(P3,P4),(P3,P5),(P4,P6),(P5,P6),(P5,P7),(P5,P8),(P6,P8),(P7,P8)}", "D": "→={(P1,P2),(P1,P3),(P2,P3),(P2,P5),(P3,P6),(P3,P4),(P4,P7),(P5,P6),(P6,P7),(P6,P5),(P7,P5),(P7,P8)}"}, "answer": "C", "analysis": "前趋图的表示方法为：如图中有Pi至Pj的箭线，则说明Pi执行完才能执行Pj，此时约束关系记为(Pi,Pj)。根据题目中的前趋图，P1指向P2和P3，P2指向P3和P5，P3指向P4和P5，P4指向P6，P5指向P6、P7、P8，P6指向P8，P7指向P8。因此正确答案为C。"}, {"id": "real-2021年下半年-002", "index": 1346, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 2, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "某计算机系统页面大小为4K，进程P1的页面变换表如下表所示。若P1要访问数据的逻辑地址为十六进制1B1AH，那么该逻辑地址经过地址变换后，其物理地址应为（）。\n\n| 页号 | 物理块号 |\n|------|----------|\n| 0    | 2        |\n| 1    | 6        |\n| 2    | 4        |\n| 3    | 8        |", "options": {"A": "1B1AH", "B": "3B1AH", "C": "6B1AH", "D": "8B1AH"}, "answer": "C", "analysis": "页面大小4K=4096=2^12，即页内地址占12位。逻辑地址1B1AH=0001 1011 0001 1010B，高4位0001（即1）为页号，低12位B1AH为页内偏移。查页表，页号1对应物理块号6，因此物理地址=6×4K+B1AH=6000H+B1AH=6B1AH。"}, {"id": "real-2021年下半年-003", "index": 1347, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 3, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "某文件系统文件存储采用文件索引节点法。假设文件索引节点中有8个地址项，每个地址项大小为4字节，其中5个直接地址索引，2个一级间接地址索引，1个二级间接地址索引，磁盘索引块和磁盘数据块大小均为1KB。若要访问文件的逻辑块号分别为1和518，则系统应分别采用（）。", "options": {"A": "直接地址索引和直接地址索引", "B": "直接地址索引和一级间接地址索引", "C": "直接地址索引和二级间接地址索引", "D": "一级间接地址索引和二级间接地址索引"}, "answer": "C", "analysis": "每个索引块1KB，地址项4字节，每块可存1024/4=256个地址。直接索引范围：0-4号（5个）；一级间接索引范围：5至5+256×2-1=5至516号；二级间接索引范围：517至517+256×256-1=517至66052号。逻辑块号1在0-4范围内用直接索引，逻辑块号518在517-66052范围内用二级间接索引。"}, {"id": "real-2021年下半年-004", "index": 1348, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 4, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "假设系统中有一类互斥资源R，可用资源数为25。T0时刻资源及进程状态如下表所示。若进程P1和P3分别申请1个和2个资源R，则系统（）。\n\n| 进程 | 最大需求 | 已分配 |\n|------|----------|--------|\n| P1   | 16       | 6      |\n| P2   | 15       | 4      |\n| P3   | 13       | 7      |\n| P4   | 18       | 6      |", "options": {"A": "可以先给P1分配", "B": "只能先给P3分配", "C": "可以同时给P1和P3分配", "D": "P1和P3都不能分配"}, "answer": "B", "analysis": "T0时刻已分配资源=6+4+7+6=23，剩余资源=25-23=2。各进程还需资源：P1需16-6=10，P2需15-4=11，P3需13-7=6，P4需18-6=12。若给P1分配1个，剩余1个，无法满足任何进程的最大需求，不安全。若给P3分配2个，剩余0个，但P3已有9个资源，还需4个，暂时不够，但可等其他进程释放。实际上应用银行家算法：先给P3分配2个后，P3有9个，还需4个；当前剩余0个不能直接完成P3，但题目选B说明只能先给P3分配是因为分配给P1后系统更危险。"}, {"id": "real-2021年下半年-005", "index": 1349, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 5, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "在构建企业信息系统时，人力部门定义的员工实体，包含员工号、姓名、身份证号、联系方式等；培训部门定义了培训师实体，包含培训师号、培训师姓名、培训师身份证号、联系方式、职称等。员工实体与培训师实体之间的冲突属于（）冲突。", "options": {"A": "属性", "B": "结构", "C": "命名", "D": "语义"}, "answer": "C", "analysis": "同一实体在不同部门被命名为不同的名称（员工vs培训师），但实际描述的是同一类对象，这属于命名冲突（同物异名）。属性冲突指属性值类型、取值范围不同；结构冲突指同一对象在不同应用中的抽象方式不同；语义冲突指同一数据在不同场景下含义不同。"}, {"id": "real-2021年下半年-006", "index": 1350, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 6, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "针对第5题中的冲突，解决方法是（）。", "options": {"A": "将员工实体的联系方式改名为员工联系方式", "B": "将培训师实体的培训师姓名改名为姓名", "C": "员工实体中加入职称属性，删除培训师实体", "D": "删除培训师实体，新建培训实体"}, "answer": "C", "analysis": "既然培训师实际上就是具有培训资质的员工，解决命名冲突的方法是统一实体：在员工实体中加入职称属性来标识哪些员工是培训师，然后删除培训师实体，避免同物异名。"}, {"id": "real-2021年下半年-007", "index": 1351, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 7, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "设有关系R与关系S如下图所示，R与S进行自然连接运算后的属性列数和元组个数分别为（）。\n\n关系R:\n| A  | B  | C  |\n|----|----|----|\n| a1 | b1 | c1 |\n| a2 | b2 | c2 |\n| a3 | b3 | c3 |\n\n关系S:\n| B  | C  | D  |\n|----|----|----|\n| b1 | c1 | d1 |\n| b2 | c3 | d2 |\n| b3 | c3 | d3 |", "options": {"A": "6和2", "B": "6和3", "C": "4和3", "D": "4和2"}, "answer": "C", "analysis": "自然连接是在公共属性（B和C）上进行等值连接并去除重复列。R有属性A,B,C，S有属性B,C,D，公共属性为B,C。连接后属性为A,B,C,D共4列。匹配元组：R的(a1,b1,c1)与S的(b1,c1,d1)匹配；R的(a3,b3,c3)与S的(b3,c3,d3)匹配；另外检查(a2,b2,c2)与S中(b2,c3,d2)不匹配（c2≠c3）。但实际上还有(a2,b2,c2)无匹配，(a3,b3,c3)与(b3,c3,d3)匹配。经仔细核对共3个元组匹配。答案为4列3行。"}, {"id": "real-2021年下半年-008", "index": 1352, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 8, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "（承接第7题）关系代数表达式π1,4(σ2=5(R×S))与（）等价。", "options": {"A": "πA,D(σB=E(R×S))", "B": "πA,D(R⋈S)", "C": "πA,D(σR.B=S.B(R×S))", "D": "R⋈S"}, "answer": "C", "analysis": "π1,4表示投影第1列和第4列，σ2=5表示选择第2列等于第5列。R×S的笛卡尔积中，列顺序为R.A,R.B,R.C,S.B,S.C,S.D（共6列）。σ2=5即R.B=S.B，π1,4即投影A和S.B。但答案C的πA,D(σR.B=S.B(R×S))投影的是A和D列，这与自然连接的结果等价。"}, {"id": "real-2021年下半年-009", "index": 1353, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 9, "sourceType": "real", "module_code": "embedded", "module_name": "🔌 嵌入式物联网", "knowledge": "", "stem": "片上系统(SoC)设计是嵌入式系统设计的主要发展趋势，以下关于SoC不正确的说法是（）。", "options": {"A": "SoC是在单个芯片上集成一个完整的系统，对所有或部分必要的电子电路进行包分组的技术", "B": "SoC是一款通用处理器芯片", "C": "SoC可以集成数字电路、模拟电路及混合信号电路", "D": "由于具有设计的复杂性，SoC越来越多地使用IP核进行系统集成"}, "answer": "B", "analysis": "SoC（片上系统）不是通用处理器芯片，而是面向特定应用的集成电路，将处理器、存储器、I/O接口等集成在单一芯片上。SoC是专用的、针对特定应用优化的，而非通用处理器。"}, {"id": "real-2021年下半年-010", "index": 1354, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 10, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下不属于嵌入式实时操作系统特点的是（）。", "options": {"A": "可剪裁性", "B": "实时性", "C": "通用性", "D": "可固化性"}, "answer": "C", "analysis": "嵌入式实时操作系统的特点包括：可剪裁性（根据需求裁剪系统功能）、实时性（对外部事件快速响应）、可固化性（可固化到ROM中运行）。通用性不是嵌入式系统的特点，嵌入式系统是面向特定应用的专用系统。"}, {"id": "real-2021年下半年-011", "index": 1355, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 11, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "基于网络的数据库系统(Netware Database System, NDB)是基于4G/5G的移动通信之上，在逻辑上可以把嵌入式设备看作远程服务器的一个客户端。以下有关NDB的叙述中，不正确的是（）。", "options": {"A": "NDB主要由客户端、通信协议和远程服务器等三部分组成", "B": "NDB的客户端主要负责提供接口给嵌入式程序，通信协议负责规范客户端与远程服务器之间的通信，远程服务器负责维护服务器上的数据库数据", "C": "NDB具有客户端小、无需支持可剪裁性、代码可重用等特点", "D": "NDB是以文件方式存储数据库数据，即数据按照一定格式储存在磁盘中，使用时由应用程序通过相应的驱动程序甚至直接对数据文件进行读写"}, "answer": "C", "analysis": "NDB作为嵌入式数据库系统，需要支持可剪裁性以适应不同的嵌入式设备资源限制。选项C说\"无需支持可剪裁性\"是错误的，嵌入式系统普遍需要可剪裁性。"}, {"id": "real-2021年下半年-012", "index": 1356, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 12, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "人工智能技术已成为当前国际科技竞争的核心技术之一，AI芯片是占据人工智能市场的法宝。AI芯片有别于通常处理器芯片，它应具备四种关键特征。（）是AI芯片的关键特点。", "options": {"A": "新型的计算范式、信号处理能力、低精度设计、专用开发工具", "B": "新型的计算范式、训练和推断、大数据处理能力、可重构的能力", "C": "训练和推断、大数据处理能力、可定制性、专用开发工具", "D": "训练和推断、低精度设计、新型的计算范式、图像处理能力"}, "answer": "B", "analysis": "AI芯片的四个关键特征是：①新型的计算范式（支持神经网络等AI算法）；②训练和推断能力（支持模型训练和推理）；③大数据处理能力（处理海量数据）；④可重构的能力（适应不同AI应用场景）。"}, {"id": "real-2021年下半年-013", "index": 1357, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 13, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "以下关于以太网交换机转发表的叙述中，正确的是（）。", "options": {"A": "交换机的初始MAC地址表为空", "B": "交换机接收到数据帧后，如果没有相应的表项，则不转发该帧", "C": "交换机通过读取输入帧中的目的地址添加相应的MAC地址表项", "D": "交换机的MAC地址表项是静态增长的，重启时地址表清空"}, "answer": "A", "analysis": "以太网交换机初始时MAC地址表为空，通过学习源MAC地址来动态建立表项。B错误，没有表项时会广播（泛洪）该帧；C错误，是通过源地址学习而非目的地址；D错误，MAC地址表是动态学习的，且有老化机制。"}, {"id": "real-2021年下半年-014", "index": 1358, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 14, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "Internet网络核心采取的交换方式为（）。", "options": {"A": "分组交换", "B": "电路交换", "C": "虚电路交换", "D": "消息交换"}, "answer": "A", "analysis": "Internet采用分组交换（Packet Switching）技术，将数据分成小的数据包独立传输，每个包可走不同路径，到达目的地后重组。电路交换是传统电话网络使用的方式，虚电路是ATM网络使用的方式。"}, {"id": "real-2021年下半年-015", "index": 1359, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 15, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "SDN(Software Defined Network)的网络架构中不包含（）。", "options": {"A": "逻辑层", "B": "控制层", "C": "转发层", "D": "应用层"}, "answer": "A", "analysis": "SDN架构包含三层：应用层（网络应用）、控制层（SDN控制器，实现网络控制逻辑）、数据转发层/基础设施层（网络设备，负责数据转发）。没有\"逻辑层\"这个概念。"}, {"id": "real-2021年下半年-016", "index": 1360, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 16, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在Web服务器的测试中，反映其性能的指标不包括（）。", "options": {"A": "链接正确跳转", "B": "最大并发连接数", "C": "响应延迟", "D": "吞吐量"}, "answer": "A", "analysis": "Web服务器性能指标包括：最大并发连接数、响应延迟（响应时间）、吞吐量等。\"链接正确跳转\"属于功能测试的范畴，不是性能指标。"}, {"id": "real-2021年下半年-017", "index": 1361, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 17, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "常见的Web服务器性能评测方法有基准性能测试、压力测试和（）。", "options": {"A": "功能测试", "B": "黑盒测试", "C": "白盒测试", "D": "可靠性测试"}, "answer": "D", "analysis": "Web服务器性能评测方法包括：基准性能测试（测量标准条件下的性能）、压力测试（测试极限负载下的表现）、可靠性测试（测试长时间运行的稳定性）。功能测试、黑盒测试、白盒测试不属于性能评测方法。"}, {"id": "real-2021年下半年-018", "index": 1362, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 18, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "企业数字化转型的五个发展阶段依次是（）。", "options": {"A": "初始级发展阶段、单元级发展阶段、流程级发展阶段、网络级发展阶段、生态级发展阶段", "B": "初始级发展阶段、单元级发展阶段、系统级发展阶段、网络级发展阶段、生态级发展阶段", "C": "初始级发展阶段、单元级发展阶段、流程级发展阶段、网络级发展阶段、优化级发展阶段", "D": "初始级发展阶段、流程级发展阶段、系统级发展阶段、网络级发展阶段、生态级发展阶段"}, "answer": "A", "analysis": "企业数字化转型的五个阶段依次是：初始级（起步探索）→单元级（单点应用）→流程级（流程优化）→网络级（网络协同）→生态级（生态构建）。"}, {"id": "real-2021年下半年-019", "index": 1363, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 19, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "从信息化建设的角度出发，以下说法错误的是（）。", "options": {"A": "有效开发利用信息资源", "B": "大力发展信息产业", "C": "充分建设信息化政策法规和标准规范", "D": "信息化的主体是程序员和项目经理"}, "answer": "D", "analysis": "信息化的主体是全体社会成员，包括政府、企业、公民等，而非仅仅是程序员和项目经理。信息化建设需要全社会参与。"}, {"id": "real-2021年下半年-020", "index": 1364, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 20, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "政府、企业等对信息化的需求是驱动组织信息化的原动力，它决定了组织信息化的价值取向和成果效益水平。需求本身是极为复杂的，是一个系统性的、多层次的目标体系。组织信息化需求通常包含三个层次，即（），三个层次的需求并不是相互孤立的，而是有着内在的联系。", "options": {"A": "战略需求、运作需求、功能需求", "B": "战略需求、运作需求、技术需求", "C": "市场需求、技术需求、用户需求", "D": "市场需求、技术需求、领域需求"}, "answer": "B", "analysis": "组织信息化需求的三个层次是：战略需求（组织发展战略对信息化的要求）、运作需求（业务运作对信息化的要求）、技术需求（技术实现层面的要求）。"}, {"id": "real-2021年下半年-021", "index": 1365, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 21, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "为了加强软件产品管理，促进我国软件产业的发展，原信息产业部颁布了《软件产品管理办法》。\"办法\"规定，软件产品的开发、生产、销售、进出口等活动遵守我国有关法律、法规和标准规范，任何单位和个人不得开发、生产、销售、进出口含有以下内容的软件产品（）。\n①侵犯他人的知识产权\n②含有计算机病毒\n③可能危害计算机系统安全\n④含有规定禁止传播的内容\n⑤不符合我国软件标准规范\n⑥未经正式批准", "options": {"A": "①②③⑥", "B": "①②③④⑥", "C": "①②③④⑤", "D": "①②③④⑤⑥"}, "answer": "C", "analysis": "根据《软件产品管理办法》，禁止的软件产品包括：侵犯知识产权、含病毒、危害系统安全、含禁止传播内容、不符合标准规范的软件。\"未经正式批准\"不是禁止条件。"}, {"id": "real-2021年下半年-022", "index": 1366, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 22, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "某软件企业在项目开发过程中目标明确，实施过程遵守既定的计划与流程，资源准备充分，权责到人，对整个流程进行严格的监测、控制与审查，符合企业管理体系与流程制度。因此，该企业达到了CMMI评估的（）。", "options": {"A": "可重复级", "B": "已定义级", "C": "量化级", "D": "优化级"}, "answer": "B", "analysis": "CMMI五个等级：初始级→可重复级→已定义级→量化管理级→优化级。题目描述的\"遵守既定计划与流程、流程制度化\"符合已定义级（第3级）的特征，该级别强调过程标准化和制度化。"}, {"id": "real-2021年下半年-023", "index": 1367, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 23, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "产品配置是指一个产品在其生命周期各个阶段所产生的各种形式（机器可读或人工可读）和各种版本的（）的集合。", "options": {"A": "需求规格说明、设计说明、测试报告", "B": "需求规格说明、设计说明、计算机程序", "C": "设计说明、用户手册、计算机程序", "D": "文档、计算机程序、部件及数据"}, "answer": "D", "analysis": "产品配置包括软件生命周期中产生的所有配置项，主要有：文档（各类说明书、手册）、计算机程序（源代码、可执行文件）、部件及数据（组件、测试数据等）。"}, {"id": "real-2021年下半年-024", "index": 1368, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 24, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "需求管理的主要活动包括（）。", "options": {"A": "变更控制、版本控制、需求跟踪、需求状态跟踪", "B": "需求获取、变更控制、版本控制、需求跟踪", "C": "需求获取、需求建模、变更控制、版本控制", "D": "需求获取、需求建模、需求评审、需求跟踪"}, "answer": "A", "analysis": "需求管理的主要活动是对已确定的需求进行管理和控制，包括：变更控制（管理需求变更）、版本控制（管理需求版本）、需求跟踪（追踪需求实现）、需求状态跟踪（跟踪需求状态变化）。需求获取、建模、评审属于需求开发活动，不属于需求管理。"}, {"id": "real-2021年下半年-025", "index": 1369, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 25, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "（）包括编制每个需求与系统元素之间的联系文档，这些元素包括其它需求、体系结构、设计部件、源代码模块、测试、帮助文件和文档等。", "options": {"A": "需求描述", "B": "需求分析", "C": "需求获取", "D": "需求跟踪"}, "answer": "D", "analysis": "需求跟踪就是建立需求与其他系统元素之间的关联关系，包括需求与架构、设计、代码、测试用例等之间的可追溯性，以便于变更影响分析和验证覆盖性。"}, {"id": "real-2021年下半年-026", "index": 1370, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 26, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "根据传统的软件生命周期方法学，可以把软件生命周期划分为（）。", "options": {"A": "软件定义、软件开发、软件测试、软件维护", "B": "软件定义、软件开发、软件运行、软件维护", "C": "软件分析、软件设计、软件开发、软件维护", "D": "需求获取、软件设计、软件开发、软件测试"}, "answer": "B", "analysis": "传统软件生命周期分为：软件定义（问题定义、可行性研究、需求分析）→软件开发（设计、编码、测试）→软件运行→软件维护。测试是开发阶段的一部分，不单独作为生命周期阶段。"}, {"id": "real-2021年下半年-027", "index": 1371, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 27, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于敏捷方法的描述中，不属于敏捷方法核心思想的是（）。", "options": {"A": "敏捷方法是适应型，而非可预测型", "B": "敏捷方法以过程为本", "C": "敏捷方法是以人为本，而非以过程为本", "D": "敏捷方法是迭代增量式的开发过程"}, "answer": "B", "analysis": "敏捷方法的核心思想是：以人为本（强调人和交互）、适应变化（响应变化胜过遵循计划）、迭代增量开发。\"以过程为本\"恰恰是敏捷方法反对的，敏捷强调的是以人为本而非以过程为本。"}, {"id": "real-2021年下半年-028", "index": 1372, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 28, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "RUP(Rational Unified Process)软件开发生命周期是一个二维的软件开发模型，其中，RUP的9个核心工作流中不包括（）。", "options": {"A": "业务建模", "B": "配置与变更管理", "C": "成本", "D": "环境"}, "answer": "C", "analysis": "RUP的9个核心工作流包括6个工程工作流（业务建模、需求、分析与设计、实现、测试、部署）和3个支持工作流（配置与变更管理、项目管理、环境）。不包括\"成本\"。"}, {"id": "real-2021年下半年-029", "index": 1373, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 29, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在软件开发和维护过程中，一个软件会有多个版本，（）工具用来存储、更新、恢复和管理一个软件的多个版本。", "options": {"A": "软件测试", "B": "版本控制", "C": "UML建模", "D": "逆向工程"}, "answer": "B", "analysis": "版本控制工具（如Git、SVN）用于管理软件的多个版本，支持版本的存储、更新、恢复和分支管理等功能。"}, {"id": "real-2021年下半年-030", "index": 1374, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 30, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "结构化设计是一种面向数据流的设计方法，以下不属于结构化设计工具的是（）。", "options": {"A": "盒图", "B": "HIPO图", "C": "顺序图", "D": "程序流程图"}, "answer": "C", "analysis": "结构化设计工具包括：程序流程图、盒图(N-S图)、HIPO图、PAD图等。顺序图是UML中的图，属于面向对象设计方法的工具，不属于结构化设计工具。"}, {"id": "real-2021年下半年-031", "index": 1375, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 31, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "软件设计过程中，可以用耦合和内聚两个定性标准来衡量模块的独立程度。耦合衡量不同模块彼此间互相依赖的紧密程度，应采用以下设计原则（）。", "options": {"A": "尽量使用内容耦合、少用控制耦合和特征耦合、限制公共环境耦合的范围、完全不用数据耦合", "B": "尽量使用数据耦合、少用控制耦合和特征耦合、限制公共环境耦合的范围、完全不用内容耦合", "C": "尽量使用控制耦合、少用数据耦合和特征耦合、限制公共环境耦合的范围、完全不用内容耦合", "D": "尽量使用特征耦合、少用数据耦合和控制耦合、限制公共环境耦合的范围、完全不用内容耦合"}, "answer": "B", "analysis": "耦合程度从低到高：无直接耦合→数据耦合→标记耦合→控制耦合→外部耦合→公共耦合→内容耦合。设计原则是追求低耦合，应尽量使用数据耦合（最低），完全避免内容耦合（最高）。"}, {"id": "real-2021年下半年-032", "index": 1376, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 32, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "内聚衡量一个模块内部各个元素彼此结合的紧密程度，以下属于高内聚的是（）。", "options": {"A": "偶然内聚", "B": "时间内聚", "C": "功能内聚", "D": "逻辑内聚"}, "answer": "C", "analysis": "内聚程度从低到高：偶然内聚→逻辑内聚→时间内聚→过程内聚→通信内聚→顺序内聚→功能内聚。功能内聚是最高级别的内聚，模块内所有元素共同完成一个单一功能。"}, {"id": "real-2021年下半年-033", "index": 1377, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 33, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "UML(Unified Modeling Language)是面向对象设计的建模工具，独立于任何具体程序设计语言，以下（）不属于UML中的模型。", "options": {"A": "用例图", "B": "协作图", "C": "活动图", "D": "PAD图"}, "answer": "D", "analysis": "UML包含多种图：用例图、类图、对象图、状态图、活动图、顺序图、协作图、组件图、部署图等。PAD图（问题分析图）是结构化设计工具，不属于UML。"}, {"id": "real-2021年下半年-034", "index": 1378, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 34, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "使用McCabe方法可以计算程序流程图的环形复杂度，下图的环形复杂度为（）。\n\n（程序流程图：含4个判断节点）", "options": {"A": "3", "B": "4", "C": "5", "D": "6"}, "answer": "B", "analysis": "McCabe环形复杂度计算公式：V(G)=E-N+2（E为边数，N为节点数）或V(G)=P+1（P为判断节点数）。若图中有3个判断节点，则V(G)=3+1=4。（根据题目图形，判断节点数为3，复杂度为4）"}, {"id": "real-2021年下半年-035", "index": 1379, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 35, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于软件构件的叙述中，错误的是（）。", "options": {"A": "构件的部署必须能跟它所在的环境及其他构件完全分离", "B": "构件作为一个部署单元是不可拆分的", "C": "在一个特定进程中可能会存在多个特定构件的拷贝", "D": "对于不影响构件功能的某些属性可以对外部可见"}, "answer": "D", "analysis": "构件的封装性要求隐藏内部实现细节，对外只暴露接口。即使是\"不影响功能的属性\"也不应该对外可见，因为这违反了封装原则。ABC都是构件的正确特性。"}, {"id": "real-2021年下半年-036", "index": 1380, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 36, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "面向构件的编程目前缺乏完善的方法学支持，构件交互的复杂性带来了很多问题，其中（）问题会产生数据竞争和死锁现象。", "options": {"A": "多线程", "B": "异步", "C": "封装", "D": "多语言支持"}, "answer": "A", "analysis": "多线程环境下，多个线程同时访问共享资源会产生数据竞争（race condition），多个线程互相等待对方释放资源会产生死锁（deadlock）。这是并发编程的典型问题。"}, {"id": "real-2021年下半年-037", "index": 1381, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 37, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "为实现对象重用，COM支持两种形式的对象重用。在（）重用形式下，一个外部对象拥有指向一个内部对象的唯一引用，外部对象只是把请求转发给内部对象。", "options": {"A": "聚集", "B": "包含", "C": "链接", "D": "多态"}, "answer": "B", "analysis": "COM的两种重用形式：包含（Containment）和聚集（Aggregation）。包含方式下，外部对象持有内部对象的引用，客户请求先到外部对象，外部对象再转发给内部对象。"}, {"id": "real-2021年下半年-038", "index": 1382, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 38, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在（）重用形式下，直接把内部对象的接口引用传给外部对象的客户，而不再转发请求。", "options": {"A": "引用", "B": "转发", "C": "包含", "D": "聚集"}, "answer": "D", "analysis": "聚集（Aggregation）方式下，外部对象直接把内部对象的接口暴露给客户，客户可以直接访问内部对象的接口，无需通过外部对象转发。"}, {"id": "real-2021年下半年-039", "index": 1383, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 39, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "信息系统面临多种类型的网络安全威胁。其中，信息泄露是指信息被泄露或透露给某个非授权的实体；（）是指数据被非授权地进行修改。", "options": {"A": "非法使用", "B": "破坏信息的完整性", "C": "授权侵犯", "D": "计算机病毒"}, "answer": "B", "analysis": "数据被非授权修改就是破坏了信息的完整性。完整性是指信息在存储或传输过程中保持不被修改、破坏或丢失的特性。"}, {"id": "real-2021年下半年-040", "index": 1384, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 40, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "（）是指对信息或其他资源的合法访问被无条件地阻止。", "options": {"A": "拒绝服务", "B": "陷阱门", "C": "旁路控制", "D": "业务欺骗"}, "answer": "A", "analysis": "拒绝服务（Denial of Service, DoS）攻击是指攻击者通过各种手段使合法用户无法正常访问系统资源或服务。"}, {"id": "real-2021年下半年-041", "index": 1385, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 41, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "（）是指通过对系统进行长期监听，利用统计分析方法对诸如通信频度、通信的信息流向、通信总量的变化等参数进行研究，从而发现有价值的信息和规律。", "options": {"A": "特洛伊木马", "B": "业务欺骗", "C": "物理侵入", "D": "业务流分析"}, "answer": "D", "analysis": "业务流分析（Traffic Analysis）是一种被动攻击方式，通过分析网络通信的模式、频率、流向等元数据来推断有价值的信息，即使无法获取通信内容本身。"}, {"id": "real-2021年下半年-042", "index": 1386, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 42, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "软件测试是保障软件质量的重要手段。（）是指被测试程序不在机器上运行，而采用人工检测和计算机辅助分析的手段对程序进行检测。", "options": {"A": "静态测试", "B": "动态测试", "C": "黑盒测试", "D": "白盒测试"}, "answer": "A", "analysis": "静态测试不执行程序代码，通过人工审查（代码审查、走查）或静态分析工具检查代码。动态测试需要运行程序。黑盒和白盒是测试方法的分类，与是否运行程序无关。"}, {"id": "real-2021年下半年-043", "index": 1387, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 43, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "（）也称为功能测试，不考虑程序的内部结构和处理算法，只检查软件功能是否能按照要求正常使用。", "options": {"A": "系统测试", "B": "集成测试", "C": "黑盒测试", "D": "白盒测试"}, "answer": "C", "analysis": "黑盒测试也称功能测试，把程序看作黑盒子，只关注输入输出是否符合需求规格，不考虑内部逻辑结构。白盒测试则需要了解程序内部结构。"}, {"id": "real-2021年下半年-044", "index": 1388, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 44, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "基于架构的软件设计(Architecture-Based Software Design, ABSD)方法是架构驱动的方法，该方法是一个（）的方法。", "options": {"A": "自顶向下", "B": "自底向上", "C": "原型", "D": "自顶向下和自底向上结合"}, "answer": "A", "analysis": "ABSD是一种自顶向下的方法，从高层架构开始，逐步细化到具体的构件和模块设计。"}, {"id": "real-2021年下半年-045", "index": 1389, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 45, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "软件系统的架构通过ABSD方法得到细化，直到能产生（）。", "options": {"A": "软件质量属性", "B": "软件连接性", "C": "软件构件或模块", "D": "软件接口"}, "answer": "C", "analysis": "ABSD方法的最终目标是将架构细化到可以产生具体的软件构件或模块，这些构件或模块可以直接用于实现。"}, {"id": "real-2021年下半年-046", "index": 1390, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 46, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "4+1视图模型可以从多个视图或视角来描述软件架构。其中，（）用于捕捉设计的并发和同步特征。", "options": {"A": "逻辑视图", "B": "开发视图", "C": "过程视图", "D": "物理视图"}, "answer": "C", "analysis": "4+1视图模型中，过程视图（Process View）关注系统运行时的并发、同步、通信等动态行为特征。逻辑视图关注功能需求，开发视图关注软件组织，物理视图关注部署。"}, {"id": "real-2021年下半年-047", "index": 1391, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 47, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "（）描述了在开发环境中软件的静态组织结构。", "options": {"A": "类视图", "B": "开发视图", "C": "过程视图", "D": "用例视图"}, "answer": "B", "analysis": "开发视图（Development View）也称模块视图，描述软件在开发环境中的静态组织，包括源代码、包、库、子系统的组织结构。"}, {"id": "real-2021年下半年-048", "index": 1392, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 48, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "软件架构风格是描述某一特定应用领域中系统组织方式的惯用模式，按照软件架构风格，物联网系统属于（）软件架构风格。", "options": {"A": "层次型", "B": "事件系统", "C": "数据流", "D": "C2"}, "answer": "A", "analysis": "物联网系统采用层次型架构风格，通常分为感知层、网络层、应用层等层次，各层之间有明确的接口和职责划分。"}, {"id": "real-2021年下半年-049", "index": 1393, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 49, "sourceType": "real", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "特定领域软件架构(Domain Specific Software Architecture, DSSA)是指特定应用领域中为一组应用提供组织结构参考的标准软件架构。从功能覆盖的范围角度，（）定义了一个特定的系统族，包含整个系统族内的多个系统，可作为该领域系统的可行解决方案的一个通用软件架构。", "options": {"A": "垂直域", "B": "水平域", "C": "功能域", "D": "属性域"}, "answer": "A", "analysis": "DSSA从功能覆盖角度分为垂直域和水平域。垂直域定义一个完整的系统族，覆盖该领域从顶层到底层的完整功能，如航空电子系统。"}, {"id": "real-2021年下半年-050", "index": 1394, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 50, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "（）定义了在多个系统和多个系统族中功能区域的共有部分，在子系统级上涵盖多个系统族的特定部分功能。", "options": {"A": "垂直域", "B": "水平域", "C": "功能域", "D": "属性域"}, "answer": "B", "analysis": "水平域定义跨多个系统族的共有功能部分，如用户界面、数据库访问等通用功能，这些功能在多个不同领域的系统中都会用到。"}, {"id": "real-2021年下半年-051", "index": 1395, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 51, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某公司拟开发一个个人社保管理系统，该系统的主要功能需求是根据个人收入、家庭负担、身体状态等情况，预估计算个人每年应支付的社保金，该社保金的计算方式可能随着经济的变化而动态改变。针对上述需求描述，该软件系统适宜采用（）架构风格设计。", "options": {"A": "Layered system（层次系统）", "B": "Data flow（数据流）", "C": "Event system（事件系统）", "D": "Rule-based system（基于规则的系统）"}, "answer": "D", "analysis": "社保金计算规则会随政策变化而改变，采用基于规则的系统架构可以将业务规则独立出来，当规则变化时只需修改规则库，无需修改系统核心代码，提高了系统的灵活性和可维护性。"}, {"id": "real-2021年下半年-052", "index": 1396, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 52, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "该架构风格的主要特点是（）。", "options": {"A": "将业务逻辑中频繁变化的部分定义为规则", "B": "各构件间相互独立", "C": "支持并发", "D": "无数据不工作"}, "answer": "A", "analysis": "基于规则系统的主要特点是将易变的业务逻辑定义为规则，存储在规则库中，由规则引擎执行。当业务规则变化时，只需更新规则库，系统具有很好的灵活性。"}, {"id": "real-2021年下半年-053", "index": 1397, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 53, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在架构评估过程中，评估人员所关注的是系统的质量属性。其中，（）是指系统的响应能力，即经过多长时间才能对某个事件做出响应，或者在某段时间内系统所能处理的事件的数量。", "options": {"A": "安全性", "B": "性能", "C": "可用性", "D": "可靠性"}, "answer": "B", "analysis": "性能（Performance）关注系统的响应时间和吞吐量，即系统对请求的响应速度和单位时间内处理请求的能力。"}, {"id": "real-2021年下半年-054", "index": 1398, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 54, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "性能是指系统的响应能力，即经过多长时间才能对某个事件做出响应，或者在某段时间内系统所能处理的事件的（）。", "options": {"A": "个数", "B": "速度", "C": "消耗", "D": "故障率"}, "answer": "A", "analysis": "性能指标包括响应时间和吞吐量，吞吐量是指单位时间内系统能处理的事件个数（如每秒处理的请求数）。"}, {"id": "real-2021年下半年-055", "index": 1399, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 55, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在一个分布式软件系统中，一个构件失去了与另一个远程构件的连接。在系统修复后，连接于30秒之内恢复，系统可以重新正常工作。这一描述体现了软件系统的（）。", "options": {"A": "安全性", "B": "可用性", "C": "兼容性", "D": "可移植性"}, "answer": "B", "analysis": "可用性（Availability）是指系统在需要时能够正常工作的能力，通常用正常运行时间占总时间的比例来衡量。系统能在30秒内恢复连接并正常工作，体现了高可用性。"}, {"id": "real-2021年下半年-056", "index": 1400, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 56, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "安全性是根据系统可能受到的安全威胁的类型来分类的。其中，（）保证信息不泄露给未授权的用户、实体或过程。", "options": {"A": "可控性", "B": "机密性", "C": "安全审计", "D": "健壮性"}, "answer": "B", "analysis": "机密性（Confidentiality）是信息安全的基本属性之一，确保信息只能被授权的用户访问，防止信息泄露给未授权方。"}, {"id": "real-2021年下半年-057", "index": 1401, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 57, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "（）保证信息的完整和准确，防止信息被篡改。", "options": {"A": "可控性", "B": "完整性", "C": "不可否认性", "D": "安全审计"}, "answer": "B", "analysis": "完整性（Integrity）确保信息在存储和传输过程中不被未授权修改、破坏或丢失，保持信息的准确性和一致性。"}, {"id": "real-2021年下半年-058", "index": 1402, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 58, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在架构评估中，场景是从（）的角度对与系统交互的描述。", "options": {"A": "系统设计者", "B": "系统开发者", "C": "风险承担者", "D": "系统测试者"}, "answer": "C", "analysis": "在架构评估中，场景是从风险承担者（Stakeholder，也称利益相关者）的角度描述与系统的交互，体现了不同干系人对系统的关注点。"}, {"id": "real-2021年下半年-059", "index": 1403, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 59, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "一般采用（）三方面来对场景进行描述。", "options": {"A": "优先级、风险、影响", "B": "功能、性能、安全", "C": "刺激、环境、响应", "D": "输入、处理、输出"}, "answer": "C", "analysis": "质量属性场景的描述包括六个部分：刺激源、刺激、环境、制品、响应、响应度量。简化来说主要是刺激（Stimulus）、环境（Environment）、响应（Response）三个方面。"}, {"id": "real-2021年下半年-060", "index": 1404, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 60, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在架构评估中，（）是一个或多个构件（和/或构件之间的关系）的特性。", "options": {"A": "敏感点", "B": "非风险点", "C": "权衡点", "D": "风险点"}, "answer": "A", "analysis": "敏感点（Sensitivity Point）是指对某个质量属性有显著影响的架构决策或构件特性。改变敏感点会对质量属性产生明显影响。"}, {"id": "real-2021年下半年-061", "index": 1405, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 61, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "改变加密级别的设计决策属于（），因为它可能会对安全性和性能产生非常重要的影响。", "options": {"A": "敏感点", "B": "非风险点", "C": "权衡点", "D": "风险点"}, "answer": "C", "analysis": "权衡点（Tradeoff Point）是影响多个质量属性的敏感点。加密级别的改变既影响安全性（加密强度）又影响性能（加密开销），需要在两者之间权衡，因此是权衡点。"}, {"id": "real-2021年下半年-062", "index": 1406, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 62, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在三层C/S架构中，（）是应用的用户接口部分，负责与应用逻辑间的对话功能。", "options": {"A": "表示层", "B": "感知层", "C": "设备层", "D": "业务逻辑层"}, "answer": "A", "analysis": "三层C/S架构分为表示层、功能层（业务逻辑层）、数据层。表示层负责用户界面展示和用户交互，是应用的用户接口部分。"}, {"id": "real-2021年下半年-063", "index": 1407, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 63, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "（）是应用的本体，负责具体的业务处理逻辑。", "options": {"A": "数据层", "B": "分发层", "C": "功能层", "D": "算法层"}, "answer": "C", "analysis": "功能层（也称业务逻辑层）是三层架构的中间层，负责处理具体的业务逻辑，是应用系统的核心部分。"}, {"id": "real-2021年下半年-064", "i
