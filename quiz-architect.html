年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 50, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "隐私计算（Privacy-Preserving Computation）技术中，（ ）允许在加密数据上直接执行计算操作，无需先解密。", "options": {"A": "联邦学习", "B": "安全多方计算", "C": "同态加密", "D": "差分隐私"}, "answer": "C", "analysis": "同态加密（Homomorphic Encryption）允许在密文上直接执行计算操作，计算结果解密后与在明文上执行相同操作的结果一致。联邦学习是分布式机器学习框架；安全多方计算是多方联合计算协议；差分隐私通过添加噪声保护隐私。"}, {"id": "mock-2026年5月-模拟卷2-051", "index": 126, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 51, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "在PKI（公钥基础设施）体系中，数字证书的主要功能是（ ）。", "options": {"A": "加密数据传输内容", "B": "绑定公钥与实体身份，由CA签发以证明公钥的合法性", "C": "存储用户的私钥信息", "D": "替代防火墙实现网络安全防护"}, "answer": "B", "analysis": "数字证书的主要功能是将公钥与实体身份绑定，由可信的证书颁发机构（CA）签发，证明公钥的合法性和持有者的身份。证书本身不存储私钥，也不替代加密和防火墙功能。"}, {"id": "mock-2026年5月-模拟卷2-052", "index": 127, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 52, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "以下关于联邦学习（Federated Learning）的描述中，正确的是（ ）。", "options": {"A": "联邦学习要求各参与方将原始数据集中到一个中心服务器", "B": "联邦学习使各参与方在不共享原始数据的情况下协作训练模型", "C": "联邦学习只能用于图像识别领域", "D": "联邦学习完全不需要中心协调节点"}, "answer": "B", "analysis": "联邦学习使各参与方在本地训练模型，仅共享模型参数或梯度更新（而非原始数据），由中心协调节点聚合各方模型更新。A错误：不集中原始数据；C错误：适用于多种场景；D错误：通常需要中心协调。"}, {"id": "mock-2026年5月-模拟卷2-053", "index": 128, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 53, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "在对称加密算法中，AES-256的密钥长度为（ ）位。", "options": {"A": "128", "B": "192", "C": "256", "D": "512"}, "answer": "C", "analysis": "AES（高级加密标准）支持三种密钥长度：128位、192位和256位。AES-256使用256位密钥，提供最高级别的安全强度。"}, {"id": "mock-2026年5月-模拟卷2-054", "index": 129, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 54, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "以下关于DDoS（分布式拒绝服务）攻击的防御措施中，不有效的是（ ）。", "options": {"A": "使用CDN分散流量", "B": "配置流量清洗设备", "C": "增加服务器的存储容量", "D": "启用速率限制和IP黑名单"}, "answer": "C", "analysis": "DDoS攻击是通过大量请求耗尽服务器的网络带宽、CPU和内存资源。增加存储容量对防御DDoS无效。有效措施包括CDN分散流量、流量清洗设备过滤恶意流量、速率限制和IP黑名单等。"}, {"id": "mock-2026年5月-模拟卷2-055", "index": 130, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 55, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在零信任架构中，SDP（Software Defined Perimeter，软件定义边界）的核心理念是（ ）。", "options": {"A": "开放所有端口，依靠入侵检测系统进行防护", "B": "先认证后连接，默认隐藏所有服务，仅对认证授权的用户暴露", "C": "仅使用VPN实现远程安全接入", "D": "将所有安全策略集中在网络边界防火墙"}, "answer": "B", "analysis": "SDP（软件定义边界）遵循\"先认证后连接\"原则：默认隐藏所有服务和端口（对未认证用户完全不可见），只有通过身份认证和授权的用户才能获得对特定服务的访问权限。"}, {"id": "mock-2026年5月-模拟卷2-056", "index": 131, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 56, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "在Web安全中，以下关于CSRF（跨站请求伪造）攻击的描述中，正确的是（ ）。", "options": {"A": "CSRF攻击利用的是服务器对用户浏览器的信任", "B": "CSRF攻击直接窃取用户的登录密码", "C": "仅POST请求会受到CSRF攻击", "D": "CSRF攻击需要攻击者登录受害者的账号"}, "answer": "A", "analysis": "CSRF攻击利用的是服务器对用户浏览器（已登录状态）的信任。攻击者诱导用户访问恶意页面，该页面自动向目标网站发送请求，浏览器会自动携带用户的Cookie。CSRF不窃取密码，GET和POST都可能受攻击。"}, {"id": "mock-2026年5月-模拟卷2-057", "index": 132, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 57, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "DevSecOps中，SAST（静态应用安全测试）和DAST（动态应用安全测试）的主要区别是（ ）。", "options": {"A": "SAST在运行时分析应用行为，DAST分析源代码", "B": "SAST分析源代码或二进制文件而不需要运行程序，DAST在应用运行时进行测试", "C": "SAST只能检测SQL注入，DAST只能检测XSS", "D": "两者功能完全相同，仅命名不同"}, "answer": "B", "analysis": "SAST（静态应用安全测试）在不运行程序的情况下分析源代码、字节码或二进制文件，发现安全漏洞。DAST（动态应用安全测试）在应用运行时通过模拟攻击来发现漏洞。两者互补，SAST发现代码级问题，DAST发现运行时问题。"}, {"id": "mock-2026年5月-模拟卷2-058", "index": 133, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 58, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "《数据安全法》规定，重要数据的处理者应当（ ）对其数据处理活动定期开展风险评估。", "options": {"A": "每季度", "B": "每半年", "C": "每年", "D": "每两年"}, "answer": "C", "analysis": "《中华人民共和国数据安全法》第三十条规定：重要数据的处理者应当按照规定对其数据处理活动定期开展风险评估，并向有关主管部门报送风险评估报告。实践中通常要求每年至少开展一次。"}, {"id": "mock-2026年5月-模拟卷2-059", "index": 134, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 59, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "在分布式数据库系统中，CAP定理的约束下，选择CP（一致性+分区容错性）策略的典型数据库是（ ）。", "options": {"A": "Cassandra", "B": "ZooKeeper", "C": "DynamoDB", "D": "CouchDB"}, "answer": "B", "analysis": "ZooKeeper选择CP策略，优先保证一致性和分区容错性，在网络分区时可能暂时不可用（进行Leader选举期间拒绝服务）。Cassandra和DynamoDB倾向于AP策略（优先可用性），CouchDB也倾向于AP。"}, {"id": "mock-2026年5月-模拟卷2-060", "index": 135, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 60, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "以下关于图数据库的描述中，正确的是（ ）。", "options": {"A": "图数据库使用表结构存储数据，与关系型数据库相同", "B": "图数据库特别适合处理高度关联的数据和复杂的关系查询", "C": "图数据库不支持ACID事务", "D": "图数据库无法处理大规模数据集"}, "answer": "B", "analysis": "图数据库（如Neo4j、JanusGraph）使用节点、边和属性来存储和查询数据，特别擅长处理社交网络、知识图谱等高度关联的数据。现代图数据库支持ACID事务，也可处理大规模数据。"}, {"id": "mock-2026年5月-模拟卷2-061", "index": 136, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 61, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "向量数据库（Vector Database）的核心功能是（ ）。", "options": {"A": "存储和管理关系型表数据", "B": "高效存储高维向量并支持相似性搜索（如最近邻查询）", "C": "仅用于存储图片和视频等二进制数据", "D": "替代所有传统数据库进行事务处理"}, "answer": "B", "analysis": "向量数据库（如Milvus、Pinecone、Weaviate）核心功能是高效存储高维向量并支持ANN（近似最近邻）搜索，广泛应用于推荐系统、图像检索、大模型RAG等需要语义相似性搜索的场景。"}, {"id": "mock-2026年5月-模拟卷2-062", "index": 137, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 62, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "数据湖（Data Lake）与数据仓库（Data Warehouse）的主要区别是（ ）。", "options": {"A": "数据湖只存储结构化数据，数据仓库存储所有类型数据", "B": "数据湖以原始格式存储各种类型的数据，数据仓库存储经过清洗和结构化的数据", "C": "数据湖只能用于批处理，数据仓库支持实时查询", "D": "两者功能完全相同，仅容量不同"}, "answer": "B", "analysis": "数据湖以原始格式存储各种类型的数据（结构化、半结构化、非结构化），采用\"先存储后处理\"（Schema-on-Read）策略。数据仓库存储经过ETL清洗和结构化的数据，采用\"先处理后存储\"（Schema-on-Write）策略。"}, {"id": "mock-2026年5月-模拟卷2-063", "index": 138, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 63, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "在关系数据库中，某关系模式R(A, B, C, D)满足函数依赖集F={A→B, B→C, A→D}，则该关系的候选键为（ ）。", "options": {"A": "AB", "B": "A", "C": "BC", "D": "AD"}, "answer": "B", "analysis": "从函数依赖F={A→B, B→C, A→D}可知，A可以推出所有其他属性（A→B→C, A→D），因此A的闭包A⁺={A,B,C,D}=U，A是候选键。由于A单个属性就能作为候选键，其他包含A的组合都是超键而非候选键。"}, {"id": "mock-2026年5月-模拟卷2-064", "index": 139, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 64, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "以下关于NewSQL数据库的描述中，正确的是（ ）。", "options": {"A": "NewSQL放弃了SQL接口，使用自定义查询语言", "B": "NewSQL旨在兼具传统关系型数据库的ACID事务能力和NoSQL的水平扩展能力", "C": "NewSQL不支持分布式部署", "D": "NewSQL完全取代了NoSQL数据库的应用场景"}, "answer": "B", "analysis": "NewSQL（如CockroachDB、TiDB、Google Spanner）旨在兼具传统关系型数据库的ACID事务能力和SQL接口，同时具备NoSQL的水平扩展能力。NewSQL保留SQL接口，支持分布式部署，与NoSQL互补而非取代。"}, {"id": "mock-2026年5月-模拟卷2-065", "index": 140, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 65, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "在数据库并发控制中，两阶段锁协议（2PL）的\"两阶段\"是指（ ）。", "options": {"A": "读阶段和写阶段", "B": "加锁阶段（Growing Phase）和解锁阶段（Shrinking Phase）", "C": "请求阶段和释放阶段交替进行", "D": "共享锁阶段和排他锁阶段"}, "answer": "B", "analysis": "两阶段锁协议分为加锁阶段（Growing Phase，只能申请和获取锁，不能释放锁）和解锁阶段（Shrinking Phase，只能释放锁，不能申请新锁）。事务加锁和解锁分为两个明确的阶段，保证可串行化。"}, {"id": "mock-2026年5月-模拟卷2-066", "index": 141, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 66, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "数字孪生（Digital Twin）技术的核心特征是（ ）。", "options": {"A": "仅用于制造业的CAD建模", "B": "在虚拟空间中创建物理实体的数字化镜像，实现实时映射和双向交互", "C": "完全替代物理实体进行实际生产", "D": "仅提供历史数据的静态展示"}, "answer": "B", "analysis": "数字孪生在虚拟空间创建物理实体的数字化镜像，通过传感器数据实现实时映射和双向交互。应用范围广泛，包括制造业、城市管理、医疗等，不仅仅是CAD建模或静态展示。"}, {"id": "mock-2026年5月-模拟卷2-067", "index": 142, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 67, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "在区块链技术中，智能合约（Smart Contract）的特点不包括（ ）。", "options": {"A": "一旦部署到区块链上即自动执行，不可篡改", "B": "执行结果由网络中的节点共识验证", "C": "可以随时由任意用户修改合约逻辑", "D": "无需中介即可实现可信的交易执行"}, "answer": "C", "analysis": "智能合约部署到区块链后，其代码不可篡改、自动执行，结果由网络共识验证，无需中介。C选项\"可随时由任意用户修改\"与区块链不可篡改特性矛盾，是错误描述。"}, {"id": "mock-2026年5月-模拟卷2-068", "index": 143, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 68, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "后量子密码学（Post-Quantum Cryptography）主要解决的问题是（ ）。", "options": {"A": "提高当前对称加密算法的运算速度", "B": "开发能够抵御量子计算机攻击的公钥加密和数字签名算法", "C": "利用量子纠缠实现即时通信", "D": "用量子比特替代经典比特存储数据"}, "answer": "B", "analysis": "后量子密码学（PQC）旨在开发能够抵御量子计算机攻击的公钥加密和数字签名算法。量子计算机可能破解RSA、ECC等当前主流公钥算法（通过Shor算法），PQC使用格密码、哈希等替代方案。NIST已于2024年发布首批PQC标准。"}, {"id": "mock-2026年5月-模拟卷2-069", "index": 144, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 69, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "AIOps（智能运维）的核心目标是（ ）。", "options": {"A": "完全取消运维人员的参与", "B": "利用人工智能和机器学习技术实现IT运维的自动化和智能化", "C": "仅用于监控服务器CPU使用率", "D": "将所有运维操作手动化以确保准确性"}, "answer": "B", "analysis": "AIOps利用AI和ML技术实现IT运维的智能化和自动化，包括智能告警关联、异常检测、根因分析、容量预测、自动修复等。AIOps是增强运维能力而非完全取代运维人员。"}, {"id": "mock-2026年5月-模拟卷2-070", "index": 145, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 70, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在大模型应用架构中，RAG（Retrieval-Augmented Generation，检索增强生成）技术的主要优势是（ ）。", "options": {"A": "完全替代大语言模型的参数训练", "B": "通过检索外部知识库为大模型提供实时、准确的上下文信息，减少幻觉", "C": "仅适用于文本摘要任务", "D": "不需要任何外部数据源即可提升模型准确性"}, "answer": "B", "analysis": "RAG通过检索外部知识库（如文档、数据库）获取相关信息，作为上下文输入大模型进行生成，可以显著减少模型幻觉（hallucination），提升回答的准确性和时效性。RAG是对大模型的增强而非替代。"}, {"id": "mock-2026年5月-模拟卷2-071", "index": 146, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 71, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "According to the passage, the primary purpose of deploying sidecar proxies in a service mesh is to ( ).", "options": {"A": "replace the application code entirely", "B": "handle service-to-service communication without modifying application code", "C": "increase the memory consumption of each service", "D": "eliminate the need for service discovery"}, "answer": "B", "analysis": "文章指出\"These proxies intercept all inbound and outbound traffic, providing capabilities such as load balancing...without requiring changes to the application code\"，即Sidecar代理在不修改应用代码的情况下处理服务间通信。"}, {"id": "mock-2026年5月-模拟卷2-072", "index": 147, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 72, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "In Istio's architecture, Envoy functions as part of the ( ).", "options": {"A": "control plane", "B": "management plane", "C": "data plane", "D": "application plane"}, "answer": "C", "analysis": "文章明确指出\"in Istio...Envoy serves as the data plane proxy\"，Envoy是Istio数据平面的代理组件。"}, {"id": "mock-2026年5月-模拟卷2-073", "index": 148, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 73, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "The passage mentions that mutual TLS (mTLS) in a service mesh is used to ( ).", "options": {"A": "reduce the number of network requests between services", "B": "ensure all inter-service communication is encrypted and authenticated", "C": "replace traditional firewalls completely", "D": "increase network latency for security purposes"}, "answer": "B", "analysis": "文章指出\"By enforcing mutual TLS (mTLS) between all services, the mesh ensures that all inter-service communication is encrypted and authenticated\"，mTLS确保所有服务间通信被加密和认证。"}, {"id": "mock-2026年5月-模拟卷2-074", "index": 149, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 74, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "According to the passage, a potential drawback of adopting a service mesh is ( ).", "options": {"A": "it eliminates the need for observability tools", "B": "it introduces additional resource overhead and complexity", "C": "it reduces the security of inter-service communication", "D": "it is only applicable to monolithic architectures"}, "answer": "B", "analysis": "文章指出\"adopting a service mesh introduces additional complexity and resource overhead. Each sidecar proxy consumes CPU and memory, and the additional network hop can increase latency\"，即引入额外的复杂性和资源开销。"}, {"id": "mock-2026年5月-模拟卷2-075", "index": 150, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 75, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "The passage suggests that a service mesh may not be suitable for ( ).", "options": {"A": "large-scale microservices deployments", "B": "organizations requiring zero-trust networking", "C": "smaller deployments where simpler alternatives may suffice", "D": "systems that need traffic management capabilities"}, "answer": "C", "analysis": "文章最后指出\"particularly for smaller deployments where simpler alternatives may suffice\"，暗示服务网格对于较小的部署场景可能不太合适，更简单的替代方案就已足够。"}, {"id": "mock-2026年5月-模拟卷3-001", "index": 151, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 1, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在采用多级反馈队列调度算法的操作系统中，以下描述正确的是（）。", "options": {"A": "各级队列均采用先来先服务策略，且时间片大小相同", "B": "当高优先级队列为空时，低优先级队列中的进程才能被调度执行", "C": "进程一旦进入低优先级队列，就不可能再回到高优先级队列", "D": "多级反馈队列调度算法不会产生饥饿现象"}, "answer": "B", "analysis": "多级反馈队列调度算法中：①各级队列优先级从高到低，时间片从小到大；②新进程进入最高优先级队列；③只有高优先级队列为空时，低优先级队列中的进程才能执行；④进程可因I/O等原因返回高优先级队列（C错）；⑤低优先级进程可能饥饿（D错）。"}, {"id": "mock-2026年5月-模拟卷3-002", "index": 152, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 2, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "某系统采用请求分页存储管理，页面大小为4KB，某进程页表如下：页号0→物理块3、页号1→物理块7、页号2→物理块1、页号3→物理块5。逻辑地址0x2A1C对应的物理地址是（）。", "options": {"A": "0x1A1C", "B": "0x3A1C", "C": "0x5A1C", "D": "0x7A1C"}, "answer": "A", "analysis": "页面大小4KB = 2^12B，低12位为页内偏移。逻辑地址0x2A1C，页号 = 0x2A1C >> 12 = 0x2 = 页号2。查页表，页号2→物理块1。物理地址 = 0x1000 + 0xA1C = 0x1A1C。"}, {"id": "mock-2026年5月-模拟卷3-003", "index": 153, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 3, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在五段流水线（取指IF、译码ID、执行EX、访存MEM、写回WB）中，若某条件分支指令在EX阶段才能确定转移方向，则在无任何优化措施时，该分支指令可能导致的流水线延迟周期数为（）。", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "answer": "B", "analysis": "五段流水线中分支指令在EX阶段确定方向。此时已有2条后续指令进入流水线（在ID和IF阶段），若分支跳转则需丢弃，延迟2个周期。"}, {"id": "mock-2026年5月-模拟卷3-004", "index": 154, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 4, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "中断向量表中存放的是（）。", "options": {"A": "中断服务程序入口地址", "B": "中断请求信号", "C": "中断屏蔽字", "D": "中断返回地址"}, "answer": "A", "analysis": "中断向量表存放各中断源对应的中断服务程序入口地址。CPU根据中断类型号查表获取入口地址，转去执行中断服务程序。"}, {"id": "mock-2026年5月-模拟卷3-005", "index": 155, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 5, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "以下关于DMA（直接存储器访问）方式的描述，错误的是（）。", "options": {"A": "DMA方式下数据传输不需要CPU干预", "B": "DMA控制器在传输开始前需向CPU申请总线使用权", "C": "DMA传输完成后通过中断方式通知CPU", "D": "DMA方式每传输一个字节都需要CPU进行一次中断处理"}, "answer": "D", "analysis": "DMA方式按块传输数据，传输期间不需要CPU干预。DMA开始前需申请总线控制权，完成后通过中断通知CPU。不是每传输一个字节都中断，D错误。"}, {"id": "mock-2026年5月-模拟卷3-006", "index": 156, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 6, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "某计算机的主存地址空间为4GB，按字节编址，Cache的数据区容量为8KB，每个Cache行大小为128字节，采用直接映射方式。则主存地址的标记（Tag）位数为（）。", "options": {"A": "17", "B": "18", "C": "19", "D": "20"}, "answer": "C", "analysis": "主存4GB = 2^32，地址32位。Cache行大小128B = 2^7，偏移7位。Cache数据区8KB = 2^13，行数 = 2^13/2^7 = 2^6 = 64行。直接映射行索引6位。Tag = 32 - 6 - 7 = 19位。"}, {"id": "mock-2026年5月-模拟卷3-007", "index": 157, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 7, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "在操作系统中，银行家算法用于（）。", "options": {"A": "预防死锁", "B": "检测死锁", "C": "避免死锁", "D": "解除死锁"}, "answer": "C", "analysis": "银行家算法是经典的死锁避免算法，通过检查资源分配后系统是否处于安全状态来决定是否分配。预防死锁是破坏四个必要条件之一，检测死锁用资源分配图简化法，解除死锁用撤销进程或剥夺资源。"}, {"id": "mock-2026年5月-模拟卷3-008", "index": 158, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 8, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "某系统采用页式虚拟存储管理，分配给某进程3个物理页框，该进程的页面访问序列为1,2,3,4,1,2,5,1,2,3,4,5。采用LRU置换算法时发生的缺页次数为（）。", "options": {"A": "8", "B": "9", "C": "10", "D": "11"}, "answer": "C", "analysis": "LRU算法，3页框，访问序列1,2,3,4,1,2,5,1,2,3,4,5：\n1→缺[1]，2→缺[1,2]，3→缺[1,2,3]，4→缺淘汰1[2,3,4]，1→缺淘汰2[3,4,1]，2→缺淘汰3[4,1,2]，5→缺淘汰4[1,2,5]，1→命中，2→命中，3→缺淘汰5[1,2,3]，4→缺淘汰1[2,3,4]，5→缺淘汰2[3,4,5]。共10次缺页。"}, {"id": "mock-2026年5月-模拟卷3-009", "index": 159, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 9, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于总线结构的描述，正确的是（）。", "options": {"A": "PCI Express采用并行总线架构以获得更高带宽", "B": "系统总线包括数据总线、地址总线和控制总线三类", "C": "总线仲裁中的菊花链方式对所有设备的优先级完全相同", "D": "同步总线中各设备可按各自时钟独立工作"}, "answer": "B", "analysis": "系统总线分为数据总线、地址总线和控制总线三类。PCIe采用串行点对点架构（A错）。菊花链仲裁中离仲裁器近的优先级高（C错）。同步总线按统一时钟工作（D错）。"}, {"id": "mock-2026年5月-模拟卷3-010", "index": 160, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 10, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在实时操作系统中，硬实时任务与软实时任务的关键区别在于（）。", "options": {"A": "硬实时任务的执行时间更短", "B": "硬实时任务必须在严格的截止时间前完成，否则会导致系统灾难性后果", "C": "软实时任务不需要截止时间", "D": "软实时任务不能被抢占"}, "answer": "B", "analysis": "硬实时任务必须在严格截止时间前完成，超时导致灾难性后果（如飞行控制）。软实时任务也有截止时间但偶尔超时仅导致性能下降。"}, {"id": "mock-2026年5月-模拟卷3-011", "index": 161, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 11, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "某32位计算机采用组相联映射的Cache，Cache容量为32KB，主存块大小为64字节，每组包含4行（4路组相联）。则该Cache共有（）组。", "options": {"A": "64", "B": "128", "C": "256", "D": "512"}, "answer": "B", "analysis": "Cache容量32KB，块大小64B，4路组相联。总行数 = 32KB/64B = 512行。每组4行，组数 = 512/4 = 128组。"}, {"id": "mock-2026年5月-模拟卷3-012", "index": 162, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 12, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在段页式存储管理系统中，每次访问内存数据至少需要（）次主存访问（不考虑快表TLB命中的情况）。", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "answer": "C", "analysis": "段页式存储管理访问数据需要：①访问段表获取页表起始地址；②访问页表获取物理块号；③访问目标数据。共3次主存访问（不考虑TLB）。"}, {"id": "mock-2026年5月-模拟卷3-013", "index": 163, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 13, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在需求工程中，需求验证（Validation）和需求验证（Verification）的区别在于（）。", "options": {"A": "Validation检查需求文档的一致性，Verification检查是否满足用户需求", "B": "Validation确认是否构建了正确的系统，Verification检查是否正确地构建了系统", "C": "两者含义相同，只是术语不同", "D": "Validation由开发人员执行，Verification由用户执行"}, "answer": "B", "analysis": "Validation（确认）：\"是否构建了正确的产品？\"即是否满足用户真实需求。Verification（验证）：\"是否正确地构建了产品？\"即是否符合规格说明。"}, {"id": "mock-2026年5月-模拟卷3-014", "index": 164, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 14, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "Z语言是一种基于（）的形式化规格说明语言，常用于关键系统的需求描述和验证。", "options": {"A": "有限状态机", "B": "一阶谓词逻辑和集合论", "C": "Petri网", "D": "进程代数"}, "answer": "B", "analysis": "Z语言基于一阶谓词逻辑和集合论（ZF集合论），由牛津大学开发，用于安全关键系统的需求规格描述。Petri网用于并发系统建模，进程代数（CSP、CCS）用于并发进程交互。"}, {"id": "mock-2026年5月-模拟卷3-015", "index": 165, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 15, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "McCabe环形复杂度的计算公式V(G) = E - N + 2中，E和N分别代表（）。", "options": {"A": "E为节点数，N为边数", "B": "E为边数，N为节点数", "C": "E为判定节点数，N为总节点数", "D": "E为路径数，N为循环数"}, "answer": "B", "analysis": "McCabe环形复杂度V(G) = E - N + 2中，E为控制流图的边数（Edge），N为节点数（Node）。也可用V(G) = P + 1（P为判定节点数）计算。"}, {"id": "mock-2026年5月-模拟卷3-016", "index": 166, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 16, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在CMMI的阶段式表示中，\"已管理级\"（第2级）包含的过程域不包括（）。", "options": {"A": "需求管理", "B": "项目监控与控制", "C": "需求开发", "D": "配置管理"}, "answer": "C", "analysis": "CMMI第2级\"已管理级\"过程域：需求管理、项目计划、项目监控与控制、供应商协议管理、度量与分析、过程和产品质量保证、配置管理。需求开发属于第3级\"已定义级\"。"}, {"id": "mock-2026年5月-模拟卷3-017", "index": 167, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 17, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "ISO/IEC 25010软件产品质量模型中，以下不属于八大质量特性的是（）。", "options": {"A": "功能适合性", "B": "可移植性", "C": "兼容性", "D": "可复用性"}, "answer": "D", "analysis": "ISO/IEC 25010八大质量特性：功能适合性、性能效率、兼容性、易用性、可靠性、安全性、可维护性、可移植性。可复用性不是独立质量特性，是可维护性的子特性。"}, {"id": "mock-2026年5月-模拟卷3-018", "index": 168, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 18, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在敏捷开发方法Scrum中，Sprint回顾会议（Sprint Retrospective）的主要目的是（）。", "options": {"A": "向产品负责人展示已完成的功能", "B": "团队反思过去Sprint的过程并制定改进计划", "C": "对Product Backlog进行优先级排序", "D": "估算下一个Sprint的工作量"}, "answer": "B", "analysis": "Sprint回顾会议是团队反思过去Sprint过程并制定改进计划的会议。Sprint评审会议（Review）才是向产品负责人展示已完成功能。"}, {"id": "mock-2026年5月-模拟卷3-019", "index": 169, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 19, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "面向对象的SOLID原则中，里氏替换原则（Liskov Substitution Principle）的核心含义是（）。", "options": {"A": "一个类应该只有一个引起变化的原因", "B": "子类对象必须能够替换其父类对象而不影响程序的正确性", "C": "高层模块不应依赖低层模块", "D": "接口应该尽量小而专用"}, "answer": "B", "analysis": "里氏替换原则（LSP）：子类对象必须能替换父类对象而不影响程序正确性。A是单一职责原则，C是依赖倒置原则，D是接口隔离原则。"}, {"id": "mock-2026年5月-模拟卷3-020", "index": 170, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 20, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "以下关于软件度量的描述，错误的是（）。", "options": {"A": "功能点分析（FPA）是一种面向功能的软件规模度量方法", "B": "代码行（LOC）度量方法与编程语言无关", "C": "Halstead复杂度度量基于程序中运算符和操作数的统计", "D": "COCOMO模型是一种软件成本估算模型"}, "answer": "B", "analysis": "代码行（LOC）与编程语言密切相关，不同语言实现相同功能的代码行数差异大。功能点分析（FPA）才是语言无关的度量方法。"}, {"id": "mock-2026年5月-模拟卷3-021", "index": 171, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 21, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在UML 2.0的交互图中，组合片段（Combined Fragment）的操作符\"alt\"表示（）。", "options": {"A": "循环执行", "B": "条件分支（多选一）", "C": "并行执行", "D": "可选执行（条件为真时执行）"}, "answer": "B", "analysis": "UML 2.0组合片段操作符：alt=条件分支（多选一，类似if-else），opt=可选执行，loop=循环，par=并行。"}, {"id": "mock-2026年5月-模拟卷3-022", "index": 172, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 22, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "软件配置管理中，基线（Baseline）的作用是（）。", "options": {"A": "防止任何人修改软件配置项", "B": "作为软件开发过程中的里程碑，已通过正式评审的配置项集合", "C": "只用于记录软件版本号", "D": "仅在项目结束时建立"}, "answer": "B", "analysis": "基线是已通过正式评审和批准的配置项集合，作为后续开发的基准。基线建立后仍可修改，但须经正式变更控制流程。"}, {"id": "mock-2026年5月-模拟卷3-023", "index": 173, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 23, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在软件可靠性工程中，MTTF表示平均失效前时间，MTTR表示平均修复时间，则系统可用性的计算公式为（）。", "options": {"A": "MTTF / (MTTF + MTTR)", "B": "MTTR / (MTTF + MTTR)", "C": "MTTF / MTTR", "D": "MTTF × MTTR"}, "answer": "A", "analysis": "系统可用性 = MTTF/(MTTF+MTTR)。MTTF为平均失效前时间，MTTR为平均修复时间。MTTF+MTTR=MTBF（平均失效间隔时间）。"}, {"id": "mock-2026年5月-模拟卷3-024", "index": 174, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 24, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "某软件项目采用增量开发模型，第一个增量实现了核心功能，后续增量逐步扩展。以下关于增量模型的描述，错误的是（）。", "options": {"A": "每个增量都是一个可运行的产品", "B": "增量模型适合需求不明确且频繁变化的项目", "C": "第一个增量通常实现最核心、最基本的功能", "D": "增量模型的每个增量都需要经过完整的软件开发过程"}, "answer": "B", "analysis": "增量模型适合需求比较清楚、可分批次交付的项目。需求不明确且频繁变化的项目更适合原型模型或敏捷方法。"}, {"id": "mock-2026年5月-模拟卷3-025", "index": 175, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 25, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "以下关于面向对象设计原则的描述，正确的是（）。", "options": {"A": "开闭原则要求软件实体对扩展和修改都是封闭的", "B": "依赖倒置原则要求高层模块应该依赖于抽象而不是具体实现", "C": "单一职责原则要求一个类只能有一个方法", "D": "接口隔离原则要求所有类都实现同一个通用接口"}, "answer": "B", "analysis": "依赖倒置原则（DIP）：高层模块应依赖抽象而非具体实现。A错：开闭原则是对扩展开放、对修改封闭。C错：单一职责是一个引起变化的原因。D错：接口隔离要求接口精简专用。"}, {"id": "mock-2026年5月-模拟卷3-026", "index": 176, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 26, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在软件测试中，等价类划分属于（）测试方法。", "options": {"A": "白盒测试", "B": "黑盒测试", "C": "灰盒测试", "D": "回归测试"}, "answer": "B", "analysis": "等价类划分是黑盒测试方法，不需要了解程序内部结构，仅根据输入输出规格设计测试用例。白盒测试方法包括语句覆盖、判定覆盖、路径覆盖等。"}, {"id": "mock-2026年5月-模拟卷3-027", "index": 177, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 27, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于软件过程模型的描述，正确的是（）。", "options": {"A": "瀑布模型适合需求不确定的项目", "B": "螺旋模型引入了风险分析，特别适合大型复杂项目", "C": "V模型强调编码阶段与测试阶段的并行", "D": "喷泉模型是一种面向过程的开发模型"}, "answer": "B", "analysis": "螺旋模型在原型模型基础上引入风险分析，适合大型复杂项目。A错：瀑布模型适合需求明确的项目。C错：V模型强调测试与开发各阶段的对应关系，不是并行。D错：喷泉模型是面向对象的开发模型。"}, {"id": "mock-2026年5月-模拟卷3-028", "index": 178, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 28, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "在软件项目管理中，关键路径法（CPM）中关键路径上的活动的总浮动时间（Total Float）为（）。", "options": {"A": "大于0", "B": "等于0", "C": "小于0", "D": "不确定"}, "answer": "B", "analysis": "关键路径是项目中最长的路径，决定了项目的最短工期。关键路径上的活动总浮动时间为0，任何延迟都会直接影响项目完工时间。"}, {"id": "mock-2026年5月-模拟卷3-029", "index": 179, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 29, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在\"管道-过滤器\"架构风格中，以下描述错误的是（）。", "options": {"A": "每个过滤器独立完成数据处理，不与其他过滤器共享状态", "B": "管道连接过滤器，传输数据流", "C": "该风格支持过滤器的并发执行", "D": "该风格特别适合需要大量用户交互的系统"}, "answer": "D", "analysis": "管道-过滤器架构风格适合数据流处理（如编译器、Unix Shell命令），不适合需要大量用户交互的系统，因为它是单向数据流处理，难以实现交互式操作。"}, {"id": "mock-2026年5月-模拟卷3-030", "index": 180, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 30, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下架构风格中，最适合用于构建编译器的是（）。", "options": {"A": "客户端-服务器", "B": "分层架构", "C": "管道-过滤器", "D": "事件驱动"}, "answer": "C", "analysis": "编译器的经典架构是管道-过滤器：词法分析→语法分析→语义分析→中间代码生成→代码优化→目标代码生成，每个阶段处理数据并传递给下一阶段。"}, {"id": "mock-2026年5月-模拟卷3-031", "index": 181, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 31, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "架构描述语言（ADL）的三个基本元素是（）。", "options": {"A": "构件、连接件、模块", "B": "构件、连接件、架构配置", "C": "接口、实现、部署", "D": "模型、视图、控制器"}, "answer": "B", "analysis": "ADL的三个基本元素：构件（Component）、连接件（Connector）和架构配置（Architectural Configuration）。构件是计算单元，连接件定义构件间交互，配置描述架构拓扑。"}, {"id": "mock-2026年5月-模拟卷3-032", "index": 182, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 32, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "ATAM（架构折中分析方法）的主要输出物不包括（）。", "options": {"A": "敏感点", "B": "权衡点", "C": "风险和非风险", "D": "详细设计文档"}, "answer": "D", "analysis": "ATAM的主要输出物包括：敏感点、权衡点、风险和非风险、风险主题。详细设计文档不是ATAM的输出，ATAM针对架构层面评估，不涉及详细设计。"}, {"id": "mock-2026年5月-模拟卷3-033", "index": 183, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 33, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于微内核架构风格的描述，错误的是（）。", "options": {"A": "微内核架构将核心功能与扩展功能分离", "B": "插件模块通过统一接口与核心系统交互", "C": "微内核架构不支持运行时动态加载新插件", "D": "操作系统和IDE是微内核架构的典型应用"}, "answer": "C", "analysis": "微内核架构的重要特点就是支持运行时动态加载/卸载插件，这是其灵活性和可扩展性的核心体现。Eclipse IDE、VS Code等都是典型的微内核架构应用。"}, {"id": "mock-2026年5月-模拟卷3-034", "index": 184, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 34, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在面向服务的架构（SOA）中，服务注册中心（Service Registry）的主要功能是（）。", "options": {"A": "执行服务的业务逻辑", "B": "存储服务描述信息，支持服务的发布和发现", "C": "监控服务运行的性能指标", "D": "负责服务之间的消息路由"}, "answer": "B", "analysis": "SOA中服务注册中心（如UDDI）存储服务描述信息（WSDL），服务提供者发布服务，服务消费者通过注册中心发现和绑定服务。"}, {"id": "mock-2026年5月-模拟卷3-035", "index": 185, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 35, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "SAAM（Software Architecture Analysis Method）主要关注的质量属性是（）。", "options": {"A": "性能", "B": "可用性", "C": "可修改性", "D": "安全性"}, "answer": "C", "analysis": "SAAM是最早的架构分析方法，主要关注可修改性质量属性。ATAM是SAAM的扩展，支持多种质量属性的折中分析。"}, {"id": "mock-2026年5月-模拟卷3-036", "index": 186, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 36, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于事件驱动架构（EDA）的描述，正确的是（）。", "options": {"A": "事件生产者需要知道事件消费者的具体信息", "B": "事件驱动架构只支持同步通信模式", "C": "事件驱动架构中组件之间通过事件进行松耦合通信", "D": "事件驱动架构不适合处理实时数据流"}, "answer": "C", "analysis": "事件驱动架构的核心特征是松耦合。事件生产者无需知道消费者（A错），支持异步通信（B错），非常适合实时数据流处理（D错）。"}, {"id": "mock-2026年5月-模拟卷3-037", "index": 187, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 37, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在架构复用中，\"产品线架构\"的核心思想是（）。", "options": {"A": "每个产品都从头开始设计独立架构", "B": "通过共享核心资产和架构来开发一系列相关产品", "C": "将所有产品合并为一个统一的系统", "D": "只复用代码而不复用架构设计"}, "answer": "B", "analysis": "产品线架构通过共享核心资产（包括架构、组件、测试用例等）来开发一系列相关产品，实现架构级别的复用，显著降低开发成本。"}, {"id": "mock-2026年5月-模拟卷3-038", "index": 188, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 38, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于REST架构风格的约束，不属于REST核心约束的是（）。", "options": {"A": "无状态", "B": "统一接口", "C": "有状态会话", "D": "分层系统"}, "answer": "C", "analysis": "REST的核心约束包括：客户端-服务器、无状态、可缓存、统一接口、分层系统、按需代码（可选）。“有状态会话”与无状态约束矛盾，不属于REST约束。"}, {"id": "mock-2026年5月-模拟卷3-039", "index": 189, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 39, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "质量属性场景（Quality Attribute Scenario）的六个组成部分中，不包括（）。", "options": {"A": "刺激源（Source of Stimulus）", "B": "刺激（Stimulus）", "C": "成本估算（Cost Estimation）", "D": "响应度量（Response Measure）"}, "answer": "C", "analysis": "质量属性场景六个部分：刺激源、刺激、环境、制品（被刺激的实体）、响应、响应度量。成本估算不属于场景组成部分。"}, {"id": "mock-2026年5月-模拟卷3-040", "index": 190, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 40, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在采用\"黑板\"架构风格的系统中，以下描述正确的是（）。", "options": {"A": "各知识源可以直接相互通信", "B": "控制组件决定哪个知识源在什么条件下被激活", "C": "黑板架构主要用于数据库管理系统", "D": "黑板中的数据只能被读取不能被修改"}, "answer": "B", "analysis": "黑板架构三个组成：黑板（共享数据）、知识源（独立处理模块）、控制组件。知识源之间不直接通信（A错），通过黑板交互。黑板数据可读写（D错）。常用于AI、语音识别等领域（C错）。"}, {"id": "mock-2026年5月-模拟卷3-041", "index": 191, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 41, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某电子商务系统需要同时满足高可用性（99.99%）和快速响应（<200ms）的要求，架构师应该优先考虑的架构策略组合是（）。", "options": {"A": "主动冗余 + 同步复制", "B": "主动冗余 + CDN + 缓存", "C": "被动冗余 + 消息队列", "D": "检查点恢复 + 数据库分片"}, "answer": "B", "analysis": "高可用性需要主动冗余（故障时快速切换），快速响应需要CDN和缓存减少延迟。同步复制会增加延迟（A不优），被动冗余切换慢（C不优），检查点恢复时间长（D不优）。"}, {"id": "mock-2026年5月-模拟卷3-042", "index": 192, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 42, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于架构视图\"4+1\"模型的描述，错误的是（）。", "options": {"A": "逻辑视图描述系统的功能需求", "B": "进程视图关注并发和同步", "C": "物理视图描述软件到硬件的映射", "D": "开发视图主要面向最终用户"}, "answer": "D", "analysis": "4+1视图模型中，开发视图主要面向程序员和软件管理人员，描述软件的组织结构（模块、包、层）。逻辑视图面向最终用户，不是开发视图。"}, {"id": "mock-2026年5月-模拟卷3-043", "index": 193, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 43, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "在RSA算法中，已知公钥(e, n)和私钥(d, n)，若明文M的加密过程为C = M^e mod n，则解密过程为（）。", "options": {"A": "M = C^e mod n", "B": "M = C^d mod n", "C": "M = C^(e×d) mod n", "D": "M = C^(e+d) mod n"}, "answer": "B", "analysis": "RSA加密：C = M^e mod n，解密：M = C^d mod n。其中e和d满足e×d ≡ 1 (mod φ(n))，保证解密正确性。"}, {"id": "mock-2026年5月-模拟卷3-044", "index": 194, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 44, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "数字证书中不包含的信息是（）。", "options": {"A": "证书持有者的公钥", "B": "证书颁发机构（CA）的数字签名", "C": "证书持有者的私钥", "D": "证书的有效期"}, "answer": "C", "analysis": "数字证书包含：持有者公钥、CA签名、有效期、序列号、发行者信息等。私钥是持有者秘密保管的，绝不包含在证书中。"}, {"id": "mock-2026年5月-模拟卷3-045", "index": 195, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 45, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "国密算法SM2是基于（）的公钥密码算法。", "options": {"A": "大整数分解", "B": "离散对数", "C": "椭圆曲线", "D": "哈希函数"}, "answer": "C", "analysis": "SM2是基于椭圆曲线密码学（ECC）的公钥密码算法。RSA基于大整数分解，DSA基于离散对数，SM3是哈希函数。"}, {"id": "mock-2026年5月-模拟卷3-046", "index": 196, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 46, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "在PKI体系中，证书撤销列表（CRL）的主要作用是（）。", "options": {"A": "存储所有已颁发的证书", "B": "记录已经被撤销但尚未过期的证书", "C": "生成新的数字证书", "D": "验证证书持有者的身份"}, "answer": "B", "analysis": "CRL记录已被撤销但尚未过期的证书列表。验证证书时需检查该列表，确保证书未被撤销。OCSP是实时替代方案。"}, {"id": "mock-2026年5月-模拟卷3-047", "index": 197, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 47, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "以下关于对称加密和非对称加密的描述，正确的是（）。", "options": {"A": "AES是非对称加密算法", "B": "非对称加密的加解密速度通常快于对称加密", "C": "在实际应用中常用非对称加密来传输对称密钥", "D": "对称加密不存在密钥分发问题"}, "answer": "C", "analysis": "实际中常用非对称加密传输对称密钥（如TLS握手），然后用对称密钥加密数据。AES是对称加密（A错），非对称加密比对称加密慢（B错），对称加密存在密钥分发问题（D错）。"}, {"id": "mock-2026年5月-模拟卷3-048", "index": 198, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 48, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "国密算法SM3的输出摘要长度为（）位。", "options": {"A": "128", "B": "160", "C": "256", "D": "512"}, "answer": "C", "analysis": "SM3是国密密码杂凑算法，输出摘要长度256位，与SHA-256相同。SM4是对称加密算法，分组长度128位。"}, {"id": "mock-2026年5月-模拟卷3-049", "index": 199, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 49, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "以下网络攻击中，属于主动攻击的是（）。", "options": {"A": "流量分析", "B": "窃听", "C": "中间人攻击", "D": "数据包嗅探"}, "answer": "C", "analysis": "主动攻击会篡改或影响数据/服务，如中间人攻击、重放攻击、拒绝服务攻击。被动攻击只窃取信息不篡改，如窃听、流量分析、数据包嗅探。"}, {"id": "mock-2026年5月-模拟卷3-050", "index": 200, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 50, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "零信任安全架构（Zero Trust Architecture）的核心原则是（）。", "options": {"A": "内网设备默认可信，外网设备需要验证", "B": "永不信任，始终验证，不论网络位置", "C": "仅在首次连接时进行身份验证", "D": "信任一切通过防火墙的请求"}, "answer": "B", "analysis": "零信任架构的核心原则是“永不信任，始终验证（Never Trust, Always Verify）”，不区分内外网，每次访问都需要身份验证和授权。"}, {"id": "mock-2026年5月-模拟卷3-051", "index": 201, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 51, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在关系代数中，从关系R中选取满足条件F的元组的操作称为（）。", "options": {"A": "投影（Projection）", "B": "选择（Selection）", "C": "连接（Join）", "D": "除（Division）"}, "answer": "B", "analysis": "关系代数中，选择（Selection，σ）是从关系中选取满足条件的元组。投影（Projection，π）是选取指定列。连接（Join）是将两个关系按条件组合。除（Division）用于全称量词查询。"}, {"id": "mock-2026年5月-模拟卷3-052", "index": 202, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 52, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "在数据库事务隔离级别中，\"可重复读\"（Repeatable Read）能避免的并发问题包括（）。", "options": {"A": "脏读和不可重复读，但不能避免幻读", "B": "脏读、不可重复读和幻读", "C": "仅脏读", "D": "仅不可重复读"}, "answer": "A", "analysis": "SQL标准中，可重复读隔离级别可避免脏读和不可重复读，但不能避免幻读。只有可串行化（Serializable）才能避免所有三种问题。注：MySQL InnoDB的RR级别通过间隙锁实际上也能避免幻读，但考试按SQL标准答。"}, {"id": "mock-2026年5月-模拟卷3-053", "index": 203, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 53, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在分布式系统中，CAP定理指出一个分布式数据存储不可能同时满足以下三个保证中的全部三个，其中\"P\"代表（）。", "options": {"A": "Performance（性能）", "B": "Partition tolerance（分区容错性）", "C": "Persistence（持久性）", "D": "Privacy（隐私性）"}, "answer": "B", "analysis": "CAP定理：C = Consistency（一致性），A = Availability（可用性），P = Partition tolerance（分区容错性）。分布式系统中分区是不可避免的，所以实际是在C和A之间权衡。"}, {"id": "mock-2026年5月-模拟卷3-054", "index": 204, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 54, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "以下关于数据库范式的描述，正确的是（）。", "options": {"A": "第二范式（2NF）消除了传递依赖", "B": "第三范式（3NF）消除了非主属性对候选键的部分函数依赖", "C": "BCNF要求每个决定因素都是候选键", "D": "第一范式（1NF）要求不存在部分依赖"}, "answer": "C", "analysis": "BCNF要求每个决定因素（函数依赖左边）都是候选键。A错：2NF消除部分依赖，3NF消除传递依赖。B错：2NF消除部分函数依赖，不是3NF。D错：1NF要求属性不可再分。"}, {"id": "mock-2026年5月-模拟卷3-055", "index": 205, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 55, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "Raft一致性算法中，节点的三种状态是（）。", "options": {"A": "Leader、Follower、Observer", "B": "Leader、Follower、Candidate", "C": "Master、Slave、Arbiter", "D": "Primary、Secondary、Candidate"}, "answer": "B", "analysis": "Raft算法中节点有三种状态：Leader（领导者）、Follower（跟随者）、Candidate（候选人）。Follower在超时未收到心跳时转为Candidate发起选举，获得多数票后成为Leader。"}, {"id": "mock-2026年5月-模拟卷3-056", "index": 206, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 56, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "在数据库的并发控制中，两阶段封锁协议（2PL）可以保证事务调度的（）。", "options": {"A": "不产生死锁", "B": "可串行化", "C": "不产生级联回滚", "D": "可恢复性"}, "answer": "B", "analysis": "两阶段封锁协议（2PL）分为增长阶段和缩减阶段，可以保证调度的可串行化，但不能防止死锁。严格两阶段封锁协议（Strict 2PL）才能避免级联回滚。"}, {"id": "mock-2026年5月-模拟卷3-057", "index": 207, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 57, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "以下关于NoSQL数据库的描述，错误的是（）。", "options": {"A": "Redis是典型的键值型数据库", "B": "MongoDB是文档型数据库", "C": "Neo4j是图数据库", "D": "NoSQL数据库都不支持ACID事务"}, "answer": "D", "analysis": "并非NoSQL数据库都不支持ACID事务。MongoDB 4.0+支持多文档ACID事务，CockroachDB（NewSQL）完全支持ACID。特定场景下多数NoSQL也提供某种形式的事务支持。"}, {"id": "mock-2026年5月-模拟卷3-058", "index": 208, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 58, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "Transformer架构中，自注意力（Self-Attention）机制的计算复杂度与输入序列长度n的关系是（）。", "options": {"A": "O(n)", "B": "O(n log n)", "C": "O(n²)", "D": "O(n³)"}, "answer": "C", "analysis": "标准自注意力机制需计算每个Token与所有其他Token的注意力分数，复杂度为O(n²)（n为序列长度）。这是Transformer处理长序列的主要瓶颈，也是FlashAttention、Mamba等方案试图解决的问题。"}, {"id": "mock-2026年5月-模拟卷3-059", "index": 209, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 59, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "Mixture of Experts（MoE）架构的核心设计思想是（）。", "options": {"A": "将所有参数用于每个输入Token的计算", "B": "通过门控网络动态选择部分专家网络处理每个Token，实现稀疏激活", "C": "采用纯卷积神经网络替代注意力机制", "D": "通过增加模型层数来提升性能"}, "answer": "B", "analysis": "MoE的核心是稀疏激活：通过门控/路由网络（Router）为每个Token动态选择部分专家（如Top-2 Experts），而非激活所有参数。这样在大幅增加模型总参数量的同时，保持每次推理的计算量可控。典型代表：Mistral Mixtral 8x7B、DeepSeek-V3。"}, {"id": "mock-2026年5月-模拟卷3-060", "index": 210, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 60, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "Mamba架构相比于Transformer的主要优势在于（）。", "options": {"A": "更强的并行计算能力", "B": "对长序列的推理复杂度为线性O(n)，而非Transformer的O(n²)", "C": "更少的模型参数量", "D": "不需要GPU即可高效运行"}, "answer": "B", "analysis": "Mamba基于结构化状态空间模型（SSM），对长序列的推理复杂度为O(n)（线性），而Transformer自注意力为O(n²)。这使得Mamba在处理超长序列时更高效。但Mamba在某些需要全局注意力的任务上可能不如Transformer。"}, {"id": "mock-2026年5月-模拟卷3-061", "index": 211, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 61, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在RAG（检索增强生成）系统中，以下描述错误的是（）。", "options": {"A": "RAG通过检索外部知识库来增强大模型的生成能力", "B": "RAG可以有效缓解大模型的幻觉（Hallucination）问题", "C": "RAG系统中的检索组件通常使用向量相似度搜索", "D": "RAG完全替代了大模型的微调（Fine-tuning），使微调不再必要"}, "answer": "D", "analysis": "RAG和微调是互补的技术，不是替代关系。RAG擅长引入外部实时知识，微调擅长调整模型行为和领域知识。实际应用中常将两者结合使用（如微调+RAG）。"}, {"id": "mock-2026年5月-模拟卷3-062", "index": 212, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 62, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在Prompt Engineering中，Chain-of-Thought（CoT）提示的核心思想是（）。", "options": {"A": "将多个不相关的问题链接在一起提问", "B": "引导模型逐步进行推理，展示中间思维过程以提升复杂任务的正确率", "C": "让模型生成尽可能长的回答", "D": "通过重复提问相同问题来提高答案准确性"}, "answer": "B", "analysis": "Chain-of-Thought（思维链）提示通过在示例中展示逐步推理过程，引导模型生成中间推理步骤而非直接给出答案，显著提升数学、逻辑等复杂任务的准确率。变体包括 Zero-shot CoT（“Let’s think step by step”）和Tree-of-Thought。"}, {"id": "mock-2026年5月-模拟卷3-063", "index": 213, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 63, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在多 Agent系统中，以下关于Agent角色分工的描述，正确的是（）。", "options": {"A": "多Agent系统中每个Agent必须使用相同的大模型", "B": "多Agent系统通过角色分工、工具调用和协作通信实现复杂任务的分解与执行", "C": "Agent之间不能共享中间结果", "D": "多Agent系统只适用于对话场景，不适用于自动化工作流"}, "answer": "B", "analysis": "多Agent系统通过角色分工（如研究员、开发者、测试者）、工具调用和协作通信实现复杂任务。各Agent可使用不同模型（A错），可共享中间结果（C错），适用于各种自动化场景（D错）。典型框架：AutoGen、CrewAI、LangGraph。"}, {"id": "mock-2026年5月-模拟卷3-064", "index": 214, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 64, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "向量数据库中常用的近似最近邻（ANN）索引算法不包括（）。", "options": {"A": "HNSW（Hierarchical Navigable Small World）", "B": "IVF（Inverted File Index）", "C": "B+树索引", "D": "Product Quantization（乘积量化）"}, "answer": "C", "analysis": "B+树是传统关系数据库的索引结构，适合精确匹配和范围查询，不适合高维向量的近似最近邻搜索。HNSW、IVF、PQ都是向量数据库常用的ANN索引算法。"}, {"id": "mock-2026年5月-模拟卷3-065", "index": 215, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 65, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在大模型推理优化中，模型量化（Quantization）的主要目的是（）。", "options": {"A": "提高模型的训练速度", "B": "增加模型的参数量", "C": "通过降低参数精度（如FP32→INT8/INT4）来减小模型体积和加速推理", "D": "提升模型在小样本场景的泛化能力"}, "answer": "C", "analysis": "模型量化通过降低参数精度（如FP32→INT8→INT4）来减小模型体积、降低显存占用和加速推理。常见方法包括GPTQ、AWQ、GGUF等。量化主要用于推理而非训练（A错），不增加参数量（B错）。"}, {"id": "mock-2026年5月-模拟卷3-066", "index": 216, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 66, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "知识蒸馏（Knowledge Distillation）中，教师模型（Teacher）和学生模型（Student）的关系是（）。", "options": {"A": "学生模型的参数量必须大于教师模型", "B": "学生模型学习教师模型的软标签（Soft Labels）输出，实现知识迁移", "C": "教师模型和学生模型必须采用相同的网络架构", "D": "蒸馏过程中教师模型的参数会被同步更新"}, "answer": "B", "analysis": "知识蒸馏中，小的学生模型学习大的教师模型的软标签（Soft Labels，即概率分布）而非硬标签，从而获取教师模型的“暗知识”。学生模型通常更小（A错），架构可不同（C错），教师模型参数冻结不更新（D错）。"}, {"id": "mock-2026年5月-模拟卷3-067", "index": 217, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 67, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于AI安全与对齐（AI Alignment）的描述，错误的是（）。", "options": {"A": "RLHF（基于人类反馈的强化学习）是当前主流的对齐方法之一", "B": "红队测试（Red Teaming）用于发现模型的安全漏洞", "C": "DPO（Direct Preference Optimization）是RLHF的简化替代方案", "D": "AI对齐问题已经被完全解决，不再是研究热点"}, "answer": "D", "analysis": "AI对齐是当前最活跃的研究领域之一，远未解决。RLHF、DPO、Constitutional AI等都是对齐方法，红队测试用于发现安全漏洞。对齐税、可扩展监督、超级对齐等都是开放问题。"}, {"id": "mock-2026年5月-模拟卷3-068", "index": 218, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 68, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "大模型训练中，LoRA（Low-Rank Adaptation）的核心思想是（）。", "options": {"A": "冻结原始模型参数，通过在每层添加低秩矩阵进行高效微调", "B": "将模型所有参数重新训练", "C": "通过剪枝减少模型参数量", "D": "使用数据增强提升模型泛化能力"}, "answer": "A", "analysis": "LoRA的核心思想是冻结原始模型参数，在每层添加可训练的低秩矩阵（两个小矩阵A和B的乘积），大幅减少可训练参数数（通常只有原模型的0.1%-1%）。这使得单卡GPU即可微调大模型。变体包括QLoRA（结合量化）。"}, {"id": "mock-2026年5月-模拟卷3-069", "index": 219, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 69, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在向量检索中，将文本转换为向量表示（Embedding）的过程中，以下描述正确的是（）。", "options": {"A": "Embedding向量的维度必须与词表大小相同", "B": "语义相似的文本在向量空间中的距离更近", "C": "Embedding只能捕捉词级别的语义，不能处理句子级别", "D": "所有Embedding模型的输出维度都是768"}, "answer": "B", "analysis": "Embedding的核心特性是语义相似的文本在向量空间中距离更近。维度与词表大小无关（A错），现代Embedding模型能处理句子/段落级别（C错），不同模型维度不同（D错，如OpenAI text-embedding-3为3072维）。"}, {"id": "mock-2026年5月-模拟卷3-070", "index": 220, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 70, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "以下关于AI伦理与治理的描述，错误的是（）。", "options": {"A": "欧盟《AI法案》将AI系统按风险等级分类管理", "B": "模型可解释性（Explainability）是AI伦理的重要议题", "C": "数据偏见可能导致AI系统产生歧视性输出", "D": "开源大模型不存在任何安全风险，因为代码是透明的"}, "answer": "D", "analysis": "开源大模型同样存在安全风险：可被恶意微调生成有害内容，可用于欺诈、虚假信息等。代码透明不等于无风险。欧盟《AI法案》、模型可解释性、数据偏见问题都是AI伦理的重要议题。"}, {"id": "mock-2026年5月-模拟卷3-071", "index": 221, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 71, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "According to the passage, the hallucination problem in LLMs refers to ().\n\nOptions:", "options": {"A": "The model's inability to process images", "B": "The model generating factually incorrect but plausible-sounding information", "C": "The model running too slowly during inference", "D": "The model consuming excessive computing resources"}, "answer": "B", "analysis": "原文明确指出 hallucination problem 是 \"models generate plausible-sounding but factually incorrect information\"，即模型生成听起来合理但事实上不正确的信息。"}, {"id": "mock-2026年5月-模拟卷3-072", "index": 222, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 72, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "In a RAG pipeline, after a user submits a query, the system first ().\n\nOptions:", "options": {"A": "Directly generates an answer using only the LLM's internal knowledge", "B": "Retrieves relevant documents from a knowledge base using vector similarity search", "C": "Retrains the model on the user's query", "D": "Translates the query into multiple languages"}, "answer": "B", "analysis": "原文说 \"the system first retrieves relevant documents from a knowledge base using vector similarity search\"，即系统首先使用向量相似度搜索从知识库检索相关文档。"}, {"id": "mock-2026年5月-模拟卷3-073", "index": 223, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 73, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "Which of the following techniques is NOT mentioned in the passage as a method for improving LLM inference efficiency?\n\nOptions:", "options": {"A": "Model quantization", "B": "Knowledge distillation", "C": "Data augmentation", "D": "Pruning"}, "answer": "C", "analysis": "原文提到的推理优化技术包括 model quantization、knowledge distillation 和 pruning。Data augmentation（数据增强）未被提及，且它是训练技术而非推理优化技术。"}, {"id": "mock-2026年5月-模拟卷3-074", "index": 224, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 74, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "The term \"alignment\" in the context of AI, as described in the passage, refers to ().\n\nOptions:", "options": {"A": "Aligning the model's architecture with hardware specifications", "B": "Ensuring AI systems behave in accordance with human values and intentions", "C": "Aligning training data with test data distributions", "D": "Synchronizing multiple models for parallel computation"}, "answer": "B", "analysis": "原文定义 alignment 为 \"ensuring that AI systems behave in accordance with human values and intentions\"，即确保AI系统的行为符合人类价值观和意图。"}, {"id": "mock-2026年5月-模拟卷3-075", "index": 225, "term": "2026年5月 模拟卷3", "paper": "模拟卷3", "questionNo": 75, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "According to the passage, red teaming exercises are used to ().\n\nOptions:", "options": {"A": "Improve the model's training speed", "B": "Attempt to elicit harmful or undesirable outputs to evaluate model safety", "C": "Reduce the model's parameter count", "D": "Optimize the model's memory usage"}, "answer": "B", "analysis": "原文说 \"Red teaming exercises, where dedicated teams attempt to elicit harmful or undesirable outputs, have become standard practice in evaluating model safety\"，即红队测试是尝试引出有害或不良输出以评估模型安全性。"}, {"id": "mock-2026年5月-模拟卷4-001", "index": 226, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 1, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在计算机系统中，DMA（直接存储器存取）方式的主要特点是（）。", "options": {"A": "数据传输由CPU通过程序控制完成", "B": "数据传输期间CPU可以继续执行程序", "C": "每传输一个字节都需要CPU中断处理", "D": "数据传输速率低于程序查询方式"}, "answer": "B", "analysis": "DMA方式的核心特点是在数据传输期间不需要CPU干预，由DMA控制器直接控制数据在内存和I/O设备之间传输，CPU可以继续执行其他程序。程序查询方式和中断方式都需要CPU参与数据传输，DMA的传输速率远高于这两种方式。"}, {"id": "mock-2026年5月-模拟卷4-002", "index": 227, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 2, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "在OSI参考模型中，负责为上层协议提供端到端的可靠传输服务，实现流量控制、差错控制和服务质量保证的是（）。", "options": {"A": "数据链路层", "B": "网络层", "C": "传输层", "D": "会话层"}, "answer": "C", "analysis": "OSI七层模型中，传输层（Transport Layer）负责端到端的可靠传输，提供流量控制、差错控制等服务。数据链路层只提供相邻节点间的可靠传输，网络层负责路由选择和分组转发，会话层负责建立和管理会话。"}, {"id": "mock-2026年5月-模拟卷4-003", "index": 228, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 3, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "某系统采用页式存储管理，页面大小为4KB，某进程的页表如下所示。逻辑地址0x00002A3F对应的物理地址是（）。\n\n| 页号 | 页框号 |\n|------|--------|\n| 0    | 3      |\n| 1    | 7      |\n| 2    | 11     |\n| 3    | 5      |", "options": {"A": "0x00003A3F", "B": "0x0000BA3F", "C": "0x00005A3F", "D": "0x00007A3F"}, "answer": "B", "analysis": "页面大小4KB=2^12字节，所以逻辑地址的低12位为页内偏移。逻辑地址0x00002A3F中，页号=0x2（即第2页），页内偏移=0xA3F。查页表得第2页对应页框号11（0xB），物理地址=0xB×0x1000+0xA3F=0x0000BA3F。"}, {"id": "mock-2026年5月-模拟卷4-004", "index": 229, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 4, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "以下关于RISC（精简指令集计算机）的描述中，不正确的是（）。", "options": {"A": "RISC采用固定长度的指令格式", "B": "RISC大量使用寄存器-寄存器操作指令", "C": "RISC的寻址方式种类多、灵活多变", "D": "RISC采用硬布线控制逻辑为主"}, "answer": "C", "analysis": "RISC的特点是：固定长度指令格式（A正确）、大量使用寄存器-寄存器操作（B正确）、硬布线控制逻辑为主（D正确）、寻址方式少而简单（C不正确，寻址方式多是CISC的特点）。RISC通过简化指令集和寻址方式来提高流水线效率。"}, {"id": "mock-2026年5月-模拟卷4-005", "index": 230, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 5, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在流水线处理器中，假设一条指令的执行分为取指（IF）、译码（ID）、执行（EX）、访存（MEM）、写回（WB）5个阶段，每个阶段耗时分别为90ns、80ns、100ns、90ns、70ns。则该流水线的最大吞吐率为（）。", "options": {"A": "1/430ns", "B": "1/100ns", "C": "1/86ns", "D": "1/90ns"}, "answer": "B", "analysis": "流水线的时钟周期取决于最长的流水段，即瓶颈段。五个阶段中最长的是EX阶段（100ns），因此流水线时钟周期为100ns，最大吞吐率=1/100ns。注意吞吐率计算基于瓶颈段时间，而非所有阶段时间之和。"}, {"id": "mock-2026年5月-模拟卷4-006", "index": 231, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 6, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在冗余技术中，N版本程序设计属于（）冗余技术。", "options": {"A": "结构冗余中的静态冗余", "B": "结构冗余中的动态冗余", "C": "时间冗余", "D": "信息冗余"}, "answer": "A", "analysis": "N版本程序设计是一种静态冗余技术，属于结构冗余。它同时运行N个独立开发的功能等价的程序版本，通过表决机制选择正确结果。动态冗余需要错误检测和切换机制（如恢复块技术），时间冗余通过重复执行来容错，信息冗余通过附加信息（如校验码）来检错纠错。"}, {"id": "mock-2026年5月-模拟卷4-007", "index": 232, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 7, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "海明码是一种纠错编码。若数据位为8位，则至少需要（）位校验位才能纠正1位错误。", "options": {"A": "3", "B": "4", "C": "5", "D": "2"}, "answer": "B", "analysis": "海明码校验位数k与数据位数m的关系为：2^k ≥ m+k+1。当m=8时，k=3：2^3=8，8≥8+3+1=12不成立；k=4：2^4=16，16≥8+4+1=13成立。因此至少需要4位校验位。"}, {"id": "mock-2026年5月-模拟卷4-008", "index": 233, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 8, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "某计算机系统中，主存容量为256MB，Cache容量为512KB，块大小为64字节。若采用直接映射方式，则Cache地址中标记（Tag）字段的位数为（）。", "options": {"A": "9", "B": "13", "C": "15", "D": "19"}, "answer": "A", "analysis": "主存256MB=2^28字节，Cache 512KB=2^19字节，块大小64字节=2^6字节。Cache共有2^19/2^6=2^13个块。直接映射方式下，主存地址28位=标记位+Cache块号(13位)+块内偏移(6位)。标记位=28-13-6=9位。"}, {"id": "mock-2026年5月-模拟卷4-009", "index": 234, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 9, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在软件需求分析阶段，（）不属于需求验证的方法。", "options": {"A": "需求评审", "B": "原型验证", "C": "模型验证", "D": "代码走查"}, "answer": "D", "analysis": "需求验证的常用方法包括：需求评审（A）、原型验证（B）、模型验证（C）和测试用例生成等。代码走查（D）是代码审查技术，属于软件实现阶段的活动，不属于需求验证方法。"}, {"id": "mock-2026年5月-模拟卷4-010", "index": 235, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 10, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在敏捷开发方法中，Scrum框架定义了三种核心角色。以下（）不是Scrum的核心角色。", "options": {"A": "产品负责人（Product Owner）", "B": "项目经理（Project Manager）", "C": "Scrum Master", "D": "开发团队（Development Team）"}, "answer": "B", "analysis": "Scrum定义了三种核心角色：产品负责人（Product Owner）、Scrum Master和开发团队（Development Team）。Scrum中没有\"项目经理\"这一角色，Scrum Master不是传统意义上的项目经理，而是服务型领导者，负责保障Scrum流程的执行。"}, {"id": "mock-2026年5月-模拟卷4-011", "index": 236, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 11, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "软件维护中，为了满足用户对已有软件提出的新功能或性能改进要求而进行的修改活动，属于（）。", "options": {"A": "纠错性维护", "B": "适应性维护", "C": "完善性维护", "D": "预防性维护"}, "answer": "C", "analysis": "软件维护四种类型：纠错性维护（修复发现的错误）、适应性维护（适应环境变化）、完善性维护（满足用户新增功能或性能改进要求）、预防性维护（提高可维护性和可靠性）。为满足新功能或性能改进要求的修改属于完善性维护。"}, {"id": "mock-2026年5月-模拟卷4-012", "index": 237, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 12, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在UML中，用于描述系统与外部参与者之间交互行为的图是（）。", "options": {"A": "类图", "B": "用例图", "C": "状态图", "D": "部署图"}, "answer": "B", "analysis": "用例图（Use Case Diagram）用于描述系统与外部参与者（Actor）之间的交互行为，展示系统的功能需求。类图描述类的结构和关系，状态图描述对象的状态变迁，部署图描述系统的物理部署结构。"}, {"id": "mock-2026年5月-模拟卷4-013", "index": 238, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 13, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "McCabe环路复杂度用于衡量程序的复杂性。对于一个程序流程图，若有16条边、12个节点、2个连通分量，则该程序的环路复杂度为（）。", "options": {"A": "4", "B": "6", "C": "8", "D": "5"}, "answer": "B", "analysis": "McCabe环路复杂度V(G)=E-N+2P，其中E为边数、N为节点数、P为连通分量数。V(G)=16-12+2×2=6。环路复杂度反映了程序中独立路径的数量，一般建议V(G)不超过10。"}, {"id": "mock-2026年5月-模拟卷4-014", "index": 239, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 14, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在软件测试中，等价类划分法属于（）测试方法。", "options": {"A": "白盒测试", "B": "黑盒测试", "C": "灰盒测试", "D": "回归测试"}, "answer": "B", "analysis": "等价类划分法是黑盒测试方法，根据输入条件的等价类来设计测试用例，不需要了解程序内部结构。白盒测试方法包括语句覆盖、分支覆盖、路径覆盖等，需要了解程序内部逻辑。"}, {"id": "mock-2026年5月-模拟卷4-015", "index": 240, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 15, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "在面向对象设计中，SOLID原则的\"L\"代表里氏替换原则。以下最符合该原则描述的是（）。", "options": {"A": "一个类应该只有一个引起变化的原因", "B": "子类对象能够替换父类对象出现的任何地方，且程序行为保持正确", "C": "高层模块不应该依赖低层模块，两者都应该依赖抽象", "D": "客户端不应该被迫依赖它不使用的接口"}, "answer": "B", "analysis": "里氏替换原则（Liskov Substitution Principle, LSP）：子类对象能够替换父类对象出现的任何地方，且程序的行为保持正确。A是单一职责原则(S)，C是依赖倒置原则(D)，D是接口隔离原则(I)。"}, {"id": "mock-2026年5月-模拟卷4-016", "index": 241, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 16, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "CMM（能力成熟度模型）将软件过程成熟度划分为5个等级。其中，软件过程已经文档化、标准化，并集成到组织级标准软件过程中的等级是（）。", "options": {"A": "可重复级", "B": "已定义级", "C": "已管理级", "D": "优化级"}, "answer": "B", "analysis": "CMM五级：初始级（过程混乱）、可重复级（基本项目管理过程已建立）、已定义级（软件过程已文档化、标准化并集成到组织级标准过程中）、已管理级（对过程和产品质量进行定量管理）、优化级（持续改进过程）。"}, {"id": "mock-2026年5月-模拟卷4-017", "index": 242, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 17, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "在面向对象分析中，（）关系表示整体与部分的关系，且部分可以脱离整体独立存在。", "options": {"A": "依赖", "B": "组合", "C": "聚合", "D": "泛化"}, "answer": "C", "analysis": "聚合（Aggregation）表示整体与部分的关系，部分可以脱离整体独立存在（如汽车与轮胎）。组合（Composition）也表示整体与部分关系，但部分不能脱离整体存在（如人与心脏）。依赖是临时性使用关系，泛化是继承关系。"}, {"id": "mock-2026年5月-模拟卷4-018", "index": 243, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 18, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在软件配置管理中，基线一经建立，对其所包含的配置项的变更必须通过（）进行审批控制。", "options": {"A": "项目经理", "B": "变更控制委员会（CCB）", "C": "开发团队负责人", "D": "质量保证工程师"}, "answer": "B", "analysis": "软件配置管理中，基线建立后，对基线中配置项的变更必须经过变更控制委员会（CCB，Change Control Board）的审批。CCB负责评估和决策变更请求，确保变更经过充分评审和批准。"}, {"id": "mock-2026年5月-模拟卷4-019", "index": 244, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 19, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某电商平台需要实时处理大量商品搜索请求，并需要在高并发场景下保证搜索结果的快速返回。从架构风格角度看，最适合该搜索模块的架构风格是（）。", "options": {"A": "主程序-子程序", "B": "管道-过滤器", "C": "C/S（客户端-服务器）", "D": "仓库风格"}, "answer": "D", "analysis": "仓库风格（Repository Style）以中央数据存储为核心，各独立构件围绕共享数据进行操作。商品搜索引擎（如基于Elasticsearch的搜索服务）本质上是仓库风格——搜索引擎作为中央数据仓库存储商品索引，各搜索请求作为独立操作构件对中央索引进行查询。C/S风格描述的是通信模式而非数据处理模式。"}, {"id": "mock-2026年5月-模拟卷4-020", "index": 245, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 20, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在软件架构评估方法中，ATAM（架构权衡分析方法）的主要输出是（）。", "options": {"A": "架构文档", "B": "风险点、敏感点和权衡点", "C": "软件需求规格说明书", "D": "详细设计文档"}, "answer": "B", "analysis": "ATAM（Architecture Tradeoff Analysis Method）的主要输出包括：风险点（可能导致问题的架构决策）、敏感点（影响特定质量属性的架构参数）和权衡点（影响多个质量属性的架构决策）。ATAM不产出架构文档或需求文档。"}, {"id": "mock-2026年5月-模拟卷4-021", "index": 246, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 21, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于微服务架构的描述中，不正确的是（）。", "options": {"A": "每个微服务可以独立部署和扩展", "B": "微服务之间通常通过轻量级通信机制交互", "C": "微服务架构天然消除了分布式事务的问题", "D": "每个微服务可以使用不同的编程语言和数据存储技术"}, "answer": "C", "analysis": "微服务架构将系统拆分为多个独立服务，每个服务可独立部署（A正确）、通过轻量级机制（如REST、消息队列）通信（B正确）、可使用不同技术栈（D正确）。但微服务架构并不能消除分布式事务问题（C不正确），反而由于服务拆分引入了更复杂的分布式事务挑战，通常需要Saga模式等方案来解决。"}, {"id": "mock-2026年5月-模拟卷4-022", "index": 247, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 22, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某在线教育平台需要根据不同学校的需求定制课程模块，且在运行时动态加载和切换不同的教学插件。最适合该需求的架构风格是（）。", "options": {"A": "管道-过滤器", "B": "微内核（插件式）架构", "C": "分层架构", "D": "事件驱动架构"}, "answer": "B", "analysis": "微内核（Microkernel）架构，又称插件式架构，由核心系统和可插拔的插件模块组成。核心系统提供基础功能，插件模块提供可扩展的定制功能，支持运行时动态加载和切换。这完全符合题目中\"定制模块+动态加载插件\"的需求。"}, {"id": "mock-2026年5月-模拟卷4-023", "index": 248, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 23, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在设计模式中，（）模式通过为其他对象提供一种代理以控制对该对象的访问。", "options": {"A": "适配器（Adapter）", "B": "装饰器（Decorator）", "C": "代理（Proxy）", "D": "外观（Facade）"}, "answer": "C", "analysis": "代理（Proxy）模式为其他对象提供一种代理以控制对该对象的访问。适配器模式用于接口转换，装饰器模式用于动态添加职责，外观模式为子系统提供统一的高层接口。代理模式包括远程代理、虚代理、保护代理等。"}, {"id": "mock-2026年5月-模拟卷4-024", "index": 249, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 24, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "质量属性场景由6部分组成，其中\"响应度量\"是指（）。", "options": {"A": "引发系统响应的条件或事件", "B": "激励到达时系统所处的状态", "C": "系统接收到激励后采取的行动", "D": "用于度量系统响应是否满足需求的指标"}, "answer": "D", "analysis": "质量属性场景6部分：刺激源（谁产生激励）、刺激（引发响应的条件/事件，选项A描述的是\"刺激\"而非\"响应度量\"）、环境（激励到达时系统状态，对应B）、制品（被激励的对象）、响应（系统采取的行动，对应C）、响应度量（度量响应是否满足需求的指标，对应D）。"}, {"id": "mock-2026年5月-模拟卷4-025", "index": 250, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 25, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某物流系统需要将来自不同供应商的订单数据进行格式转换、校验、路由分发到不同的仓库系统。从架构风格角度看，最适合该数据处理流程的架构风格是（）。", "options": {"A": "解释器", "B": "管道-过滤器", "C": "黑板", "D": "隐式调用"}, "answer": "B", "analysis": "管道-过滤器（Pipe-Filter）架构风格适合数据流处理场景。题目中的物流订单处理流程——格式转换→校验→路由分发——是典型的数据流经多个处理阶段的场景，每个阶段作为一个过滤器，阶段之间通过管道连接。解释器适合自定义规则执行，黑板适合复杂问题求解，隐式调用适合事件通知。"}, {"id": "mock-2026年5月-模拟卷4-026", "index": 251, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 26, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "某银行核心系统需要同时满足高可用性（99.99%）和强一致性要求。根据CAP定理，在网络分区发生时，该系统应优先保证（）。", "options": {"A": "可用性（A），牺牲一致性", "B": "一致性（C），牺牲可用性", "C": "分区容错性（P），牺牲可用性和一致性", "D": "同时保证一致性和可用性"}, "answer": "B", "analysis": "根据CAP定理，在网络分区（P）发生时，系统只能在一致性（C）和可用性（A）之间二选一。银行核心系统对数据一致性要求极高（如账户余额不能出错），因此在网络分区时应优先保证一致性（CP模型），牺牲部分可用性。典型的CP系统如ZooKeeper、HBase等。"}, {"id": "mock-2026年5月-模拟卷4-027", "index": 252, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 27, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在ABSD（基于架构的软件设计）方法中，架构需求包括需求获取、标识构件和（）三个活动。", "options": {"A": "需求评审", "B": "架构复审", "C": "需求评审和需求规格说明", "D": "架构文档化"}, "answer": "C", "analysis": "ABSD方法中，架构需求过程包括三个活动：需求获取、标识构件、需求评审和需求规格说明。需求获取是收集利益相关者的需求，标识构件是确定系统的主要构件，需求评审确保需求的正确性和完整性。"}, {"id": "mock-2026年5月-模拟卷4-028", "index": 253, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 28, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某智能交通系统需要从多个传感器采集数据，通过多种分析算法协同处理以识别交通事故。各算法可以共享中间结果，并根据中间结果选择下一步分析策略。最适合该系统的架构风格是（）。", "options": {"A": "管道-过滤器", "B": "分层架构", "C": "黑板", "D": "隐式调用"}, "answer": "C", "analysis": "黑板（Blackboard）架构风格适合需要多个知识源协同求解复杂问题的场景。各分析算法作为知识源，共享中间结果（黑板），控制构件根据黑板状态选择下一步分析策略。管道-过滤器是单向数据流，不支持共享中间结果；隐式调用通过事件触发但不共享数据空间。"}, {"id": "mock-2026年5月-模拟卷4-029", "index": 254, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 29, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在REST架构风格中，以下（）不是其核心约束。", "options": {"A": "无状态", "B": "统一接口", "C": "分层系统", "D": "有状态会话"}, "answer": "D", "analysis": "REST（Representational State Transfer）的核心约束包括：客户端-服务器、无状态（A）、可缓存、统一接口（B）、分层系统（C）和按需代码（可选）。REST强调无状态通信，\"有状态会话\"（D）恰恰违反了REST的无状态约束。"}, {"id": "mock-2026年5月-模拟卷4-030", "index": 255, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 30, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某大型企业ERP系统的架构如图所示，采用了表示层、业务逻辑层、数据访问层三层分离的设计。这种架构最主要的优点是（）。", "options": {"A": "提高系统运行性能", "B": "降低层间耦合，提高可维护性和可扩展性", "C": "减少开发工作量", "D": "提高系统安全性"}, "answer": "B", "analysis": "分层架构的最主要优点是降低层间耦合度，使各层职责清晰分离，从而提高系统的可维护性和可扩展性。分层可能引入性能开销（层间调用），不会减少开发工作量，安全性提升也不是分层的主要目的。"}, {"id": "mock-2026年5月-模拟卷4-031", "index": 256, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 31, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在SOA（面向服务的架构）中，UDDI的作用是（）。", "options": {"A": "定义Web服务的接口描述", "B": "提供服务注册和发现机制", "C": "定义消息传输协议", "D": "实现服务间的安全认证"}, "answer": "B", "analysis": "SOA中的核心技术标准：WSDL用于定义Web服务的接口描述（A不对应UDDI），SOAP定义消息传输协议（C不对应），UDDI（Universal Description, Discovery, and Integration）提供服务注册和发现机制，使服务消费者能够找到所需的服务。"}, {"id": "mock-2026年5月-模拟卷4-032", "index": 257, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 32, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "某系统需要支持多种报表输出格式（PDF、Excel、HTML），且未来可能增加新的格式。为了在不修改现有代码的基础上扩展新格式，最适合使用的设计模式是（）。", "options": {"A": "单例模式（Singleton）", "B": "策略模式（Strategy）", "C": "观察者模式（Observer）", "D": "模板方法模式（Template Method）"}, "answer": "B", "analysis": "策略模式（Strategy）定义一系列算法，将每个算法封装起来，使它们可以互相替换。题目中不同的报表格式（PDF、Excel、HTML）是不同的策略（算法），通过策略模式可以在不修改现有代码的情况下增加新的输出格式。单例模式控制实例数量，观察者模式用于事件通知，模板方法定义算法骨架。"}, {"id": "mock-2026年5月-模拟卷4-033", "index": 258, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 33, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在系统工程的生命周期阶段中，（）的主要任务是确定系统的总体目标和范围，分析系统的需求和约束条件，论证系统实施的可能性。", "options": {"A": "系统实施", "B": "系统设计", "C": "系统分析与规划", "D": "系统运行与维护"}, "answer": "C", "analysis": "系统分析与规划阶段的主要任务是确定系统的总体目标和范围，分析系统需求和约束条件，论证系统实施的可能性（包括技术、经济、操作可行性）。系统设计是确定系统方案，系统实施是编码和部署，运维是维护和优化。"}, {"id": "mock-2026年5月-模拟卷4-034", "index": 259, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 34, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在可行性分析中，（）回答的是\"在当前技术条件下，系统能否实现\"的问题。", "options": {"A": "经济可行性", "B": "技术可行性", "C": "操作可行性", "D": "法律可行性"}, "answer": "B", "analysis": "技术可行性回答\"在当前技术条件下，系统能否实现\"的问题，分析现有技术能力、硬软件资源是否满足系统开发需求。经济可行性关注投入产出比，操作可行性关注用户能否使用，法律可行性关注合规性。"}, {"id": "mock-2026年5月-模拟卷4-035", "index": 260, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 35, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在项目管理中，工作分解结构（WBS）是对项目范围的层次化分解。以下关于WBS的描述中，不正确的是（）。", "options": {"A": "WBS的最低层级称为工作包", "B": "WBS分解应遵循100%规则，即包含全部项目范围", "C": "WBS中每个元素的工作应分配给唯一的责任人", "D": "WBS的分解层级越多越好，应尽量细化到最小任务"}, "answer": "D", "analysis": "WBS分解应适度而非越细越好。WBS最低层称为工作包（A正确），遵循100%规则（B正确），每个元素分配唯一责任人（C正确）。过度分解（D不正确）会导致管理成本增加、资源浪费，应分解到可以准确估算成本和工期的层级即可。"}, {"id": "mock-2026年5月-模拟卷4-036", "index": 261, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 36, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "在项目时间管理中，关键路径法（CPM）用于确定项目最短工期。某项目的活动依赖关系和工期如下：\n\n| 活动 | 前置活动 | 工期（天） |\n|------|----------|-----------|\n| A    | -        | 3         |\n| B    | -        | 4         |\n| C    | A        | 2         |\n| D    | A, B     | 5         |\n| E    | B        | 3         |\n| F    | C, D     | 4         |\n| G    | D, E     | 2         |\n\n该项目的关键路径是（），项目最短工期为（）天。", "options": {"A": "A→C→F，9天", "B": "B→D→F，13天", "C": "B→E→G，9天", "D": "A→D→G，10天"}, "answer": "B", "analysis": "各路径工期：A→C→F=3+2+4=9天；A→D→F=3+5+4=12天（注意D的前置包含A和B，B=4>A=3，所以D最早开始=4）；B→D→F=4+5+4=13天；B→D→G=4+5+2=11天；B→E→G=4+3+2=9天；A→D→G=10天。关键路径为B→D→F，工期13天。"}, {"id": "mock-2026年5月-模拟卷4-037", "index": 262, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 37, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "甘特图（Gantt Chart）的主要优点是（）。", "options": {"A": "能清楚地表示活动之间的依赖关系", "B": "直观地展示项目进度计划和实际进展", "C": "能计算关键路径和浮动时间", "D": "能进行资源优化和成本分析"}, "answer": "B", "analysis": "甘特图（横道图）的主要优点是直观、简洁地展示项目进度计划和实际进展，能清楚地表示每项活动的开始和结束时间。但甘特图难以清楚表示活动间的复杂依赖关系（A不正确），也不能直接计算关键路径（C不正确）和进行资源/成本分析（D不正确）。"}, {"id": "mock-2026年5月-模拟卷4-038", "index": 263, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 38, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "在挣值管理（EVM）中，某项目当前的计划价值（PV）为100万元，挣值（EV）为90万元，实际成本（AC）为95万元。关于该项目当前状态的描述正确的是（）。", "options": {"A": "进度超前，成本节约", "B": "进度滞后，成本超支", "C": "进度超前，成本超支", "D": "进度滞后，成本节约"}, "answer": "B", "analysis": "进度偏差SV=EV-PV=90-100=-10万元（SV<0，进度滞后）；成本偏差CV=EV-AC=90-95=-5万元（CV<0，成本超支）。进度绩效指数SPI=EV/PV=0.9<1（进度滞后），成本绩效指数CPI=EV/AC≈0.947<1（成本超支）。项目当前状态：进度滞后且成本超支。"}, {"id": "mock-2026年5月-模拟卷4-039", "index": 264, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 39, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在系统规划方法中，企业系统规划法（BSP）的核心思想是（）。", "options": {"A": "自底向上地识别系统目标", "B": "自上而下地识别企业目标和过程，再自下而上地设计信息系统", "C": "以关键成功因素为导向进行规划", "D": "以战略目标集转化为信息系统战略"}, "answer": "B", "analysis": "企业系统规划法（BSP，Business Systems Planning）由IBM提出，其核心思想是\"自上而下地识别企业目标、过程和数据，再自下而上地设计信息系统\"。选项C描述的是关键成功因素法（CSF），选项D描述的是战略目标集转化法（SST）。"}, {"id": "mock-2026年5月-模拟卷4-040", "index": 265, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 40, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "软件项目估算中，COCOMO II模型将项目估算划分为三个阶段模型。其中在软件设计完成后，根据实际模块数进行估算的是（）。", "options": {"A": "应用组装模型", "B": "早期设计模型", "C": "后架构模型", "D": "基本模型"}, "answer": "C", "analysis": "COCOMO II三个阶段模型：应用组装模型（最早期，基于对象点估算）、早期设计模型（需求确定后，基于功能点估算）、后架构模型（设计完成后，基于源代码行估算，根据实际模块数进行估算）。"}, {"id": "mock-2026年5月-模拟卷4-041", "index": 266, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 41, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "在项目风险管理中，（）是指将风险及其后果转移给第三方承担。", "options": {"A": "风险规避", "B": "风险转移", "C": "风险缓解", "D": "风险接受"}, "answer": "B", "analysis": "风险转移是将风险及其后果转移给第三方承担，如购买保险、外包等。风险规避是改变计划以消除风险；风险缓解是降低风险发生的概率或影响；风险接受是承认风险存在但不采取主动措施。"}, {"id": "mock-2026年5月-模拟卷4-042", "index": 267, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 42, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "某项目经理在项目启动阶段编制了一份文件，明确了项目的目标、主要可交付成果、假设条件和约束条件，并授权项目经理使用组织资源开展项目工作。该文件是（）。", "options": {"A": "项目管理计划", "B": "项目章程", "C": "项目范围说明书", "D": "工作说明书（SOW）"}, "answer": "B", "analysis": "项目章程是正式批准项目的文件，由项目发起人签发，授权项目经理使用组织资源。项目章程包含项目目标、主要可交付成果、假设条件、约束条件、高层级需求等。项目管理计划是详细执行计划，范围说明书详细描述项目范围，SOW描述项目需要交付的产品或服务。"}, {"id": "mock-2026年5月-模拟卷4-043", "index": 268, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 43, "sourceType": "mock", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "根据《中华人民共和国著作权法》（2020年修正），著作权包括人身权和财产权。以下属于著作权人身权的是（）。", "options": {"A": "复制权", "B": "发行权", "C": "署名权", "D": "出租权"}, "answer": "C", "analysis": "著作权人身权包括：发表权、署名权、修改权、保护作品完整权。复制权（A）、发行权（B）、出租权（D）均属于著作权的财产权。署名权是表明作者身份的权利，属于人身权。"}, {"id": "mock-2026年5月-模拟卷4-044", "index": 269, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 44, "sourceType": "mock", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "根据《计算机软件保护条例》（2013年修订），软件著作权的保护期限中，自然人的软件著作权保护期为（）。", "options": {"A": "自软件发表之日起50年", "B": "自然人终生及其死亡后50年", "C": "自软件开发完成之日起50年", "D": "自然人终生及其死亡后70年"}, "answer": "B", "analysis": "根据《计算机软件保护条例》第14条，自然人的软件著作权保护期为自然人终生及其死亡后50年，截止于死亡后第50年的12月31日。法人或其他组织的软件著作权保护期为50年，截止于软件首次发表后第50年的12月31日。"}, {"id": "mock-2026年5月-模拟卷4-045", "index": 270, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 45, "sourceType": "mock", "module_code": "embedded", "module_name": "🔌 嵌入式物联网", "knowledge": "", "stem": "根据《中华人民共和国专利法》（2020年修正），以下不能授予专利权的是（）。", "options": {"A": "一种新型数据压缩算法的硬件实现装置", "B": "智能交通控制方法及系统", "C": "一种软件的用户界面布局设计", "D": "科学发现"}, "answer": "D", "analysis": "根据《专利法》第25条，科学发现不授予专利权。科学发现是对自然界已有规律的认识，不是技术方案。新型硬件装置（A）、控制方法及系统（B）可以申请专利，界面布局设计（C）可以申请外观设计专利。"}, {"id": "mock-2026年5月-模拟卷4-046", "index": 271, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 46, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "根据《中华人民共和国数据安全法》（2021年施行），国家建立数据分类分级保护制度，根据数据在经济社会发展中的重要程度以及一旦遭到篡改、破坏、泄露或者非法获取、非法利用，对国家安全、公共利益或者个人、组织合法权益造成的危害程度，对数据实行分类分级保护。其中，（）数据目录由国家数据安全工作协调机制统筹协调有关部门制定。", "options": {"A": "一般数据", "B": "重要数据", "C": "核心数据", "D": "敏感数据"}, "answer": "B", "analysis": "根据《数据安全法》第21条，国家建立数据分类分级保护制度。关系国家安全、国民经济命脉、重要民生、重大公共利益等的数据属于国家核心数据，实行更加严格的管理制度。重要数据目录由国家数据安全工作协调机制统筹协调有关部门制定。各地区、各部门应确定本地区、本部门以及相关行业、领域的重要数据具体目录。"}, {"id": "mock-2026年5月-模拟卷4-047", "index": 272, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 47, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "根据《中华人民共和国个人信息保护法》（2021年施行），以下关于个人信息处理规则的描述中，不正确的是（）。", "options": {"A": "处理个人信息应当具有明确、合理的目的", "B": "处理个人信息应当遵循最小必要原则", "C": "个人信息处理者可以在未经个人同意的情况下向第三方提供其个人信息", "D": "个人信息处理者应当对其个人信息处理活动负责"}, "answer": "C", "analysis": "根据《个人信息保护法》第23条，个人信息处理者向其他个人信息处理者提供其处理的个人信息的，应当向个人告知接收方的名称或者姓名、联系方式、处理目的、处理方式和个人信息的种类，并取得个人的单独同意。未经个人同意不得向第三方提供个人信息（C不正确）。"}, {"id": "mock-2026年5月-模拟卷4-048", "index": 273, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 48, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "根据《生成式人工智能服务管理暂行办法》（2023年施行），以下关于生成式AI服务提供者义务的描述中，正确的是（）。", "options": {"A": "生成式AI服务提供者无需对训练数据的合法性负责", "B": "生成式AI服务提供者应当采取有效措施防止生成虚假信息", "C": "生成式AI服务仅面向境外用户提供时不受本办法约束", "D": "利用生成式AI技术向公众提供服务无需进行安全评估"}, "answer": "B", "analysis": "根据《生成式人工智能服务管理暂行办法》（2023年8月15日施行），生成式AI服务提供者应当对训练数据的合法性负责（A不正确），应采取有效措施防止生成虚假信息（B正确）。该办法适用于在中华人民共和国境内向公众提供的生成式AI服务（C不正确），向公众提供前应进行安全评估（D不正确）。"}, {"id": "mock-2026年5月-模拟卷4-049", "index": 274, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 49, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "根据《互联网信息服务算法推荐管理规定》（2022年施行），算法推荐服务提供者应当以（）的方式公示算法推荐服务的基本原理、目的意图和主要运行机制等。", "options": {"A": "内部文件", "B": "显著方式", "C": "技术文档", "D": "口头告知"}, "answer": "B", "analysis": "根据《互联网信息服务算法推荐管理规定》（2022年3月1日施行）第16条，算法推荐服务提供者应当以显著方式告知用户其提供算法推荐服务的情况，并以适当方式公示算法推荐服务的基本原理、目的意图和主要运行机制等。"}, {"id": "mock-2026年5月-模拟卷4-050", "index": 275, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 50, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "根据《信息安全技术 网络安全等级保护基本要求》（GB/T 22239-2019），等级保护分为（）个安全保护等级。", "options": {"A": "3", "B": "4", "C": "5", "D": "6"}, "answer": "C", "analysis": "根据GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》，等级保护分为5个安全保护等级：第一级（用户自主保护级）、第二级（系统审计保护级）、第三级（安全标记保护级）、第四级（结构化保护级）、第五级（访问验证保护级）。"}, {"id": "mock-2026年5月-模拟卷4-051", "index": 276, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 51, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "根据《网络安全审查办法》（2022年修订施行），掌握超过（）万用户个人信息的网络平台运营者赴国外上市，必须向网络安全审查办公室申报网络安全审查。", "options": {"A": "10", "B": "50", "C": "100", "D": "500"}, "answer": "C", "analysis": "根据《网络安全审查办法》（2022年2月15日施行）第7条，掌握超过100万用户个人信息的网络平台运营者赴国外上市，必须向网络安全审查办公室申报网络安全审查。"}, {"id": "mock-2026年5月-模拟卷4-052", "index": 277, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 52, "sourceType": "mock", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "甲公司委托乙公司开发一套管理软件，合同中未约定著作权归属。根据《计算机软件保护条例》，该软件的著作权归（）所有。", "options": {"A": "甲公司", "B": "乙公司", "C": "甲乙双方共同", "D": "国家"}, "answer": "B", "analysis": "根据《计算机软件保护条例》第11条，接受他人委托开发的软件，其著作权的归属由委托人与受托人签订书面合同约定；无书面合同或者合同未作明确约定的，其著作权由受托方（开发方/乙公司）享有。"}, {"id": "mock-2026年5月-模拟卷4-053", "index": 278, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 53, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "在信息安全中，数字签名技术主要用于保证信息的（）。", "options": {"A": "机密性和可用性", "B": "完整性和不可抵赖性", "C": "机密性和完整性", "D": "可用性和不可抵赖性"}, "answer": "B", "analysis": "数字签名技术使用发送方的私钥对消息摘要进行加密，接收方使用发送方的公钥验证。数字签名主要保证：完整性（消息未被篡改）和不可抵赖性（发送方不能否认发送过该消息）。机密性需要通过加密技术保证，可用性与数字签名无关。"}, {"id": "mock-2026年5月-模拟卷4-054", "index": 279, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 54, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "在公钥基础设施（PKI）体系中，负责签发和管理数字证书的核心机构是（）。", "options": {"A": "RA（注册机构）", "B": "CA（证书颁发机构）", "C": "CRL（证书吊销列表）", "D": "LDAP（目录服务）"}, "answer": "B", "analysis": "PKI体系中，CA（Certificate Authority，证书颁发机构）是核心机构，负责签发、管理和吊销数字证书。RA（注册机构）负责审核证书申请者的身份。CRL是证书吊销列表。LDAP是用于存储和查询证书的目录服务。"}, {"id": "mock-2026年5月-模拟卷4-055", "index": 280, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 55, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "以下关于对称加密和非对称加密的描述中，不正确的是（）。", "options": {"A": "对称加密的加密和解密使用相同的密钥", "B": "非对称加密的加密速度通常慢于对称加密", "C": "RSA是典型的对称加密算法", "D": "AES是典型的对称加密算法"}, "answer": "C", "analysis": "RSA是典型的非对称加密算法（C不正确），不是对称加密算法。对称加密使用相同密钥（A正确），非对称加密速度慢于对称加密（B正确），AES是典型的对称加密算法（D正确）。常见的对称加密算法：DES、3DES、AES；非对称加密算法：RSA、ECC、DSA。"}, {"id": "mock-2026年5月-模拟卷4-056", "index": 281, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 56, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "在网络攻击中，攻击者通过伪造ARP响应报文，将自己的MAC地址与目标IP地址绑定，从而截获网络流量。这种攻击方式称为（）。", "options": {"A": "SQL注入攻击", "B": "ARP欺骗攻击", "C": "DDoS攻击", "D": "跨站脚本攻击（XSS）"}, "answer": "B", "analysis": "ARP欺骗攻击通过伪造ARP响应报文，将攻击者的MAC地址与目标IP绑定，使网络流量被重定向到攻击者，从而实现中间人攻击。SQL注入针对数据库，DDoS是拒绝服务攻击，XSS是跨站脚本攻击。"}, {"id": "mock-2026年5月-模拟卷4-057", "index": 282, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 57, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "防火墙是网络安全的重要设备。以下关于防火墙的描述中，正确的是（）。", "options": {"A": "防火墙能够防止内部网络中已感染病毒的传播", "B": "防火墙可以防止所有来自外部的攻击", "C": "包过滤防火墙工作在网络层，根据IP地址、端口号等信息进行过滤", "D": "防火墙能够防止利用服务器漏洞进行的攻击"}, "answer": "C", "analysis": "包过滤防火墙工作在网络层（第三层），根据数据包的源/目的IP地址、端口号、协议类型等信息进行过滤（C正确）。防火墙不能防止内部病毒传播（A不正确），不能防止所有外部攻击（B不正确），也不能防止利用服务器已有漏洞的攻击（D不正确）。"}, {"id": "mock-2026年5月-模拟卷4-058", "index": 283, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 58, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "在信息安全风险评估中，风险值的计算通常取决于三个要素：（）。", "options": {"A": "资产价值、威胁发生频率、脆弱性严重程度", "B": "资产价值、攻击成本、防护措施有效性", "C": "威胁发生频率、攻击成本、影响范围", "D": "脆弱性数量、威胁种类、系统规模"}, "answer": "A", "analysis": "信息安全风险评估中，风险值=f（资产价值, 威胁发生频率, 脆弱性严重程度）。资产价值反映资产的重要程度，威胁发生频率反映威胁出现的可能性，脆弱性严重程度反映资产弱点被利用的难易程度和影响。"}, {"id": "mock-2026年5月-模拟卷4-059", "index": 284, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 59, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "在关系数据库中，若关系R的某个属性组的值能唯一标识R中的每个元组，则称该属性组为R的（）。", "options": {"A": "外键", "B": "候选键", "C": "主属性", "D": "全码"}, "answer": "B", "analysis": "候选键（Candidate Key）是关系中能唯一标识每个元组的最小属性组。外键是引用其他关系主键的属性，主属性是包含在任一候选键中的属性，全码是所有属性组成的候选键。题目描述的\"能唯一标识\"符合候选键的定义。"}, {"id": "mock-2026年5月-模拟卷4-060", "index": 285, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo":
