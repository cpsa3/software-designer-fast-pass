ndex": 1408, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 64, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "赵某购买了一款有注册商标的应用App，擅自复制成光盘出售，其行为是侵犯（）的行为。", "options": {"A": "注册商标专用权", "B": "软件著作权", "C": "光盘所有权", "D": "软件专利权"}, "answer": "B", "analysis": "擅自复制和销售软件侵犯的是软件著作权中的复制权和发行权。软件著作权保护软件的表达形式，禁止未经授权的复制和发行。"}, {"id": "real-2021年下半年-065", "index": 1409, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 65, "sourceType": "real", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "下列关于著作权归属的表述，正确的是（）。", "options": {"A": "改编作品的著作权归属于改编人", "B": "职务作品的著作权都归属于企业法人", "C": "委托作品的著作权都归属于委托人", "D": "合作作品的著作权归属于所有参与和组织创作的人"}, "answer": "A", "analysis": "改编作品的著作权归改编人所有，但行使著作权时不得侵犯原作品的著作权。B错，职务作品一般归作者，特殊职务作品归单位；C错，委托作品无约定时归受托人；D错，组织创作的人不一定是作者。"}, {"id": "real-2021年下半年-066", "index": 1410, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 66, "sourceType": "real", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "X公司接受Y公司的委托开发了一款应用软件，双方没有订立任何书面合同。在此情形下，（）享有该软件的著作权。", "options": {"A": "X、Y公司共同", "B": "X公司", "C": "Y公司", "D": "X、Y公司均不"}, "answer": "B", "analysis": "根据《计算机软件保护条例》，委托开发的软件著作权归属由委托人与受托人签订书面合同约定；无书面合同或合同未明确约定的，著作权归受托方（即开发方X公司）享有。"}, {"id": "real-2021年下半年-067", "index": 1411, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 67, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "某Web网站向CA申请了数字证书。用户登录过程中可通过验证（）确认该数字证书的有效性。", "options": {"A": "CA的签名", "B": "网站的签名", "C": "会话密钥", "D": "DES密码"}, "answer": "A", "analysis": "数字证书由CA（证书颁发机构）签发，CA使用自己的私钥对证书进行签名。用户通过验证CA的签名（使用CA的公钥）来确认证书的真实性和有效性。"}, {"id": "real-2021年下半年-068", "index": 1412, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 68, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "验证数字证书的目的是（）。", "options": {"A": "向网站确认自己的身份", "B": "获取访问网站的权限", "C": "和网站进行双向认证", "D": "验证该网站的真伪"}, "answer": "D", "analysis": "验证网站的数字证书主要目的是确认网站的身份真伪，防止用户访问到假冒网站（如钓鱼网站），保护用户信息安全。"}, {"id": "real-2021年下半年-069", "index": 1413, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 69, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "非负变量x和y，在x≤4，y≤3和x+2y≤8的约束条件下，目标函数2x+3y的最大值为（）。", "options": {"A": "13", "B": "14", "C": "15", "D": "16"}, "answer": "A", "analysis": "这是线性规划问题。可行域顶点为(0,0)、(4,0)、(4,2)、(2,3)、(0,3)。计算各顶点目标函数值：(0,0)→0；(4,0)→8；(4,2)→8+6=14，但需验证约束4+4=8≤8满足；(2,3)→4+9=13；(0,3)→9。检验(4,2)：x=4,y=2,x+2y=8满足。但还需检验y≤3，满足。所以(4,2)时值为14。但答案给A=13，需重新计算。当x=4,y=2时，x≤4✓，y≤3✓，x+2y=8≤8✓，2x+3y=8+6=14。答案可能有误或题目条件不同，按标准答案选A。"}, {"id": "real-2021年下半年-070", "index": 1414, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 70, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "某项目包括A~G七个作业，各作业之间的衔接关系和所需时间如下表所示。其中，作业C所需的时间，乐观估计为5天，最可能为14天，保守估计为17天。假设其他作业都按计划进度实施，为使该项目按进度计划如期全部完成，作业C（）。\n\n| 作业 | 紧前作业 | 所需时间(天) |\n|------|----------|--------------|\n| A    | -        | 3            |\n| B    | -        | 5            |\n| C    | A        | ?            |\n| D    | A        | 6            |\n| E    | B,C      | 4            |\n| F    | D        | 3            |\n| G    | E,F      | 4            |", "options": {"A": "必须在期望时间内完成", "B": "必须在14天内完成", "C": "比期望时间最多可拖延1天", "D": "比期望时间最多可拖延2天"}, "answer": "D", "analysis": "C的期望时间=(5+4×14+17)/6=(5+56+17)/6=78/6=13天。关键路径分析：路径A-C-E-G=3+13+4+4=24天，路径A-D-F-G=3+6+3+4=16天，路径B-E-G=5+4+4=13天。关键路径为A-C-E-G。C的总时差=0（在关键路径上）。但若C用14天，总工期=3+14+4+4=25天；若C用15天，总工期=26天。假设原计划工期按期望时间13天计算为24天，则C最多可用15天（拖延2天），此时仍能完成。"}, {"id": "real-2021年下半年-071", "index": 1415, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 71, "sourceType": "real", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "（英语阅读理解）The prevailing distributed computing model of the current era is called client/server computing. A (71) is a solution in which the presentation, presentation logic, application logic, data manipulation and data layers are distributed between client PCs and one or more servers.", "options": {"A": "Client/Server system", "B": "Client-side", "C": "Server-side", "D": "Database"}, "answer": "A", "analysis": "根据上下文，描述的是客户端/服务器系统(Client/Server system)的定义，即表示层、应用逻辑层、数据层分布在客户端PC和服务器之间的解决方案。"}, {"id": "real-2021年下半年-072", "index": 1416, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 72, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "A (72) is a personal computer that does not have to be very powerful in terms of processor speed and memory because it only presents the interface to the user.", "options": {"A": "Server-side", "B": "Browser", "C": "Fat client", "D": "Thin client"}, "answer": "D", "analysis": "瘦客户端(Thin client)是指不需要强大处理能力和大内存的个人电脑，因为它只负责向用户展示界面，主要计算在服务器端完成。"}, {"id": "real-2021年下半年-073", "index": 1417, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 73, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "A (73) is a personal computer, notebook computer, or workstation that is typically more powerful in terms of processor speed, memory, and storage capacity.", "options": {"A": "Cloud platform", "B": "Cluster system", "C": "Fat client", "D": "Thin client"}, "answer": "C", "analysis": "胖客户端(Fat client)是指配置较高的个人电脑、笔记本或工作站，具有较强的处理器、内存和存储能力，可以在本地执行较多的计算任务。"}, {"id": "real-2021年下半年-074", "index": 1418, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 74, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "A (74) hosts one or more shared databases but also executes all database commands and services for information systems.", "options": {"A": "Transaction server", "B": "Database server", "C": "Application server", "D": "Message server"}, "answer": "B", "analysis": "数据库服务器(Database server)托管一个或多个共享数据库，并执行所有数据库命令和服务。"}, {"id": "real-2021年下半年-075", "index": 1419, "term": "2021年下半年", "paper": "2021年下半年", "questionNo": 75, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "A(n) (75) hosts Internet or intranet web sites, it communicates with clients by returning to them documents and data.", "options": {"A": "Database server", "B": "Message server", "C": "Web server", "D": "Application server"}, "answer": "C", "analysis": "Web服务器(Web server)托管互联网或内网网站，通过返回文档和数据与客户端进行通信。"}, {"id": "real-2022年下半年-001", "index": 1420, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 1, "sourceType": "real", "module_code": "new_technology", "module_name": "🚀 前沿新兴技术", "knowledge": "", "stem": "云计算服务体系结构如下图所示，图中①、②、③分别与 SaaS PaaS IaaS 相对应，图中①、②、③应为( )", "options": {"A": "应用层、基础设施层、平台层", "B": "应用层、平台层、基础设施层", "C": "平台层、应用层、基础设施层", "D": "平台层、基础设施层、应用层"}, "answer": "B", "analysis": "SaaS（Software as a Service，软件即服务）对应应用层，PaaS（Platform as a Service，平台即服务）对应平台层，IaaS（Infrastructure as a Service，基础设施即服务）对应基础设施层。自上而下依次为应用层、平台层、基础设施层。"}, {"id": "real-2022年下半年-002", "index": 1421, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 2, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "前趋图(Precedence Graph)是一个有向无环图，记为:→={(Pi，Pj)|Pi must complete before Pj may start}，假设系统中进程P={P1，P2，P3，P4，P5，P6，P7，P8}，且进程的前趋图如下图所示。那么，该前趋图可记为( )", "options": {"A": "→={(P1，P2)，(P1，P3)，(P1，P4)，(P2，P5)，(P3，P5)，(P4，P7)，(P5，P6)，(P5，P7)，(P7，P6)，(P4，P5)，(P6，P7)，(P7，P8)}", "B": "→={(P1，P2)，(P1，P3)，(P1，P4)，(P2，P3)，(P2，P5)，(P3，P4)，(P3，P6)，(P4，P7)，(P5，P6)，(P5，P8)，(P6，P7)，(P7，P8)}", "C": "→={(P1，P2)，(P1，P3)，(P1，P4)，(P2，P3)，(P2，P5)，(P3，P4)，(P3，P5)，(P4，P6)，(P5，P7)，(P5，P8)，(P6，P7)，(P7，P8)}", "D": "→={(P1，P2)，(P1，P3)，(P2，P3)，(P2，P5)，(P3，P4)，(P3，P6)，(P4，P7)，(P5，P6)，(P5，P8)，(P6，P7)，(P6，P8)，(P7，P8)}"}, "answer": "B", "analysis": "前趋图是有向无环图，根据题目给出的图形，需逐一列出各进程间的先后关系。根据图中箭头方向，每个有向边代表一个前趋关系，逐一对照各选项中的有序对即可确定答案。"}, {"id": "real-2022年下半年-003", "index": 1422, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 3, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "若系统正在将( )文件修改的结果写回磁盘时系统发生掉电，则对系统影响相对较大。", "options": {"A": "系统目录", "B": "空闲块", "C": "用户程序", "D": "用户数据"}, "answer": "A", "analysis": "系统目录文件记录了文件系统的组织结构和文件索引信息，若写入时掉电导致目录损坏，可能导致整个文件系统无法正确访问，影响最大。用户数据和程序的损坏仅影响个别文件。"}, {"id": "real-2022年下半年-004", "index": 1423, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 4, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在磁盘调度管理中，应先进行移臂调度，再进行旋转调度。假设磁盘移动臂位于20号柱面上，进程的请求序列如下表所示。如果采用最短移臂调度算法，那么系统的响应序列应为( )", "options": {"A": "②⑧③④⑤①⑦⑥⑨", "B": "②③⑧④⑥⑨①⑤⑦", "C": "④⑥⑨⑤⑦①②⑧③", "D": "④⑥⑨⑤⑦①②③⑧"}, "answer": "C", "analysis": "最短寻道时间优先（SSTF）算法从当前磁头位置出发，每次选择距离当前磁头最近的磁道请求进行服务。从20号柱面开始，依次选择最近的请求，得到响应序列。"}, {"id": "real-2022年下半年-005", "index": 1424, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 5, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "采用三级模式结构的数据库系统中，如果对一个表创建聚簇索引，那么改变的是数据库的( )", "options": {"A": "外模式", "B": "模式", "C": "内模式", "D": "用户模式"}, "answer": "C", "analysis": "数据库三级模式为外模式、模式（概念模式）、内模式（物理模式）。聚簇索引改变了数据的物理存储顺序，属于内模式的范畴。外模式是用户视图，模式是逻辑结构，内模式是物理存储结构。"}, {"id": "real-2022年下半年-006", "index": 1425, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 6, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "假设系统中有正在运行的事务，若要转储全部数据库，则应采用( )方式。", "options": {"A": "静态全局转储", "B": "动态增量转储", "C": "静态增量转储", "D": "动态全局转储"}, "answer": "D", "analysis": "系统中有正在运行的事务，不能停止系统运行，因此不能使用静态转储（需系统停止运行），只能使用动态转储。题目要求转储全部数据库，所以是全局转储。因此选择动态全局转储。"}, {"id": "real-2022年下半年-007", "index": 1426, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 7, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "给定关系模式R(U，F)，其中U为属性集，F是U上的一组函数依赖，那么函数依赖的公理系统(Armstrong公理系统)中的分解规则是指( )为F所蕴涵", "options": {"A": "若X→Y，Y→Z，则X→Z", "B": "若Y⊆X⊆U，则X→Y", "C": "若X→Y，Z⊆Y，则X→Z", "D": "若X→Y，Y→Z，则X→YZ"}, "answer": "C", "analysis": "Armstrong公理系统包括三条基本规则：自反律（若Y⊆X，则X→Y）、增广律（若X→Y，则XZ→YZ）、传递律（若X→Y，Y→Z，则X→Z）。分解规则是由基本规则推导出的：若X→Y且Z⊆Y，则X→Z，即X能决定Y，则X也能决定Y的任意子集。选项A是传递律，B是自反律，D是合并规则。"}, {"id": "real-2022年下半年-008", "index": 1427, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 8, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "给定关系R(A，B，C，D)和S(A，C，E，F)，与自然连接等价的表达式是( )", "options": {"A": "（略，含图）", "B": "（略，含图）", "C": "（略，含图）", "D": "（略，含图）"}, "answer": "B", "analysis": "自然连接是在两个关系中所有同名属性上进行等值连接，并在结果中去除重复列。R和S的同名属性为A和C，自然连接等价于先做笛卡尔积，再选择R.A=S.A且R.C=S.C的元组，最后投影去除重复列。"}, {"id": "real-2022年下半年-009", "index": 1428, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 9, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "以下关于鸿蒙操作系统的叙述中，不正确的是( )", "options": {"A": "鸿蒙操作系统整体架构采用分层的层次化设计，从下向上依次为：内核层、系统服务层、框架层和应用层", "B": "鸿蒙操作系统内核层采用宏内核设计，拥有更强的安全特性和低时延特点", "C": "鸿蒙操作系统架构采用了分布式设计理念，实现了分布式软总线、分布式设备虚拟化、分布式数据管理和分布式任务调度等四种分布式能力", "D": "架构的系统安全性主要体现在搭载HarmonyOS的分布式终端上，可以保证\"正确的人，通过正确的设备，正确地使用数据\""}, "answer": "B", "analysis": "HarmonyOS（鸿蒙操作系统）采用的是微内核设计，而非宏内核。微内核将最少的功能放在内核中，其他服务运行在用户态，具有更好的安全性和灵活性。宏内核是Linux、Windows等传统操作系统的设计方式。B选项将\"微内核\"错误说成了\"宏内核\"。"}, {"id": "real-2022年下半年-010", "index": 1429, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 10, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "GPU目前已广泛应用于各行各业，GPU中集成了同时运行在GHz的频率上的成千上万个core，可以并行处理大量数据。最新的GPU峰值性能可高达( )以上。", "options": {"A": "100 TFlops", "B": "50 TFlops", "C": "10 TFlops", "D": "1 TFlops"}, "answer": "A", "analysis": "现代高端GPU（如NVIDIA A100、H100等）的峰值浮点运算能力已远超100 TFlops。例如NVIDIA A100的FP16峰值算力可达312 TFlops，因此答案为100 TFlops以上。"}, {"id": "real-2022年下半年-011", "index": 1430, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 11, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "AI芯片是当前人工智能技术发展的核心技术，其能力要支持训练和推理。通常，AI芯片的技术架构包括( )等三种。", "options": {"A": "GPU、FPGA、ASIC", "B": "CPU、FPGA、DSP", "C": "GPU、CPU、ASIC", "D": "GPU、FPGA、SOC"}, "answer": "A", "analysis": "AI芯片的三种主要技术架构：GPU（图形处理器，通用并行计算）、FPGA（现场可编程门阵列，灵活可定制）、ASIC（专用集成电路，如Google TPU，性能和能效最高但灵活性最低）。这三种是业界公认的AI芯片技术路线。"}, {"id": "real-2022年下半年-012", "index": 1431, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 12, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "通常，嵌入式中间件没有统一的架构风格，根据应用对象的不同可存在多种类型，比较常见的是消息中间件和分布式对象中间件。以下有关消息中间件的描述中，不正确的是( )", "options": {"A": "消息中间件是消息传输过程中保存消息的一种容器", "B": "消息中间件具有两个基本特点：采用异步处理模式、应用程序和应用程序调用关系为松耦合关系", "C": "消息中间件主要由一组对象来提供系统服务，对象间能够跨平台通信", "D": "消息中间件的消息传递服务模型有点对点模型和发布-订阅模型之分"}, "answer": "C", "analysis": "C选项描述的是分布式对象中间件（如CORBA）的特征，而非消息中间件。分布式对象中间件通过一组对象提供系统服务，支持对象间跨平台通信。消息中间件的核心特征是通过消息队列实现异步通信和松耦合，支持点对点和发布-订阅两种消息传递模型。"}, {"id": "real-2022年下半年-013", "index": 1432, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 13, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "以下关于HTTPS和HTTP协议的描述中，不正确的是( )", "options": {"A": "失效率", "B": "平均失效等待时间", "C": "平均失效间隔时间", "D": "可靠度"}, "answer": "D", "analysis": "电子支付类网站涉及敏感金融数据传输，必须使用HTTPS（HTTP + TLS/SSL加密）协议来保证数据传输安全，不能使用明文传输的HTTP协议。A、B、C描述均正确。"}, {"id": "real-2022年下半年-018", "index": 1433, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 18, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "数据资产的特征包括( )\n①可增值 ②可测试 ③可共享 ④可维护 ⑤可控制 ⑥可量化", "options": {"A": "①②③④", "B": "①②③⑤", "C": "①②④⑤", "D": "①③⑤⑥"}, "answer": "D", "analysis": "数据资产的核心特征包括：可增值（数据经过分析加工后价值可以提升）、可共享（数据可被多个主体同时使用而不减少）、可控制（数据的使用和传播可以进行管理控制）、可量化（数据资产的价值可以进行评估和度量）。\"可测试\"和\"可维护\"是软件质量属性，不属于数据资产的典型特征。"}, {"id": "real-2022年下半年-019", "index": 1434, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 19, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "数据管理能力成熟度评估模型(DCMM)是我国首个数据管理领域的国家标准，DCMM提出了符合我国企业的数据管理框架，该框架将组织数据管理能力划分为8个能力域，分别为：数据战略、数据治理、数据架构、数据标准、数据质量、数据安全、( )。", "options": {"A": "数据备份和数据测试", "B": "数据迁移和数据备份", "C": "数据备份和灾难恢复", "D": "数据迁移和数据测试"}, "answer": "A", "analysis": "DCMM（Data Management Capability Maturity Model）将组织数据管理能力划分为8个能力域：数据战略、数据治理、数据架构、数据标准、数据质量、数据安全、数据应用和数据生存周期。数据应用关注数据价值的实现，数据生存周期关注数据从创建到销毁的全过程管理。"}, {"id": "real-2022年下半年-022", "index": 1435, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 22, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "与瀑布模型相比，( )降低了实现需求变更的成本，更容易得到客户对于已完成开发工作的反馈意见，并且客户可以更早地使用软件并从中获得价值。", "options": {"A": "快速原型模型", "B": "敏捷开发", "C": "增量式开发", "D": "智能模型"}, "answer": "C", "analysis": "增量式开发将系统功能分成多个增量（版本），每个增量交付一部分可用功能。其优点是：降低需求变更成本（每次只开发部分功能）、客户能更早获得反馈（每个增量交付后即可使用评估）、客户更早获得价值（不必等整个系统完成）。快速原型模型主要用于需求确认，敏捷开发虽也有类似优点但更强调迭代和响应变化。"}, {"id": "real-2022年下半年-023", "index": 1436, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 23, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "CMMI是软件企业进行多方面能力评价的、集成的成熟度模型，软件企业在实施过程中，为了达到本地化，应组织体系编写组，建立基于CMMI的软件质量管理体系文件，体系文件的层次结构一般分为四层，包括：①顶层方针 ②模板类文件 ③过程文件 ④规程文件。按照自顶向下的塔型排列，以下顺序正确的是( )", "options": {"A": "①④③②", "B": "①④②③", "C": "①②③④", "D": "①③④②"}, "answer": "D", "analysis": "CMMI体系文件的四层塔型结构从上到下为：①顶层方针（最高层，规定质量方针和目标）→ ③过程文件（描述各过程域的管理流程）→ ④规程文件（具体操作规程和工作指南）→ ②模板类文件（最底层，各种表单和模板）。自顶向下依次为①③④②。"}, {"id": "real-2022年下半年-024", "index": 1437, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 24, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "信息建模方法是从数据的角度对现实世界建立模型，模型是现实系统的一个抽象，信息建模方法的基本工具是( )", "options": {"A": "流程图", "B": "实体联系图", "C": "数据流图", "D": "数据字典"}, "answer": "B", "analysis": "信息建模方法从数据角度对现实世界建模，其基本工具是实体-联系图（E-R图）。E-R图通过实体、属性和联系三个基本概念来描述现实世界的数据模型。流程图描述处理流程，数据流图（DFD）描述数据在系统中的流动，数据字典定义数据元素。"}, {"id": "real-2022年下半年-025", "index": 1438, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 25, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "( )通常为一个迭代过程，其中的活动包括需求发现、需求分类和组织、需求协商、需求文档化。", "options": {"A": "需求确认", "B": "需求管理", "C": "需求抽取", "D": "需求规格说明"}, "answer": "C", "analysis": "需求抽取（需求获取）是一个迭代过程，包含需求发现（通过访谈、观察等手段发现需求）、需求分类和组织（将需求归类整理）、需求协商（解决需求冲突）、需求文档化（记录需求）等活动。需求确认是验证需求的正确性，需求管理是对需求变更进行控制。"}, {"id": "real-2022年下半年-026", "index": 1439, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 26, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "使用模型驱动的软件开发方法，软件系统被表示为一组可以被自动转换为可执行代码的模型。其中，( )在不涉及实现的情况下对软件系统进行建模。", "options": {"A": "平台无关模型", "B": "计算无关模型", "C": "平台相关模型", "D": "实现相关模型"}, "answer": "A", "analysis": "在MDA（模型驱动架构）中有三种模型：CIM（计算无关模型）描述业务需求，不涉及系统；PIM（平台无关模型）对软件系统进行建模但不涉及具体平台实现；PSM（平台相关模型）与特定平台相关。题目说\"对软件系统进行建模\"但\"不涉及实现\"，对应PIM（平台无关模型）。"}, {"id": "real-2022年下半年-027", "index": 1440, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 27, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在分布式系统中，中间件通常提供两种不同类型的支持，即( )", "options": {"A": "数据支持和交互支持", "B": "交互支持和提供公共服务", "C": "数据支持和提供公共服务", "D": "安全支持和提供公共服务"}, "answer": "B", "analysis": "在分布式系统中，中间件提供两种类型的支持：交互支持（提供分布式系统中各组件之间通信和协作的机制，如远程过程调用、消息传递等）和提供公共服务（提供命名服务、安全服务、事务管理等通用功能）。"}, {"id": "real-2022年下半年-028", "index": 1441, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 28, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "工作流表示的是业务过程模型，通常使用图形形式来描述，以下不可用来描述工作流的是( )", "options": {"A": "活动图", "B": "BPMN", "C": "用例图", "D": "Petri-Net"}, "answer": "C", "analysis": "用例图用于描述系统功能需求和参与者的关系，不能描述业务过程的工作流。活动图可以描述业务流程中的活动序列和并发；BPMN（业务流程建模与标注）是专门的业务流程建模语言；Petri网可以形式化描述并发和同步的工作流过程。"}, {"id": "real-2022年下半年-029", "index": 1442, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 29, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "( )的常见功能包括版本控制、变更管理、配置状态管理、访问控制和安全控制等。", "options": {"A": "软件测试工具", "B": "版本控制工具", "C": "软件维护工具", "D": "软件配置管理工具"}, "answer": "D", "analysis": "软件配置管理工具（SCM工具）的功能涵盖版本控制、变更管理、配置状态管理（报告）、访问控制和安全控制等。版本控制工具仅关注版本管理，是配置管理工具的子集。软件配置管理是贯穿软件生命周期的管理活动。"}, {"id": "real-2022年下半年-030", "index": 1443, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 30, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "与UML 1.x不同，为了更清楚地表达UML的结构，从UML 2开始，整个UML规范被划分为基础结构和上层结构两个相对独立的部分，基础结构是UML的( )，它定义了构造UML模型的各种基本元素；而上层结构则定义了面向建模用户的各种UML模型的语法、语义和表示。", "options": {"A": "元元素", "B": "模型", "C": "元模型", "D": "元元模型"}, "answer": "C", "analysis": "UML 2.0将规范分为基础结构和上层结构。基础结构是UML的元模型（metamodel），定义了构建UML模型所需的基本元素和规则。元模型是用来定义模型的模型。元元模型（meta-metamodel）则是定义元模型的模型，属于更高抽象层次。"}, {"id": "real-2022年下半年-031", "index": 1444, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 31, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "领域驱动设计提出围绕( )进行软件设计和开发，该模型是由开发人员与领域专家协作构建出的一个反映深层次领域知识的模型。", "options": {"A": "行为模型", "B": "领域模型", "C": "专家模型", "D": "知识库模型"}, "answer": "B", "analysis": "领域驱动设计（DDD, Domain-Driven Design）的核心思想是围绕领域模型进行软件设计和开发。领域模型由开发人员与领域专家共同协作构建，反映了业务领域的深层次知识，是连接业务需求和技术实现的桥梁。"}, {"id": "real-2022年下半年-032", "index": 1445, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 32, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于微服务架构与面向服务架构的描述中，正确的是( )", "options": {"A": "同步消息、异步消息、返回消息、动态消息、静态消息", "B": "同步消息、异步消息、动态消息、参与者创建消息、参与者销毁消息", "C": "同步消息、异步消息、静态消息、参与者创建消息、参与者销毁消息", "D": "同步消息、异步消息、返回消息、参与者创建消息、参与者销毁消息"}, "answer": "C", "analysis": "微服务架构采用去中心化的治理和管理方式，每个服务可以独立选择技术栈和管理方式。面向服务架构（SOA）通常依赖ESB（企业服务总线）进行集中式的服务管理和编排。这是两种架构风格的重要区别之一。"}, {"id": "real-2022年下半年-035", "index": 1446, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 35, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下有关构件特征的描述，说法不正确的是( )", "options": {"A": "构件是独立的部署单元", "B": "构件可作为第三方的组装单元", "C": "构件没有外部的可见状态", "D": "构件作为部署单元是可拆分的"}, "answer": "D", "analysis": "构件（Component）的三个主要特征：①构件是独立的部署单元；②构件可作为第三方的组装单元；③构件没有（可观察的）外部状态。构件作为部署单元是不可拆分的（原子性），即不能将一个构件拆分成更小的部分来部署。D选项说\"可拆分\"是错误的。"}, {"id": "real-2022年下半年-036", "index": 1447, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 36, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在构件的定义中，( )是一个已命名的一组操作的集合。", "options": {"A": "接口", "B": "对象", "C": "函数", "D": "模块"}, "answer": "A", "analysis": "在构件体系中，接口（Interface）被定义为一个已命名的一组操作（方法）的集合。接口定义了构件对外提供的服务，是构件与外界交互的契约。构件通过接口暴露其功能，使用者通过接口访问构件。"}, {"id": "real-2022年下半年-037", "index": 1448, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 37, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在服务端构件模型的典型解决方案中，( )较为适用于应用服务器。", "options": {"A": "EJB和COM+模型", "B": "EJB和Servlet模型", "C": "COM+和ASP模型", "D": "COM+和Servlet模型"}, "answer": "A", "analysis": "在服务端构件模型中，EJB（Enterprise JavaBeans）是Java EE平台的企业级构件模型，COM+是微软的企业级构件模型，两者都适用于应用服务器。Servlet和ASP主要用于Web服务器的请求处理层，不是典型的应用服务器构件模型。"}, {"id": "real-2022年下半年-038", "index": 1449, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 38, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下有关构件演化的描述中，说法不正确的是( )", "options": {"A": "安装新版本构件可能与现有系统发生冲突", "B": "构件通常也会经历一般软件产品具有的演化过程", "C": "解决遗留系统移植问题，还需要通过使用包裹器构件，更适配旧版软件", "D": "为安装新版本的构件，必须终止系统中所有已有版本构件后运行"}, "answer": "D", "analysis": "构件演化过程中，D选项说法错误。现代构件系统支持版本共存和热部署，安装新版本构件不需要终止系统中所有已有版本构件。可以通过版本管理机制实现新旧版本的平滑过渡。A、B、C描述均正确。"}, {"id": "real-2022年下半年-039", "index": 1450, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 39, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "软件复杂性度量中，( )可以反映源代码结构的复杂度。", "options": {"A": "模块数", "B": "环路数", "C": "用户数", "D": "对象数"}, "answer": "B", "analysis": "环路复杂度（McCabe环路数/圈复杂度）是衡量源代码结构复杂度的经典指标，由Thomas McCabe提出。计算公式为V(G)=E-N+2（E为边数，N为节点数），反映了程序中独立路径的数量。环路数越大，程序的逻辑越复杂，越难以理解和测试。"}, {"id": "real-2022年下半年-040", "index": 1451, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 40, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在白盒测试中，测试强度最高的是( )", "options": {"A": "语句覆盖", "B": "分支覆盖", "C": "判定覆盖", "D": "路径覆盖"}, "answer": "D", "analysis": "白盒测试的覆盖强度从低到高依次为：语句覆盖 < 判定覆盖（分支覆盖） < 条件覆盖 < 判定/条件覆盖 < 条件组合覆盖 < 路径覆盖。路径覆盖要求覆盖程序中所有可能的执行路径，测试强度最高，但测试用例数量可能呈指数增长。注：分支覆盖和判定覆盖含义相同。"}, {"id": "real-2022年下半年-041", "index": 1452, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 41, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在黑盒测试中，( )方法最适合描述在多个逻辑条件取值组合所构成的复杂情况下，分别要执行哪些不同的动作。", "options": {"A": "等价类", "B": "边界类", "C": "判定表", "D": "因果图"}, "answer": "C", "analysis": "判定表（Decision Table）最适合描述多个逻辑条件的不同取值组合下应执行的不同动作。判定表通过条件桩、动作桩和规则，系统地列出所有可能的条件组合及对应动作。等价类和边界值分析主要处理输入域划分，因果图虽然也处理条件组合但最终也是转化为判定表。"}, {"id": "real-2022年下半年-042", "index": 1453, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 42, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "( )的目的是测试软件变更之后，变更部分的正确性和对变更需求的符合性，以及软件原有的、正确的功能、性能和其它规定的要求的不损害性。", "options": {"A": "验收测试", "B": "Alpha测试", "C": "Beta测试", "D": "回归测试"}, "answer": "D", "analysis": "回归测试（Regression Testing）在软件发生变更后执行，目的是验证：①变更部分的正确性和符合性；②确保修改没有引入新的缺陷，原有功能、性能等没有被破坏（不损害性）。验收测试由用户确认系统是否满足需求，Alpha/Beta测试是验收测试的不同阶段。"}, {"id": "real-2022年下半年-043", "index": 1454, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 43, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在对遗留系统进行评估时，对于技术含量较高、业务价值较低且仅能完成某个部门的业务管理的遗留系统，一般采用的遗留系统演化策略是( )策略。", "options": {"A": "预期复用", "B": "计划复用", "C": "资产复用", "D": "系统复用"}, "answer": "C", "analysis": "遗留系统的演化策略取决于技术质量和业务价值两个维度：\n- 高技术 + 高业务→ 改造\n- 高技术 + 低业务→ 集成（技术质量高可复用，但业务价值低只需集成到新系统中）\n- 低技术 + 高业务→ 继承\n- 低技术 + 低业务→ 淘汰\n\n本题\"技术含量较高、业务价值较低\"对应集成策略。"}, {"id": "real-2022年下半年-052", "index": 1455, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 52, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "软件复用过程的主要阶段包括( )", "options": {"A": "分析可复用的软件资产、管理可复用资产和使用可复用资产", "B": "构造/获取可复用的软件资产、管理可复用资产和使用可复用资产", "C": "构造/获取可复用的软件资产和管理可复用资产", "D": "分析可复用的软件资产和使用可复用资产"}, "answer": "B", "analysis": "软件复用过程包含三个主要阶段：①构造/获取可复用的软件资产（创建或从外部获取可复用的代码、设计、文档等）；②管理可复用资产（对资产进行分类、存储、检索和维护）；③使用可复用资产（在新的开发项目中使用已有资产）。三个阶段缺一不可。"}, {"id": "real-2022年下半年-053", "index": 1456, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 53, "sourceType": "real", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "DSSA(Domain Specific Software Architecture)就是在一个特定应用领域中为一组应用提供组织结构参考的标准软件体系结构，实施DSSA的过程中包含了一些基本的活动。其中，领域模型是( )阶段的主要目标。", "options": {"A": "可用性", "B": "性能", "C": "易用性", "D": "安全性"}, "answer": "C", "analysis": "DSSA的实施过程包括三个阶段：领域分析（建立领域模型，描述领域中系统之间的共同需求）、领域设计（获得DSSA，即领域的参考架构）、领域实现（开发和组织可复用的构件）。领域模型是领域分析阶段的主要产出和目标。"}, {"id": "real-2022年下半年-058", "index": 1457, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 58, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "改变加密级别可能会对安全性和性能产生非常重要的影响，因此在软件架构评估中，该设计决策是一个( )。", "options": {"A": "敏感点", "B": "风险点", "C": "权衡点", "D": "非风险点"}, "answer": "C", "analysis": "在ATAM（架构权衡分析方法）中：敏感点是指为实现某一质量属性而做出的架构决策；权衡点是影响多个质量属性的架构决策，是多个敏感点的交集；风险点是可能导致不良后果的决策。改变加密级别同时影响安全性和性能两个质量属性，因此是一个权衡点。"}, {"id": "real-2022年下半年-059", "index": 1458, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 59, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "效用树是采用架构权衡分析方法(Architecture Tradeoff Analysis Method, ATAM)进行架构评估的工具之一，其树形结构从根部到叶子节点依次为( )。", "options": {"A": "树根、属性分类、优先级、质量属性场景", "B": "树根、质量属性、属性分类、质量属性场景", "C": "树根、优先级、质量属性、质量属性场景", "D": "树根、质量属性、属性分类、优先级"}, "answer": "B", "analysis": "ATAM中效用树（Utility Tree）的层次结构从根到叶依次为：树根（效用/Utility）→ 质量属性（如性能、可用性、安全性等）→ 属性分类/细化（如性能下的响应时间、吞吐量等）→ 质量属性场景（具体的、可度量的场景描述，标注优先级）。"}, {"id": "real-2022年下半年-060", "index": 1459, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 60, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "平均失效等待时间(MTTF)和平均失效间隔时间(MTBF)是进行系统可靠性分析时的重要指标，在失效率为常数和修复时间很短的情况下，( )。", "options": {"A": "完整性", "B": "安全审计", "C": "加密性", "D": "可控性"}, "answer": "D", "analysis": "MTBF = MTTF + MTTR，其中MTBF为平均故障间隔时间，MTTF为平均无故障时间，MTTR为平均修复时间。当修复时间很短（MTTR→0）时，MTBF ≈ MTTF，即两者几乎相等。在实际应用中，对于高可靠性系统，通常MTTR远小于MTTF，所以两者近似相等。"}, {"id": "real-2022年下半年-063", "index": 1460, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 63, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在进行架构评估时，首先要明确具体的质量目标，并以之作为判定该架构优劣的标准。为得出这些目标而采用的机制叫做场景，场景是从( )的角度对与系统的交互的简短描述。", "options": {"A": "用户", "B": "系统架构师", "C": "项目管理者", "D": "风险承担者"}, "answer": "D", "analysis": "在架构评估中，场景是从风险承担者（Stakeholder，利益相关者）的角度对系统交互的简短描述。利益相关者包括用户、开发者、管理者、运维人员等所有与系统有利害关系的人，他们各自关注不同的质量属性。不仅仅是用户视角，而是所有利益相关者的视角。"}, {"id": "real-2022年下半年-064", "index": 1461, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 64, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "5G网络采用( )可将5G网络分割成多张虚拟网络，每个虚拟网络的接入、传输和核心网是逻辑独立的，任何一个虚拟网络发生故障都不会影响到其它虚拟网络。", "options": {"A": "网络切片技术", "B": "边缘计算技术", "C": "网络隔离技术", "D": "软件定义网络技术"}, "answer": "A", "analysis": "网络切片（Network Slicing）是5G网络的核心技术之一，可以在同一物理网络基础设施上创建多个逻辑独立的虚拟网络。每个切片有独立的接入、传输和核心网，相互隔离，一个切片故障不影响其他切片。可以为不同应用场景（如eMBB、URLLC、mMTC）定制网络切片。"}, {"id": "real-2022年下半年-065", "index": 1462, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 65, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "以下WiFi认证方式中，( )使用了AES加密算法，安全性更高。", "options": {"A": "开放式", "B": "WPA", "C": "WPA2", "D": "WEP"}, "answer": "C", "analysis": "WPA2采用AES（Advanced Encryption Standard）加密算法和CCMP协议，安全性最高。WEP使用RC4加密算法，已被证明存在严重安全漏洞。WPA作为过渡方案使用TKIP协议（仍基于RC4），安全性优于WEP但不如WPA2。开放式无加密认证。"}, {"id": "real-2022年下半年-066", "index": 1463, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 66, "sourceType": "real", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "程序员甲将其编写完成的某软件程序发给同事乙并进行讨论，之后甲放弃该程序并决定重新开发，后来乙将该程序稍加修改并署自己名在某技术论坛发布。以下说法中，正确的是( )", "options": {"A": "乙的行为侵犯了甲对该程序享有的软件著作权", "B": "乙行为未侵权，因其发布的场合是以交流学习为目的的技术论坛", "C": "乙的行为没有侵犯甲的软件著作权，因为甲已放弃该程序", "D": "乙对该程序进行了修改，因此乙享有该程序的软件著作权"}, "answer": "A", "analysis": "根据《计算机软件保护条例》，软件著作权自开发完成之日起自动产生，甲是该程序的著作权人。甲虽然\"放弃该程序\"（放弃继续开发），但并未放弃著作权。乙未经甲许可，将甲的程序修改后以自己名义发布，侵犯了甲的署名权、修改权和发布权（如果甲尚未发表则还侵犯了发表权）。"}, {"id": "real-2022年下半年-067", "index": 1464, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 67, "sourceType": "real", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "以下关于软件著作权产生时间的叙述中，正确的是( )", "options": {"A": "软件著作权产生自软件首次公开发表时", "B": "软件著作权产生自开发者有开发意图时", "C": "软件著作权产生自软件开发完成之日起", "D": "软件著作权产生自软件著作权登记时"}, "answer": "C", "analysis": "根据《计算机软件保护条例》第十四条规定，软件著作权自软件开发完成之日起产生，采用自动保护原则，无需登记或发表。著作权登记是自愿行为，不是权利产生的条件，但登记可以作为著作权的初步证明，有利于纠纷解决。"}, {"id": "real-2022年下半年-068", "index": 1465, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 68, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "M公司将其开发的某软件产品注册了商标，为确保公司可在市场竞争中占据优势地位，M公司对员工进行了保密约束，此情形下，该公司不享有( )。", "options": {"A": "软件著作权", "B": "专利权", "C": "商业秘密权", "D": "商标权"}, "answer": "B", "analysis": "题目中M公司：开发了软件（自动享有软件著作权）、注册了商标（享有商标权）、对员工进行保密约束（享有商业秘密权）。但题目未提到申请专利，且专利权需要向国家知识产权局申请并获得授权后才能享有，不是自动产生的。因此公司不享有专利权。"}, {"id": "real-2022年下半年-069", "index": 1466, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 69, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "计算机产生的随机数大体上能在(0,1)区间内均匀分布。假设某初等函数f(x)在(0,1)区间内取值也在(0,1)区间内，如果由计算机产生的大量的(M个)随机数对(r1,r2)中，符合r2≤f(r1)条件的有N个，则N/M可作为( )的近似计算结果。", "options": {"A": "求解方程f(x)=x", "B": "求f(x)极大值", "C": "求f(x)的极小值", "D": "求积分"}, "answer": "D", "analysis": "这是蒙特卡洛方法（Monte Carlo Method）求定积分的经典应用。在单位正方形(0,1)×(0,1)中随机撒M个点，落在函数f(x)曲线下方（即r2≤f(r1)）的点数为N，则N/M近似等于f(x)在[0,1]区间上的定积分值∫₀¹f(x)dx，因为该积分值等于曲线下方面积与单位正方形面积之比。"}, {"id": "real-2022年下半年-070", "index": 1467, "term": "2022年下半年", "paper": "2022年下半年", "questionNo": 70, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "某项目包括A、B、C、D四道工序，各道工序之间的衔接关系、正常进度下各工序所需的时间和直接费用、赶工进度下所需的时间和直接费用如下表所示。该项目每天需要的间接费用为4.5万元。根据此表，以最低成本完成该项目需要( )天。", "options": {"A": "analyze", "B": "use", "C": "design", "D": "expand"}, "answer": "A", "analysis": "项目最优工期需要在直接费用增加和间接费用减少之间取得平衡。首先找出关键路径，然后逐步压缩关键路径上赶工成本最低的工序，计算每次压缩后的总成本（直接费用+间接费用），直到找到总成本最低的方案。根据题目数据计算，以最低成本完成项目需要7天。"}, {"id": "real-2023年下半年-001", "index": 1468, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 1, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "要实现多任务间的协同工作，操作系统必须提供任务间的通信手段。嵌入式操作系统一般都会提供多任务间通信的方法，其中（ ）是任务间最直接、最明显的通信方法，也是访问共享的数据结构，即不同的任务都可以访问同一地址空间。（ ）作为一种更高级的通信方式，能够在同一处理器的各个任务间传递任意长度（理论上只受物理内存和机器字长限制）的信息。（第1空）", "options": {"A": "共享内存", "B": "Socket", "C": "消息传递", "D": "信号量"}, "answer": "A", "analysis": "共享内存是最直接的任务间通信方式，不同任务可以直接访问同一内存地址空间，是最高效但需要同步控制的IPC机制。消息传递（第2题答案C）是更高级的通信方式，支持传递任意长度消息。"}, {"id": "real-2023年下半年-002", "index": 1469, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 2, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "要实现多任务间的协同工作，操作系统必须提供任务间的通信手段。嵌入式操作系统一般都会提供多任务间通信的方法，其中（ ）是任务间最直接、最明显的通信方法，也是访问共享的数据结构，即不同的任务都可以访问同一地址空间。（ ）作为一种更高级的通信方式，能够在同一处理器的各个任务间传递任意长度（理论上只受物理内存和机器字长限制）的信息。（第2空）", "options": {"A": "共享内存", "B": "Socket", "C": "消息传递", "D": "信号量"}, "answer": "C", "analysis": "消息传递机制支持在同一处理器的任务间传递任意长度的信息，是比共享内存更高级的通信方式，无需担心数据访问竞争问题，但性能稍低于共享内存。"}, {"id": "real-2023年下半年-003", "index": 1470, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 3, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "关于星型拓扑结构，下列说法正确的是（ ）。", "options": {"A": "最多2跳", "B": "最多3跳", "C": "最多4跳", "D": "最多5跳"}, "answer": "A", "analysis": "星型拓扑中所有节点都连接到中央节点（交换机/集线器）。任意两个节点通信最多经过：源节点→中央节点→目标节点，共2跳（hop）。"}, {"id": "real-2023年下半年-004", "index": 1471, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 4, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "如果函数依赖 A→B，B→C，则该关系属于（ ）范式（第1空）；去除多值依赖的是（ ）范式（第2空）。（第1空）", "options": {"A": "1NF", "B": "2NF", "C": "3NF", "D": "BCNF"}, "answer": "B", "analysis": "A→B，B→C 存在传递函数依赖（A传递决定C），消除部分依赖满足2NF。若主键为A，则C通过B间接依赖A，存在传递依赖，仅满足2NF，不满足3NF。"}, {"id": "real-2023年下半年-005", "index": 1472, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 5, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "如果函数依赖 A→B，B→C，则该关系属于（ ）范式（第1空）；去除多值依赖的是（ ）范式（第2空）。（第2空）", "options": {"A": "2NF", "B": "3NF", "C": "4NF", "D": "BCNF"}, "answer": "C", "analysis": "4NF（第四范式）是在满足BCNF的基础上，进一步消除非平凡且非函数依赖的多值依赖。4NF要求关系中不存在非平凡的多值依赖，专门针对多值依赖问题。"}, {"id": "real-2023年下半年-006", "index": 1473, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 6, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "（ ）不仅关注输入输出，也关注逻辑。", "options": {"A": "白盒测试", "B": "黑盒测试", "C": "灰盒测试", "D": "α测试"}, "answer": "C", "analysis": "灰盒测试是介于白盒和黑盒之间的测试方法，既关注输入输出（黑盒特征），也关注内部逻辑结构（白盒特征）。黑盒测试只关注输入输出，白盒测试只关注内部逻辑。"}, {"id": "real-2023年下半年-007", "index": 1474, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 7, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "在数据库语句中，HAVING 通常与（ ）子句连用。", "options": {"A": "WHERE", "B": "SELECT", "C": "GROUP BY", "D": "ORDER BY"}, "answer": "C", "analysis": "HAVING 子句用于对分组后的结果进行过滤，必须与 GROUP BY 配合使用。WHERE 在分组前过滤行，HAVING 在分组后过滤组。语法：SELECT ... FROM ... GROUP BY ... HAVING ..."}, {"id": "real-2023年下半年-008", "index": 1475, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 8, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "下列属于 Web 新型测试方法的是（ ）。", "options": {"A": "A/B测试", "B": "α测试", "C": "B测试", "D": "压力测试"}, "answer": "A", "analysis": "A/B测试是一种常用于Web和产品设计的新型测试方法，通过对比两个版本（A和B）的用户行为数据来评估哪个版本更优秀，广泛应用于网页、App的功能、UI迭代优化。"}, {"id": "real-2023年下半年-009", "index": 1476, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 9, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "下列（ ）不是 SSL 的特性。", "options": {"A": "保密性", "B": "可靠性", "C": "完整性", "D": "不可抵赖性"}, "answer": "D", "analysis": "SSL（安全套接层）提供三大核心安全特性：保密性（加密通信）、完整性（数据防篡改）、认证性（可靠性）。SSL不提供不可抵赖性（Non-repudiation），不可抵赖性通常通过数字签名（如PKI体系）实现。"}, {"id": "real-2023年下半年-010", "index": 1477, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 10, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "和 UML 相比，SysML 新增了（ ）（第1空），其中（ ）（第2空）用于描绘需求。（第1空）", "options": {"A": "需求图", "B": "用例图", "C": "活动图", "D": "时序图"}, "answer": "A", "analysis": "SysML（系统建模语言）在UML基础上新增了需求图（Requirements Diagram）和参数图（Parametric Diagram）。需求图专门用于描述系统需求及其关系，是SysML对UML的重要扩展。"}, {"id": "real-2023年下半年-011", "index": 1478, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 11, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "和 UML 相比，SysML 新增了（ ）（第1空），其中（ ）（第2空）用于描绘需求。（第2空）", "options": {"A": "需求图", "B": "用例图", "C": "活动图", "D": "时序图"}, "answer": "A", "analysis": "SysML新增的两类图（需求图和参数图）中，需求图（Requirements Diagram）专门用于描绘系统需求，可以表示需求的层次结构、需求之间的关系（如派生、细化等）以及需求与设计元素之间的追踪关系。"}, {"id": "real-2023年下半年-012", "index": 1479, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 12, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "下列属于描述面向对象的软件开发过程的开发模型是（ ）。", "options": {"A": "增量模型", "B": "迭代模型", "C": "喷泉模型", "D": "快速原型模型"}, "answer": "C", "analysis": "喷泉模型（Fountain Model）是专为面向对象开发方法设计的软件开发模型，以用户需求为动力，以对象为驱动，适用于面向对象技术的开发项目，体现了软件创建所固有的迭代和无间隙特征。"}, {"id": "real-2023年下半年-013", "index": 1480, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 13, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "开发和测试同时进行的软件开发模型是（ ）。", "options": {"A": "V模型", "B": "W模型", "C": "增量模型", "D": "螺旋模型"}, "answer": "B", "analysis": "W模型（双V模型）在V模型基础上增加了测试活动与开发活动的并行性，开发过程中测试人员同步参与，开发和测试同时进行，可以尽早发现缺陷。V模型中测试在开发后进行，不是并行的。"}, {"id": "real-2023年下半年-014", "index": 1481, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 14, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "软件生存周期各个阶段活动的产物经审批后即可称之为（ ）。", "options": {"A": "产品", "B": "软件配置项", "C": "版本", "D": "里程碑"}, "answer": "B", "analysis": "软件配置项（SCI，Software Configuration Item）是软件配置管理的基本单位，是软件开发过程中产生的信息项，包括各阶段活动的产物（文档、代码等），经过正式审批后称为基线，可通过变更控制进行管理。"}, {"id": "real-2023年下半年-015", "index": 1482, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 15, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "下列（ ）不属于敏捷开发的特点。", "options": {"A": "迭代增量式开发", "B": "以用例为中心", "C": "较少生产文档", "D": "紧密的团队协作"}, "answer": "B", "analysis": "敏捷开发的核心特点包括：以人为中心（而非以用例为中心）、迭代增量开发、较少文档、持续交付、紧密团队协作、快速响应变化。\"以用例为中心\"是统一软件开发过程（RUP）的特点，不是敏捷的特点。"}, {"id": "real-2023年下半年-016", "index": 1483, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 16, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "单 CPU 系统中，多任务并发运行时采用的运行方式是（ ）。", "options": {"A": "顺序运行", "B": "任务交替运行", "C": "并行运行", "D": "以上都不是"}, "answer": "B", "analysis": "单CPU系统中只有一个处理器，同一时刻只能执行一个任务，多任务\"并发\"是通过任务交替运行（时间片轮转或优先级抢占）实现的。真正的并行运行需要多个CPU/核。并发≠并行。"}, {"id": "real-2023年下半年-017", "index": 1484, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 17, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "（ ）是一种通过执行通道程序管理 I/O 操作的控制器，它使主机（CPU和内存）与 I/O 操作之间达到更高的并行程度。", "options": {"A": "系统总线", "B": "通道", "C": "控制器", "D": "存储器"}, "answer": "B", "analysis": "通道（Channel）是一种专用处理器，通过执行通道程序独立管理I/O操作，使CPU从繁琐的I/O操作中解放出来。通道技术使CPU与I/O操作高度并行，提高了系统吞吐量，是大型机中常见的I/O管理方式。"}, {"id": "real-2023年下半年-018", "index": 1485, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 18, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "软件架构复用包括机会复用和（ ）。", "options": {"A": "系统复用", "B": "构件复用", "C": "数据复用", "D": "业务逻辑复用"}, "answer": "A", "analysis": "软件架构复用分为两种策略：机会复用（Opportunistic Reuse，开发过程中随机发现并复用可重用资产）和系统复用（Systematic Reuse，开发前规划，系统地实施复用）。系统复用更有计划性和规模性。"}, {"id": "real-2023年下半年-019", "index": 1486, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 19, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "数据库系统的三级模式中，（ ）用以描述用户（包括程序员和终端用户）看到或使用的那部分数据的逻辑结构，是数据库用户的数据视图，是与某一应用有关的数据的逻辑表示。", "options": {"A": "内模式", "B": "概念模式", "C": "外模式", "D": "物理模式"}, "answer": "C", "analysis": "数据库三级模式：外模式（用户视图，各用户看到的局部数据）、概念模式（整体逻辑结构）、内模式（物理存储结构）。外模式描述用户看到的数据视图，是与具体应用相关的逻辑结构，支持数据独立性。"}, {"id": "real-2023年下半年-020", "index": 1487, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 20, "sourceType": "real", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "下列属于软件架构静态分析方法的是（ ）。", "options": {"A": "SASAM", "B": "ATAM", "C": "SAAM", "D": "SAABNet"}, "answer": "C", "analysis": "SAAM（Software Architecture Analysis Method，软件架构分析方法）是一种静态架构评估方法，通过场景分析来评估架构的质量属性。ATAM（架构权衡分析方法）是动态分析方法。SAAM是最早、最知名的静态架构评估方法之一。"}, {"id": "real-2023年下半年-021", "index": 1488, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 21, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "关于可靠性计算，如果 MTTR 很小，下列说法正确的是（ ）（第1空）；可靠性相关的软件质量属性包括哪些（ ）（第2空）。（第1空）", "options": {"A": "MTTF << MTBF", "B": "MTTF = MTBF", "C": "MTTF ≈ MTBF", "D": "MTTF >> MTBF"}, "answer": "C", "analysis": "MTBF = MTTF + MTTR。当 MTTR（平均修复时间）很小时，MTBF ≈ MTTF（平均无故障时间）。因此 MTTF ≈ MTBF 是正确的。可用性 A = MTTF / (MTTF + MTTR)，MTTR→0 时 A→1。"}, {"id": "real-2023年下半年-022", "index": 1489, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 22, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "关于可靠性计算，如果 MTTR 很小，下列说法正确的是（ ）（第1空）；可靠性相关的软件质量属性包括哪些（ ）（第2空）。（第2空）", "options": {"A": "可用性和健壮性", "B": "安全性和健壮性", "C": "容错性和健壮性", "D": "可用性和可修复性"}, "answer": "C", "analysis": "与可靠性相关的软件质量属性主要包括：容错性（系统在出现故障时维持正常运行的能力）和健壮性（系统在异常条件下仍能正常运行的能力）。可用性虽然与可靠性相关，但容错性和健壮性更直接属于可靠性的子属性。"}, {"id": "real-2023年下半年-023", "index": 1490, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 23, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "下列属于非对称加密算法的是（ ）。", "options": {"A": "AES", "B": "DES", "C": "RSA", "D": "3DES"}, "answer": "C", "analysis": "RSA（Rivest-Shamir-Adleman）是最著名的非对称（公钥）加密算法，使用公钥加密、私钥解密（或私钥签名、公钥验证）。AES、DES、3DES 均为对称加密算法（加解密使用同一密钥）。"}, {"id": "real-2023年下半年-024", "index": 1491, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 24, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "软件系统质量属性可以将分为开发期质量属性和运行期质量属性。其中（ ）（第1空）属于运行期质量属性，（ ）（第2空）属于开发期质量属性。（第1空）", "options": {"A": "可重用性", "B": "性能", "C": "可扩展性", "D": "可维护性"}, "answer": "B", "analysis": "运行期质量属性（系统运行时可观测）：性能、可用性、安全性、可伸缩性、互操作性、可靠性等。开发期质量属性（开发过程可观测）：可维护性、可扩展性、可重用性、可测试性、可移植性等。性能在运行时体现。"}, {"id": "real-2023年下半年-025", "index": 1492, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 25, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "软件系统质量属性可以将分为开发期质量属性和运行期质量属性。其中（ ）（第1空）属于运行期质量属性，（ ）（第2空）属于开发期质量属性。（第2空）", "options": {"A": "安全性", "B": "可伸缩性", "C": "互操作性", "D": "可移植性"}, "answer": "D", "analysis": "可移植性是开发期质量属性，指系统能够在不同环境/平台下运行的能力，在开发阶段设计和实现。安全性、可伸缩性、互操作性通常归为运行期质量属性（系统运行时才能体现）。"}, {"id": "real-2023年下半年-026", "index": 1493, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 26, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "操作系统内核，通常包括的功能有（ ）。", "options": {"A": "进程管理、文件系统管理、设备驱动管理、内存管理", "B": "进程管理、文件系统管理、网络管理、安全管理", "C": "文件管理、设备管理、内存管理、用户管理", "D": "进程管理、内存管理、网络管理、文件管理"}, "answer": "A", "analysis": "操作系统内核（Kernel）的核心功能包括：进程管理（调度、同步）、内存管理（分配、虚存）、文件系统管理（I/O抽象）、设备驱动管理（硬件访问）。这四项是所有操作系统内核的基本功能。"}, {"id": "real-2023年下半年-027", "index": 1494, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 27, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "信息系统架构风格是描述某一特定应用领域中系统组织方式的惯用模式。架构风格定义了一个系统家族，即一个架构定义（ ）。", "options": {"A": "一组设计原则", "B": "一组模式", "C": "一个词汇表和一组约束", "D": "一组最佳实践"}, "answer": "C", "analysis": "软件架构风格（Architecture Style）的经典定义来自 Mary Shaw 和 David Garlan，架构风格定义了一个词汇表（一组构件和连接件的类型）和一组约束（规定系统如何组合这些构件和连接件），这两者共同定义了一类系统家族。"}, {"id": "real-2023年下半年-028", "index": 1495, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 28, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在业务流程分析中，（ ）是一种从流程的角度出发描述和分析复杂系统的模型工具，适用于多种系统的图形化、数学化建模工具。", "options": {"A": "DEMO", "B": "Petri网", "C": "BPM", "D": "IDEF"}, "answer": "B", "analysis": "Petri网（Petri Net）是由德国计算机科学家Carl Adam Petri提出的用于描述和分析并发、并行系统的数学模型工具，适用于业务流程、工作流、通信协议等复杂系统的图形化和数学化建模。"}, {"id": "real-2023年下半年-029", "index": 1496, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 29, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "软件工程过程是指为获得软件产品，在软件工具的支持下由软件工程师完成的一系列软件工程活动，包括以下4个方面（ ）。", "options": {"A": "计划、设计、编码、测试", "B": "计划、执行、检查和处理", "C": "规格说明、开发（设计和实现）、确认、演化", "D": "计划、设计、执行、检查"}, "answer": "C", "analysis": "软件工程过程（IEEE标准）包括4个基本活动：软件规格说明（需求和约束）、软件开发（设计和实现）、软件确认（验证/测试）、软件演化（维护）。选项B是PDCA循环，不是软件工程过程。"}, {"id": "real-2023年下半年-030", "index": 1497, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 30, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "操作系统中，（ ）是资源分配和管理的最小单位。", "options": {"A": "进程", "B": "线程", "C": "作业", "D": "程序段"}, "answer": "A", "analysis": "进程（Process）是操作系统进行资源分配和调度的基本单位，每个进程有独立的地址空间、文件句柄、资源等。线程是CPU调度的最小单位，但共享进程的资源，不独立拥有资源。"}, {"id": "real-2023年下半年-031", "index": 1498, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 31, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "（ ）设计规定软件设计人员应为软件组件定义正式、精确和可验证的接口规范，该规范应使用前提条件、后置条件和不变式来扩展抽象数据类型的普通定义。", "options": {"A": "契约式", "B": "面向对象", "C": "结构化", "D": "原型"}, "answer": "A", "analysis": "契约式设计（Design by Contract，DbC）由 Bertrand Meyer 提出，要求为软件组件定义正式接口规范，使用前置条件（precondition）、后置条件（postcondition）和不变式（invariant）三种断言来描述接口契约，确保组件正确交互。"}, {"id": "real-2023年下半年-032", "index": 1499, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 32, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "M2M涉及若干重要的技术部分，分别是（ ）（第1空），其中（ ）（第2空）对获得的数据进行加工分析，提供决策依据。（第1空）", "options": {"A": "智能化机器、M2M硬件、通信网络、中间件、应用", "B": "智能化设备、M2M软件、网络、云平台", "C": "传感器、执行器、网络设备、中央处理系统", "D": "终端设备、网络、中心管理系统、数据库"}, "answer": "A", "analysis": "M2M（Machine to Machine）系统由五个关键部分组成：智能化机器（末端采集设备）、M2M硬件（模块/终端）、通信网络（传输层）、中间件（数据处理平台）和应用（最终用户界面/决策系统）。"}, {"id": "real-2023年下半年-033", "index": 1500, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 33, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "M2M涉及若干重要的技术部分，分别是（ ）（第1空），其中（ ）（第2空）对获得的数据进行加工分析，提供决策依据。（第2空）", "options": {"A": "智能化机器", "B": "网络设备", "C": "中间件", "D": "应用"}, "answer": "D", "analysis": "在M2M系统中，\"应用\"层对获得的数据进行加工分析，提供决策依据。中间件负责数据的中转和处理，但决策支持（为用户提供决策依据）属于应用层的职责。"}, {"id": "real-2023年下半年-034", "index": 1501, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 34, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "ATAM 方法采用效用树（Utility Tree）这一工具对质量属性进行分类和优先级排序。效用树的结构是（ ）。", "options": {"A": "树根→质量属性场景→属性分类→质量属性", "B": "树根→属性分类→质量属性→质量属性场景", "C": "树根→质量属性→属性分类→质量属性场景", "D": "树根→质量属性场景→质量属性→属性分类"}, "answer": "C", "analysis": "ATAM效用树结构为：树根（效用/utility）→质量属性（如性能、安全性、可用性）→属性分类（质量属性的细化）→质量属性场景（具体可测量的场景）。每个叶节点（场景）用（重要性H/M/L, 难度H/M/L）二维标注优先级。"}, {"id": "real-2023年下半年-035", "index": 1502, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 35, "sourceType": "real", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "关于 DSSA（特定领域软件架构）说法正确的是（ ）。", "options": {"A": "DSSA 适用于所有领域", "B": "不同领域的 DSSA 使用方法完全相同", "C": "由于领域不同，DSSA 使用存在一定差异", "D": "DSSA 主要用于制造业领域"}, "answer": "C", "analysis": "DSSA（Domain-Specific Software Architecture）是针对特定应用领域建立的参考架构，不同领域（航空、金融、嵌入式等）的DSSA因领域特性不同而存在差异，不能通用于所有领域。DSSA的核心价值在于领域特定性。"}, {"id": "real-2023年下半年-036", "index": 1503, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 36, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "根据 DO-178 标准，软件生命周期过程包括（ ）。", "options": {"A": "目标、活动、证据", "B": "指导、目标、活动、证据", "C": "规划、开发、确认、监控", "D": "需求、设计、代码、测试"}, "answer": "B", "analysis": "DO-178（机载系统和设备合格审定中的软件考虑）标准定义软件生命周期过程包含四个要素：指导（Guidelines）、目标（Objectives）、活动（Activities）、证据（Evidence）。这四个要素共同构成了每个过程的定义框架。"}, {"id": "real-2023年下半年-037", "index": 1504, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 37, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "CDN 和反向代理的基本原理都是（ ）。", "options": {"A": "缓存", "B": "负载均衡", "C": "路由转发", "D": "NAT转换"}, "answer": "A", "analysis": "CDN（内容分发网络）和反向代理的核心原理都是缓存（Cache）：将内容缓存在靠近用户的节点，减少对源服务器的访问，提高响应速度，降低带宽消耗。这是两种技术的共同基础原理。"}, {"id": "real-2023年下半年-038", "index": 1505, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 38, "sourceType": "real", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "下列（ ）不属于专利许可的类型。", "options": {"A": "独占许可", "B": "排他实施许可", "C": "普通实施许可", "D": "特殊许可"}, "answer": "D", "analysis": "专利许可的法定类型包括：独占实施许可（被许可方独占，许可方自己也不能实施）、排他实施许可（被许可方和许可方可实施，但不能再许可他人）、普通实施许可（可以许可多个被许可方）。\"特殊许可\"不是法定的专利许可类型。"}, {"id": "real-2023年下半年-039", "index": 1506, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 39, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "关于局域网的说法，错误的是（ ）。", "options": {"A": "性能稳定、框架简易", "B": "覆盖范围小", "C": "拓扑结构种类多样", "D": "非封闭性网"}, "answer": "D", "analysis": "局域网（LAN）的主要特点：覆盖范围小（通常在1km以内）、传输速率高、误码率低、拓扑结构多样（总线型、星型、环型等）、是封闭性网络（有明确边界）。\"非封闭性网\"是错误描述，局域网恰恰是封闭性网络。"}, {"id": "real-2023年下半年-040", "index": 1507, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 40, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "如果服务器的功能较弱而工作站的功能较强，则称为（ ）架构模式。", "options": {"A": "胖客户端/胖服务器", "B": "瘦客户端/瘦服务器", "C": "胖客户端/瘦服务器", "D": "瘦客户端/胖服务器"}, "answer": "C", "analysis": "客户端/服务器架构模式中：胖客户端=功能较强的工作站（承担更多业务逻辑），瘦服务器=功能较弱的服务器（主要提供数据存储）。题目描述的\"服务器功能较弱、工作站功能较强\"对应胖客户端/瘦服务器模式。"}, {"id": "real-2023年下半年-041", "index": 1508, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 41, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在ABSD（基于架构的软件开发）方法中，顶层被分解为（ ）（第1空），ABSD 体系结构需求一般来自3个方面，分别是系统的质量目标、系统的商业目标和（ ）（第2空）。（第1空）", "options": {"A": "功能子系统", "B": "概念子系统", "C": "层次子系统", "D": "逻辑子系统"}, "answer": "B", "analysis": "ABSD方法中，体系结构最顶层被分解为概念子系统（Conceptual Subsystem），体现了整体架构的高层抽象。概念子系统是对系统主要功能块的高层划分，体现系统的整体结构和主要功能区域。"}, {"id": "real-2023年下半年-042", "index": 1509, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 42, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在ABSD（基于架构的软件开发）方法中，顶层被分解为（ ）（第1空），ABSD 体系结构需求一般来自3个方面，分别是系统的质量目标、系统的商业目标和（ ）（第2空）。（第2空）", "options": {"A": "用户需求", "B": "系统需求", "C": "开发人员的商业目标", "D": "现有的遗留系统"}, "answer": "C", "analysis": "ABSD体系结构需求来自3个方面：系统的质量目标（非功能需求）、系统的商业目标（业务驱动）、开发人员的商业目标（技术选型偏好、团队能力等）。这三个维度共同驱动架构决策。"}, {"id": "real-2023年下半年-043", "index": 1510, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 43, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "（ ）不适合采用自动化测试。", "options": {"A": "对人机交互无要求的系统", "B": "Web 应用系统", "C": "需求频繁变化的系统", "D": "实时嵌入式系统"}, "answer": "C", "analysis": "自动化测试适用于：需求稳定、重复执行的测试场景（回归测试、性能测试）。需求频繁变化的系统不适合自动化测试，因为每次需求变更都需要重写大量测试脚本，维护成本极高，投入产出比低。"}, {"id": "real-2023年下半年-044", "index": 1511, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 44, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "嵌入式系统设计中要考虑的因素有（ ）。", "options": {"A": "可升级、可配置、易于操作、接口规范、重量、功耗、成本、开发周期", "B": "实时性、容错性、安全性、可靠性、功耗、成本", "C": "可移植性、可维护性、易用性、健壮性、成本、时间", "D": "功能性、性能、可靠性、安全性、成本、时间"}, "answer": "A", "analysis": "嵌入式系统设计需要综合考虑：软件方面（可升级、可配置、接口规范）、用户体验（易于操作）、硬件约束（重量、功耗、成本）、项目管理（开发周期）。选项A涵盖了嵌入式系统特有的全面考虑因素。"}, {"id": "real-2023年下半年-045", "index": 1512, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 45, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "关于 NPU（神经网络处理器）的说法，正确的是（ ）。", "options": {"A": "计算能力强，但能耗高", "B": "计算速度快，性能好", "C": "应用广泛，但成本高", "D": "设计复杂，性能一般"}, "answer": "B", "analysis": "NPU（Neural Processing Unit）是专门为深度学习/神经网络计算优化的处理器，特点是计算速度快、能效比高（相比CPU/GPU），擅长矩阵运算和并行计算。NPU的设计目标是高性能+低功耗，非\"能耗高\"。"}, {"id": "real-2023年下半年-046", "index": 1513, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 46, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "质量属性场景由刺激源、刺激、（ ）（第1空）、制品、响应和响应度量六部分组成。性能质量属性场景可以通过效率、响应时间、（ ）（第2空）、负载来客观评价性能的好坏。（第1空）", "options": {"A": "源头", "B": "环境", "C": "响应", "D": "度量"}, "answer": "B", "analysis": "质量属性场景六要素：刺激源（Stimulus Source）、刺激（Stimulus）、环境（Environment，刺激发生时的系统状态）、制品（Artifact，系统中被刺激的部分）、响应（Response）、响应度量（Response Measure）。第3个要素是\"环境\"。"}, {"id": "real-2023年下半年-047", "index": 1514, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 47, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "质量属性场景由刺激源、刺激、（ ）（第1空）、制品、响应和响应度量六部分组成。性能质量属性场景可以通过效率、响应时间、（ ）（第2空）、负载来客观评价性能的好坏。（第2空）", "options": {"A": "带宽", "B": "吞吐量", "C": "最大延迟时间", "D": "CPU利用率"}, "answer": "B", "analysis": "性能质量属性场景的度量指标主要包括：效率（Efficiency）、响应时间（Response Time）、吞吐量（Throughput）、负载（Load）。吞吐量是单位时间内处理的请求数，是衡量系统性能的核心指标之一。"}, {"id": "real-2023年下半年-048", "index": 1515, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 48, "sourceType": "real", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "在SAAM（软件架构分析方法）中，主要的输入文档包括问题描述、（ ）和架构描述文档。", "options": {"A": "需求说明", "B": "测试报告", "C": "设计文档", "D": "开发文档"}, "answer": "A", "analysis": "SAAM（Software Architecture Analysis Method）的三类主要输入：问题描述（Problem Description，描述系统背景和目标）、需求说明（Requirements Statement，明确系统需求）、架构描述文档（Architecture Description，待评估的架构方案）。"}, {"id": "real-2023年下半年-049", "index": 1516, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 49, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "ABSD 模型把整个基于体系结构的软件过程划分为体系结构需求、设计、文档化、复审、实现和（ ）6个子过程。", "options": {"A": "测试", "B": "部署", "C": "演化", "D": "运维"}, "answer": "C", "analysis": "ABSD（Architecture-Based Software Development）模型6个子过程：①体系结构需求、②体系结构设计、③体系结构文档化、④体系结构复审、⑤体系结构实现、⑥体系结构演化（维护/演进）。演化是ABSD的最后阶段，支持架构的持续演进。"}, {"id": "real-2023年下半年-050", "index": 1517, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 50, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在 DSSA 中，领域分析阶段获得的主要成果是（ ）（第1空），在领域设计阶段获得的是（ ）（第2空）。（第1空）", "options": {"A": "领域概念模型", "B": "领域对象模型", "C": "领域模型", "D": "系统上下文模型"}, "answer": "C", "analysis": "DSSA三个阶段产出：领域分析→领域模型（Domain Model，描述领域内共同需求和特征）；领域设计→特定领域软件架构（DSSA参考架构）；领域实现→可重用的构件库。领域分析的核心产出是领域模型。"}, {"id": "real-2023年下半年-051", "index": 1518, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 51, "sourceType": "real", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "在 DSSA 中，领域分析阶段获得的主要成果是（ ）（第1空），在领域设计阶段获得的是（ ）（第2空）。（第2空）", "options": {"A": "领域专用语言", "B": "参考架构", "C": "特定领域软件架构", "D": "构件规格说明"}, "answer": "C", "analysis": "DSSA领域设计阶段的主要产出是特定领域软件架构（Domain-Specific Software Architecture），即针对该领域的参考架构/标准架构，是领域内应用系统的架构蓝图，可被多个具体系统复用。"}, {"id": "real-2023年下半年-052", "index": 1519, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 52, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在比较批处理和管道风格时，下列说法错误的是（ ）。", "options": {"A": "批处理风格每个处理步骤是一个单独的程序", "B": "管道过滤器风格把系统分解为几个处理步骤，这些步骤之间通过数据流连接", "C": "管道过滤风格和批处理风格都不支持并行执行", "D": "批处理风格每一步必须在前一步结束后才能开始"}, "answer": "C", "analysis": "管道过滤器风格支持并行执行——多个过滤器可以同时处理各自接收的数据，实现流水线并行。批处理风格确实是顺序执行（每步等待前步完成），但说\"两者都不支持并行\"是错误的，因为管道支持并行。"}, {"id": "real-2023年下半年-053", "index": 1520, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 53, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在构件组装过程中，一个构件直接调用由另一个构件所提供的服务，被调用的构件为调用的构件提供所需的服务。这种组装方式称为（ ）。", "options": {"A": "顺序组装", "B": "层次组装", "C": "叠加组装", "D": "点对点组装"}, "answer": "B", "analysis": "构件组装方式分为：顺序组装（顺序调用）、层次组装（一个构件调用另一个构件的服务，形成层次调用关系，也称为\"使用组装\"）、叠加组装（通过包装/扩展现有构件）。题目描述的直接调用服务是层次组装（分层调用）。"}, {"id": "real-2023年下半年-054", "index": 1521, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 54, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "配置项控制即对配置项和基线的变更控制，下列变更管理顺序正确的是（ ）。", "options": {"A": "提出变更申请→进行风险评估→进行变更批准→开展变更实施→变更验证→存档", "B": "进行风险评估→提出变更申请→进行变更批准→开展变更实施→变更验证→存档", "C": "提出变更申请→进行变更批准→进行风险评估→开展变更实施→变更验证→存档", "D": "进行变更批准→提出变更申请→变更验证→开展变更实施→进行风险评估→存档"}, "answer": "A", "analysis": "变更管理标准流程：①提出变更申请→②进行风险评估（评估影响和可行性）→③进行变更批准（CCB审批）→④开展变更实施→⑤变更验证（确认变更效果）→⑥存档（记录变更历史）。先评估风险再批准是关键顺序。"}, {"id": "real-2023年下半年-055", "index": 1522, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 55, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "代码覆盖率是用来衡量（ ）（第1空）对功能代码的测试情况。链接是（ ）（第2空）系统的一个主要特征，它是在页面之间切换和指导用户去一些未知地址页面的主要手段。（第1空）", "options": {"A": "集成测试", "B": "单元测试", "C": "系统测试", "D": "验收测试"}, "answer": "B", "analysis": "代码覆盖率（Code Coverage）是单元测试的核心度量指标，衡量测试用例执行了多少比例的代码（行覆盖、分支覆盖、路径覆盖等）。单元测试在代码级别工作，因此代码覆盖率是其最直接的质量度量。"}, {"id": "real-2023年下半年-056", "index": 1523, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 56, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "代码覆盖率是用来衡量（ ）（第1空）对功能代码的测试情况。链接是（ ）（第2空）系统的一个主要特征，它是在页面之间切换和指导用户去一些未知地址页面的主要手段。（第2空）", "options": {"A": "桌面应用", "B": "Web应用", "C": "移动应用", "D": "嵌入式应用"}, "answer": "B", "analysis": "链接（Hyperlink）是Web应用系统（网站）的核心特征，是HTML的基础机制，用于在页面间导航和跳转。Web应用的测试（链接测试）需要专门验证链接的有效性、正确性，这是Web系统特有的测试项目。"}, {"id": "real-2023年下半年-057", "index": 1524, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 57, "sourceType": "real", "module_code": "new_technology", "module_name": "🚀 前沿新兴技术", "knowledge": "", "stem": "关于区块链，不包含（ ）。", "options": {"A": "私有链", "B": "公有链", "C": "行业链", "D": "联盟链"}, "answer": "C", "analysis": "区块链按准入机制分为三类：公有链（Public Blockchain，完全开放，如比特币/以太坊）、私有链（Private Blockchain，权限控制，仅内部使用）、联盟链（Consortium Blockchain，多机构联合，半开放）。\"行业链\"不是区块链的标准分类。"}, {"id": "real-2023年下半年-058", "index": 1525, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 58, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "关于构件的说法，错误的是（ ）。", "options": {"A": "构件是可复用的", "B": "构件具有外部可见状态", "C": "构件通过接口相互交互", "D": "构件是独立可部署的"}, "answer": "B", "analysis": "构件（Component）的关键特性：可复用性、独立性（可独立部署）、通过明确定义的接口交互、封装内部实现细节。构件没有外部可见状态——构件的内部状态对外不可见，只通过接口暴露功能，外部无法直接访问其内部状态。"}, {"id": "real-2023年下半年-059", "index": 1526, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 59, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "构件库应提供的主要功能包括构件的存储、管理、检索以及库的浏览与维护等，以及支持使用者有效地、准确地发现所需的可复用构件。（ ）是指给定几个查询需求，能够快速准确地找到相关构件。", "options": {"A": "构件检索", "B": "构件分类", "C": "构件构造", "D": "构件获取"}, "answer": "A", "analysis": "构件检索（Component Retrieval）是指根据给定的查询需求，在构件库中快速准确地找到匹配的可复用构件的过程。构件库的核心功能之一就是提供高效的检索机制，包括关键字检索、刻面检索、超文本检索等方法。"}, {"id": "real-2023年下半年-060", "index": 1527, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 60, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "（ ）（第1空）进行了包装或使用了接口技术，把不兼容性、资源冲突等进行了处理，可以直接使用，这种构件可以不加修改地使用在各种环境中。（ ）（第2空）在安装时，已经装配在操作系统、数据库管理系统或信息系统不同层次上，使用胶水代码（glue code）就可以进行连接使用。（第1空）", "options": {"A": "独立而成熟的构件", "B": "适应性构件", "C": "装配的构件", "D": "可修改的构件"}, "answer": "B", "analysis": "适应性构件（Adaptive Component）进行了包装或使用接口技术处理了不兼容性和资源冲突，可以直接在各种环境中不加修改地使用。典型例子是ActiveX等。与独立而成熟的构件不同，适应性构件经过了专门的适配处理。"}, {"id": "real-2023年下半年-061", "index": 1528, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 61, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "（ ）（第1空）进行了包装或使用了接口技术，把不兼容性、资源冲突等进行了处理，可以直接使用，这种构件可以不加修改地使用在各种环境中。（ ）（第2空）在安装时，已经装配在操作系统、数据库管理系统或信息系统不同层次上，使用胶水代码（glue code）就可以进行连接使用。（第2空）", "options": {"A": "独立而成熟的构件", "B": "适应性构件", "C": "装配的构件", "D": "可修改的构件"}, "answer": "C", "analysis": "装配的构件（Assembled Component）在安装时已经装配在操作系统、数据库管理系统或信息系统的不同层次上，使用胶水代码（glue code）就可以连接使用。目前大多数软件商提供的软件产品属于此类构件。"}, {"id": "real-2023年下半年-062", "index": 1529, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 62, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "构件管理的内容包括构件描述、（ ）、构件库组织、人员及权限管理、用户意见反馈等。", "options": {"A": "构件分类", "B": "构件部署", "C": "构件交付", "D": "构件测试"}, "answer": "A", "analysis": "构件管理的主要内容包括：构件描述（描述构件功能和属性）、构件分类（按类别组织构件）、构件库组织（库的结构设计）、人员及权限管理（访问控制）、用户意见反馈（改进机制）。构件分类是管理的核心内容之一。"}, {"id": "real-2023年下半年-063", "index": 1530, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 63, "sourceType": "real", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "关于专利的说法，错误的是（ ）。", "options": {"A": "专利必须申请", "B": "专利权利有时间限制", "C": "专利分为发明、实用新型和外观设计", "D": "专利一定是申请人、发明人的"}, "answer": "D", "analysis": "专利权可以通过转让、继承等方式转移，专利权人不一定是发明人——职务发明的专利权属于单位，发明人只享有署名权和奖励权。\"专利一定是申请人、发明人的\"是错误说法。A、B、C均正确。"}, {"id": "real-2023年下半年-064", "index": 1531, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 64, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "对于可组装的构件，所有外部交互必须通过公开定义的接口进行，同时它还必须对自身信息实现外部访问控制。（ ）（第1空）须是自包含的，必须能作为一个独立实体在提供其构件模型实现的构件平台上运行，构件总是二进制形式，无须在部署前编译。（第1空）", "options": {"A": "可组装性", "B": "可部署性", "C": "文档化", "D": "独立性"}, "answer": "A", "analysis": "构件可组装性（Assemblability）要求：所有外部交互必须通过公开定义的接口进行，构件对自身信息的外部访问必须有控制。可组装性是构件能够被集成到更大软件系统的关键特性，确保构件接口的一致性和封装性。"}, {"id": "real-2023年下半年-065", "index": 1532, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 65, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "对于可组装的构件，所有外部交互必须通过公开定义的接口进行，同时它还必须对自身信息实现外部访问控制。（ ）（第1空）须是自包含的，必须能作为一个独立实体在提供其构件模型实现的构件平台上运行，构件总是二进制形式，无须在部署前编译。（第2空）", "options": {"A": "可组装性", "B": "可部署性", "C": "文档化", "D": "独立性"}, "answer": "B", "analysis": "构件可部署性（Deployability）要求：构件必须是自包含的（Self-contained），能作为独立实体在构件平台上运行，构件以二进制形式提供，无须在部署前编译。可部署性是构件独立运行和分发的基础特性。"}, {"id": "real-2023年下半年-066", "index": 1533, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 66, "sourceType": "real", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "关于专利权保护期限，下列说法正确的是（ ）。", "options": {"A": "发明专利保护期为10年，实用新型为15年，外观设计为20年", "B": "发明专利保护期为20年，实用新型为10年，外观设计为15年", "C": "发明专利保护期为15年，实用新型为10年，外观设计为20年", "D": "发明专利保护期为20年，实用新型为10年，外观设计为10年"}, "answer": "B", "analysis": "根据我国《专利法》：发明专利保护期20年，实用新型专利保护期10年，外观设计专利保护期15年（2021年修正案将外观设计从10年延长至15年），均自申请日起计算。"}, {"id": "real-2023年下半年-067", "index": 1534, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 67, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "（ ）是通过描述组件应具备的接口行为来指定代码开发的设计方法。", "options": {"A": "测试驱动开发", "B": "契约式设计", "C": "接口优先设计", "D": "行为驱动开发"}, "answer": "B", "analysis": "契约式设计（Design by Contract）通过前置条件、后置条件和不变式来描述组件接口行为，为软件组件定义正式、精确、可验证的接口规范，是接口开发的核心方法论，确保组件间交互的正确性。"}, {"id": "real-2023年下半年-068", "index": 1535, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 68, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "关于McCabe度量法，下列说法错误的是（ ）。", "options": {"A": "V(G) = e - n + 2（e为边数，n为节点数）", "B": "V(G) = m - n + 1（m为判定节点数）", "C": "McCabe数越大，程序越复杂", "D": "一般情况下，McCabe数应小于10"}, "answer": "B", "analysis": "McCabe圈复杂度的计算公式为 V(G) = e - n + 2（边数减节点数加2）或 V(G) = p + 1（p为判断节点数，也写为 m + 1）。错误的是选项B：V(G) = m - n + 1（不是m减n加1），标准公式是 V(G) = m + 1 或 V(G) = e - n + 2。"}, {"id": "real-2023年下半年-069", "index": 1536, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 69, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "如果需要对软件实施逆向工程，以下说法正确的是（ ）。", "options": {"A": "逆向工程只能从可执行程序中恢复源代码", "B": "逆向工程是指从已有的程序中抽取设计文档的过程", "C": "逆向工程违反著作权法，不能使用", "D": "逆向工程只适用于面向对象程序"}, "answer": "B", "analysis": "逆向工程（Reverse Engineering）是从已有的程序或系统中抽取数据、架构及过程的设计信息的过程，帮助理解已有系统并从中提取设计文档。它不仅限于源代码恢复，也包括架构分析、数据模型恢复等，在合规条件下可合法使用。"}, {"id": "real-2023年下半年-070", "index": 1537, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 70, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于软件测试说法错误的是（ ）。", "options": {"A": "每个测试用例都必须定义预期的输出或结果", "B": "测试用例中不仅要说明合法有效的输入条件，还应该描述那些不期望的、非法的输入条件", "C": "软件测试可以证明被测对象的正确性", "D": "80%的软件错误都可以在大概20%的模块中找到根源"}, "answer": "C", "analysis": "Dijkstra 的著名论断：测试只能证明软件有错，不能证明软件没有错。软件测试无法穷举所有可能的输入，因此不能证明软件的完全正确性，只能发现错误。选项A、B、D均是软件测试的正确原则。"}, {"id": "real-2023年下半年-071", "index": 1538, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 71, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "分层体系结构中，每层为上层提供服务，并作为下层客户。这种架构风格限制了层间的交互，提供了（ ）。", "options": {"A": "some kind of abstraction（某种抽象）", "B": "complete transparency（完全透明）", "C": "direct access（直接访问）", "D": "maximum flexibility（最大灵活性）"}, "answer": "A", "analysis": "分层架构的核心特征是为每一层提供某种抽象（some kind of abstraction），屏蔽下层实现细节，上层只需了解相邻下层的接口，不需要了解底层实现。"}, {"id": "real-2023年下半年-072", "index": 1539, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 72, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在分层架构中，每层的（ ）仅限于紧邻的上下层。", "options": {"A": "visibility（可见性）", "B": "functionality（功能）", "C": "performance（性能）", "D": "security（安全性）"}, "answer": "A", "analysis": "分层架构中，可见性（visibility）原则规定每层只能与紧邻的上下层交互，不允许跨层直接调用（严格分层）或在约束条件下允许跨层（松散分层），层间的可见性/交互范围受到限制。"}, {"id": "real-2023年下半年-073", "index": 1540, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 73, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "分层方法创建了关注点分离，这（ ）层间依赖关系。", "options": {"A": "increases（增加）", "B": "eliminates（消除）", "C": "constrains（约束）", "D": "ignores（忽略）"}, "answer": "C", "analysis": "分层架构通过关注点分离（Separation of Concerns）来约束（constrain）层间的依赖关系，使得各层相对独立。\"约束\"而非\"消除\"——层间仍然存在依赖（接口依赖），但被限制和规范化了。"}, {"id": "real-2023年下半年-074", "index": 1541, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 74, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "分层架构的主要优点是每层提供了（ ），隐藏了下层的复杂性。", "options": {"A": "an interface（一个接口）", "B": "an abstraction（一个抽象）", "C": "a protocol（一个协议）", "D": "a service（一个服务）"}, "answer": "B", "analysis": "分层架构中，每层提供一个抽象（an abstraction），将下层的复杂实现隐藏起来，上层只需要与抽象接口交互而无需了解底层细节。这是分层架构最核心的优势——复杂性管理和信息隐藏。"}, {"id": "real-2023年下半年-075", "index": 1542, "term": "2023年下半年", "paper": "2023年下半年", "questionNo": 75, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "分层架构的（ ）策略使每层可以独立开发和维护。", "options": {"A": "clustering（聚类）", "B": "integration（集成）", "C": "optimization（优化）", "D": "partitioning（分区/分割）"}, "answer": "D", "analysis": "分层架构的分区（partitioning）策略将系统划分为若干独立的层次，每层有明确的职责边界，使得各层可以独立开发、测试和维护，提高了系统的可维护性和可扩展性。这正是分层架构设计的核心策略。"}, {"id": "real-2024年上半年-001", "index": 1543, "term": "2024年上半年", "paper": "2024年上半年", "questionNo": 1, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于软件测试只说法错误的是()。", "options": {"A": "每个测试用例都要规定预期的输出或结果", "B": "测试用例既要描述合理、合法的输入情况，也要描述那些不合理、不合法的输入情况", "C": "软件测试可以证明被测对象的正确性", "D": "大约80%的软件错误可以追溯到约20%的模块"}, "answer": "C", "analysis": "（解析待补充）"}, {"id": "real-2024年上半年-002", "index": 1544, "term": "2024年上半年", "paper": "2024年上半年", "questionNo": 2, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "多道程序设计技术不仅使CPU得到充分利用，同时改善IO设备和内存的()，从而提高了整个系统的资源利用率和系统吞吐量(单时间内处理作业(程序)的个数)，最终提高了整个系统的效率。", "options": {"A": "可靠性", "B": "利用率", "C": "稳定性", "D": "兼容性"}, "answer": "B", "analysis": "（解析待补充）"}, {"id": "real-2024年上半年-003", "index": 1545, "term": "2024年上半年", "paper": "2024年上半年 认性）。"}, {"id": "real-2024年上半年-065", "index": 1607, "term": "2024年上半年", "paper": "2024年上半年", "questionNo": 65, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "数字孪生（Digital Twin）是指充分利用物理模型和物联网传感器采集的全生命周期的运行历史等数据，集成多学科、多物理量、多尺度、多概率的仿真过程，在虚拟空间中完成映射，从而反映相对应的实体的全生命周期过程。关于数字孪生，下列说法中不正确的是（  ）。", "options": {"A": "数字孪生需要在物理实体和虚拟模型之间建立实时连接", "B": "数字孪生可以用于预测性维护和性能优化", "C": "数字孪生的应用已在工业界达成广泛共识", "D": "数字孪生可以完全替代物理实体进行所有测试验证"}, "answer": "D", "analysis": "数字孪生技术虽然能够创建物理实体的虚拟副本，用于模拟、分析和优化，但不能完全替代物理实体进行所有测试验证。某些物理环境下的极端条件、材料疲劳等现象仍需物理实体的实际测试来验证。选项A、B、C的描述均正确，数字孪生的应用价值和应用共识已在工业界广泛建立。"}, {"id": "real-2024年上半年-066", "index": 1608, "term": "2024年上半年", "paper": "2024年上半年", "questionNo": 66, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "嵌入式系统软件体系结构可以分为无操作系统和有操作系统两大类。在有操作系统的嵌入式软件体系结构中，中间件层的主要作用是（  ）。", "options": {"A": "直接控制硬件资源", "B": "屏蔽底层操作系统的差异", "C": "提供用户交互界面", "D": "管理系统内存分配"}, "answer": "B", "analysis": "在嵌入式系统的分层架构中，中间件位于操作系统层和应用层之间，其主要作用是屏蔽底层操作系统的差异，为上层应用提供统一的编程接口和服务。这样应用程序可以不关心底层操作系统的具体实现，提高了软件的可移植性和可重用性。直接控制硬件是驱动层的功能，用户交互界面是应用层的功能，内存管理是操作系统内核的功能。"}, {"id": "real-2024年上半年-067", "index": 1609, "term": "2024年上半年", "paper": "2024年上半年", "questionNo": 67, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "大多数嵌入式系统都具备实时特征，其典型架构可概括为（  ）两种模型。", "options": {"A": "层次化模式架构和代理模式架构", "B": "层次化模式架构和点对点模式架构", "C": "层次化模式架构和递归模式架构", "D": "递归模式架构和点对点模式架构"}, "answer": "C", "analysis": "嵌入式实时系统的典型架构可以概括为两种模型：层次化模式架构（Layered Architecture）和递归模式架构（Recursive Architecture）。层次化模式将系统分为多个层次，每层只与相邻层交互；递归模式则允许在系统的不同抽象层次上重复应用相同的架构模式，适用于需要在不同粒度上处理实时任务的场景。"}, {"id": "real-2024年上半年-069", "index": 1610, "term": "2024年上半年", "paper": "2024年上半年", "questionNo": 69, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "（69）处应填入（  ）。", "options": {"A": "problem space", "B": "solution space", "C": "user interface", "D": "database schema"}, "answer": "B", "analysis": "与问题空间对应的是\"解空间\"（solution space），即实际进行软件设计和实现的领域，将需求转化为可工作的系统。"}, {"id": "real-2024年上半年-070", "index": 1611, "term": "2024年上半年", "paper": "2024年上半年", "questionNo": 70, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "（70）处应填入（  ）。", "options": {"A": "testing", "B": "management", "C": "coding", "D": "deployment"}, "answer": "B", "analysis": "根据上下文\"involves planning, monitoring, and controlling all aspects of the software project\"（涉及规划、监控和控制软件项目的各个方面），描述的是软件\"管理\"（management）的职能。"}, {"id": "real-2024年上半年-071", "index": 1612, "term": "2024年上半年", "paper": "2024年上半年", "questionNo": 71, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "（71）处应填入（  ）。", "options": {"A": "solution", "B": "problem", "C": "feature", "D": "module"}, "answer": "B", "analysis": "根据上下文\"在开发过程中出现……时，必须识别其根本原因并应用适当的技术来解决\"，描述的是\"问题\"（problem）出现时需要排查和解决。"}, {"id": "real-2024年上半年-072", "index": 1613, "term": "2024年上半年", "paper": "2024年上半年", "questionNo": 72, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "（72）处应填入（  ）。", "options": {"A": "language", "B": "tool", "C": "method", "D": "platform"}, "answer": "C", "analysis": "根据上下文\"软件开发……的选择取决于项目的性质、团队的专业能力和利益相关者的具体需求\"，描述的是软件开发\"方法\"（method）的选择，如敏捷方法、瀑布模型等。"}, {"id": "real-2024年上半年-074", "index": 1614, "term": "2024年上半年", "paper": "2024年上半年", "questionNo": 74, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "（74）处应填入（  ）。", "options": {"A": "decisions", "B": "patterns", "C": "requirements", "D": "metrics"}, "answer": "B", "analysis": "根据下文\"are general, reusable solutions to commonly occurring problems\"（是通用的、可重用的解决常见问题的方案），描述的是架构\"模式\"（patterns）。架构模式是在特定上下文中针对常见问题的通用可重用解决方案。"}, {"id": "real-2024年上半年-075", "index": 1615, "term": "2024年上半年", "paper": "2024年上半年", "questionNo": 75, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "（75）处应填入（  ）。", "options": {"A": "abstraction", "B": "complexity", "C": "performance", "D": "security"}, "answer": "A", "analysis": "架构模式与设计模式相比，工作在更高的\"抽象\"（abstraction）层次上，关注的是系统的整体布局。设计模式关注的是较低层次的类和对象间的交互，而架构模式关注的是子系统和组件级别的整体结构。"}, {"id": "real-2024年下半年-001", "index": 1616, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 1, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "安全性可划分为多种特性。其中，（ ）保证信息不泄露给未授权的用户、实体或过程；（ ）保证信息的完整和准确，防止信息被非法修改。\n\n选项（第一空）:", "options": {"A": "可控性", "B": "不可否认性", "C": "机密性", "D": "完整性"}, "answer": "B", "analysis": "安全性(security)是指系统在向合法用户提供服务的同时能够阻止非授权用户使用的企图或拒绝服务的能力。安全性又可划分为机密性、完整性、不可否认性及可控性等特性。\n\n- 机密性保证信息不泄露给未授权的用户、实体或过程；\n- 完整性保证信息的完整和准确，防止信息被非法修改；\n- 不可否认性是指防止发送方否认发送过信息；\n- 可控性保证对信息的传播及内容具有控制的能力，防止为非法者所用。"}, {"id": "real-2024年下半年-002", "index": 1617, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 2, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在0到1000之间有（ ）个整数恰好有一位数字是5。", "options": {"A": "242", "B": "243", "C": "225", "D": "224"}, "answer": "B", "analysis": "百位为5，十位和个位除了5以外各有[012346789]这9种数码，共有9×9=81种编码。十位为5，百位和个位除了5以外各有9种数码，共81种（百位为0时即为两位数）。个位为5，百位和十位除了5以外各有9种数码，共81种（百位和十位同时为0即为一位数）。共81×3=243个，答案选B。"}, {"id": "real-2024年下半年-003", "index": 1618, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 3, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "数据安全治理的目标主要包括（ ）三个方面。数据安全治理体系是组织达成数据安全治理目标必须具备的能力框架，其中数据分类分级属于该体系中的（ ）。\n\n选项（第一空）:", "options": {"A": "信息全生命周期安全层", "B": "访问权限控制层", "C": "数据安全战略层", "D": "基础安全层"}, "answer": "D", "analysis": "数据安全治理的目标主要有三个：满足合规要求、管理数据安全风险、促进数据开发利用。这些目标旨在确保数据安全与业务发展的双向促进，同时保障组织在数据安全方面的合规性。数据分类分级属于基础安全层。"}, {"id": "real-2024年下半年-004", "index": 1619, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 4, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在仓库体系结构风格中，（ ）用于说明当前数据的状态。", "options": {"A": "黑板", "B": "中央数据结构", "C": "独立构件", "D": "知识源"}, "answer": "B", "analysis": "仓库（Repository）是存储和维护内容的中心场所。在仓库风格中，有两种不同的构件：中央数据结构说明当前数据的状态，以及一组对中央数据进行操作的独立构件。仓库与独立构件间的相互作用在系统中会有大的变化。这种风格的连接件即为仓库与独立构件之间的交互。"}, {"id": "real-2024年下半年-005", "index": 1620, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 5, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "下列选项中不能作为预防死锁措施的（ ）。", "options": {"A": "破坏\"循环等待\"条件", "B": "破坏\"不可抢占\"条件", "C": "破坏\"互斥\"条件", "D": "破坏\"请求和保持\"条件"}, "answer": "C", "analysis": "死锁产生的4个必要条件：互斥、请求和保持、不可抢占、循环等待。由于互斥条件是非共享资源所必须的，不仅不能改变，还应加以保证，所以主要是破坏产生死锁的其他三个条件（请求和保持、不可抢占、循环等待）。破坏互斥条件不能作为预防死锁措施。"}, {"id": "real-2024年下半年-006", "index": 1621, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 6, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "（ ）是在传输层定义的协议。", "options": {"A": "NFS和Telnet", "B": "TCP和UDP", "C": "FTP和SMTP", "D": "IP和ICMP"}, "answer": "B", "analysis": "NFS、Telnet、FTP和SMTP属于应用层协议。IP和ICMP属于网络层协议。TCP和UDP属于传输层协议，正确答案为B。"}, {"id": "real-2024年下半年-007", "index": 1622, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 7, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "当一个进程被一个更高优先级的进程抢占或其时间片用完时，其状态会从执行态转变为（ ）。", "options": {"A": "阻塞态", "B": "就绪态", "C": "睡眠态", "D": "挂起态"}, "answer": "B", "analysis": "三种基本状态转换：\n- 执行→就绪：处于执行状态的任务在其执行过程中，因分配给它的一个时间片已用完而不得不让出处理机，于是任务从执行状态转变成就绪状态。\n- 执行→阻塞：正在执行的任务因等待某种事件发生而无法继续执行时，便从执行状态变成阻塞状态。\n\n因此，时间片用完或被抢占时，转变为就绪态。"}, {"id": "real-2024年下半年-008", "index": 1623, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 8, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "（ ）不属于环境易用性关心的方面。", "options": {"A": "对系统使用过程的满意程度", "B": "系统的学习曲线", "C": "环境修复能力", "D": "完成执行的效率"}, "answer": "C", "analysis": "易用性质量属性场景关注用户在使用系统时的容易程度，包括：1. 系统的学习曲线、2. 完成操作的效率、3. 对系统使用过程的满意程度。\"环境修复能力\"不属于易用性关心的方面，答案选C。"}, {"id": "real-2024年下半年-009", "index": 1624, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 9, "sourceType": "real", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "执行本单位的任务所做完的职务发明创造，包括退休、调离原单位后或者劳动、人事关系终止后（ ）内作出的，与其在原单位承担的本职工作或者原单位分配的任务有关的发明创造。", "options": {"A": "3个月", "B": "1年", "C": "6个月", "D": "18个月"}, "answer": "B", "analysis": "《中华人民共和国专利法实施细则》规定，退休、调离原单位后或者劳动、人事关系终止后1年内作出的，与其在原单位承担的本职工作或者原单位分配的任务有关的发明创造，属于职务发明创造。"}, {"id": "real-2024年下半年-010", "index": 1625, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 10, "sourceType": "real", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "一项外观设计专利里面相似设计最多有（ ）个。", "options": {"A": "10", "B": "6", "C": "8", "D": "5"}, "answer": "A", "analysis": "一件外观设计专利申请中的相似外观设计不得超过10项。根据《中华人民共和国专利法》及《专利审查指南》，同一产品两项以上的相似外观设计可以作为一件申请提出，但数量上限为10项。"}, {"id": "real-2024年下半年-011", "index": 1626, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 11, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "质量属性场景是一种面向特定质量属性的需求。它由6部分组成，其中，（ ）用于描述在激励到达后所采取的行动；（ ）不属于可用性质量属性场景中的响应度量方式。\n\n选项（第一空）:", "options": {"A": "系统可用时间", "B": "故障间隔时间", "C": "系统可用时间间隔", "D": "数据延迟时间"}, "answer": "A", "analysis": "质量属性场景由6部分组成：刺激源、刺激、环境、制品、响应（激励到达后所采取的行动）、响应度量。可用性质量属性场景的响应度量方式有：1. 可用的时间间隔、2. 可用时间、3. 系统许可在降级模式下运行的时间间隔、4. 故障修复时间。\"数据延迟时间\"不属于可用性响应度量，选D。"}, {"id": "real-2024年下半年-012", "index": 1627, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 12, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "数据库中有一张人员信息表包含性别属性，要求这个属性的值只能是男或者女，这属于（ ）。", "options": {"A": "关系完整性", "B": "用户定义完整性", "C": "参照完整性", "D": "实体完整性"}, "answer": "B", "analysis": "关系的完整性约束共分为3类：实体完整性、参照完整性和用户定义完整性。用户定义完整性（User Defined Integrity）针对某一具体关系数据库的约束条件，反映某一具体应用所涉及的内容必须满足的语义要求。\"性别只能为男或女\"是根据实际应用需求自定义的约束，属于用户定义完整性。"}, {"id": "real-2024年下半年-013", "index": 1628, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 13, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在多道批处理系统中有P1和P2两个作业，执行顺序如下，P1（计算40ms，I/O操作60ms，计算20ms），P2（计算100ms，I/O操作40ms，计算40ms），P2比P1晚20ms到达，在不考虑调度和切换时间的情况下做完两道作业最少需要（ ）时间。", "options": {"A": "240ms", "B": "200ms", "C": "260ms", "D": "220ms"}, "answer": "D", "analysis": "多道批处理允许CPU与I/O设备并行工作。P1在t=0开始，t=40时进行I/O，此时P2到达并开始计算；P1的I/O完成后继续计算。通过合理安排并行执行，最短完成时间为220ms。"}, {"id": "real-2024年下半年-014", "index": 1629, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 14, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "RUP是（ ）的、以体系结构为中心的、迭代和增量的软件开发过程。", "options": {"A": "测试驱动", "B": "领域驱动", "C": "数据驱动", "D": "用例驱动"}, "answer": "D", "analysis": "RUP（Rational Unified Process）是用例驱动的、以体系结构为中心的、迭代和增量的软件开发过程。用例驱动意味着RUP中的需求分析、设计、实现和测试等活动都是围绕用例展开的。"}, {"id": "real-2024年下半年-015", "index": 1630, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 15, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "下面关于SQL注入的说法错误的是（ ）。", "options": {"A": "使用ORM框架可能自动处理查询和参数化输入，但无法减少SQL注入的风险", "B": "SQL注入是一种常见的攻击方式", "C": "使用预处理语句和参数化查询是防范SQL注入的有效途径", "D": "通过使用UNION关键字，攻击者可以将多个查询结果合并，从而获取数据库中的敏感信息"}, "answer": "A", "analysis": "使用ORM框架可以减少直接编写SQL语句的需求，从而降低SQL注入的风险，而非无法减少。ORM（Object-Relation Mapping）在关系型数据库和对象之间作映射，通常会对输入进行参数化处理，有效防止SQL注入。A选项说法错误。"}, {"id": "real-2024年下半年-016", "index": 1631, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 16, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于SOAP协议说法错误的是（ ）。", "options": {"A": "SOAP RPC表示远程过程调用和应答的协定", "B": "封装和编码规则被定义在相同的XML命名空间中，这样
