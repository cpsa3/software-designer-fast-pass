使得定义更加简单", "C": "SOAP封装定义了一个框架，描述消息中的内容是什么，谁发送的，谁应当接受并处理它们，以及如何处理它们", "D": "SOAP绑定定义了SOAP运用哪种协议交换信息"}, "answer": "B", "analysis": "SOAP封装和编码规则是被定义在不同的XML命名空间（Namespace）中，而非相同的命名空间，这样使得定义更加简单。B选项说法错误。SOAP包含4个部分：SOAP封装、SOAP编码规则、SOAP RPC表示和SOAP绑定，它们在功能上彼此独立。"}, {"id": "real-2024年下半年-017", "index": 1632, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 17, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在体系结构描述中，典型的4+1视图模型包括（ ）。", "options": {"A": "逻辑视图、进程视图、开发视图、物理视图和场景", "B": "逻辑视图、进程视图、制作视图、部署视图和场景", "C": "逻辑视图、进程视图、开发视图、物理视图和类视图", "D": "逻辑视图、进程视图、编写视图、物理视图和部署视图"}, "answer": "A", "analysis": "典型的4+1模型包括：逻辑视图、进程视图、开发视图、物理视图，加上统一的场景（+1）。其中\"开发视图\"也称为实现视图。"}, {"id": "real-2024年下半年-018", "index": 1633, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 18, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "路由器工作在OSI体系结构中的（ ）层。", "options": {"A": "网络", "B": "传输", "C": "数据链路", "D": "物理"}, "answer": "A", "analysis": "路由器工作在OSI体系结构中的网络层，它在多个网络上交换和路由数据包。路由器通过在相互独立网络中交换路由信息以生成路由表，达到数据包的路径选择。"}, {"id": "real-2024年下半年-019", "index": 1634, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 19, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在软件架构评估中，（ ）方法采用效用树这一工具来对质量属性进行分类和优先级排序。效用树的结构包括：（ ）。\n\n选项（第一空）:", "options": {"A": "树根——质量属性——属性分类——质量属性场景（叶子节点）", "B": "树根——属性分类——属性描述——质量属性场景（叶子节点）", "C": "树根——质量属性——属性描述——质量属性场景（叶子节点）", "D": "树根——效果需求——需求描述——质量属性场景（叶子节点）"}, "answer": "B", "analysis": "ATAM（架构权衡分析法）采用效用树工具来对质量属性进行分类和优先级排序。效用树的结构为：树根——质量属性——属性分类——质量属性场景（叶子节点）。ATAM主要关注性能、安全性、可修改性和可用性4类质量属性。"}, {"id": "real-2024年下半年-020", "index": 1635, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 20, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "有100人，其中会打篮球的有45人，会打乒乓球的有53人，会踢足球的有55人，既会打篮球也会打乒乓球的有28人，既会打篮球也会踢足球的有32人，既会打乒乓球也会踢足球的有35人，三种球都会的有20人，那么三种球都不会的有（ ）人。", "options": {"A": "22", "B": "23", "C": "21", "D": "20"}, "answer": "A", "analysis": "根据容斥原理：|A∪B∪C| = |A|+|B|+|C| - |A∩B| - |A∩C| - |B∩C| + |A∩B∩C| = 45+53+55-28-32-35+20 = 78。三种球都不会的人数 = 100 - 78 = 22人。"}, {"id": "real-2024年下半年-021", "index": 1636, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 21, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "某项目包括A、B、C、D四道工序，各道工序之间的衔接关系、正常进度下各工序所需的时间和直接费用、赶工进度下所需的时间和直接费用如下表所示。该项目每天必须的间接费用为2万元。根据此表，以最短时间完成该项目需要的成本最少为（ ）万元。", "options": {"A": "140", "B": "150", "C": "145", "D": "132"}, "answer": "D", "analysis": "关键路径为ACD，工期11天。分别计算各工序赶工1天的费用：A为5万，B为7.5万，C为15万，D为10/3万。最优赶工方案：D赶工3天、A赶工2天、B赶工2天，最终工期6天。总费用 = 间接费用+直接费用+赶工增加费用 ≈ 122万。（注：真题本身存在疑问，选最接近的D选项）"}, {"id": "real-2024年下半年-022", "index": 1637, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 22, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "白盒测试也称为结构测试，主要用于软件单元测试阶段，（ ）不属于白盒测试。", "options": {"A": "功能测试", "B": "控制流分析", "C": "数据流分析", "D": "程序变异测试"}, "answer": "A", "analysis": "常用的白盒测试方法有控制流分析、数据流分析、路径分析、程序变异等。功能测试（黑盒测试）是基于功能需求的测试，不属于白盒测试，答案选A。"}, {"id": "real-2024年下半年-023", "index": 1638, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 23, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在白盒测试中，关于覆盖标准描述错误的是（ ）。", "options": {"A": "判定覆盖比语句覆盖强", "B": "满足条件组合覆盖的测试用例一定满足判定/条件覆盖", "C": "路径覆盖不能代替条件覆盖和条件组合覆盖", "D": "条件覆盖一定具备判定覆盖"}, "answer": "D", "analysis": "条件覆盖要求每个判定中的每个条件至少有一个结果为真和至少一个结果为假，但并不保证每个判定的整体结果（真或假）都被覆盖，因此条件覆盖不一定具备判定覆盖。D选项错误。A、B、C均正确。"}, {"id": "real-2024年下半年-024", "index": 1639, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 24, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在软件的启用过程中，用户往往会对软件提出新的特性与性能要求。为了满足这些要求，需要修改或再开发软件，以扩充软件功能、增强软件性能、改进加工效率、提高软件的可维护性。这种情况下进行的维护活动称为（ ）。", "options": {"A": "预防性维护", "B": "适应性维护", "C": "完善性维护", "D": "改正性维护"}, "answer": "C", "analysis": "软件维护类型：\n- 改正性维护【修BUG】：识别和纠正软件错误/缺陷。\n- 适应性维护【应变】：使应用软件适应环境变化而进行的修改。\n- 完善性维护【新需求】：扩充功能和改善性能而进行的修改。\n- 预防性维护【针对未来】：为适应未来的软硬件环境变化主动增加预防性功能。\n\n题目描述的是扩充功能、增强性能，属于完善性维护。"}, {"id": "real-2024年下半年-025", "index": 1640, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 25, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于设计模式描述正确的是（ ）。", "options": {"A": "解释器模式和代理模式属于同一类型模式", "B": "观察者模式属于结构型模式", "C": "装饰器模式属于行为型模式", "D": "原型模式属于创建型模式"}, "answer": "D", "analysis": "设计模式三大类型：\n- 创建型：单例、原型、工厂方法、抽象工厂、构建器（5种）\n- 结构型：代理、适配器、桥接、装饰、外观、享元、组合（7种）\n- 行为型：模板方法、策略、命令、职责链、状态、观察者、中介者、迭代器、访问者、备忘录、解释器（11种）\n\n原型模式属于创建型，D正确。A错（解释器是行为型，代理是结构型）；B错（观察者是行为型）；C错（装饰器是结构型）。"}, {"id": "real-2024年下半年-026", "index": 1641, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 26, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "（ ）是对对象实例化过程的抽象，它凭借采用抽象类所定义的接口，封装了系统中对象如何创建、组合等信息。", "options": {"A": "结构型模式", "B": "组合型模式", "C": "创建型模式", "D": "行为型模式"}, "answer": "C", "analysis": "创建型设计模式是对对象实例化过程的抽象，它采用抽象类所定义的接口，封装了系统中对象如何创建、组合等信息，将对象的创建与使用分离。包括五种：单例、原型、工厂方法、抽象工厂、构建器。"}, {"id": "real-2024年下半年-027", "index": 1642, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 27, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "有两个关系R（a，b，c）和S（b，c，d），将R和S进行自然连接，得到的结果包含（ ）列。", "options": {"A": "4", "B": "6", "C": "2", "D": "5"}, "answer": "A", "analysis": "自然连接规则：找出两个关系中相同名称的列（b和c），进行等值连接并去除重复列。结果包含列：(a, b, c, d)，共4列，答案选A。"}, {"id": "real-2024年下半年-028", "index": 1643, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 28, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "关系操作中，操作的对象和结果都是（ ）。", "options": {"A": "元组", "B": "记录", "C": "集合", "D": "列"}, "answer": "C", "analysis": "关系操作的特点是操作对象和操作结果都是集合。关系代数运算符有4类：集合运算符、专门的关系运算符、算术比较符和逻辑运算符。"}, {"id": "real-2024年下半年-029", "index": 1644, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 29, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "给出关系模式R（A，B，C，D）和其属性之间的函数依赖（B→D，AB→C），则R的码是（ ）。", "options": {"A": "B", "B": "D", "C": "AB", "D": "A"}, "answer": "C", "analysis": "从函数依赖图中可以看出，入度为零的节点是A与B，从这两个节点的组合出发，能遍历全图（AB→C，B→D），所以AB组合为候选码。"}, {"id": "real-2024年下半年-030", "index": 1645, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 30, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "下面关于体系结构风格说法正确的是（ ）。", "options": {"A": "管道-过滤器体系结构风格中，过滤器可以并行执行", "B": "批处理体系结构风格中，构件可以并行执行", "C": "批处理体系结构风格中，数据是增量传输的", "D": "黑板体系结构风格和管道-过滤器风格属于数据流体系风格的子风格"}, "answer": "A", "analysis": "A正确，管道-过滤器风格中过滤器可以并行执行（数据可被分割成独立部分进行并行处理）。B错误（批处理是顺序处理模式）；C错误（批处理中数据以整个批次形式传输）；D错误（黑板体系结构风格不属于数据流体系风格的子风格）。"}, {"id": "real-2024年下半年-031", "index": 1646, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 31, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在架构设计中，提高加密级别可以提高安全性，但可能要耗费更多的处理时间，影响系统性能。如果某个机密消息的处理有严格的时间延迟要求，则加密级别可能就会成为架构评估中的一个（ ）。", "options": {"A": "权衡点", "B": "敏感点", "C": "风险点", "D": "非风险点"}, "answer": "A", "analysis": "权衡点是影响多个质量属性的特性，是多个质量属性的敏感点。加密级别同时影响安全性和性能两个质量属性，因此是一个权衡点。敏感点只影响一个质量属性，与此不同。"}, {"id": "real-2024年下半年-032", "index": 1647, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 32, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在用户界面设计过程中，可能分别启用UML（ ）表示用户界面元素与界面的跳转关系。", "options": {"A": "类图和顺序图", "B": "用例图和顺序图", "C": "类图和活动图", "D": "用例图和活动图"}, "answer": "A", "analysis": "用户界面设计模型的UML表示：用类图表示用户界面元素、用顺序图表示用户界面跳转关系。"}, {"id": "real-2024年下半年-033", "index": 1648, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 33, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "体系结构需求一般来自三个方面，分别是（ ）。", "options": {"A": "系统的质量目标、系统的商业目标和系统开发人员的商业目标", "B": "框架的功能需求、系统的质量目标和环境的商业目标", "C": "系统的质量目标、系统的商业目标和系统开发人员的质量目标", "D": "系统的功能需求、系统的商业目标和系统开发人员的商业目标"}, "answer": "A", "analysis": "体系结构需求一般来自3个方面：系统的质量目标、系统的商业目标和系统开发人员的商业目标。"}, {"id": "real-2024年下半年-034", "index": 1649, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 34, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在企业集成技术架构层次中，自下而上依次为（ ）。其中，数据集成主要有三种模式，分别为（ ）。\n\n选项（第一空）:", "options": {"A": "数据联邦、数据复制和基于接口的数据集成", "B": "数据复制、数据融合和数据抽取", "C": "数据联邦、数据复制和基于接口的材料集成", "D": "数据抽取、数据复制和数据测试"}, "answer": "C", "analysis": "企业集成技术架构自下而上四个层次：网络集成→数据集成→会聚集成（应用集成）→服务集成。数据集成主要有三种模式：数据联邦、数据复制和基于接口的数据集成。"}, {"id": "real-2024年下半年-035", "index": 1650, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 35, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "复用的基本过程主要包括三个阶段：（ ）、管理可复用资产，以及使用可复用资产。", "options": {"A": "重新包装可复用的软件资产", "B": "分析可复用的软件资产", "C": "分解可复用的软件资产", "D": "构造/获取可复用的软件资产"}, "answer": "D", "analysis": "软件复用过程的主要阶段按顺序分为：构造/获取可复用的软件资产、管理可复用资产和使用可复用资产。"}, {"id": "real-2024年下半年-036", "index": 1651, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 36, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "一个模块内的处理元素是相关的，而且必须以特定次序执行，则称为（ ）。", "options": {"A": "通信内聚", "B": "逻辑内聚", "C": "过程内聚", "D": "时间内聚"}, "answer": "C", "analysis": "软件模块内聚类型（从高到低）：功能内聚、顺序内聚（必须顺序执行）、通信内聚（集中在同一数据结构区域）、过程内聚（处理元素相关且必须按特定次序执行）、时间内聚（同一时间间隔内执行）、逻辑内聚、偶然内聚。"}, {"id": "real-2024年下半年-037", "index": 1652, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 37, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "软件测试过程中的系统测试是为了发现（ ）阶段的错误。", "options": {"A": "编码", "B": "需求分析", "C": "概要设计", "D": "详细设计"}, "answer": "B", "analysis": "根据V模型：\n- 验收测试/系统测试 → 针对需求分析阶段\n- 集成测试 → 针对概要设计阶段\n- 单元测试 → 针对详细设计阶段\n\n系统测试采用黑盒测试，检查系统是否符合软件需求，故选B。"}, {"id": "real-2024年下半年-038", "index": 1653, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 38, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在UML用例图中，参与者之间存在（ ）关系。", "options": {"A": "聚合", "B": "包含", "C": "继承", "D": "扩展"}, "answer": "C", "analysis": "在UML用例图中：\n- 用例之间有扩展关系和包含关系\n- 参与者和用例之间有关联关系\n- 用例与用例、参与者与参与者之间有泛化关系（继承关系）"}, {"id": "real-2024年下半年-039", "index": 1654, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 39, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在进程通信体系结构风格中，连接件是（ ）。", "options": {"A": "独立的过程", "B": "消息队列", "C": "事件", "D": "消息传递"}, "answer": "D", "analysis": "在进程通信体系结构风格中，构件是独立的过程，连接件是消息传递。消息传递的方式包括点到点、异步或同步方式及远程过程调用等。"}, {"id": "real-2024年下半年-040", "index": 1655, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 40, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "脚本是一组测试工具执行的指令集合，数据驱动脚本指将测试输入存储在（ ）中，针对不同的数据输入实现多个测试用例。", "options": {"A": "程序文件", "B": "数据文件", "C": "脚本文件", "D": "指令文件"}, "answer": "B", "analysis": "数据驱动脚本将测试输入存储在独立的数据文件中，而不是存储在脚本中。可以针对不同数据输入实现多个测试用例，提高测试复用性。"}, {"id": "real-2024年下半年-041", "index": 1656, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 41, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "Web服务描述语言WSDL描述了Web服务的三个基本属性，包括（ ）。", "options": {"A": "谁要访问服务、如何访问服务和服务位于何处", "B": "服务做什么、谁要访问服务和服务位于何处", "C": "服务做什么、如何访问服务和谁要访问服务", "D": "服务做什么、如何访问服务和服务位于何处"}, "answer": "D", "analysis": "WSDL（Web Services Description Language）描述Web服务的三个基本属性：\n- 服务做些什么——服务所提供的操作（方法）\n- 如何访问服务——和服务交互的数据格式以及必要协议\n- 服务位于何处——协议相关的地址，如URL"}, {"id": "real-2024年下半年-042", "index": 1657, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 42, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "操作系统定义了两种程序执行模式（用户模式和内核模式），应用程序在用户模式下使用特权指令引起的中断是（ ）。", "options": {"A": "溢出中断", "B": "外部中断", "C": "访管中断", "D": "信号中断"}, "answer": "C", "analysis": "访管中断是一种特殊的中断，用于在用户态下请求操作系统内核提供服务或执行特权处理。当用户程序需要执行特权指令时，通过发起访管中断来请求操作系统执行这些操作。溢出中断是算术溢出引发的，外部中断是由外部事件引发的，均与此不同。"}, {"id": "real-2024年下半年-043", "index": 1658, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 43, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "安全审计涉及4个基本要素，分别是（ ）。", "options": {"A": "控制目标、控制过程、控制措施和安全测试", "B": "控制目标、安全漏洞、控制措施和安全测试", "C": "控制目标、安全漏洞、控制措施和控制测试", "D": "控制目标、控制过程、控制措施和控制测试"}, "answer": "C", "analysis": "安全审计涉及四个基本要素：控制目标、安全漏洞、控制措施和控制测试。\n\n- 控制目标：确保数据的保密性、完整性或系统的可用性\n- 安全漏洞：系统中可能被恶意用户利用的弱点\n- 控制措施：针对安全漏洞采取的修复或预防措施\n- 控制测试：验证控制措施是否有效执行"}, {"id": "real-2024年下半年-044", "index": 1659, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 44, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "（ ）是指重用不同应用领域中的软件元素，例如数据结构、分类算法和人机界面构件等。", "options": {"A": "结构重用", "B": "纵向重用", "C": "交叉重用", "D": "横向重用"}, "answer": "D", "analysis": "软件重用可分为横向重用和纵向重用。横向重用是指重用不同应用领域中的软件元素，例如数据结构、分类算法和人机界面构件等，标准函数是典型的横向重用机制。纵向重用是指在一类具有较多公共性的应用领域之间进行软件重用。"}, {"id": "real-2024年下半年-045", "index": 1660, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 45, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "下面关于ATAM效用树中优先级的说法不正确的是（ ）。", "options": {"A": "系统安全性场景属于高优先级场景", "B": "效用树中的优先级基于相对排名：高（H），中（M）和低（L）", "C": "效用树沿着两个维度排列优先顺序：每个场景对系统成功的重要性以及实现该场景的难度估计", "D": "（H，L）的场景代表该场景对系统成功的重要性较高，该场景的实现难度较低"}, "answer": "A", "analysis": "效用树沿着两个维度排列优先顺序：重要性和实现难度，优先级基于相对排名：高（H）、中（M）、低（L）。B、C、D均正确。A错误——在效用树中，场景的优先级是基于多因素综合考量的，不是所有安全性场景都自动被归为高优先级。"}, {"id": "real-2024年下半年-046", "index": 1661, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 46, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "与通常软件开发过程不同的是，N版本程序设计增加了三个新的阶段，分别是（ ）。", "options": {"A": "相异成分规范评审、相同性确认和背对背测试", "B": "相异成分规范评审、相异性确认和面对面测试", "C": "相同成分规范评审、相同性确认和背对背测试", "D": "相异成分规范评审、相异性确认和背对背测试"}, "answer": "D", "analysis": "N版本程序设计增加了三个新的阶段：相异成分规范评审、相异性确认和背对背测试。\n\n1. 相异成分评审：各工作组独立工作，不允许交流，保证相异性\n2. 相异性确认：在详细设计后进行，评估各版本的相异性\n3. 背对背测试：使用同样测试数据对N个版本进行测试，比较结果"}, {"id": "real-2024年下半年-047", "index": 1662, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 47, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "下面关于MD5（Message Digest Algorithm 5）说法错误的是（ ）。", "options": {"A": "无论输入的数据有多长，MD5都会生成一个长度为128位的哈希值", "B": "MD5常用于文件完整性的校验", "C": "MD5是单向的，无法借助哈希值直接逆推出原始数据", "D": "MD5完全抗碰撞，不存在不同输入生成相同哈希值的可能性"}, "answer": "D", "analysis": "MD5是一个存在碰撞漏洞的哈希算法，即不同的输入可能产生相同的哈希值（碰撞）。D选项说法错误。A、B、C均正确：MD5输出固定128位；常用于文件完整性校验；是单向哈希函数无法逆推。"}, {"id": "real-2024年下半年-048", "index": 1663, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 48, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "分段允许程序员把内存视为由多个地址空间或段组成，其中段的大小是（ ）。", "options": {"A": "固定的", "B": "不可变的", "C": "相等的", "D": "动态可变的"}, "answer": "D", "analysis": "在段式存储管理系统中，段的大小是动态可变的，可以根据需要改变。这与分页管理不同——分页管理中的页大小通常是固定的。"}, {"id": "real-2024年下半年-049", "index": 1664, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 49, "sourceType": "real", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "为了学习和研究软件内含的设计思想和原理，通过安装、显示、传输或者存储软件等方式使用软件的，（ ）。", "options": {"A": "可以不经软件著作权人许可，不向其支付报酬", "B": "可以向著作权人申请，支付较少的报酬", "C": "需要向著作权人支付相应的报酬", "D": "经软件著作权人许可，可以不向其支付报酬"}, "answer": "A", "analysis": "《计算机软件保护条例》规定：为了学习和研究软件内含的设计思想和原理，通过安装、显示、传输或者存储软件等方式使用软件的，可以不经软件著作权人许可，不向其支付报酬。"}, {"id": "real-2024年下半年-050", "index": 1665, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 50, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "（ ）不属于调用/返回体系结构风格的子风格。", "options": {"A": "层次型体系结构风格", "B": "主程序/子过程体系结构风格", "C": "黑板体系结构风格", "D": "面向对象体系结构风格"}, "answer": "C", "analysis": "调用/返回体系结构风格主要包括：主程序/子程序风格、面向对象风格、层次型风格以及客户端/服务器风格。黑板体系结构风格属于仓库风格的一种，不属于调用/返回风格的子风格。"}, {"id": "real-2024年下半年-051", "index": 1666, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 51, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于事件驱动架构（Event-Driven Architecture，EDA）描述正确的是（ ）。", "options": {"A": "事件触发消息在独立的、耦合的模块之间传递", "B": "事件触发消息在独立的、非耦合的模块之间传递", "C": "事件触发消息在非独立的、耦合的模块之间传递", "D": "事件触发消息在非独立的、非耦合的模块之间传递"}, "answer": "B", "analysis": "事件驱动体系架构（EDA）是一种设计和构建应用的方法，其中事件触发消息在独立的非耦合模块之间传递（它们之间不需要知道对方）。事件源通常发送消息到中间件或消息代理，订阅者可订阅该消息。"}, {"id": "real-2024年下半年-052", "index": 1667, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 52, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "配置管理不是（ ）中的重要组成部分。", "options": {"A": "CMMI", "B": "UML", "C": "PMBOK", "D": "ISO9000"}, "answer": "B", "analysis": "UML（统一建模语言）是用于对软件密集系统进行可视化建模的标准语言，主要用于需求分析、系统设计等阶段的建模工作，配置管理不是UML的核心内容。CMMI、PMBOK、ISO9000都将配置管理作为重要组成部分。"}, {"id": "real-2024年下半年-053", "index": 1668, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 53, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "螺旋模型是在（ ）的基础上扩展而成的。", "options": {"A": "快速原型模型", "B": "喷泉模型", "C": "V模型", "D": "增量模型"}, "answer": "A", "analysis": "螺旋模型是在快速原型模型的基础上扩展而成，是生命周期模型与原型模型的结合。每个阶段由4部分组成：目标设定、风险分析、开发和有效性验证、评审。"}, {"id": "real-2024年下半年-054", "index": 1669, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 54, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "信道容量是信道的最大传输速率，可以通过（ ）提升信道容量。", "options": {"A": "使用较大的带宽，升高信噪比", "B": "使用较小的带宽，降低信号功率", "C": "使用较大的带宽，降低信噪比", "D": "使用较小的带宽，降低信噪比"}, "answer": "C", "analysis": "根据香农公式，提升信道容量可以通过：使用较大的带宽（降低信噪比也可），或使用较小的带宽但升高信噪比。注意：C选项\"使用较大的带宽，降低信噪比\"——带宽增大对容量的提升效果大于信噪比降低的影响，总体上仍能提升信道容量。（原题解析指向C）"}, {"id": "real-2024年下半年-055", "index": 1670, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 55, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "信息化需求具备三个层次，即（ ）。", "options": {"A": "战略需求、运作需求和信息资源开发", "B": "战略需求、运作需求和技术需求", "C": "战略需求、信息资源开发和技术需求", "D": "信息资源开发、运作需求和技术需求"}, "answer": "B", "analysis": "信息化需求具备3个层次：战略需求、运作需求和技术需求。战略需求旨在提升组织竞争能力；运作需求是信息化需求的重要关键环节；技术需求涉及系统的完善、升级、集成和整合。"}, {"id": "real-2024年下半年-056", "index": 1671, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 56, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在ATAM中，利益相关者需要头脑风暴的场景是（ ）。", "options": {"A": "用例场景、增长场景、环境场景", "B": "用例场景、增长场景、探索场景", "C": "增长场景、探索场景、环境场景", "D": "用例场景、探索场景、环境场景"}, "answer": "B", "analysis": "在ATAM中，利益相关者使用头脑风暴的三种场景：\n- 用例场景：利益相关者就是最终用户\n- 增长场景：代表架构发展的方式\n- 探索性场景：代表架构中极端的增长形式"}, {"id": "real-2024年下半年-057", "index": 1672, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 57, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "基于度量的评估方式建立在软件架构度量的基础上，涉及三个基本活动，先需要建立质量属性和度量之间的映射原则，接着从软件架构文档中获取度量信息，最后根据映射原则分析推导出系统的（ ）。", "options": {"A": "质量属性", "B": "架构决策", "C": "功能需求", "D": "架构元素"}, "answer": "A", "analysis": "基于度量的评估方法三个基本活动：1. 建立质量属性和度量之间的映射原则；2. 从软件架构文档中获取度量信息；3. 根据映射原则分析推导出系统的质量属性。"}, {"id": "real-2024年下半年-058", "index": 1673, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 58, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "基于内容的推荐是信息过滤技术的延续与发展，不属于该方式优点的是（ ）。", "options": {"A": "能推荐新的或不是非常流行的项目，没有新项目问题", "B": "能为具有特殊兴趣爱好的用户进行推荐", "C": "不依赖其他用户的数据，与他人的行为无关", "D": "能够为新用户产生推荐"}, "answer": "D", "analysis": "基于内容的推荐系统优点：不依赖其他用户数据（A、C）、能推荐新项目（A）、个性化推荐（B）。缺点是无法为新用户产生推荐（冷启动问题），因为新用户没有历史数据基础。D不属于优点。"}, {"id": "real-2024年下半年-059", "index": 1674, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 59, "sourceType": "real", "module_code": "new_technology", "module_name": "🚀 前沿新兴技术", "knowledge": "", "stem": "专家系统一般采用人工智能中的（ ）来模拟通常由该领域专家才能解决的复杂问题。", "options": {"A": "知识推理和注意力机制", "B": "知识表示和知识推理技术", "C": "知识获取和注意力机制", "D": "知识表示和注意力机制"}, "answer": "B", "analysis": "专家系统一般采用人工智能中的知识表示和知识推理技术来模拟通常由领域专家才能解决的复杂问题。专家系统=知识库+推理机，必须具备三要素：领域专家级知识、模拟专家思维、达到专家级水平。"}, {"id": "real-2024年下半年-060", "index": 1675, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 60, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "体系结构演化是应用系统演化步骤去修改应用，以满足新的需求。主要包括以下步骤：需求变化归类，制定体系结构演化计划，修改、增加或删除构件，（ ），构件组装与测试，以及技术评审。", "options": {"A": "更新构件的相互作用", "B": "构件版本管理", "C": "分析已有构件", "D": "分析构件间的关系"}, "answer": "A", "analysis": "体系结构演化主要包括6个步骤：（1）需求变化归类；（2）制订体系结构演化计划；（3）修改、增加或删除构件；（4）更新构件的相互作用（随着构件的增删改，构件之间的控制流必须得到更新）；（5）构件组装与测试；（6）技术评审。"}, {"id": "real-2024年下半年-061", "index": 1676, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 61, "sourceType": "real", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "下面关于DSSA（Domain Specific Software Architecture）说法正确的是（ ）。", "options": {"A": "DSSA的建立过程是并发的、递归的和反复进行的", "B": "在DSSA中，定义领域特定的元素阶段的重点是确定什么在感兴趣的领域中以及本过程到何时结束，这个阶段的一个关键输出是领域中的应用应该满足一系列用户的需求", "C": "定义领域模型和体系结构阶段的目标是通过为DSSA增加构件，使它能够被用来产生问题域中的新应用", "D": "在不同的领域中，DSSA的创建和使用过程完全相同"}, "answer": "A", "analysis": "DSSA的建立过程分为5个阶段，是并发的（Concurrent）、递归的（Recursive）、反复的（Iterative），可以说是螺旋模型。B错（定义领域范围阶段才是确定边界；定义领域特定元素阶段目标是编译领域字典）；C错（增加构件是\"产生、搜集可重用产品单元\"阶段的目标）；D错（不同领域各有差异）。"}, {"id": "real-2024年下半年-062", "index": 1677, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 62, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "数据库的三级模式结构中，描述局部数据的逻辑结构和特征的是（ ）。", "options": {"A": "逻辑模式", "B": "外模式", "C": "内模式", "D": "概念模式"}, "answer": "B", "analysis": "数据库三级模式：\n- 外模式：数据的局部逻辑结构和特征的描述（用户视图）\n- 模式（概念模式）：数据的全局逻辑结构和特征的描述\n- 内模式：数据物理结构和存储方式的描述"}, {"id": "real-2024年下半年-063", "index": 1678, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 63, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "以下关于数据流图的说法错误的是（ ）。", "options": {"A": "加工是对数据进行处理的单元，接收一定的数据输入，对其进行处理后产生输出", "B": "子图的输入输出数据流同父图相应加工的输入输出数据流必须一致", "C": "对大型复杂系统，可采用自顶向下逐层分解的方式，绘出分层数据流图", "D": "数据流反映了系统\"做什么\"，以及加工的执行顺序"}, "answer": "D", "analysis": "数据流图（DFD）中的数据流主要反映了系统\"做什么\"，而不是加工的执行顺序（执行顺序不是DFD关注的）。D选项说法错误。A、B、C均正确。"}, {"id": "real-2024年下半年-064", "index": 1679, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 64, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "基于软件系统的生命周期，可以将软件系统的质量属性分为开发期质量属性和运行期质量属性两个部分。其中，（ ）关注软件因适应新需求或需求变化而增加新功能的能力；（ ）是关注软件系统同时兼顾向合法用户提供服务，以及阻止非授权使用的能力。\n\n选项（第一空）:", "options": {"A": "可测试性", "B": "安全性", "C": "可移植性", "D": "可用性"}, "answer": "B", "analysis": "- 可扩展性（开发期质量属性）：软件因适应新需求或需求变化而增加新功能的能力，也称为灵活性。\n- 安全性（运行期质量属性）：软件系统同时兼顾向合法用户提供服务，以及阻止非授权使用的能力。"}, {"id": "real-2024年下半年-065", "index": 1680, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 65, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "> ⚠️ 注意: 本题在社区回忆版中未收录完整题目，以下为rkpass.cn题目方向提示重构。\n\n在企业应用集成（EAI）中，企业内部应用集成从底层到高层按集成深度，其集成层次从低到高依次为（ ）。", "options": {"A": "数据集成、界面集成、平台集成、应用集成和过程集成", "B": "界面集成、平台集成、数据集成、应用集成和过程集成", "C": "平台集成、界面集成、数据集成、应用集成和过程集成", "D": "界面集成、数据集成、平台集成、应用集成和过程集成"}, "answer": "B", "analysis": "EAI企业内部集成按集成深度从低到高分为5个层次：\n1. 界面集成：最浅层次，把用户界面作为公共集成点\n2. 平台集成：实现系统基础集成（底层结构、软件、硬件）\n3. 数据集成：解决数据和数据库的集成问题\n4. 应用集成：为两个应用中的数据和函数提供接近实时的集成\n5. 过程集成：对各种业务信息的交换进行定义、授权和管理"}, {"id": "real-2024年下半年-066", "index": 1681, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 66, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "> ⚠️ 注意: 本题在社区回忆版中未收录完整题目，以下为rkpass.cn题目方向提示重构。\n\n下面关于软件质量管理的说法，正确的是（ ）。", "options": {"A": "ISO 9000标准只关注产品质量，不关注过程质量", "B": "软件质量保证（SQA）贯穿于软件生产的各个阶段", "C": "质量控制只需在软件交付前进行", "D": "质量保证和质量控制是同一个概念"}, "answer": "B", "analysis": "软件质量保证（SQA）是指为保证软件系统充分满足用户要求的质量而进行的有计划、有组织的活动，这些活动贯穿于软件生产的各个阶段即整个生命周期。质量保证和质量控制是不同概念：质量保证侧重于过程的规范化，质量控制侧重于监视项目结果是否符合质量标准。"}, {"id": "real-2024年下半年-067", "index": 1682, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 67, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "> ⚠️ 注意: 本题在社区回忆版中未收录完整题目，以下为rkpass.cn题目方向提示重构。\n\n在ATAM效用树中，某质量属性场景被标记为（H，H），则表示该场景（ ）。", "options": {"A": "对系统成功的重要性高，且实现难度高", "B": "对系统成功的重要性高，且实现难度低", "C": "对系统成功的重要性低，且实现难度高", "D": "对系统成功的重要性低，且实现难度低"}, "answer": "A", "analysis": "效用树沿着两个维度排列优先顺序：（重要性, 难度）。（H，H）表示：该场景对系统成功的重要性高，实现该场景的难度也高。这类场景需要重点关注，是架构风险最大的区域。"}, {"id": "real-2024年下半年-068", "index": 1683, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 68, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "> ⚠️ 注意: 本题在社区回忆版中未收录完整题目，以下为rkpass.cn题目方向提示重构。\n\n在数据安全治理框架中，（ ）不属于数据安全治理体系的核心能力层。", "options": {"A": "数据安全战略层", "B": "基础安全层", "C": "访问权限控制层", "D": "用户需求满足层"}, "answer": "D", "analysis": "数据安全治理体系是组织达成数据安全治理目标必须具备的能力框架，其核心能力层包括：数据安全战略层、基础安全层（含数据分类分级）、访问权限控制层、信息全生命周期安全层等。\"用户需求满足层\"不是数据安全治理体系的组成部分。"}, {"id": "real-2024年下半年-069", "index": 1684, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 69, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "> ⚠️ 注意: 本题在社区回忆版中未收录完整题目，以下为rkpass.cn题目方向提示重构。\n\n在数据库概念结构设计中，各子系统局部E-R图合并为全局E-R图时，可能产生的冲突类型包括（ ）。", "options": {"A": "属性冲突、命名冲突和结构冲突", "B": "属性冲突、数据冲突和结构冲突", "C": "命名冲突、逻辑冲突和结构冲突", "D": "属性冲突、命名冲突和逻辑冲突"}, "answer": "A", "analysis": "各局部E-R图之间的冲突主要有3类：\n1. 属性冲突：包括属性域冲突和属性取值冲突\n2. 命名冲突：包括同名异义和异名同义\n3. 结构冲突：同一对象在不同应用中有不同抽象，或同一实体在不同局部E-R图中属性个数和排列次序不同"}, {"id": "real-2024年下半年-070", "index": 1685, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 70, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "下面哪项是可复用资产管理的正确顺序？", "options": {"A": "分析可复用资产、使用可复用资产、构造/获取可复用资产、管理可复用资产", "B": "分析可复用资产、构造/获取可复用资产、使用可复用资产、管理可复用资产", "C": "分析可复用资产、管理可复用资产、构造/获取可复用资产、使用可复用资产", "D": "分析可复用资产、构造/获取可复用资产、管理可复用资产、使用可复用资产"}, "answer": "D", "analysis": "软件复用过程的主要阶段按顺序分为：\n1. 分析可复用资产（识别哪些资产可以复用）\n2. 构造/获取可复用的软件资产（创建或获取可复用资产）\n3. 管理可复用资产（对资产进行分类、存储、维护）\n4. 使用可复用资产（在实际开发中使用这些资产）"}, {"id": "real-2024年下半年-071", "index": 1686, "term": "2024年下半年", "paper": "2024年下半年", "questionNo": 71, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "Blackboard architecture, also known as the blackboard system, is a problem-solving approach that utilizes a modular and（71）framework. It effectively solves complex problems that（72）a well-defined algorithm or a pre-determined architecture. Blackboard architecture is inspired by human experts collaborating and solving difficult problems by（73）and contributing their expertise. The architecture is based on how people work together around a（74）. Each person would sit around the board and a problem would be written on it. When a person can solve the problem, they would go to the board and add the（75）solution they know how to do. This process is repeated until a collective solution is found.", "options": {"A": "conceptualized（概念化）", "B": "centralized（集中）", "C": "decentralized（分散）", "D": "controlled（受控）"}, "answer": "C", "analysis": "黑板架构利用模块化和分散化（modular and decentralized）的框架，这与黑板架构中各知识源独立工作的特点相符。"}, {"id": "real-2025年上半年-001", "index": 1687, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 1, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "调制解调技术主要用于解决以下哪种信号传输问题?(题干由 OCR 丢失,根据解析还原)", "options": {"A": "数字信道传递数字信号", "B": "模拟信道传递数字信号", "C": "数字信道传递模拟信号", "D": "模拟信道传递模拟信号"}, "answer": "B", "analysis": "调制解调技术的核心是将数字信号转换为模拟信号 (调制) 以便在模拟信道上传输,并在接收端将模拟信号还原为数字信号 (解调)。这种技术主要用于解决数字数据在模拟信道 (如传统电话线) 上的传输问题。至于数字信道传递模拟信号,这涉及模数转换 (如 PCM 编码),使用编解码器 (Codec) 技术,而非调制解调技术,数字信道直接传输数字信号,模拟信号需要先被数字化。"}, {"id": "real-2025年上半年-002", "index": 1688, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 2, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "CMMI 有阶段式和连续式两个不同划分方式,其中阶段式共分为 () 个阶段", "options": {"A": "3", "B": "4", "C": "5", "D": "6"}, "answer": "C", "analysis": "CMMI 阶段式五级分别是: 初始级、已管理级、已定义级、定量管理、优化级。"}, {"id": "real-2025年上半年-003", "index": 1689, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 3, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "国家秘密中,除特殊情况外,机密级保密期限一般不超过多少年 ()", "options": {"A": "十年", "B": "二十年", "C": "三十年", "D": "四十年"}, "answer": "B", "analysis": "根据《中华人民共和国保守国家秘密法》第十五条规定:\n\n国家秘密的保密期限,除另有规定外,绝密级不超过三十年;机密级不超过二十年,秘密级不超过十年。"}, {"id": "real-2025年上半年-004", "index": 1690, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 4, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "要想实现半双工通讯,通信双方至少需要 ()", "options": {"A": "1 个逻辑通道", "B": "2 个逻辑通道", "C": "1 个有线信道", "D": "2 个有线信道"}, "answer": "A", "analysis": "注意是至少需要。半双工通讯允许通信双方都能发送和接收信息,但不能同时进行 (即一方发送时,另一方只能接收,反之亦然)。这种通信方式通过时间共享一个逻辑通道来实现双向数据传输。\n\n逻辑通道指的是通信路径的逻辑划分 (如通过协议或时分复用实现),而非物理介质。在半双工中,一个逻辑通道就足以支持双向交替通信,因为它可以被动态地切换方向。"}, {"id": "real-2025年上半年-005", "index": 1691, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 5, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "下列选项中,内聚类型排序从高到低的是 ()", "options": {"A": "功能内聚、时间内聚、顺序内聚", "B": "顺序内聚、通信内聚、过程内聚", "C": "过程内聚、顺序内聚、逻辑内聚", "D": "时间内聚、顺序内聚、偶然内聚"}, "answer": "B", "analysis": "内聚程度从高到低分别是功能、顺序、通信、过程、时间、逻辑、偶然。"}, {"id": "real-2025年上半年-006", "index": 1692, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 6, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "在关系型数据库中,关系运算不包括 ()", "options": {"A": "选择", "B": "投影", "C": "删除", "D": "连接"}, "answer": "C", "analysis": "送分题了,没讲过删除。关系运算包括选择、投影、连接等,删除属于数据操纵语言 (DML) 操作,不属于关系运算。"}, {"id": "real-2025年上半年-007", "index": 1693, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 7, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在关系 R（A1，A2，A3）和 S（A2，A3，A4）上进行关系运算的 4 个等价的表达式 E1、E2、E3 和 E4 如下所示（含图片，此处省略表达式细节）。如果严格按照表达式运算顺序执行，则查询效率最高的是表达式 ()\n\n> 注：本题与 2018 年下半年第 7 题相同，题目中包含 4 个关系代数表达式的图片。核心考点是关系代数查询优化——尽早执行选择 (σ) 和投影 (π) 操作以减少中间结果集大小。", "options": {"A": "E2", "B": "E3", "C": "E4", "D": "E1"}, "answer": "C", "analysis": "关系代数查询优化的基本原则：尽可能早地执行选择操作（减少元组数）和投影操作（减少属性数），以缩小中间关系的规模，从而提高查询效率。E4 在连接之前先分别对 R 和 S 进行了选择和投影，使得参与连接的中间关系最小，因此查询效率最高。本题来源于 rkpass.cn 2025年上半年系统架构设计师真题库。"}, {"id": "real-2025年上半年-008", "index": 1694, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 8, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "数据流图中 () 描述了输入数据流到输出数据流之间的变换,也就是输入数据流经过什么处理后变成了输出数据流。", "options": {"A": "数据流", "B": "外部实体", "C": "数据存储", "D": "处理"}, "answer": "D", "analysis": "处理就是加工,这是加工的定义。"}, {"id": "real-2025年上半年-009", "index": 1695, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 9, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于 AB 测试的说法中,正确的是 ()", "options": {"A": "在同一时间维度,分别让分组成分相同或相似的访问群组随机的访问这些版本", "B": "在不同时间维度,分别让分组成分互补的访问群组随机的访问这些版本", "C": "在同一时间维度,分别让分组成分互补的访问群组随机的访问这些版本", "D": "在不同时间维度,分别让分组成分相同的访问群组随机的访问这些版本"}, "answer": "A", "analysis": "AB 测试是为 Web 或 App 界面或流程制作两个或多个版本,在同一时间维度,分别让组成成分相同 (相似) 的访客群组 (目标人群) 随机的访问这些版本,收集各群组的用户体验数据和业务数据,最后分析、评估出最好版本,正式采用。"}, {"id": "real-2025年上半年-010", "index": 1696, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 10, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "芯片 -45°C ~ 85°C 是什么级别的需求", "options": {"A": "军用级", "B": "民用级", "C": "通用级", "D": "工业级"}, "answer": "D", "analysis": "教材原文。通常,我们把芯片分为民用级、工业级和军用级。民用级器件的工作温度范围是 0~70°C;工业级的是 -40~85°C、军用级的是 -55~150°C。"}, {"id": "real-2025年上半年-011", "index": 1697, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 11, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "现有三个不等式约束,分别是 (1) x-1>=0 (2) x-y<=0 (3) x+y-4>=0,在同时满足这三个不等式约束的条件下,求 y/x 最大值为 ()", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "answer": "C", "analysis": "本质上是线性规划的题型,省略了自己列不等式的过程,求法一样,先两两求交点,看是否满足第三个不等式,满足的话这个交点就能用,如有多个满足的交点,就看 y/x 结果最大的那个。这里 (1)(2) 的交点是 x=1,y=1,不满足 (3),不能用;(1)(3) 的交点是 x=1,y=3,满足 (2),代入 y/x=3;(2)(3) 的交点是 x=2,y=2,满足 (1),代入 y/x=1;所以综合下来,最大的是 3。"}, {"id": "real-2025年上半年-012", "index": 1698, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 12, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下 () 属于微服务断路器模式的状态", "options": {"A": "激活状态,关闭状态,休眠状态", "B": "打开状态,关闭状态,熔断状态", "C": "打开状态,关闭状态,半打开状态", "D": "打开状态,休眠状态,挂起状态"}, "answer": "C", "analysis": "断路器模式是云计算和微服务架构中的一种保护性设计模式,其目的是避免系统中的调用链出现故障时,导致系统崩溃。通过断路器模式,可以检测到系统的故障并及时切断不稳定的调用,防止对失败的操作进行连续请求,保护服务的正常运行。断路器模式包含以下三个主要状态:\n\n关闭状态 (Closed): 初始状态,允许请求通过。如果请求失败次数超过阈值,则状态切换为「打开状态」。\n\n打开状态 (Open): 不允许请求通过,直接返回错误。经过一段时间后,将状态切换为「半开状态」。\n\n半开状态 (Half-Open): 允许部分请求通过。如果请求成功,则状态切换为关闭状态;否则,切换回打开状态。"}, {"id": "real-2025年上半年-013", "index": 1699, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 13, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于层次式架构的说法中,错误的是 ()", "options": {"A": "B/S 架构是一种特殊的二层 C/S 架构", "B": "三层 C/S 比两层 C/S 架构多了一个应用服务器", "C": "三层 C/S 有较高的可扩展性", "D": "三层 C/S 架构一般分为表现层、功能层、数据层"}, "answer": "A", "analysis": "B/S (Browser/Server) 架构本质上是三层架构: 表示层 (浏览器)、业务逻辑层 (服务器端应用)、数据层 (数据库)。而二层 C/S (Client/Server) 架构通常指客户端 (包含用户界面和业务逻辑) 直接连接服务器 (数据层),客户端是「胖客户端」。B/S 架构中,浏览器作为「瘦客户端」只负责表示层,业务逻辑完全在服务器端,因此它不是二层 C/S 架构的特殊形式,而是三层架构的一种实现。尽管广义上 C/S 模型可涵盖 B/S,但层数划分上 B/S 不属于二层。"}, {"id": "real-2025年上半年-014", "index": 1700, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 14, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "当使用网络传输数据时,传输信道带宽为 3000Hz,信号一共有 32 种状态,在无干扰的情况下,该信道的最大传输速率为 () kbps", "options": {"A": "100", "B": "30", "C": "500", "D": "50"}, "answer": "B", "analysis": "根据奈奎斯特公式,无干扰条件下最大传输速率为:\nC = 2 × W × log2(T)\n其中,W = 3000Hz,T = 32 (信号状态数)。\n\n代入计算:\nlog2(32) = 5\nC = 2 × 3000 × 5 = 30,000bps = 30kbps"}, {"id": "real-2025年上半年-015", "index": 1701, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 15, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "一次可编程只读存储器是哪一个 ()", "options": {"A": "ROM", "B": "EPROM", "C": "PROM", "D": "EEPROM"}, "answer": "C", "analysis": "根据组成元件的不同,ROM 内存又分为以下 5 种:\n\n(1) MASK ROM (掩模型只读存储器): 制造商为了大量生产 ROM 内存,需要先制作一有原始数据的 ROM 或 EPROM 作为样本,然后再大量复制。烧录在 MASK ROM 中的资料永远无法做修改,成本比较低。\n\n(2) PROM (Programmable ROM,可编程只读存储器): 这是一种可以用刻录机将资料写入的 ROM 内存,但只能写入一次,所以也被称为「一次可编程只读存储器」。PROM 在出厂时,存储的内容全为 1,用户可以根据需要将其中的某些单元写入数据 0,以实现对其「编程」的目的。\n\n(3) EPROM (Erasable Programmable,可擦可编程只读存储器): 具有可擦除功能,擦除后即可进行再编程的 ROM 内存,写入前必须先把里面的内容用紫外线照射的方式来清除掉。\n\n(4) EEPROM (Electrically Erasable Programmable,电可擦可编程只读存储器): 功能与 EPROM 一样,不同之处是清除数据的方式,它是以约 20V 的电压来进行清除的。\n\n(5) Flash Memory (快闪存储器): 可以直接在主机板上修改内容而不需要将 IC 拔下的内存。"}, {"id": "real-2025年上半年-016", "index": 1702, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 16, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "哪个不是非实时嵌入式操作系统 ()", "options": {"A": "iOS", "B": "VxWorks", "C": "Android", "D": "WinCE"}, "answer": "B", "analysis": "嵌入式操作系统通常分为两类,一类是面向控制、通信等领域的嵌入式实时操作系统,如 WindRiver 公司 VxWorks、ATI 公司 Nucleus 等;另一类是面向消费电子产品的非实时嵌入式操作系统,这类产品包括移动电话、机顶盒、电子书等,操作系统包括 Google 公司的 Android、Apple 公司的 iOS,以及 Microsoft 公司的 WinCE 等。\n\n因此 VxWorks 是实时操作系统,不属于非实时嵌入式操作系统。"}, {"id": "real-2025年上半年-017", "index": 1703, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 17, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "不属于 Web 服务器性能评测方法的是 ()", "options": {"A": "基准性能测试", "B": "压力测试", "C": "可靠性测试", "D": "UI 测试"}, "answer": "D", "analysis": "在 Web 服务器的测试中,反映其性能的指标主要有: 最大并发连接数、响应延迟和吞吐量等。常见的 Web 服务器性能评测方法有基准性能测试、压力测试和可靠性测试。"}, {"id": "real-2025年上半年-018", "index": 1704, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 18, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "ERP 企业资源三流是哪三流", "options": {"A": "逻辑视图", "B": "进程视图", "C": "实现视图", "D": "部署视图"}, "answer": "A", "analysis": "ERP 管理的企业资源主要是三种,即物流、资金流、信息流。"}, {"id": "real-2025年上半年-021", "index": 1705, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 21, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "净室软件工程的理论基础主要是 ()", "options": {"A": "函数理论和抽样理论", "B": "概率统计和软件认证", "C": "统计测试和正确性验证", "D": "质量保证和概率统计"}, "answer": "A", "analysis": "净室软件工程 (CSE) 的理论基础主要是函数理论和抽样理论。"}, {"id": "real-2025年上半年-022", "index": 1706, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 22, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "当用户首次打开一个文件的时候,系统 ()", "options": {"A": "先读取文件名", "B": "把文件内容读入内存", "C": "先读 FCB", "D": "先读到缓冲区中"}, "answer": "C", "analysis": "文件首次打开时,系统优先读取该文件的 FCB (或 inode 等元数据结构)。\n\nFCB 存储文件的元数据,包括: 权限、大小、创建时间、物理存储位置等。系统需通过 FCB 验证用户权限、定位文件数据块,并建立内存中的文件句柄。"}, {"id": "real-2025年上半年-023", "index": 1707, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 23, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "当前系统中有 5 个进程,每个进程运行需要 2 个资源,那么至少提供多少个资源不会造成系统死锁", "options": {"A": "5", "B": "6", "C": "8", "D": "10"}, "answer": "B", "analysis": "简单的运算,5 × (2-1) + 1 = 6 个。"}, {"id": "real-2025年上半年-024", "index": 1708, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 24, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "大模型的生成代码架构是什么", "options": {"A": "Knowledge Map (知识图谱): 用于结构化知识表示 (如实体关系),可辅助模型理解语义,但非生成架构本身。", "B": "Data Flow (数据流): 描述程序中数据的流动方向 (如变量依赖关系),是程序执行过程的抽象,而非生成模型架构。", "C": "Rule Base System (规则库系统): 基于预定义规则 (如 if-then 逻辑) 生成输出,属于传统符号主义 AI。", "D": "Transformer"}, "answer": "D", "analysis": "当前所有主流大模型 (如 GPT、Codex、Llama 等) 的生成能力均基于 Transformer 架构实现。\n\nA. Knowledge Map (知识图谱): 用于结构化知识表示 (如实体关系),可辅助模型理解语义,但非生成架构本身。\nB. Data Flow (数据流): 描述程序中数据的流动方向 (如变量依赖关系),是程序执行过程的抽象,而非生成模型架构。\nC. Rule Base System (规则库系统): 基于预定义规则 (如 if-then 逻辑) 生成输出,属于传统符号主义 AI。"}, {"id": "real-2025年上半年-025", "index": 1709, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 25, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于需求跟踪的说法中,错误的是 ()", "options": {"A": "正向跟踪是检查设计文档、代码、测试用例等工作成果是否都能在《产品需求规格说明书》中找到出处", "B": "需求跟踪有两种方式,分别是正向跟踪和逆向跟踪", "C": "需求跟踪矩阵保存了需求与后继工作成果的对应关系", "D": "需求跟踪的目的是建立与维护「需求—设计—编程—测试」之间的一致性"}, "answer": "A", "analysis": "A 的定义是逆向跟踪,正向跟踪是检查《产品需求规格说明书》中的每个需求是否都能在后继工作成果中找到对应点。"}, {"id": "real-2025年上半年-026", "index": 1710, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 26, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "软件的逆向工程是分析程序,力图在比源代码更高抽象层次上建立程序的表示过程,逆向工程有四个级别,其中,使用用户指导下的搜索与变换方法可导出以下哪两个层级 ()", "options": {"A": "内模式", "B": "概念模式", "C": "外模式", "D": "用户模式"}, "answer": "B", "analysis": "在软件的逆向工程中,逆向工程通常分为四个级别:\n\n实现级 (Implementation Level): 关注源代码的具体实现细节,如语句、变量和控制流。\n结构级 (Structural Level): 关注程序的结构元素,如模块、类、函数之间的关系和依赖。\n功能级 (Functional Level): 描述程序的功能行为,即「做什么」,而不涉及具体实现细节。\n领域级 (Domain Level): 涉及程序在特定应用领域中的含义、业务规则和上下文。\n\n用户指导下的搜索与变换方法特别适用于需要语义理解和领域知识的级别。功能级:用户可以通过指导工具搜索输入输出行为、算法或功能模式,并变换成功能规格,从而导出功能级表示。领域级:用户结合领域知识,指导工具搜索与业务规则、领域实体相关的模式,并变换成领域模型,从而导出领域级表示。\n\n实现级通常通过自动反编译或反汇编得到,不需要用户指导。结构级可以通过静态分析自动导出。"}, {"id": "real-2025年上半年-029", "index": 1711, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 29, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下 () 不能体现该架构风格的脆弱性?", "options": {"A": "管道过滤器风格的脆弱性在于构件不能并行执行", "B": "层次风格的脆弱性在于分层过多会降低性能", "C": "事件驱动风格的脆弱性在于构件间逻辑关系复杂容易死循环", "D": "微服务架构的脆弱性在于其分布式管理的复杂度"}, "answer": "A", "analysis": "A 是管道过滤器风格本身的定义,不是其脆弱性。"}, {"id": "real-2025年上半年-030", "index": 1712, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 30, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在数据流图中,描述数据流可以产生 b 数据和 c 数据,但是不能同时产生 b 和 c 数据的是 () 符号", "options": {"A": "⊕ (加号)", "B": "* (星号)", "C": "‖ (并行)", "D": "⊻ (异或)"}, "answer": "D", "analysis": "在数据流图中,题目描述的「数据流可以产生 b 或 c，但不能同时产生」属于互斥选择关系。异或符号 (XOR) 表示互斥选择,即两个选项中只能选择一个,不能同时成立,完全符合题目要求。"}, {"id": "real-2025年上半年-036", "index": 1713, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 36, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在面向对象分析建模时,用例模型不包含哪种关系 ()", "options": {"A": "包含", "B": "扩展", "C": "泛化", "D": "聚合"}, "answer": "D", "analysis": "聚合属于分析模型的关系,不属于用例模型中的关系。用例模型中的关系包括包含 (include)、扩展 (extend) 和泛化 (generalization)。"}, {"id": "real-2025年上半年-037", "index": 1714, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 37, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "以下 () 开发模型增加了风险评估的环节", "options": {"A": "瀑布模型", "B": "螺旋模型", "C": "V 模型", "D": "增量模型"}, "answer": "B", "analysis": "强调风险,很明显是螺旋模型;螺旋模型四个环节分别是目标设定、风险分析、开发和有效性验证、评审。"}, {"id": "real-2025年上半年-038", "index": 1715, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 38, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "某项目包括 8 个作业 A~H,每天需要间接费用 5 万元,完成各作业所需的时间与直接费用、赶进度时每天需要增加的费用以及作业之间的衔接关系见下表。根据这些数据,以最低成本完成该项目需要 () 天。", "options": {"A": "13", "B": "14", "C": "15", "D": "16"}, "answer": "B", "analysis": "本题是项目管理中时间管理的关键路径问题。关键路径为 B-G-H,正常情况下该项目的工期为 8+4+3=15 天,所需经费=总直接费用+天数×每天的间接费用=150+15×5=225 万元。\n\n为了将项目压缩工期 1 天,则必须将关键路径上的某个作业压缩 1 天。关键路径上的三个作业 B、G、H 压缩每天需要增加的费用分别为 6、3、6 万元,显然应将 G 压缩 1 天,需要增加费用 3 万元,但会节省间接费用 5 万元,所以总成本将降为 223 万元,工期将是 14 天。\n\n此时,关键路径有两条: B-G-H 和 B-C。如果项目要再压缩 1 天,则需要在每条关键路径上都压缩 1 天,而且赶进度总增加的费用应低于 5 万元才能节省总成本。如果 B 压缩 1 天,则总成本将增加 6-5=1 万元;如果 C 和 G 都压缩 1 天,则总成本将增加 3+3-5=1 万元。\n\n因此,只能压缩 G 1 天,以最低成本 (223 万元) 完成该项目需要 14 天。"}, {"id": "real-2025年上半年-039", "index": 1716, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 39, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在面向对象开发中,() 是指一个对象在将另一个对象的能力与特点进行完全的继承之后,又继承了其他对象所包含的相应内容,结果导致这个对象所具有的能力与特点大于等于父对象,实现了对于父对象的包含", "options": {"A": "包含继承", "B": "特化继承", "C": "特别继承", "D": "取代继承"}, "answer": "A", "analysis": "如果按照继承源进行划分,则可以分为单继承与多继承;如果从继承中包含的内容进行划分,则继承可以分为 4 类:\n\n取代继承: 一个对象在继承另一个对象的能力与特点之后将父对象进行取代。\n包含继承: 一个对象在将另一个对象的能力与特点进行完全的继承之后,又继承了其他对象所包含的相应内容,结果导致这个对象所具有的能力与特点大于等于父对象。\n受限继承: 子类通过继承父类,但限制或减少父类接口的可见性,使子类对外暴露的功能比父类更少。\n特化继承: 子类继承父类后,扩展或修改父类的行为,使其更具体化,但保持父类接口的完整性。"}, {"id": "real-2025年上半年-040", "index": 1717, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 40, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "总共有 100 个人,其中,27 个人会 Java,35 个人会 C 语言,42 个人会 Python,10 个人既会 Java 又会 C 语言,15 个人既会 C 又会 Python,12 个人既会 Java 又会 Python,5 个人三门语言都会,那么 () 个人什么都不会。", "options": {"A": "25", "B": "26", "C": "27", "D": "28"}, "answer": "D", "analysis": "计算至少会一门语言的人数,使用容斥原理公式:\n|J∪C∪P| = |J| + |C| + |P| - |J∩C| - |J∩P| - |C∩P| + |J∩C∩P|\n= 27 + 35 + 42 - 10 - 12 - 15 + 5 = 72\n\n因此,至少会一门语言的人数为 72。\n总人数为 100,所以什么都不会的人数为: 100 - 72 = 28。"}, {"id": "real-2025年上半年-041", "index": 1718, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 41, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下 () 能实现 RESTful 对于资源进行部分更新的请求方法?", "options": {"A": "Part", "B": "POST: 通常用于创建新资源 (Create),而非更新。虽然技术上可通过 POST 实现部分更新,但不符合 RESTful 语义规范。", "C": "PUT: 用于整体替换资源 (Replace)。客户端必须提供资源的完整表示,缺失字段会被重置为默认值 (而非部分更新)。", "D": "PATCH: 专为部分更新设计。客户端仅需发送需修改的字段 (如 JSON Patch 格式),服务器仅更新指定部分,符合 RESTful 原则。"}, "answer": "D", "analysis": "A. Part: HTTP 协议中不存在名为 Part 的标准方法,属于干扰项。\nB. POST: 通常用于创建新资源 (Create),而非更新。虽然技术上可通过 POST 实现部分更新,但不符合 RESTful 语义规范。\nC. PUT: 用于整体替换资源 (Replace)。客户端必须提供资源的完整表示,缺失字段会被重置为默认值 (而非部分更新)。\nD. PATCH: 专为部分更新设计。客户端仅需发送需修改的字段 (如 JSON Patch 格式),服务器仅更新指定部分,符合 RESTful 原则。"}, {"id": "real-2025年上半年-042", "index": 1719, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 42, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "以下 () 算法能够满足强实时性要求?", "options": {"A": "First In First Deadline: 非标准术语,该策略无法保证强实时性,因为它不动态调整优先级以满足紧迫截止时间。", "B": "Least Laxity First (LLF): 最少松弛时间优先算法,可以满足强实时性要求,但实现复杂,且在任务切换频繁时开销较大。", "C": "Earlier Deadline First (EDF): 最早截止时间优先算法,总是选择截止时间最早的任务执行。EDF 在单处理器上是最优的动态优先级调度算法,能够保证所有任务在截止时间前完成,因此满足强实时性要求。", "D": "Rate Monotonic Scheduling (RMS): 速率单调调度算法,基于任务周期分配静态优先级,当利用率较高时可能失败,因此不保证强实时性。"}, "answer": "C", "analysis": "在实时系统中,强实时性要求任务必须在严格的截止时间前完成,否则会导致系统失败。\n\nA. First In First Deadline: 非标准术语,该策略无法保证强实时性,因为它不动态调整优先级以满足紧迫截止时间。\nB. Least Laxity First (LLF): 最少松弛时间优先算法,可以满足强实时性要求,但实现复杂,且在任务切换频繁时开销较大。\nC. Earlier Deadline First (EDF): 最早截止时间优先算法,总是选择截止时间最早的任务执行。EDF 在单处理器上是最优的动态优先级调度算法,能够保证所有任务在截止时间前完成,因此满足强实时性要求。\nD. Rate Monotonic Scheduling (RMS): 速率单调调度算法,基于任务周期分配静态优先级,当利用率较高时可能失败,因此不保证强实时性。"}, {"id": "real-2025年上半年-043", "index": 1720, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 43, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在 Scrum 中,使用产品 Backlog 来管理产品的需求,产品 Backlog 是一个按照 () 排序的需求列表。", "options": {"A": "实现难易度", "B": "商业价值", "C": "最后期限", "D": "技术成熟度"}, "answer": "B", "analysis": "在 Scrum 中,使用产品 Backlog 来管理产品的需求,产品 Backlog 是一个按照商业价值排序的需求列表。根据 Backlog 的内容,将整个开发过程被分为若干个短的迭代周期 (Sprint)。\n\n在 Sprint 中,Scrum 团队从产品 Backlog 中挑选最高优先级的需求组成 Sprint Backlog。在每个迭代结束时,Scrum 团队将递交潜在可交付的产品增量。"}, {"id": "real-2025年上半年-044", "index": 1721, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 44, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "单元测试的依据是 ()", "options": {"A": "概要设计", "B": "需求分析", "C": "详细设计", "D": "用户需求"}, "answer": "C", "analysis": "单元测试针对的是编码阶段,但测试依据是其上一个阶段,也就是详细设计阶段。注意审题。"}, {"id": "real-2025年上半年-045", "index": 1722, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 45, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "以下 () 不属于项目管理和支撑组输出的内容?", "options": {"A": "源代码", "B": "工作计划", "C": "项目追踪", "D": "项目质量报告"}, "answer": "A", "analysis": "在项目管理中,项目管理和支撑组主要负责项目的规划、监控、协调和质量保障,其输出内容通常包括管理文档、报告和过程产物。源代码很明显是开发团队输出的,不属于管理类产物。"}, {"id": "real-2025年上半年-046", "index": 1723, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 46, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "RUP 设计及确定体系结构及工作计划及资源配置是 () 阶段?", "options": {"A": "初始阶段", "B": "细化阶段", "C": "构建阶段", "D": "交付阶段"}, "answer": "B", "analysis": "已经明确说了确定体系结构,也就是确定架构,架构设计,在细化阶段。"}, {"id": "real-2025年上半年-047", "index": 1724, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 47, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于白盒测试中,各种不同类型覆盖的说法中,正确的是 ()", "options": {"A": "条件覆盖程度强于路径覆盖", "B": "语句覆盖程度强于路径覆盖", "C": "条件覆盖不一定包含判定覆盖,判定覆盖也不一定包含条件覆盖", "D": "条件/判定组合覆盖要求每个判定中所有条件可能的组合均被测试"}, "answer": "C", "analysis": "语句覆盖最低,路径覆盖最高,条件和判定不一定互相包含,条件/判定组合覆盖是要求既满足条件又满足判定覆盖,D 选项描述的是组合条件覆盖。"}, {"id": "real-2025年上半年-048", "index": 1725, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 48, "sourceType": "real", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "软件著作权申请需要提供下列 () 审查材料", "options": {"A": "程序和设计文档", "B": "程序和软件著作权归属合同", "C": "数据和设计文档", "D": "程序和数据"}, "answer": "A", "analysis": "必备材料清单包括: 申请表、程序、设计说明书、身份证明文件、权利归属证明 (不一定是合同)。"}, {"id": "real-2025年上半年-049", "index": 1726, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 49, "sourceType": "real", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "软件著作权中,() 决定了用户具有公开内容的权利", "options": {"A": "发表权", "B": "专利权", "C": "发行权", "D": "新闻传播"}, "answer": "A", "analysis": "公开内容,顾名思义肯定是公开发表。"}, {"id": "real-2025年上半年-050", "index": 1727, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 50, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在工业大模型的分层架构中,() 处于基础层和应用层中间?", "options": {"A": "交互层", "B": "中间层", "C": "网络层", "D": "数据层"}, "answer": "B", "analysis": "工业大模型的分层是一个系统工程视角下的概念,通常可以划分为以下几个关键层次:\n\n基础层提供「粮草」(数据) 和「道路」(网络、算力)。\n中间层锻造「大脑」(模型) 并提供「兵工厂」(平台) 来训练、部署和管理它。\n应用层是「战场」,让「大脑」在具体的工业场景中解决实际问题,创造价值。\n交互层是「指挥所」和「通信器」,实现高效的人机协同。"}, {"id": "real-2025年上半年-051", "index": 1728, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 51, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "在信息系统监理工程中,有四控、三管、一协调的说法,其中,四控指的是 ()", "options": {"A": "投资控制、进度控制、质量控制、合同控制", "B": "进度控制、质量控制、合同控制、变更控制", "C": "进度控制、质量控制、合同控制、安全控制", "D": "进度控制、质量控制、投资控制、变更控制"}, "answer": "D", "analysis": "监理活动的四控三管一协调主要是指质量控制、进度控制、投资控制、变更控制、合同管理、信息管理、安全管理以及协调业主和施工方的关系。"}, {"id": "real-2025年上半年-052", "index": 1729, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 52, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下 () 不属于黑盒测试的方法?", "options": {"A": "等价类划分", "B": "因果图", "C": "路径覆盖", "D": "边界值分析"}, "answer": "C", "analysis": "送分题,路径覆盖属于白盒测试。"}, {"id": "real-2025年上半年-053", "index": 1730, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 53, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下 () 不是边缘计算的特点?", "options": {"A": "降低功耗", "B": "提高带宽", "C": "低延迟", "D": "提高安全"}, "answer": "B", "analysis": "边缘计算是指数据可以在本地端 (边缘端) 处理计算,减少传输时间,增强效率性能,其核心特点包括低延迟、减少带宽需求、提高安全性、分布式计算。"}, {"id": "real-2025年上半年-054", "index": 1731, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 54, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "下列 () 不属于可靠性的子特性", "options": {"A": "容错性", "B": "成熟性", "C": "可恢复性", "D": "稳定性"}, "answer": "D", "analysis": "根据 GB/T 16260.1 定义,从管理角度对软件系统质量进行度量,可将影响软件质量的主要因素划分为 6 种维度特性: 功能性、可靠性、易用性、效率、维护性与可移植性。其中可靠性包括容错性、易恢复性、成熟性;稳定性属于维护性的子特性。"}, {"id": "real-2025年上半年-055", "index": 1732, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 55, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于调试和测试的区别的说法中,错误的是 ()", "options": {"A": "调试一般在测试之前进行", "B": "系统测试用于检查系统是否满足需求规格说明的要求", "C": "测试的核心目标是发现问题,而调试是为了解决问题", "D": "测试的自动化程度比调试要更高"}, "answer": "A", "analysis": "一般是测试先行发现问题,然后通过调试定位问题、解决问题,调试更多依赖于人工,所以自动化程度低。"}, {"id": "real-2025年上半年-056", "index": 1733, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 56, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下属于结构化分析特点的是 ()", "options": {"A": "自底向上", "B": "面向数据流", "C": "非直接耦合", "D": "模块间数据耦合居多"}, "answer": "B", "analysis": "结构化的特点:自顶向下,逐层分解,面向数据流,阶段之间划分严格。因为结构清晰,分层调用,所以各模块之间是直接耦合,显式调用居多。"}, {"id": "real-2025年上半年-057", "index": 1734, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 57, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在 UML 状态图中,() 表示状态转换时触发的瞬时行为", "options": {"A": "初始态", "B": "原子态", "C": "活动态", "D": "动作态"}, "answer": "D", "analysis": "初始态:初始状态 (Initial State),对象生命周期的起点。\n原子态:简单状态 (Simple State),不可再分解的基础状态 (无子状态)。\n活动态:活动状态 (Activity State),状态持续期间执行的活动。\n动作态:转换动作 (Transition Action),状态转换时触发的瞬时行为。"}, {"id": "real-2025年上半年-058", "index": 1735, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 58, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "下列哪项不属于可测试性的度量指标 ()", "options": {"A": "平均故障恢复时间", "B": "故障发生的概率", "C": "测试准备时间", "D": "测试环境的准备时间"}, "answer": "B", "analysis": "这里严格来说 A、B 都不是,A、B 都跟可用性有关,而非可测试性,但学员回忆就是这样,考虑就是出题问题不严谨,所以大家了解即可。"}, {"id": "real-2025年上半年-059", "index": 1736, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 59, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在分布式系统中,实现跨平台互操作性和开放标准的关键架构模型中 __ 和 __ 是代表性概念\n1 计算池模型 2 五层沙漏 3 开放式 WebService 4 网格服务化", "options": {"A": "13", "B": "23", "C": "34", "D": "24"}, "answer": "B", "analysis": "五层沙漏 (2) 是 Web 服务架构中的经典模型,通过标准化协议层 (如传输层、消息层) 确保互操作性。开放式 WebService (3) 直接依赖于开放标准,支持跨平台通信。\n\n1 计算池模型: 一种资源管理模型,将计算资源池化以提升利用率,但不直接强调开放标准。\n4 网格服务化: 将网格资源作为服务提供,但更侧重于服务化抽象而非特定开放标准。"}, {"id": "real-2025年上半年-060", "index": 1737, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 60, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "OSI 开放系统互联安全体系的 5 类安全服务包括 ()", "options": {"A": "鉴别、访问控制、机密性服务、完整性服务、不可抵赖性服务", "B": "认证、访问控制、机密性服务、完整性服务、不可抵赖性服务", "C": "认证、鉴别、机密性服务、完整性服务、不可抵赖性服务", "D": "认证、鉴别、访问控制、机密性服务、完整性服务"}, "answer": "A", "analysis": "OSI 开放系统互联安全体系的 5 类安全服务包括鉴别、访问控制、数据机密性、数据完整性和抗抵赖性。"}, {"id": "real-2025年上半年-061", "index": 1738, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 61, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "有关系模式 R(a,b,c,d),其依赖关系为 {a→cd,c→b},则 R 的候选码是 ()", "options": {"A": "a", "B": "b", "C": "c", "D": "d"}, "answer": "A", "analysis": "第一步,找出没在右边出现过的 a,第二步验证 a 能不能推出其他的 bcd,发现是可以的,因此 a 就是候选键。"}, {"id": "real-2025年上半年-062", "index": 1739, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 62, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "下面 () 协议定义了服务请求者和服务提供者之间的数据传输规范", "options": {"A": "UDDI", "B": "SOAP", "C": "WSDL", "D": "XML"}, "answer": "B", "analysis": "UDDI 可以用来注册服务或查找服务;SOAP 用来在服务请求者和提供者之间传输数据,以 XML 文件传输;WSDL 用于描述语言。这里更应该选 SOAP 而非 XML,SOAP 是规定规范格式。"}, {"id": "real-2025年上半年-063", "index": 1740, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 63, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "数据中台的应用场景不包括 ()", "options": {"A": "风险控制: 中台整合交易、用户行为等数据,提供实时反欺诈、信用评估等数据服务。", "B": "数据治理: 中台的核心基础,通过元数据管理、质量标准等实现数据规范化。", "C": "数据库扩容", "D": "用户画像: 中台融合多源数据构建标签体系,支撑精准营销。"}, "answer": "C", "analysis": "数据中台是企业级的数据能力中枢,其核心是将分散的数据整合为统一资产,通过服务化输出赋能业务快速创新。\n\n数据库扩容本质属于基础设施层 (IaaS) 的硬件资源扩展,由数据库管理员 (DBA) 或云平台实现。数据中台关注「数据价值提炼」 (如整合、建模、服务化),而非底层资源扩展。\n\n其他选项属于典型应用场景:\nA. 风险控制: 中台整合交易、用户行为等数据,提供实时反欺诈、信用评估等数据服务。\nB. 数据治理: 中台的核心基础,通过元数据管理、质量标准等实现数据规范化。\nD. 用户画像: 中台融合多源数据构建标签体系,支撑精准营销。"}, {"id": "real-2025年上半年-064", "index": 1741, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 64, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "进程从运行状态变成就绪状态的条件是 ()", "options": {"A": "主动让出 CPU", "B": "信号量执行 wait() 方法", "C": "缺页中断", "D": "请求磁盘"}, "answer": "A", "analysis": "根据进程的三态模型,从运行到就绪是时间片到,本质就是让出 CPU;BCD 都会导致进程进入阻塞状态。"}, {"id": "real-2025年上半年-065", "index": 1742, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 65, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "软件产品线的双生命周期模型中,包含的两个生命周期工程分别是 ()", "options": {"A": "领域工程和应用工程", "B": "领域工程和企业工程", "C": "企业工程和应用工程", "D": "领域工程和管理工程"}, "answer": "A", "analysis": "软件产品线的双生命周期模型是软件复用领域的核心框架,由领域工程 (Domain Engineering) 和应用工程 (Application Engineering) 两个相互关联的生命周期构成,旨在通过系统化复用提升开发效率、降低成本和保障质量。\n\n领域工程目标: 为产品家族构建可复用资产库 (如核心架构、组件、需求模型)。\n应用工程目标: 利用资产库快速派生具体产品。"}, {"id": "real-2025年上半年-066", "index": 1743, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 66, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在黑板架构风格中,数据处理单元是 ()", "options": {"A": "中央数据结构", "B": "知识源", "C": "黑板", "D": "控制器"}, "answer": "A", "analysis": "在黑板架构风格中,中央数据结构起到了数据处理单元的作用。它是所有组件共享的数据存储区域,所有的知识源都会访问和更新这个中央数据结构。\n\n仓库 (Repository) 是存储和维护数据的中心场所。在仓库风格中,有两种不同的构件: 中央数据结构说明当前数据的状态以及一组对中央数据进行操作的独立构件。"}, {"id": "real-2025年上半年-067", "index": 1744, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 67, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "当前系统中有 5 个对象,每个对象有 2 种不同的取值,如果要把这 5 个对象的所有取值都组合一遍,一共有 () 组合?", "options": {"A": "25", "B": "32", "C": "10", "D": "20"}, "answer": "B", "analysis": "总的取值组合是 2 的 5 次方,也就是 32。"}, {"id": "real-2025年上半年-068", "index": 1745, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 68, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在机器学习领域中,将本身没有类别的样本聚集成不同的组,并且对每个这样的组进行描述的过程是 ()", "options": {"A": "聚类分析", "B": "分类分析", "C": "主成分分析", "D": "关联分析"}, "answer": "A", "analysis": "聚类分析是根据「物以类聚」的原理,将本身没有类别的样本聚集成不同的组,并且对每个这样的组进行描述的过程。"}, {"id": "real-2025年上半年-069", "index": 1746, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 69, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "回归测试的目的是 ()", "options": {"A": "验证新开发功能的正确性", "B": "确保软件修改后原有功能不受影响", "C": "首次发现系统中的潜在缺陷", "D": "优化用户界面交互体验"}, "answer": "B", "analysis": "回归测试目的是判断修改是否正确以及是否影响了原功能。"}, {"id": "real-2025年上半年-070", "index": 1747, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 70, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "对敏感数据进行加密后存储保证了该数据的 ()", "options": {"A": "机密性", "B": "完整性", "C": "可用性", "D": "抗抵赖性"}, "answer": "A", "analysis": "加密,是机密性。"}, {"id": "real-2025年上半年-071", "index": 1748, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 71, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "从管理角度出发,可以将影响软件质量的因素划分为 3 组,分别反映用户在使用软件产品时的 3 种不同倾向和观点。这 3 组分别是 ()", "options": {"A": "产品运行、产品修改和产品维护", "B": "产品研发、产品运行和产品修改", "C": "产品设计、产品研发和产品维护", "D": "产品运行、产品修改和产品转移"}, "answer": "D", "analysis": "McCall 软件质量模型将影响软件质量的因素划分为三组:\n\n产品运行: 正确性、可靠性、效率、完整性、可用性。\n产品修改: 可维修性、灵活性、可测试性。\n产品转移: 可移植性、可复用性、互操作性。"}, {"id": "real-2025年上半年-072", "index": 1749, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 72, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "下列 SOA 中间件中,() 能够进一步解耦服务请求者和服务提供者", "options": {"A": "WebService", "B": "ESB", "C": "RPC", "D": "服务注册表: 用于服务的注册与发现 (如 UDDI),但仅解决「如何找到服务」的问题。请求者发现服务后,仍需直接调用提供者。"}, "answer": "B", "analysis": "ESB 作为消息中介层,通过路由、协议转换、消息转换等功能,使服务请求者与提供者无需直接通信。\n\nWebService: 仅是服务暴露的技术标准 (如 SOAP/REST),但请求者需直接依赖提供者的端点 URL 和接口。\nRPC: 远程调用技术,本质是点对点通信,请求者与提供者紧密耦合。\nD. 服务注册表: 用于服务的注册与发现 (如 UDDI),但仅解决「如何找到服务」的问题。请求者发现服务后,仍需直接调用提供者。"}, {"id": "real-2025年上半年-073", "index": 1750, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 73, "sourceType": "real", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "数据库内模式描述的内容包括 ()", "options": {"A": "外部记录类型", "B": "概念记录类型", "C": "内部记录类型", "D": "记录间的联系、操作"}, "answer": "C", "analysis": "内模式也称存储模式,是数据物理结构和存储方式的描述,是数据在数据库内部的表示方式。定义所有的内部记录类型、索引和文件的组织方式,以及数据控制方面的细节。"}, {"id": "real-2025年上半年-074", "index": 1751, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 74, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "领域驱动设计的分层结构中,() 能够承载业务规则和状态,并且与技术实现无关。", "options": {"A": "用户接口层", "B": "应用层", "C": "领域层", "D": "基础设施层"}, "answer": "C", "analysis": "领域驱动设计 (Domain-Driven Design, DDD) 的分层结构是解耦业务逻辑与技术实现的核心框架:\n\n用户接口层 (User Interface Layer): 处理外部输入 (HTTP 请求、消息、CLI 命令等),封装输出。\n应用层 (Application Layer): 编排领域对象完成业务用例,不包含业务规则。\n领域层 (Domain Layer): 业务核心,承载业务规则和状态,与技术实现无关。\n基础设施层 (Infrastructure Layer): 实现技术细节,为上层提供支撑。"}, {"id": "real-2025年上半年-075", "index": 1752, "term": "2025年上半年", "paper": "2025年上半年", "questionNo": 75, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在某系统中,对用户认证的数据进行加密存储,属于 () 质量属性场景", "options": {"A": "安全性", "B": "机密性", "C": "可用性", "D": "性能"}, "answer": "A", "analysis": "机密性不属于质量属性。这里很明显只能选安全。"}, {"id": "real-2025年下半年-001", "index": 1753, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 1, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "九个项目A11, A12, A13, A21, A22, A23, A31, A32, A33的成本从1百万，2百万，……，9百万各不相同，但并不顺序对应。已知A11与A21、A12与A22的成本都有一倍关系，A11与A12、A21与A31、A22与A23、A23与A33的成本都相差1百万。由此可以推断，项目A22的成本是（）百万。", "options": {"A": "6", "B": "8", "C": "2", "D": "4"}, "answer": "D", "analysis": "根据约束条件进行逻辑推理。A11与A21有一倍关系，A12与A22有一倍关系，且多组之间相差1百万。通过枚举满足所有约束的唯一解，可推出A22=4百万。"}, {"id": "real-2025年下半年-002", "index": 1754, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 2, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "（）通常为一个迭代过程，其中的活动包括需求发现、需求分类和组织、需求协商、需求文档化。", "options": {"A": "需求确认", "B": "需求管理", "C": "需求抽取", "D": "需求规格说明"}, "answer": "C", "analysis": "需求抽取（也称需求获取/需求发现）是一个迭代过程，其活动包括需求发现、需求分类和组织、需求协商、需求文档化。需求确认是验证需求的正确性，需求管理是对需求变更的控制。"}, {"id": "real-2025年下半年-003", "index": 1755, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 3, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "项目范围管理中，范围定义的输入包括（）。", "options": {"A": "生产项目计划、项目可交付物说明、信息系统要求说明和项目质量标准", "B": "项目章程、项目范围管理计划、产品范围说明书和变更申请", "C": "项目范围描述、产品范围说明书、项目章程和WBS模板", "D": "项目章程、项目范围管理计划、批准的变更请求和组织过程资产"}, "answer": "D", "analysis": "范围定义的输入包括项目章程、项目范围管理计划、组织过程资产、批准的变更请求等。"}, {"id": "real-2025年下半年-004", "index": 1756, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 4, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某公司拟开发一套在线游戏系统，该系统的设计目标之一是支持用户自行定义游戏对象属性、行为和对象之间的交互关系。为了实现上述目标，公司应该采用（）架构风格最为合适。", "options": {"A": "主程序-子程序", "B": "解释器", "C": "管道-过滤器", "D": "黑板"}, "answer": "B", "analysis": "解释器架构风格允许用户自定义规则和行为，适合需要用户自行定义对象属性、行为和交互关系的场景。解释器可以动态解释和执行用户定义的脚本和规则。"}, {"id": "real-2025年下半年-005", "index": 1757, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 5, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "某软件公司根据客户需求，组织研发出一套应用软件，并与本公司的职工签订了保密协议，但是本公司某研发人员将该软件中的算法和部分程序代码公开发表。该软件研发人员（66），该软件公司丧失了这套应用软件的（67）。\n\n（第66空）:", "options": {"A": "违反了保密协议", "B": "不违反保密协议，因为算法不受保护", "C": "不违反保密协议，因为程序代码可以发表", "D": "违反了著作权法"}, "answer": "A", "analysis": "研发人员与公司签订了保密协议，将受保密协议约束的算法和代码公开发表，违反了保密协议。公司因此丧失了商业秘密权（因为信息已公开，不再具有秘密性）。"}, {"id": "real-2025年下半年-006", "index": 1758, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 6, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "对于遗留系统的评价框架如下图所示，那么处于\"高水平、低价值\"区的遗留系统适合于采用的演化策略为（）。", "options": {"A": "集成", "B": "淘汰", "C": "改造", "D": "继承"}, "answer": "C", "analysis": "遗留系统评价框架中：\"高水平高价值\"→继承，\"低水平高价值\"→集成，\"低水平低价值\"→淘汰，\"高水平低价值\"→改造。"}, {"id": "real-2025年下半年-007", "index": 1759, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 7, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在嵌入式系统设计时，下面几种存储结构中对程序员是透明的是（）。", "options": {"A": "flash存储器", "B": "内存", "C": "磁盘存储器", "D": "高速缓存"}, "answer": "D", "analysis": "高速缓存（Cache）对程序员是透明的，由硬件自动管理数据的调入和替换，程序员无需也无法直接操作Cache。"}, {"id": "real-2025年下半年-008", "index": 1760, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 8, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "多道程序设计技术不仅使CPU得到充分利用，同时改善I/O设备和内存的（），从而提高了整个系统的资源利用率和系统吞吐量。", "options": {"A": "稳定性", "B": "可靠性", "C": "利用率", "D": "兼容性"}, "answer": "C", "analysis": "多道程序设计的核心目标是提高系统资源利用率。通过让多个程序并发执行，提高CPU、I/O设备和内存的利用率。"}, {"id": "real-2025年下半年-009", "index": 1761, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 9, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "（问题1）针对最终架构而非详细设计进行评估。（问题2）用于分析多种质量属性之间的折中。", "options": {"A": "SAEM", "B": "ATAM", "C": "SAAM", "D": "CBAM"}, "answer": "B", "analysis": "ATAM（Architecture Tradeoff Analysis Method）针对最终架构进行评估，分析质量属性之间的权衡。CBAM（Cost Benefit Analysis Method）用于分析成本效益的折中。SAAM主要关注可修改性。"}, {"id": "real-2025年下半年-010", "index": 1762, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 10, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在结构化分析方法中，用（27）表示功能模型，用（28）表示行为模型。\n\n（第27空）:", "options": {"A": "用例图", "B": "对象图", "C": "ER图", "D": "DFD"}, "answer": "D", "analysis": "结构化分析方法中，功能模型用数据流图（DFD）表示，数据模型用E-R图表示，行为模型用状态转换图（STD）表示。"}, {"id": "real-2025年下半年-011", "index": 1763, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 11, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "软件架构是降低成本、改进质量、按时和按需交付产品的关键因素。软件架构设计需满足系统的（），如性能、安全性和可修改性等，并能够指导设计人员和实现人员的工作。", "options": {"A": "功能需求", "B": "质量属性", "C": "业务需求", "D": "设计约束"}, "answer": "B", "analysis": "软件架构设计的核心目标是满足系统的质量属性（非功能需求），如性能、安全性、可修改性、可用性等。"}, {"id": "real-2025年下半年-012", "index": 1764, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 12, "sourceType": "real", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "螺旋模型在（）的基础上扩展而成。", "options": {"A": "原型模型", "B": "面向对象模型", "C": "瀑布模型", "D": "快速模型"}, "answer": "A", "analysis": "螺旋模型是在原型模型的基础上扩展而成的，将原型实现的迭代特征与瀑布模型的控制方面结合，并加入了风险分析。"}, {"id": "real-2025年下半年-013", "index": 1765, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 13, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于白盒测试方法的叙述中，错误的是（）。", "options": {"A": "组合覆盖要求设计足够多的测试用例，使得每个判定中条件结果的所有可能组合最多出现一次", "B": "语句覆盖要求设计足够多的测试用例，使程序中每条语句至少执行一次", "C": "判定覆盖要求设计足够多的测试用例，使每个判定的取真和取假分支至少经历一次", "D": "条件覆盖要求设计足够多的测试用例，使每个判定中的每个条件的每种可能结果至少出现一次"}, "answer": "A", "analysis": "组合覆盖要求所有可能组合\"至少\"出现一次，而非\"最多\"出现一次。A中的\"最多\"是错误表述。"}, {"id": "real-2025年下半年-014", "index": 1766, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 14, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "以下嵌入式处理器类型中不具备内存管理单元（MMU）的是（10），嵌入式操作系统（11）可以运行在它上面。\n\n（第10空）:", "options": {"A": "Cortex-M3", "B": "PowerPC750", "C": "MIPS32 24K", "D": "ARM Cortex-A9"}, "answer": "A", "analysis": "Cortex-M3是ARM微控制器系列，不具备MMU，只有可选的MPU。μC/OS-II等实时操作系统可以运行在没有MMU的处理器上。"}, {"id": "real-2025年下半年-015", "index": 1767, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 15, "sourceType": "real", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "", "stem": "一项外观设计专利里面相似设计最多有（）个。", "options": {"A": "6", "B": "8", "C": "10", "D": "5"}, "answer": "C", "analysis": "根据《专利法实施细则》，一件外观设计专利申请中的相似外观设计不得超过10项。"}, {"id": "real-2025年下半年-016", "index": 1768, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 16, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某公司采用基于架构的软件设计（ABSD）方法。ABSD方法有三个基础，分别是对系统进行功能分解、采用（）实现质量属性和商业需求、采用软件模板设计软件结构。", "options": {"A": "架构风格", "B": "设计模式", "C": "架构策略", "D": "软件框架"}, "answer": "A", "analysis": "ABSD方法的三个基础：（1）功能分解；（2）采用架构风格实现质量属性和商业需求；（3）采用软件模板设计软件结构。"}, {"id": "real-2025年下半年-017", "index": 1769, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 17, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "EJB是企业级Java构件。其中，（ ）负责完成服务端与客户端的交互；（ ）用于数据持久化来简化数据库开发工作；（ ）主要用来处理异步并发访问。", "options": {"A": "Session Bean", "B": "Entity Bean", "C": "Message-driven Bean", "D": "Stateless Bean"}, "answer": "A", "analysis": "Session Bean负责完成服务端与客户端的交互，Entity Bean用于数据持久化来简化数据库开发工作，Message-driven Bean主要用来处理异步并发消息。"}, {"id": "real-2025年下半年-018", "index": 1770, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 18, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在磁盘调度管理中，假设磁盘移动臂位于21号柱面上，如果采用最短移臂调度算法，那么系统的响应序列应为（）。", "options": {"A": "①②③④⑤⑥⑦⑧⑨", "B": "④⑤①②⑥③⑧⑨⑦", "C": "⑦⑨⑧③⑥②①⑤④", "D": "④⑤②①⑥③⑧⑨⑦"}, "answer": "D", "analysis": "最短移臂调度算法（SSTF）每次选择距离当前磁头位置最近的柱面请求进行服务。从21号柱面出发，按距离最近优先原则依次响应。"}, {"id": "real-2025年下半年-019", "index": 1771, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 19, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某软件公司开发了一套图形界面显示构件库VisualComponent。用户要求为界面定制特效显示效果，如带滚动条、显示艺术字体的透明窗体等。采用（）设计模式最为合适。", "options": {"A": "装饰器（Decorator）", "B": "适配器（Adapter）", "C": "桥接（Bridge）", "D": "组合（Composite）"}, "answer": "A", "analysis": "装饰器模式动态地给对象增加额外的职责，适合为组件动态添加滚动条、艺术字体等功能。"}, {"id": "real-2025年下半年-020", "index": 1772, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 20, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "经典设计模式按目的分为（54）型、结构型和行为型；按范围分为类设计模式和（55）设计模式。", "options": {"A": "创建", "B": "功能", "C": "对象", "D": "接口"}, "answer": "A", "analysis": "GoF设计模式按目的分：创建型、结构型、行为型。按范围分：类模式和对象模式。"}, {"id": "real-2025年下半年-021", "index": 1773, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 21, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在客户机/服务器系统开发中，采用（）时，应将数据层和数据处理层放置于服务器，应用逻辑层、表示逻辑层和表示层放置于客户机。", "options": {"A": "分布式表示结构", "B": "分布式应用结构", "C": "分布式数据和应用结构", "D": "远程数据管理结构"}, "answer": "D", "analysis": "远程数据管理结构将数据层和数据处理层放在服务器端，其余放在客户机端（胖客户端模式）。"}, {"id": "real-2025年下半年-022", "index": 1774, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 22, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "结构化设计是一种面向数据流的设计方法，以下不属于结构化设计工具的是（）。", "options": {"A": "顺序图", "B": "程序流程图", "C": "HIPO图", "D": "盒图"}, "answer": "A", "analysis": "顺序图是UML面向对象工具，不属于结构化设计。程序流程图、HIPO图、盒图（N-S图）都是结构化设计工具。"}, {"id": "real-2025年下半年-023", "index": 1775, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 23, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于面向对象软件测试的叙述中，正确的是（）。", "options": {"A": "存在多态的情况下，为了达到较高的测试充分性，应对所有可能的绑定都进行测试", "B": "假设类B是类A的子类，如果类A已经充分测试，测试类B时不需要再测试继承的方法", "C": "面向对象软件的类测试等价于传统软件测试中的单元测试", "D": "面向对象测试的整体目标与传统软件测试不同"}, "answer": "A", "analysis": "多态情况下需要测试所有可能的绑定。B错误因为子类上下文不同；D错误，目标相同都是发现错误。"}, {"id": "real-2025年下半年-024", "index": 1776, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 24, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "软件构件是独立可部署的软件单元，与对象不同，构件（）。", "options": {"A": "利用工厂方法来创建自己的实例", "B": "可以利用容器管理自身对外的可见状态", "C": "之间可以共享一个类元素", "D": "没有外部可见的状态"}, "answer": "D", "analysis": "构件与对象的关键区别是构件没有外部可见的状态。构件通过接口提供服务，内部状态对外不可见。"}, {"id": "real-2025年下半年-025", "index": 1777, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 25, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "企业信息资源集成管理的前提是对企业（ ）的集成，其核心是对企业（ ）的集成。", "options": {"A": "信息处理", "B": "信息功能", "C": "信息设施", "D": "信息活动"}, "answer": "C", "analysis": "前提是信息设施的集成（基础设施），核心是信息功能的集成。"}, {"id": "real-2025年下半年-026", "index": 1778, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 26, "sourceType": "real", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "关于NPU（神经网络处理器）的说法，正确的是（）。", "options": {"A": "计算能力强，但能耗高", "B": "设计复杂，性能一般", "C": "计算速度快，性能好", "D": "应用广泛，但成本高"}, "answer": "C", "analysis": "NPU是专为神经网络计算设计的处理器，具有计算速度快、性能好、能效比高的特点。"}, {"id": "real-2025年下半年-027", "index": 1779, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 27, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "系统测试的依据是（）。", "options": {"A": "软件详细设计说明书", "B": "软件用户手册", "C": "软件需求规格说明书", "D": "软件概要设计说明书"}, "answer": "C", "analysis": "系统测试依据需求规格说明书。单元测试→详细设计，集成测试→概要设计，系统测试→需求规格说明书。"}, {"id": "real-2025年下半年-028", "index": 1780, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 28, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某公司拟开发一个扫地机器人，需要响应外界环境触发的突发事件，根据自身状态进行动态调整。该机器人控制程序最适合采用（）架构风格。", "options": {"A": "解释器", "B": "规则系统", "C": "管道-过滤器", "D": "黑板"}, "answer": "B", "analysis": "规则系统适合根据预定义规则响应环境变化并动态调整行为的场景。"}, {"id": "real-2025年下半年-029", "index": 1781, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 29, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于构件的描述中，（）是不正确的。", "options": {"A": "构件是二进制形式，无需在部署前编译", "B": "构件是一个独立的软件单元", "C": "构件是通用实体，不能对构件进行配置来适应应用系统", "D": "构件元数据是构件本身相关的数据描述"}, "answer": "C", "analysis": "构件可以通过配置和参数化来适应不同的应用系统，C选项\"不能对构件进行配置\"是错误的。"}, {"id": "real-2025年下半年-030", "index": 1782, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 30, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下有关构件特性的描述中，说法不正确的是（）。", "options": {"A": "构件作为部署单元，是可拆分的", "B": "构件可作为第三方的组装单元", "C": "构件是独立部署单元", "D": "构件没有外部的可见状态"}, "answer": "A", "analysis": "构件作为独立部署单元是不可拆分的（原子性），必须作为整体部署。"}, {"id": "real-2025年下半年-031", "index": 1783, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 31, "sourceType": "real", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在实际应用中，用户通常依靠评价程序来测试系统性能。以下评价程序中，（）的评测准确程度最低。", "options": {"A": "真实程序", "B": "核心程序", "C": "小型基准测试程序", "D": "合成基准测试程序"}, "answer": "D", "analysis": "评测准确程度从高到低：真实程序 > 核心程序 > 小型基准测试程序 > 合成基准测试程序。"}, {"id": "real-2025年下半年-032", "index": 1784, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 32, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "正确识别风险点、非风险点、敏感点和权衡点是进行软件架构评价的关键步骤。其中（62）是实现一个特定质量属性的关键特征。\"改变加密的级别可能会对安全性和性能都产生显著的影响\"是（63）的实例。\n\n（第62空）:", "options": {"A": "风险点", "B": "非风险点", "C": "敏感点", "D": "权衡点"}, "answer": "C", "analysis": "敏感点是实现特定质量属性的关键特征。权衡点是影响多个质量属性的特性——\"改变加密级别同时影响安全性和性能\"就是权衡点的典型实例。"}, {"id": "real-2025年下半年-033", "index": 1785, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 33, "sourceType": "real", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "程序员甲将其编写完成的某软件程序发给同事乙并进行讨论，之后甲放弃该程序并决定重新开发，后来乙将该程序稍加修改并署自己名在某技术论坛发布。以下说法中，正确的是（）。", "options": {"A": "乙对该程序进行了修改，因此乙享有修改后程序的著作权", "B": "甲已放弃该程序，因此乙有权使用", "C": "该程序著作权仍属于甲，乙的行为侵犯了甲的著作权", "D": "甲将程序发给乙，视为甲授权乙使用"}, "answer": "C", "analysis": "软件著作权自开发完成之日起产生，甲是原始作者。甲放弃重新开发不等于放弃著作权。乙未经授权修改并署名发布，侵犯了甲的署名权和修改权。"}, {"id": "real-2025年下半年-034", "index": 1786, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 34, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "以下关于计算机内存管理的描述中，（）属于段页式内存管理的描述。", "options": {"A": "程序按逻辑分为多段，每一段内又进行分页，使用段页表来进行管理", "B": "一个程序就是一段，使用基址极限对来进行管理", "C": "一个程序分为多个固定大小的页面进行管理", "D": "程序按逻辑分为多段，使用段表进行管理"}, "answer": "A", "analysis": "段页式内存管理先将程序按逻辑分段，再对每段进行分页。B描述的是简单段式管理，C描述的是页式管理，D描述的是段式管理。"}, {"id": "real-2025年下半年-035", "index": 1787, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 35, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在构件组装过程中，一个构件直接调用由另一个构件所提供的服务时，这种组装方式称为（）。", "options": {"A": "层次组装", "B": "点对点组装", "C": "顺序组装", "D": "叠加组装"}, "answer": "C", "analysis": "顺序组装是指一个构件直接调用另一个构件提供的服务，形成调用-被调用的关系。"}, {"id": "real-2025年下半年-036", "index": 1788, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 36, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "操作系统低优先级进程被高优先级进程抢占或者时间片用光，由执行态变为（）状态。", "options": {"A": "挂起", "B": "就绪", "C": "阻塞", "D": "睡眠"}, "answer": "B", "analysis": "进程被抢占或时间片用光时，从执行态（运行态）变为就绪态，等待CPU重新调度。阻塞是等待I/O等事件，挂起是被移出内存。"}, {"id": "real-2025年下半年-037", "index": 1789, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 37, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "系统架构的4+1视图是下面哪几个视图？", "options": {"A": "逻辑视图、用例视图、进程视图、物理视图和场景视图", "B": "逻辑视图、实现视图、进程视图、物理视图和部署视图", "C": "逻辑视图、用例视图、进程视图、物理视图和开发视图", "D": "逻辑视图、开发视图、进程视图、物理视图和场景视图"}, "answer": "D", "analysis": "Kruchten的4+1视图模型包括：逻辑视图、开发视图（实现视图）、进程视图、物理视图（部署视图）和场景视图（用例视图/+1）。"}, {"id": "real-2025年下半年-038", "index": 1790, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 38, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以编译器为例，其主流架构经历了管道-过滤器到数据共享为中心的转变过程。以下关于编译器架构的叙述中，错误的是（）。", "options": {"A": "早期的编译器采用管道-过滤器架构风格", "B": "现代编译器采用以数据共享为中心的架构风格，即仓库风格", "C": "在管道-过滤器架构下，各阶段的结果需要在各过滤器间以符号表的形式传递", "D": "现代编译器中语法树和符号表是数据中心"}, "answer": "C", "analysis": "管道-过滤器架构下，各阶段的结果通过管道以数据流的形式传递，而非以符号表的形式。符号表是仓库风格中数据共享中心的核心数据结构。"}, {"id": "real-2025年下半年-039", "index": 1791, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 39, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "假设系统采用段式存储管理方法，进程P的段表如下所示。逻辑地址（）不能转换为对应的物理地址。", "options": {"A": "(1,30)和(3,290)", "B": "(2,88)和(4,100)", "C": "(0,430)和(3,290)", "D": "(1,30)和(2,88)"}, "answer": "C", "analysis": "段式存储管理中，逻辑地址由（段号，段内偏移）组成。如果段内偏移超过该段的段长，则会产生地址越界错误，无法转换为物理地址。需要根据段表中各段的段长进行判断。"}, {"id": "real-2025年下半年-040", "index": 1792, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 40, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "构件组装成软件系统的过程可以分为三个不同的层次：（）。", "options": {"A": "连接、集成和演化", "B": "初始化、互连和集成", "C": "定制、集成和扩展", "D": "集成、扩展和演化"}, "answer": "C", "analysis": "构件组装分为三个层次：定制（Customization）、集成（Integration）和扩展（Extension）。"}, {"id": "real-2025年下半年-041", "index": 1793, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 41, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "架构描述语言（ADL）主要包括以下组成部分：组件、组件接口、（）和架构配置。", "options": {"A": "连接件", "B": "组件实现", "C": "中间件", "D": "组件交互协议"}, "answer": "A", "analysis": "ADL的核心组成部分：组件（Component）、连接件（Connector）、组件接口（Interface）和架构配置（Configuration）。"}, {"id": "real-2025年下半年-042", "index": 1794, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 42, "sourceType": "real", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "以下关于计算机性能改进的叙述中，正确的是（）。", "options": {"A": "使用虚存的计算机系统如果主存太小，则页面交换频率将增加，CPU使用效率就会降低，因此应当增加更多的内存", "B": "如果某计算机系统的CPU利用率已经很高，则增加内存可以显著提高系统性能", "C": "如果磁盘利用率不高，则减少内存不会影响系统性能", "D": "增加CPU数量总是能提高系统的性能"}, "answer": "A", "analysis": "虚存系统中主存过小会导致频繁页面交换（抖动），CPU大量时间花在处理页面中断上，效率降低。增加内存可以减少页面交换，提高CPU利用效率。"}, {"id": "real-2025年下半年-043", "index": 1795, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 43, "sourceType": "real", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "GPU目前已广泛应用于各行各业，最新的GPU峰值性能可高达（）以上。", "options": {"A": "1 TFlops", "B": "10 TFlops", "C": "100 TFlops", "D": "1000 TFlops"}, "answer": "C", "analysis": "最新的高端GPU（如NVIDIA H100、H200等）峰值性能已经超过100 TFlops（FP32精度），部分在特定精度下甚至更高。"}, {"id": "real-2025年下半年-044", "index": 1796, "term": "2025年下半年", "paper": "2025年下半年", "questionNo": 44, "sourceType": "real", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge":
