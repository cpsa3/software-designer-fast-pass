<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>软考高级·系统架构设计师 离线全真题刷题站 (1822题)</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-focus: #818cf8;
      --success: #10b981;
      --success-light: #ecfdf5;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --table-header-bg: #f1f5f9;
      --table-zebra: #f8fafc;
      --math-font: "Cambria Math", "Latin Modern Math", "STIX Two Math", Georgia, serif;
    }

    [data-theme="dark"] {
      --bg: #0b0f19;
      --card-bg: #111827;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: #1e1b4b;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #1f2937;
      --border-focus: #6366f1;
      --success: #10b981;
      --success-light: #064e3b;
      --danger: #ef4444;
      --danger-light: #7f1d1d;
      --warning: #f59e0b;
      --warning-light: #78350f;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
      --table-header-bg: #1f2937;
      --table-zebra: #161e2e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .brand-icon {
      font-size: 1.4rem;
      background: var(--primary-light);
      padding: 0.3rem 0.5rem;
      border-radius: 8px;
    }
    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.45rem 0.85rem;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover {
      background-color: var(--bg);
      border-color: var(--border-focus);
    }
    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }
    .btn-star.active {
      color: var(--warning);
      border-color: var(--warning);
      background-color: var(--warning-light);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: none;
      }
    }

    /* Sidebar Filter Panel */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .side-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .side-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .filter-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .filter-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.65rem;
      font-size: 0.825rem;
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }
    .filter-pill:hover {
      background-color: var(--bg);
    }
    .filter-pill.active {
      background-color: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
      border-color: var(--primary-light);
    }
    .pill-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg);
      padding: 0.1rem 0.4rem;
      border-radius: 10px;
    }
    .filter-pill.active .pill-count {
      background: var(--card-bg);
      color: var(--primary);
    }

    /* Search Input */
    .search-input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus {
      border-color: var(--primary);
    }

    /* Content Area */
    .content-area {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Progress Stats Bar */
    .stats-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .progress-bar-wrap {
      flex: 1;
      height: 8px;
      background-color: var(--bg);
      border-radius: 4px;
      overflow: hidden;
      margin: 0 1rem;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary) 0%, #a855f7 100%);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Main Question Card */
    .question-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .meta-tags {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-term {
      background-color: var(--primary-light);
      color: var(--primary);
    }
    .badge-module {
      background-color: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .badge-type {
      background-color: var(--success-light);
      color: #065f46;
    }
    .badge-type-mock {
      background-color: var(--warning-light);
      color: #92400e;
    }

    .q-body {
      font-size: 1.05rem;
      line-height: 1.75;
      margin-bottom: 1.5rem;
      word-break: break-word;
    }

    /* Options */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .opt-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background-color: var(--card-bg);
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .opt-item:hover {
      border-color: var(--primary);
      background-color: var(--primary-light);
    }
    .opt-letter {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      flex-shrink: 0;
    }
    .opt-text {
      flex: 1;
    }

    /* Option States */
    .opt-item.selected-correct {
      border-color: var(--success);
      background-color: var(--success-light);
    }
    .opt-item.selected-correct .opt-letter {
      background-color: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }
    .opt-item.selected-wrong {
      border-color: var(--danger);
      background-color: var(--danger-light);
    }
    .opt-item.selected-wrong .opt-letter {
      background-color: var(--danger);
      color: #ffffff;
      border-color: var(--danger);
    }
    .opt-item.show-correct {
      border-color: var(--success);
      background-color: var(--success-light);
    }
    .opt-item.show-correct .opt-letter {
      background-color: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }

    /* Feedback Banner */
    .result-banner {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
      align-items: center;
      justify-content: space-between;
    }
    .result-banner.correct {
      display: flex;
      background-color: var(--success-light);
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .result-banner.wrong {
      display: flex;
      background-color: var(--danger-light);
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    /* Explanation Box */
    .explanation-drawer {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      display: none;
      animation: fadeIn 0.2s ease-in;
    }
    .explanation-drawer.show {
      display: block;
    }
    .exp-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .exp-body {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text);
    }

    /* Card Controls Footer */
    .q-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Typography, Math, and Markdown Elements */
    .math-inline {
      font-family: var(--math-font);
      font-style: italic;
      padding: 0 0.15rem;
    }
    .math-block {
      margin: 0.75rem 0;
      padding: 0.75rem 1rem;
      background: var(--card-bg);
      border-left: 3px solid var(--primary);
      border-radius: 4px;
      text-align: center;
      font-family: var(--math-font);
      font-size: 1.05rem;
      overflow-x: auto;
    }
    .frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      padding: 0 0.2rem;
      font-size: 0.88em;
      line-height: 1.1;
    }
    .frac-num {
      border-bottom: 1.5px solid currentColor;
      padding-bottom: 1px;
    }
    .frac-den {
      padding-top: 1px;
    }
    .kbd-inline {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85em;
    }
    .quiz-ul {
      margin: 0.5rem 0 0.75rem 1.25rem;
      padding-left: 0.5rem;
    }
    .quiz-li {
      margin-bottom: 0.35rem;
      line-height: 1.65;
    }
    .quiz-p {
      margin-bottom: 0.6rem;
      line-height: 1.65;
    }

    /* Modal Sheet Grid */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 90%;
      max-width: 780px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
    }
    .modal-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-body {
      padding: 1rem 1.25rem;
      overflow-y: auto;
    }
    .sheet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
      gap: 0.5rem;
    }
    .sheet-bubble {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg);
      transition: all 0.15s ease;
    }
    .sheet-bubble:hover {
      border-color: var(--primary);
    }
    .sheet-bubble.correct {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }
    .sheet-bubble.wrong {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .sheet-bubble.current {
      box-shadow: 0 0 0 2px var(--primary);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-content">
      <div class="brand">
        <span class="brand-icon">🏛️</span>
        <div>
          <div class="brand-title">软考高级·系统架构设计师 刷题站</div>
          <div class="brand-subtitle">历年官方真题 + 模拟卷 · 离线单文件全解</div>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn" id="btn-theme" title="切换暗黑模式">🌓 主题</button>
        <button class="btn" id="btn-sheet">📑 答题卡</button>
        <button class="btn" id="btn-reset" title="清空本机刷题记录">🗑️ 重置</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main>
    <!-- Sidebar: Filters -->
    <aside class="sidebar">
      <div class="side-box">
        <div class="side-title">🔍 关键词搜索</div>
        <input type="text" id="search-input" class="search-input" placeholder="输入题干、考点或选项...">
      </div>

      <div class="side-box">
        <div class="side-title">
          <span>📅 考期筛选</span>
        </div>
        <div class="filter-list" id="term-filters">
          <!-- Filled by JS -->
        </div>
      </div>

      <div class="side-box">
        <div class="side-title">
          <span>🏛️ 考点模块</span>
        </div>
        <div class="filter-list" id="module-filters">
          <!-- Filled by JS -->
        </div>
      </div>

      <div class="side-box">
        <div class="side-title">📌 状态过滤</div>
        <div class="filter-list" id="status-filters">
          <div class="filter-pill active" data-status="all">全部题目 <span class="pill-count" id="count-all">0</span></div>
          <div class="filter-pill" data-status="unanswered">未作答 <span class="pill-count" id="count-unanswered">0</span></div>
          <div class="filter-pill" data-status="wrong">错题本 <span class="pill-count" id="count-wrong">0</span></div>
          <div class="filter-pill" data-status="starred">标星收藏 <span class="pill-count" id="count-starred">0</span></div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <section class="content-area">
      <!-- Stats Bar -->
      <div class="stats-card">
        <div class="stat-item">
          <div class="stat-value" id="stat-progress">0 / 0</div>
          <div class="stat-label">当前进度</div>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="stat-item">
          <div class="stat-value" style="color:var(--success);" id="stat-correct">0</div>
          <div class="stat-label">正确数</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" style="color:var(--danger);" id="stat-wrong">0</div>
          <div class="stat-label">错题数</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-rate">0%</div>
          <div class="stat-label">正确率</div>
        </div>
      </div>

      <!-- Question Card -->
      <div class="question-card" id="q-card">
        <div class="q-meta">
          <div class="meta-tags">
            <span class="badge badge-term" id="meta-term">2024年下半年</span>
            <span class="badge badge-module" id="meta-module">系统架构设计</span>
            <span class="badge badge-type" id="meta-type">真题</span>
            <span class="badge" style="background:var(--bg); color:var(--text-muted);" id="meta-index">#1</span>
          </div>
          <button class="btn btn-star" id="btn-star" title="收藏此题 (快捷键 S)">⭐ 收藏</button>
        </div>

        <!-- Question Body -->
        <div class="q-body" id="q-body">
          题目加载中...
        </div>

        <!-- Options Container -->
        <div class="options-list" id="options-container">
          <!-- Filled by JS -->
        </div>

        <!-- Answer Result Banner -->
        <div class="result-banner" id="result-banner">
          <span id="banner-text"></span>
          <span style="font-size:0.85rem; font-weight:normal;" id="banner-ans"></span>
        </div>

        <!-- Explanation Box -->
        <div class="explanation-drawer" id="exp-drawer">
          <div class="exp-title">💡 考点解析与推导：</div>
          <div class="exp-body" id="exp-body"></div>
        </div>

        <!-- Card Controls -->
        <div class="q-controls">
          <button class="btn" id="btn-toggle-exp">💡 查看解析</button>
          <div class="nav-actions">
            <button class="btn" id="btn-prev" title="上一题 (←)">上一题</button>
            <button class="btn btn-primary" id="btn-next" title="下一题 (→)">下一题</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Answer Sheet Modal -->
  <div class="modal-overlay" id="modal-sheet">
    <div class="modal-card">
      <div class="modal-header">
        <div style="font-weight:700;">📑 答题卡导航</div>
        <button class="btn" id="btn-close-sheet">✕ 关闭</button>
      </div>
      <div class="modal-body">
        <div class="sheet-grid" id="sheet-grid"></div>
      </div>
    </div>
  </div>

  <!-- Question Bank Embedded Data -->
  <script>
    const ALL_QUESTIONS = [{"id": "mock-2026年5月-模拟卷1-001", "index": 1, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 1, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "操作系统—进程同步与互斥", "stem": "在操作系统中，若系统中有6个并发进程共享同一互斥资源，则用于实现互斥访问的信号量初始值应设为（ ）。", "options": {"A": "0", "B": "1", "C": "5", "D": "6"}, "answer": "B", "analysis": "互斥信号量用于保证同一时刻只有一个进程访问临界资源，无论有多少个并发进程竞争，互斥信号量的初始值均为1。信号量值为1表示资源可用，为0表示资源已被占用，为负数表示等待队列中的进程数。"}, {"id": "mock-2026年5月-模拟卷1-002", "index": 2, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 2, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "操作系统—内存管理", "stem": "在段页式存储管理方案中，每次访问内存数据需要（ ）次访问主存。", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "answer": "C", "analysis": "段页式存储管理中，要访问一个数据需要：第1次访问内存查段表，得到页表起始地址；第2次访问内存查页表，得到物理块号；第3次访问内存才能读取到所需数据。因此需要3次访问主存。（若使用快表TLB可以减少访存次数，但题目问的是不使用快表的情况。）"}, {"id": "mock-2026年5月-模拟卷1-003", "index": 3, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 3, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "计算机组成—CPU性能指标", "stem": "某处理器主频为3.6GHz，每个时钟周期可执行2条指令（双发射），则该处理器的峰值处理速率为（ ）。", "options": {"A": "3600 MIPS", "B": "7200 MIPS", "C": "1800 MIPS", "D": "14400 MIPS"}, "answer": "B", "analysis": "峰值处理速率 = 主频 × 每周期指令数 = 3.6GHz × 2 = 7.2G条指令/秒 = 7200 MIPS。MIPS表示每秒百万条指令数。"}, {"id": "mock-2026年5月-模拟卷1-004", "index": 4, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 4, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "数据结构—查找算法", "stem": "对长度为n的有序数组进行二分查找，最坏情况下的时间复杂度为（ ）。", "options": {"A": "O(n)", "B": "O(n²)", "C": "O(log₂n)", "D": "O(nlog₂n)"}, "answer": "C", "analysis": "二分查找每次将搜索范围缩小一半，最坏情况下需要比较⌈log₂n⌉+1次，时间复杂度为O(log₂n)。"}, {"id": "mock-2026年5月-模拟卷1-005", "index": 5, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 5, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "计算机网络—OSI模型", "stem": "在OSI参考模型中，实现端到端的流量控制功能的是（ ）。", "options": {"A": "数据链路层", "B": "网络层", "C": "传输层", "D": "会话层"}, "answer": "C", "analysis": "OSI七层模型中，传输层负责端到端（进程到进程）的通信，包括流量控制、差错控制和连接管理等功能。数据链路层实现的是相邻节点间（点到点）的流量控制。"}, {"id": "mock-2026年5月-模拟卷1-006", "index": 6, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 6, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "操作系统—死锁", "stem": "在一个系统中，有4个进程P1~P4，每个进程需要3个同类资源才能完成工作。系统中至少需要（ ）个该类资源，才能保证不会发生死锁。", "options": {"A": "9", "B": "10", "C": "12", "D": "8"}, "answer": "A", "analysis": "死锁避免公式：最少资源数 = 进程数 ×（每进程最大需求 - 1）+ 1 = 4 × (3-1) + 1 = 9。即最坏情况下每个进程都持有2个资源等待第3个，此时再多一个资源就能让某个进程完成并释放资源。"}, {"id": "mock-2026年5月-模拟卷1-007", "index": 7, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 7, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "计算机组成—CPU寄存器", "stem": "CPU中（ ）用于存放当前正在执行的指令。", "options": {"A": "程序计数器（PC）", "B": "指令寄存器（IR）", "C": "地址寄存器（MAR）", "D": "数据寄存器（MDR）"}, "answer": "B", "analysis": "指令寄存器（IR）用于暂存当前正在执行的指令。程序计数器（PC）存放下一条要执行的指令的地址。地址寄存器（MAR）存放要访问的内存地址。数据寄存器（MDR）存放从内存中读取的数据或要写入内存的数据。"}, {"id": "mock-2026年5月-模拟卷1-008", "index": 8, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 8, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "计算机网络—IP地址与子网划分", "stem": "在IPv4协议中，某主机的IP地址为192.168.10.100，子网掩码为255.255.255.192，则该主机所在子网的网络地址为（ ）。", "options": {"A": "192.168.10.0", "B": "192.168.10.64", "C": "192.168.10.96", "D": "192.168.10.128"}, "answer": "B", "analysis": "子网掩码255.255.255.192的二进制后8位为11000000，即/26。主机IP最后一个字节100的二进制为01100100，与子网掩码11000000进行按位与运算：01100100 AND 11000000 = 01000000 = 64。所以网络地址为192.168.10.64。"}, {"id": "mock-2026年5月-模拟卷1-009", "index": 9, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 9, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "操作系统—文件管理", "stem": "文件系统中，（ ）不属于文件的物理结构。", "options": {"A": "连续分配", "B": "链接分配", "C": "索引分配", "D": "树形目录"}, "answer": "D", "analysis": "文件的物理结构（即文件在磁盘上的存储方式）包括连续分配、链接分配和索引分配三种。树形目录是文件的目录结构（逻辑组织方式），不属于文件的物理结构。"}, {"id": "mock-2026年5月-模拟卷1-010", "index": 10, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 10, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "计算机组成—指令流水线", "stem": "在流水线技术中，若一条指令的执行分为取指（IF）、译码（ID）、执行（EX）、访存（MEM）、写回（WB）5个阶段，每个阶段需要1个时钟周期，则连续执行100条指令所需的时钟周期数为（ ）。", "options": {"A": "500", "B": "104", "C": "105", "D": "109"}, "answer": "B", "analysis": "在流水线中，第一条指令需要5个时钟周期完成，此后每1个时钟周期完成1条指令。因此执行100条指令所需周期数 = 5 + (100-1) × 1 = 104个时钟周期。"}, {"id": "mock-2026年5月-模拟卷1-011", "index": 11, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 11, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件工程—需求工程", "stem": "在需求工程中，（ ）关注的是\"建立和维护需求—设计—编程—测试之间的一致性\"，确保所有需求都被实现且每个实现都有对应的需求来源。", "options": {"A": "需求验证", "B": "需求跟踪", "C": "需求变更管理", "D": "需求规格说明"}, "answer": "B", "analysis": "需求跟踪的目的是建立和维护\"需求—设计—编程—测试\"之间的一致性，确保所有需求都能在后续工作成果中找到对应点（正向跟踪），也确保每个实现都能追溯到需求来源（逆向跟踪）。"}, {"id": "mock-2026年5月-模拟卷1-012", "index": 12, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 12, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件工程—设计模式", "stem": "以下关于设计模式的描述中，正确的是（ ）。", "options": {"A": "策略模式和状态模式都属于创建型模式", "B": "抽象工厂模式提供一个接口用于创建一系列相关的对象，而无需指定具体的类", "C": "适配器模式属于行为型模式", "D": "迭代器模式属于结构型模式"}, "answer": "B", "analysis": "抽象工厂模式提供一个接口用于创建一系列相关或相互依赖的对象，而无需指定它们具体的类。策略模式和状态模式属于行为型模式（非创建型）；适配器模式属于结构型模式（非行为型）；迭代器模式属于行为型模式（非结构型）。"}, {"id": "mock-2026年5月-模拟卷1-013", "index": 13, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 13, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件工程—设计模式", "stem": "（ ）设计模式能够将一个复杂对象的构建过程与它的表示分离，使得同样的构建过程可以创建不同的表示。", "options": {"A": "原型（Prototype）", "B": "建造者（Builder）", "C": "工厂方法（Factory Method）", "D": "单例（Singleton）"}, "answer": "B", "analysis": "建造者（Builder）模式将一个复杂对象的构建过程与其表示分离，使得同样的构建过程可以创建不同的表示。原型模式通过复制已有对象来创建新对象；工厂方法模式定义创建对象的接口，由子类决定实例化哪个类；单例模式确保一个类只有一个实例。"}, {"id": "mock-2026年5月-模拟卷1-014", "index": 14, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 14, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件工程—UML", "stem": "在UML中，（ ）图用于描述对象之间的交互关系和消息的时间顺序。", "options": {"A": "类图", "B": "活动图", "C": "顺序图", "D": "状态图"}, "answer": "C", "analysis": "顺序图（Sequence Diagram）描述对象之间的交互关系，特别强调消息的时间顺序。类图描述系统的静态结构；活动图描述活动的流转；状态图描述一个对象在其生命周期中的状态变化。"}, {"id": "mock-2026年5月-模拟卷1-015", "index": 15, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 15, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件工程—白盒测试", "stem": "在白盒测试中，以下关于覆盖标准强弱关系的说法，正确的是（ ）。", "options": {"A": "判定覆盖一定包含条件覆盖", "B": "条件组合覆盖一定满足路径覆盖", "C": "路径覆盖是最强的覆盖标准", "D": "语句覆盖是最弱的覆盖标准"}, "answer": "D", "analysis": "语句覆盖是最弱的覆盖标准，只要求每条语句至少执行一次。覆盖标准强弱关系（由弱到强）：语句覆盖 < 判定覆盖 < 条件覆盖 < 判定/条件覆盖 < 条件组合覆盖 < 路径覆盖。注意：判定覆盖不一定包含条件覆盖，条件覆盖也不一定包含判定覆盖；条件组合覆盖不一定满足路径覆盖。"}, {"id": "mock-2026年5月-模拟卷1-016", "index": 16, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 16, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件工程—黑盒测试", "stem": "黑盒测试方法中，（ ）适用于输入条件之间存在组合关系和约束关系的情况。", "options": {"A": "等价类划分", "B": "边界值分析", "C": "因果图", "D": "场景法"}, "answer": "C", "analysis": "因果图法适用于输入条件之间存在组合关系和约束关系的情况，通过分析输入条件之间的因果关系、约束关系，生成判定表，再转化为测试用例。等价类划分和边界值分析主要关注单个输入条件。"}, {"id": "mock-2026年5月-模拟卷1-017", "index": 17, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 17, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件工程—软件维护", "stem": "软件维护中，为了应对未来可能的运行环境变化，主动对软件进行改进而实施的维护活动称为（ ）。", "options": {"A": "改正性维护", "B": "适应性维护", "C": "完善性维护", "D": "预防性维护"}, "answer": "D", "analysis": "预防性维护是为了适应未来可能的运行环境变化和需求变化，主动对软件进行改进。改正性维护是修复已发现的错误；适应性维护是为了适应已发生的环境变化；完善性维护是为了扩充功能或改善性能。"}, {"id": "mock-2026年5月-模拟卷1-018", "index": 18, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 18, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件工程—敏捷开发", "stem": "在敏捷开发方法Scrum中，每次Sprint的时间通常为（ ）。", "options": {"A": "1天", "B": "1-4周", "C": "3-6个月", "D": "6-12个月"}, "answer": "B", "analysis": "在Scrum中，Sprint是一个固定时间长度的迭代周期，通常为1-4周（最常见为2周）。Sprint期间团队从Sprint Backlog中完成工作项，交付潜在可交付的产品增量。"}, {"id": "mock-2026年5月-模拟卷1-019", "index": 19, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 19, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件工程—软件过程模型", "stem": "RUP（Rational Unified Process）将软件开发过程划分为四个阶段，其中（ ）阶段的主要目标是确定系统架构并制定详细的工作计划。", "options": {"A": "初始阶段", "B": "细化阶段", "C": "构建阶段", "D": "交付阶段"}, "answer": "B", "analysis": "RUP的四个阶段：初始阶段（确定项目范围和可行性）、细化阶段（确定系统架构、制定工作计划和资源配置）、构建阶段（实现系统功能）、交付阶段（部署和移交产品）。"}, {"id": "mock-2026年5月-模拟卷1-020", "index": 20, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 20, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件工程—项目进度管理", "stem": "某项目由A、B、C、D、E五项活动组成，活动之间的先后关系和工期如下：A(5天)→C(4天)→E(3天)，A(5天)→D(6天)→E(3天)，B(3天)→D(6天)→E(3天)。该项目的关键路径工期为（ ）天。", "options": {"A": "12", "B": "14", "C": "15", "D": "17"}, "answer": "B", "analysis": "路径1：A→C→E = 5+4+3 = 12天；路径2：A→D→E = 5+6+3 = 14天；路径3：B→D→E = 3+6+3 = 12天。关键路径为A→D→E，工期为14天。"}, {"id": "mock-2026年5月-模拟卷1-021", "index": 21, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 21, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件工程—软件度量", "stem": "在软件度量中，McCabe环形复杂度V(G)的计算公式为V(G)=E-N+2，其中E为程序流程图中边的数量，N为节点的数量。若一个程序流程图有15条边和12个节点，则其环形复杂度为（ ）。", "options": {"A": "3", "B": "4", "C": "5", "D": "6"}, "answer": "C", "analysis": "McCabe环形复杂度V(G) = E - N + 2 = 15 - 12 + 2 = 5。环形复杂度反映了程序的逻辑复杂性，一般认为V(G)不应超过10。"}, {"id": "mock-2026年5月-模拟卷1-022", "index": 22, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 22, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件工程—CMMI", "stem": "CMMI（能力成熟度模型集成）的阶段式模型共分为5个等级，其中（ ）级别要求组织建立定量化的质量和过程绩效目标，并使用统计和其他定量技术进行管理。", "options": {"A": "已管理级", "B": "已定义级", "C": "定量管理级", "D": "优化级"}, "answer": "C", "analysis": "CMMI阶段式5个等级：1-初始级（过程不可预测）、2-已管理级（项目级管理）、3-已定义级（组织级标准化过程）、4-定量管理级（使用统计和定量技术管理过程绩效）、5-优化级（持续过程改进）。"}, {"id": "mock-2026年5月-模拟卷1-023", "index": 23, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 23, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件工程—UML用例图", "stem": "在面向对象分析中，用例模型中不包含的关系是（ ）。", "options": {"A": "包含关系", "B": "扩展关系", "C": "泛化关系", "D": "组合关系"}, "answer": "D", "analysis": "用例模型中包含的关系有：包含关系（include）、扩展关系（extend）和泛化关系（generalization）。组合关系不属于用例模型中的关系，它属于分析模型中类之间的关系。"}, {"id": "mock-2026年5月-模拟卷1-024", "index": 24, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 24, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件工程—逆向工程", "stem": "逆向工程有四个级别，其中（ ）是最低层次的逆向工程。", "options": {"A": "实现级", "B": "结构级", "C": "功能级", "D": "领域级"}, "answer": "A", "analysis": "逆向工程四个级别（从低到高）：实现级（关注代码具体实现细节）、结构级（关注程序结构和模块关系）、功能级（描述程序的功能行为）、领域级（涉及程序在特定领域的含义和业务规则）。实现级是最低层次。"}, {"id": "mock-2026年5月-模拟卷1-025", "index": 25, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 25, "sourceType": "mock", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "法律法规—软件著作权", "stem": "根据《计算机软件保护条例》，下列关于软件著作权的说法，正确的是（ ）。", "options": {"A": "软件著作权自登记之日起产生", "B": "软件著作权自发表之日起产生", "C": "软件著作权自开发完成之日起产生", "D": "软件著作权自获得审批之日起产生"}, "answer": "C", "analysis": "根据《计算机软件保护条例》第十四条规定，软件著作权自软件开发完成之日起产生。软件著作权不需要登记、发表或审批即自动产生，登记是自愿行为，可以作为权利证明。"}, {"id": "mock-2026年5月-模拟卷1-026", "index": 26, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 26, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—架构风格", "stem": "在软件架构风格中，（ ）由一组构件和一组连接件组成，构件通过端口接收和产生数据，连接件负责数据的传输，数据在构件之间以流的形式进行传输和变换。", "options": {"A": "管道-过滤器风格", "B": "事件驱动风格", "C": "黑板风格", "D": "分层风格"}, "answer": "A", "analysis": "管道-过滤器风格中，过滤器（构件）通过端口接收和产生数据，管道（连接件）负责数据传输。数据以流的形式在过滤器之间传输和变换。每个过滤器独立处理数据，不依赖其他过滤器的内部状态。"}, {"id": "mock-2026年5月-模拟卷1-027", "index": 27, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 27, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—ATAM评估方法", "stem": "在ATAM（架构权衡分析法）中，效用树用于对质量属性进行分类和优先级排序。效用树的结构从根到叶依次为（ ）。", "options": {"A": "树根—属性分类—质量属性—质量属性场景", "B": "树根—质量属性—属性分类—质量属性场景", "C": "树根—质量属性—质量属性场景—属性分类", "D": "树根—属性分类—质量属性场景—质量属性"}, "answer": "B", "analysis": "ATAM效用树的结构为：树根—质量属性（如性能、安全性）—属性分类（如性能下的响应时间、吞吐量）—质量属性场景（叶子节点，具体的场景描述）。效用树按（重要性, 难度）两个维度对叶子节点排列优先级。"}, {"id": "mock-2026年5月-模拟卷1-028", "index": 28, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 28, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—架构风格选择", "stem": "某公司开发一个智能合同审核系统，需要支持用户自定义审核规则，审核流程可以根据合同类型动态调整。该系统最适合采用（ ）架构风格。", "options": {"A": "管道-过滤器", "B": "解释器", "C": "层次结构", "D": "客户端-服务器"}, "answer": "B", "analysis": "解释器架构风格适合需要支持用户自定义规则和脚本、动态解释执行的场景。智能合同审核系统需要支持用户自定义审核规则并动态调整，符合解释器风格的应用场景。"}, {"id": "mock-2026年5月-模拟卷1-029", "index": 29, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 29, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—架构评估", "stem": "在软件架构评估中，\"提高数据库连接池的最大连接数可以提升并发处理能力，但可能导致数据库服务器资源耗尽\"，这描述的是一个（ ）。", "options": {"A": "风险点", "B": "非风险点", "C": "敏感点", "D": "权衡点"}, "answer": "D", "analysis": "权衡点是影响多个质量属性的特性。\"提高连接池最大连接数\"同时影响性能（提升并发处理能力）和可用性/可靠性（可能导致资源耗尽），因此是权衡点。敏感点只影响一个质量属性。"}, {"id": "mock-2026年5月-模拟卷1-030", "index": 30, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 30, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—质量属性场景", "stem": "质量属性场景由六部分组成：刺激源、刺激、环境、制品、响应和响应度量。其中（ ）描述的是刺激到达时系统所处的条件。", "options": {"A": "刺激源", "B": "环境", "C": "制品", "D": "响应度量"}, "answer": "B", "analysis": "质量属性场景六部分：刺激源（产生刺激的实体）、刺激（到达系统的事件）、环境（刺激到达时系统所处的条件，如正常运行、过载等）、制品（被刺激的系统部分）、响应（系统对刺激的反应）、响应度量（度量响应的方式）。"}, {"id": "mock-2026年5月-模拟卷1-031", "index": 31, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 31, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—微服务设计模式", "stem": "在微服务架构中，（ ）模式用于防止对失败服务的连续调用导致级联故障。该模式包含关闭、打开和半打开三种状态。", "options": {"A": "服务注册", "B": "负载均衡", "C": "断路器", "D": "服务网关"}, "answer": "C", "analysis": "断路器（Circuit Breaker）模式用于防止级联故障。三种状态：关闭状态（正常请求通过）→打开状态（直接返回错误，不再请求）→半打开状态（允许部分请求试探性通过，成功则切回关闭，失败则回到打开）。"}, {"id": "mock-2026年5月-模拟卷1-032", "index": 32, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 32, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—微服务与单体架构对比", "stem": "以下关于微服务架构和单体架构的比较，说法错误的是（ ）。", "options": {"A": "微服务架构的服务可以独立部署和扩展", "B": "微服务架构的运维复杂度低于单体架构", "C": "单体架构在早期开发阶段通常比微服务更简单", "D": "微服务架构中各服务可以使用不同的技术栈"}, "answer": "B", "analysis": "微服务架构的运维复杂度高于单体架构，而非低于。微服务涉及多个独立服务的部署、监控、日志聚合、服务发现、网络通信等，运维挑战更大。A、C、D均正确。"}, {"id": "mock-2026年5月-模拟卷1-033", "index": 33, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 33, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—云原生", "stem": "云原生（Cloud Native）架构的核心技术要素不包括（ ）。", "options": {"A": "容器化", "B": "微服务", "C": "单点登录", "D": "DevOps"}, "answer": "C", "analysis": "云原生核心技术要素通常包括：容器化、微服务、DevOps、持续交付/部署（CI/CD）和服务网格等。单点登录（SSO）是身份认证技术，不属于云原生的核心技术要素。"}, {"id": "mock-2026年5月-模拟卷1-034", "index": 34, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 34, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—容器编排", "stem": "在Kubernetes容器编排平台中，（ ）是最小的调度和管理单元，它可以包含一个或多个紧密耦合的容器。", "options": {"A": "Node", "B": "Pod", "C": "Service", "D": "Deployment"}, "answer": "B", "analysis": "Pod是Kubernetes中最小的调度和管理单元。一个Pod可以包含一个或多个紧密耦合的容器，它们共享网络命名空间和存储卷。Node是集群中的工作节点，Service是服务暴露的抽象，Deployment是声明式部署管理。"}, {"id": "mock-2026年5月-模拟卷1-035", "index": 35, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 35, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—企业集成", "stem": "在企业集成技术架构层次中，自下而上依次为网络集成、数据集成、（ ）和服务集成。", "options": {"A": "界面集成", "B": "应用集成", "C": "会聚集成", "D": "过程集成"}, "answer": "C", "analysis": "企业集成技术架构自下而上四个层次：网络集成→数据集成→会聚集成（也称应用集成）→服务集成。"}, {"id": "mock-2026年5月-模拟卷1-036", "index": 36, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 36, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—SOA", "stem": "在SOA架构中，（ ）通过消息路由、协议转换和数据格式转换等功能，进一步解耦服务请求者和服务提供者。", "options": {"A": "WebService", "B": "UDDI", "C": "ESB（企业服务总线）", "D": "SOAP"}, "answer": "C", "analysis": "ESB（Enterprise Service Bus，企业服务总线）作为消息中介层，通过消息路由、协议转换、数据格式转换等功能，使服务请求者与提供者无需直接通信，进一步解耦。WebService是服务暴露标准，UDDI用于服务注册发现，SOAP是通信协议。"}, {"id": "mock-2026年5月-模拟卷1-037", "index": 37, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 37, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—ABSD方法", "stem": "基于架构的软件设计（ABSD）方法有三个基础，分别是对系统进行功能分解、采用（ ）实现质量属性和商业需求，以及采用软件模板设计软件结构。", "options": {"A": "架构策略", "B": "架构风格", "C": "设计模式", "D": "架构视图"}, "answer": "B", "analysis": "ABSD方法的三个基础：（1）对系统进行功能分解；（2）采用架构风格实现质量属性和商业需求；（3）采用软件模板设计软件结构。"}, {"id": "mock-2026年5月-模拟卷1-038", "index": 38, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 38, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—DSSA", "stem": "DSSA（特定领域软件架构）的建立过程是（ ）的。", "options": {"A": "顺序的、线性的和一次性的", "B": "并发的、递归的和反复进行的", "C": "并行的、独立的和不可逆的", "D": "迭代的、增量的和线性的"}, "answer": "B", "analysis": "DSSA的建立过程是并发的（Concurrent）、递归的（Recursive）和反复进行的（Iterative）。这类似于螺旋模型的特点，各阶段可以并行推进，且可以反复迭代。"}, {"id": "mock-2026年5月-模拟卷1-039", "index": 39, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 39, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—DDD", "stem": "领域驱动设计（DDD）的分层架构中，承载核心业务规则和状态，且与技术实现无关的是（ ）。", "options": {"A": "用户接口层", "B": "应用层", "C": "领域层", "D": "基础设施层"}, "answer": "C", "analysis": "DDD分层架构中：用户接口层处理外部输入输出；应用层编排业务用例，不含业务规则；领域层承载核心业务规则和状态，与技术实现无关；基础设施层实现技术细节。"}, {"id": "mock-2026年5月-模拟卷1-040", "index": 40, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 40, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—软件产品线", "stem": "软件产品线的双生命周期模型包含的两个生命周期工程分别是（ ）。", "options": {"A": "领域工程和应用工程", "B": "领域工程和企业工程", "C": "企业工程和应用工程", "D": "领域工程和管理工程"}, "answer": "A", "analysis": "软件产品线的双生命周期模型包含：领域工程（构建可复用核心资产库，包括架构、组件、需求模型等）和应用工程（利用核心资产库快速派生具体产品）。"}, {"id": "mock-2026年5月-模拟卷1-041", "index": 41, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 41, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—构件组装", "stem": "在构件组装过程中，构件的组装可以分为三个不同的层次，依次是（ ）。", "options": {"A": "连接、集成和演化", "B": "初始化、互连和集成", "C": "定制、集成和扩展", "D": "集成、扩展和演化"}, "answer": "C", "analysis": "构件组装分为三个层次：定制（Customization，配置和适配构件）、集成（Integration，将构件组合成系统）和扩展（Extension，增加新功能和新构件）。"}, {"id": "mock-2026年5月-模拟卷1-042", "index": 42, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 42, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—EDA", "stem": "以下关于事件驱动架构（EDA）的描述中，正确的是（ ）。", "options": {"A": "事件驱动架构中的模块之间是紧耦合的", "B": "事件触发消息在独立的、非耦合的模块之间传递", "C": "事件驱动架构不支持异步通信", "D": "事件驱动架构中的构件必须知道彼此的存在"}, "answer": "B", "analysis": "事件驱动架构（EDA）中，事件触发消息在独立的、非耦合的模块之间传递。事件源发布事件到消息中间件，订阅者接收并处理事件，彼此之间不需要知道对方的存在。支持异步通信。"}, {"id": "mock-2026年5月-模拟卷1-043", "index": 43, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 43, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—REST", "stem": "以下关于REST架构风格的说法，错误的是（ ）。", "options": {"A": "REST使用标准的HTTP方法（GET、POST、PUT、DELETE等）操作资源", "B": "REST是无状态的，服务器不保存客户端的会话状态", "C": "在RESTful API中，PATCH方法用于对资源进行部分更新", "D": "REST要求所有通信必须使用XML格式"}, "answer": "D", "analysis": "REST不要求必须使用XML格式。REST支持多种数据格式，包括JSON、XML、HTML等，实际中JSON是最常用的格式。A、B、C均正确描述。"}, {"id": "mock-2026年5月-模拟卷1-044", "index": 44, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 44, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—ADL", "stem": "架构描述语言（ADL）的主要组成部分包括组件、组件接口、（ ）和架构配置。", "options": {"A": "连接件", "B": "组件实现", "C": "中间件", "D": "组件交互协议"}, "answer": "A", "analysis": "ADL的核心组成部分：组件（Component）、连接件（Connector）、组件接口（Interface）和架构配置（Configuration）。连接件定义了组件之间的交互机制。"}, {"id": "mock-2026年5月-模拟卷1-045", "index": 45, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 45, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—架构演化", "stem": "在体系结构演化过程中，修改、增加或删除构件之后，下一步应该进行的是（ ）。", "options": {"A": "需求变化归类", "B": "构件组装与测试", "C": "更新构件的相互作用", "D": "技术评审"}, "answer": "C", "analysis": "体系结构演化六步骤：（1）需求变化归类→（2）制订演化计划→（3）修改、增加或删除构件→（4）更新构件的相互作用→（5）构件组装与测试→（6）技术评审。因此修改构件之后应更新构件间的交互关系。"}, {"id": "mock-2026年5月-模拟卷1-046", "index": 46, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 46, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "信息安全—加密算法", "stem": "以下关于对称加密和非对称加密的说法，正确的是（ ）。", "options": {"A": "RSA属于对称加密算法", "B": "AES是一种非对称加密算法", "C": "对称加密的加密速度通常快于非对称加密", "D": "非对称加密只使用一个密钥进行加密和解密"}, "answer": "C", "analysis": "对称加密（如AES、DES）使用同一个密钥进行加密和解密，加密速度快。非对称加密（如RSA）使用公钥和私钥配对，加密速度较慢但解决了密钥分发问题。RSA是非对称加密（A错），AES是对称加密（B错），非对称加密使用两个密钥（D错）。"}, {"id": "mock-2026年5月-模拟卷1-047", "index": 47, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 47, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "信息安全—数字签名", "stem": "数字签名技术中，发送方使用（ ）对消息摘要进行加密，接收方使用（ ）进行验证。", "options": {"A": "发送方的公钥；接收方的私钥", "B": "发送方的私钥；发送方的公钥", "C": "接收方的公钥；接收方的私钥", "D": "接收方的私钥；发送方的公钥"}, "answer": "B", "analysis": "数字签名过程：发送方用自己的私钥对消息摘要加密生成签名，接收方用发送方的公钥验证签名。这保证了消息的来源认证和不可否认性。若用接收方的公钥加密则是加密通信，而非数字签名。"}, {"id": "mock-2026年5月-模拟卷1-048", "index": 48, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 48, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "信息安全—网络攻击", "stem": "在网络安全中，（ ）攻击是指攻击者在通信双方之间截获并篡改传输的数据，通信双方并不知道已经被攻击。", "options": {"A": "DoS", "B": "SQL注入", "C": "中间人攻击", "D": "暴力破解"}, "answer": "C", "analysis": "中间人攻击（MITM，Man-in-the-Middle Attack）是攻击者在通信双方之间截获并可能篡改数据的攻击方式，双方误以为在直接通信。DoS是拒绝服务攻击，SQL注入针对数据库，暴力破解是穷举密码。"}, {"id": "mock-2026年5月-模拟卷1-049", "index": 49, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 49, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "信息安全—零信任架构", "stem": "零信任安全架构的核心原则是（ ）。", "options": {"A": "信任内网，验证外网", "B": "永不信任，始终验证", "C": "一次验证，持续信任", "D": "信任但验证"}, "answer": "B", "analysis": "零信任安全架构的核心原则是\"永不信任，始终验证\"（Never Trust, Always Verify）。不区分内网外网，每次访问都需要进行身份验证和授权，实施最小权限原则。传统安全模型才是\"信任但验证\"。"}, {"id": "mock-2026年5月-模拟卷1-050", "index": 50, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 50, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "信息安全—等级保护", "stem": "根据《信息安全技术 网络安全等级保护基本要求》（等保2.0），网络安全保护等级共分为（ ）级。", "options": {"A": "3", "B": "4", "C": "5", "D": "6"}, "answer": "C", "analysis": "根据等保2.0（GB/T 22239-2019），网络安全保护等级分为5级：第一级（用户自主保护级）、第二级（系统审计保护级）、第三级（安全标记保护级）、第四级（结构化保护级）、第五级（访问验证保护级）。"}, {"id": "mock-2026年5月-模拟卷1-051", "index": 51, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 51, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "信息安全—哈希算法", "stem": "以下关于MD5哈希算法的说法，错误的是（ ）。", "options": {"A": "MD5输出固定长度的128位哈希值", "B": "MD5是单向函数，无法从哈希值逆推原始数据", "C": "MD5完全抗碰撞，不存在不同输入产生相同哈希值的可能", "D": "MD5常用于文件完整性校验"}, "answer": "C", "analysis": "MD5已被证明存在碰撞漏洞，即不同的输入可以产生相同的哈希值（碰撞）。王小云教授团队在2004年就提出了MD5的碰撞方法。因此C选项\"完全抗碰撞\"说法错误。A、B、D均正确。"}, {"id": "mock-2026年5月-模拟卷1-052", "index": 52, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 52, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "信息安全—OAuth认证", "stem": "OAuth 2.0协议中，（ ）授权模式适用于服务器端应用，是最常用且安全性最高的授权方式。", "options": {"A": "客户端凭证模式", "B": "隐式授权模式", "C": "授权码模式", "D": "密码模式"}, "answer": "C", "analysis": "OAuth 2.0的授权码模式（Authorization Code）适用于有后端服务器的Web应用，是最常用和最安全的方式。客户端凭证模式适用于服务端到服务端；隐式模式已不推荐使用；密码模式需要用户直接提供密码，安全性最低。"}, {"id": "mock-2026年5月-模拟卷1-053", "index": 53, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 53, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "信息安全—安全特性", "stem": "在信息安全中，保证信息的完整和准确、防止信息被非法修改的特性称为（ ）。", "options": {"A": "机密性", "B": "完整性", "C": "可用性", "D": "不可否认性"}, "answer": "B", "analysis": "信息安全的基本特性：机密性（防泄露）、完整性（防篡改，保证信息完整准确）、可用性（保证合法用户正常使用）、不可否认性（防止抵赖）。"}, {"id": "mock-2026年5月-模拟卷1-054", "index": 54, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 54, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "信息安全—安全审计", "stem": "安全审计涉及四个基本要素，分别是（ ）。", "options": {"A": "控制目标、安全漏洞、控制措施和控制测试", "B": "控制目标、控制过程、控制措施和安全测试", "C": "控制目标、控制过程、控制措施和控制测试", "D": "控制目标、安全漏洞、控制措施和安全测试"}, "answer": "A", "analysis": "安全审计涉及四个基本要素：控制目标（确保数据安全的目标）、安全漏洞（系统中的弱点）、控制措施（针对漏洞的修复或预防措施）和控制测试（验证控制措施的有效性）。"}, {"id": "mock-2026年5月-模拟卷1-055", "index": 55, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 55, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "信息安全—容错技术", "stem": "N版本程序设计（N-Version Programming）增加了三个新的阶段，分别是（ ）。", "options": {"A": "相异成分规范评审、相异性确认和背对背测试", "B": "相异成分规范评审、相同性确认和背对背测试", "C": "相同成分规范评审、相同性确认和面对面测试", "D": "相异成分规范评审、相异性确认和面对面测试"}, "answer": "A", "analysis": "N版本程序设计增加了三个新阶段：相异成分规范评审（保证各工作组独立工作的相异性）、相异性确认（评估各版本之间的差异性）和背对背测试（用相同测试数据分别测试N个版本并比较结果）。"}, {"id": "mock-2026年5月-模拟卷1-056", "index": 56, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 56, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库—规范化理论", "stem": "给出关系模式R(A, B, C, D, E)，函数依赖集F={A→BC, B→D, D→E}，则R的候选码为（ ），R最高满足（ ）。", "options": {"A": "A；第二范式（2NF）", "B": "A；第三范式（3NF）", "C": "AB；第二范式（2NF）", "D": "A；BC范式（BCNF）"}, "answer": "A", "analysis": "从函数依赖F={A→BC, B→D, D→E}可知：A⁺=A→BC→D→E={A,B,C,D,E}=U，所以A是候选码。存在传递依赖A→B→D和A→B→D→E（非主属性对码存在传递依赖），因此R满足2NF但不满足3NF。"}, {"id": "mock-2026年5月-模拟卷1-057", "index": 57, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 57, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库—三级模式", "stem": "在数据库三级模式结构中，描述数据的全局逻辑结构和特征的是（ ），描述数据的局部逻辑结构和特征的是（ ）。", "options": {"A": "模式（概念模式）；外模式", "B": "外模式；内模式", "C": "内模式；模式（概念模式）", "D": "模式（概念模式）；内模式"}, "answer": "A", "analysis": "数据库三级模式：模式（概念模式）描述数据的全局逻辑结构和特征（整个数据库的逻辑视图）；外模式描述数据的局部逻辑结构和特征（用户视图）；内模式描述数据的物理存储结构。"}, {"id": "mock-2026年5月-模拟卷1-058", "index": 58, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 58, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库—概念设计", "stem": "在概念结构设计中，各局部E-R图合并为全局E-R图时，可能产生的冲突类型包括（ ）。", "options": {"A": "属性冲突、命名冲突和结构冲突", "B": "属性冲突、数据冲突和结构冲突", "C": "命名冲突、逻辑冲突和结构冲突", "D": "属性冲突、命名冲突和逻辑冲突"}, "answer": "A", "analysis": "局部E-R图合并为全局E-R图时的三类冲突：属性冲突（属性域冲突、属性取值冲突）、命名冲突（同名异义、异名同义）、结构冲突（同一对象在不同应用中有不同抽象或不同属性组成）。"}, {"id": "mock-2026年5月-模拟卷1-059", "index": 59, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 59, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库—数据仓库", "stem": "数据仓库具有面向主题的、集成的、相对稳定的和（ ）的特征。", "options": {"A": "可修改", "B": "实时更新", "C": "反映历史变化", "D": "标准化"}, "answer": "C", "analysis": "数据仓库（Data Warehouse）四大特征：面向主题的、集成的、相对稳定的（非易失的）和反映历史变化的（时变的）。数据仓库中的数据通常包含历史数据，记录了数据随时间的变化。"}, {"id": "mock-2026年5月-模拟卷1-060", "index": 60, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 60, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库—大数据框架", "stem": "在大数据处理框架中，（ ）是一个分布式文件系统，适合存储超大规模数据集，具有高容错性和流式数据访问的特点。", "options": {"A": "MapReduce", "B": "HDFS", "C": "Spark", "D": "HBase"}, "answer": "B", "analysis": "HDFS（Hadoop Distributed File System）是Hadoop的分布式文件系统，适合存储超大规模数据集（PB级别），具有高容错性（数据多副本存储）和流式数据访问特点。MapReduce是计算框架，Spark是通用计算引擎，HBase是列族数据库。"}, {"id": "mock-2026年5月-模拟卷1-061", "index": 61, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 61, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库—NoSQL分类", "stem": "NoSQL数据库根据数据模型可以分为多种类型，其中Redis属于（ ）类型，MongoDB属于（ ）类型。", "options": {"A": "键值数据库；文档数据库", "B": "文档数据库；列族数据库", "C": "键值数据库；图数据库", "D": "列族数据库；文档数据库"}, "answer": "A", "analysis": "Redis是典型的键值数据库（Key-Value Store），以键值对形式存储数据。MongoDB是典型的文档数据库（Document Database），以JSON/BSON文档形式存储数据。其他NoSQL类型还包括列族数据库（如HBase/Cassandra）和图数据库（如Neo4j）。"}, {"id": "mock-2026年5月-模拟卷1-062", "index": 62, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 62, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库—关系运算", "stem": "有两个关系R(A, B, C)和S(B, C, D)，将R和S进行自然连接，得到的结果关系包含（ ）列。", "options": {"A": "3", "B": "4", "C": "5", "D": "6"}, "answer": "B", "analysis": "自然连接：找出两个关系中同名属性（B和C），进行等值连接后去除重复列。R有属性{A,B,C}，S有属性{B,C,D}，自然连接结果属性为{A,B,C,D}，共4列。"}, {"id": "mock-2026年5月-模拟卷1-063", "index": 63, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 63, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "新技术—大语言模型架构", "stem": "在大语言模型（LLM）技术中，Transformer架构的核心创新机制是（ ），它允许模型在处理序列数据时动态关注输入中最相关的部分。", "options": {"A": "卷积神经网络（CNN）", "B": "循环神经网络（RNN）", "C": "自注意力机制（Self-Attention）", "D": "长短期记忆（LSTM）"}, "answer": "C", "analysis": "Transformer架构的核心创新是自注意力机制（Self-Attention），它允许模型在处理序列中的每个位置时，动态计算该位置与所有其他位置的相关性权重，从而捕获长距离依赖关系。CNN主要用于图像处理，RNN和LSTM用于序列处理但存在长距离依赖问题。"}, {"id": "mock-2026年5月-模拟卷1-064", "index": 64, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 64, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "新技术—RAG架构", "stem": "在检索增强生成（RAG）架构中，以下关于其工作流程的描述，正确的是（ ）。", "options": {"A": "RAG直接使用大模型的参数化知识回答所有问题，无需外部检索", "B": "RAG先从外部知识库中检索相关文档，再将检索结果作为上下文输入大模型生成回答", "C": "RAG仅适用于文本数据，不能处理结构化数据", "D": "RAG的检索和生成过程是完全独立的，检索结果不影响生成质量"}, "answer": "B", "analysis": "RAG（检索增强生成）的核心工作流程：用户提问→从外部知识库检索相关文档→将检索结果作为上下文与问题一起输入大模型→大模型基于上下文生成回答。这解决了大模型知识过时、幻觉等问题。RAG可以处理结构化和非结构化数据，检索质量直接影响生成质量。"}, {"id": "mock-2026年5月-模拟卷1-065", "index": 65, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 65, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "新技术—AI Agent架构", "stem": "在AI Agent（智能体）架构中，一个典型的Agent系统通常包含感知模块、规划模块、记忆模块和（ ）模块。", "options": {"A": "编译", "B": "行动（工具调用）", "C": "渲染", "D": "压缩"}, "answer": "B", "analysis": "典型的AI Agent架构包含四个核心模块：感知模块（接收外部信息）、规划模块（任务分解和决策）、记忆模块（短期和长期记忆管理）和行动模块（执行工具调用、API调用等实际操作）。行动模块是Agent与外部世界交互的桥梁。"}, {"id": "mock-2026年5月-模拟卷1-066", "index": 66, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 66, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "新技术—大模型微调", "stem": "以下关于大模型微调技术的说法，正确的是（ ）。", "options": {"A": "全量微调（Full Fine-tuning）只更新模型的最后几层参数", "B": "LoRA（低秩自适应）通过在原模型权重矩阵旁添加低秩分解矩阵来实现高效微调", "C": "提示工程（Prompt Engineering）需要修改模型的内部参数", "D": "微调后的模型性能一定优于原始预训练模型"}, "answer": "B", "analysis": "LoRA（Low-Rank Adaptation）通过在原模型权重矩阵旁添加低秩分解矩阵（A×B），只训练这些新增的小矩阵参数，大幅减少可训练参数量。全量微调更新所有参数（A错）；提示工程不修改模型参数（C错）；微调不当可能导致性能下降（D错）。"}, {"id": "mock-2026年5月-模拟卷1-067", "index": 67, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 67, "sourceType": "mock", "module_code": "new_technology", "module_name": "🚀 前沿新兴技术", "knowledge": "新技术—数字孪生", "stem": "数字孪生（Digital Twin）技术的核心特征不包括（ ）。", "options": {"A": "物理实体与虚拟模型的实时映射", "B": "基于数据驱动的仿真和预测", "C": "虚拟模型替代物理实体独立运行", "D": "全生命周期的数据集成"}, "answer": "C", "analysis": "数字孪生的核心特征包括：物理实体与虚拟模型的实时映射、基于数据驱动的仿真和预测、全生命周期的数据集成。数字孪生的虚拟模型是物理实体的镜像，不是替代物理实体独立运行，而是与物理实体保持同步，辅助决策和优化。"}, {"id": "mock-2026年5月-模拟卷1-068", "index": 68, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 68, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "新技术—大模型问题", "stem": "在生成式AI应用中，大模型产生看似合理但实际错误的内容，这种现象被称为（ ）。", "options": {"A": "过拟合（Overfitting）", "B": "幻觉（Hallucination）", "C": "灾难性遗忘（Catastrophic Forgetting）", "D": "模式崩溃（Mode Collapse）"}, "answer": "B", "analysis": "幻觉（Hallucination）是大语言模型生成看似流畅合理但实际上包含错误事实或虚构内容的现象。这是当前LLM面临的主要挑战之一。过拟合是模型在训练数据上表现好但泛化差；灾难性遗忘是学习新任务后忘记旧任务；模式崩溃是GAN中生成样本缺乏多样性。"}, {"id": "mock-2026年5月-模拟卷1-069", "index": 69, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 69, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "新技术—多Agent系统", "stem": "以下关于多Agent协作架构的说法，错误的是（ ）。", "options": {"A": "多Agent系统中的各Agent可以分别承担不同的专业角色", "B": "Agent之间可以通过消息传递进行协作和信息共享", "C": "多Agent系统必须采用中心化的协调机制，不支持去中心化架构", "D": "ReAct模式是一种常见的Agent推理与行动交替执行的范式"}, "answer": "C", "analysis": "多Agent系统支持多种协调机制，包括中心化（有协调者）和去中心化（Agent间平等协商）架构。C选项\"必须采用中心化\"说法错误。A、B、D均正确：多Agent可分工协作，通过消息通信，ReAct是Agent推理与行动交替的常见范式。"}, {"id": "mock-2026年5月-模拟卷1-070", "index": 70, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 70, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "新技术—量子计算基础", "stem": "在量子计算中，量子比特（qubit）与经典比特的本质区别在于（ ）。", "options": {"A": "量子比特只能表示0和1两种状态", "B": "量子比特可以同时处于0和1的叠加态", "C": "量子比特的运算速度固定为经典比特的2倍", "D": "量子比特不能与其他量子比特产生关联"}, "answer": "B", "analysis": "量子比特（qubit）的本质特征是量子叠加态——可以同时处于0和1的叠加状态，直到被测量时才坍缩为确定的0或1。经典比特只能是0或1。此外，量子比特之间可以产生量子纠缠（关联），运算加速不是简单的2倍关系。"}, {"id": "mock-2026年5月-模拟卷1-071", "index": 71, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 71, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "英语—技术阅读理解", "stem": "- A. benefit\n- B. differ\n- C. suffer\n- D. result\n\n---", "options": {"A": "benefit", "B": "differ", "C": "suffer", "D": "result"}, "answer": "C", "analysis": "LLMs often suffer from outdated knowledge, hallucinations...（大模型常常受困于过时的知识、幻觉等问题）。suffer from 意为\"受...之苦/困扰\"，是固定搭配。benefit from（受益于）语义相反；differ from（不同于）和result from（由...导致）不符合上下文。"}, {"id": "mock-2026年5月-模拟卷1-072", "index": 72, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 72, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "英语—技术阅读理解", "stem": "- A. images\n- B. representations\n- C. databases\n- D. formats\n\n---", "options": {"A": "images", "B": "representations", "C": "databases", "D": "formats"}, "answer": "B", "analysis": "Documents are converted into vector representations（文档被转换为向量表示）。在NLP和RAG技术中，embedding模型将文本转换为向量表示（vector representations），用于语义相似度计算。images（图片）、databases（数据库）、formats（格式）均不合文意。"}, {"id": "mock-2026年5月-模拟卷1-073", "index": 73, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 73, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "英语—技术阅读理解", "stem": "- A. popular\n- B. recent\n- C. expensive\n- D. relevant\n\n---", "options": {"A": "popular", "B": "recent", "C": "expensive", "D": "relevant"}, "answer": "D", "analysis": "The retrieval stage identifies the most relevant document chunks（检索阶段找出最相关的文档片段）。RAG检索的目标是找到与查询最相关的内容。popular（流行的）、recent（最近的）、expensive（昂贵的）均不符合语境。"}, {"id": "mock-2026年5月-模拟卷1-074", "index": 74, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 74, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "英语—技术阅读理解", "stem": "- A. solely\n- B. hardly\n- C. frequently\n- D. partially\n\n---", "options": {"A": "solely", "B": "hardly", "C": "frequently", "D": "partially"}, "answer": "A", "analysis": "Rather than relying solely on its parametric knowledge（而非仅仅依赖其参数化知识）。solely（仅仅、完全）与rather than搭配，强调RAG使模型不再完全依赖参数知识，而是结合外部检索信息。hardly（几乎不）、frequently（频繁地）、partially（部分地）不符合语境。"}, {"id": "mock-2026年5月-模拟卷1-075", "index": 75, "term": "2026年5月 模拟卷1", "paper": "模拟卷1", "questionNo": 75, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "英语—技术阅读理解", "stem": "- A. speed\n- B. quality\n- C. cost\n- D. complexity\n\n---", "options": {"A": "speed", "B": "quality", "C": "cost", "D": "complexity"}, "answer": "B", "analysis": "Re-ranking mechanisms that further improve retrieval quality（重排序机制进一步提高检索质量）。重排序的目的是提高检索结果的相关性和准确性，即提高质量。speed（速度）、cost（成本）、complexity（复杂度）均不是重排序的主要目标。"}, {"id": "mock-2026年5月-模拟卷2-001", "index": 76, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 1, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在计算机系统中，DMA（直接内存访问）方式的主要优点是（ ）。", "options": {"A": "CPU全程参与数据传输，确保数据正确性", "B": "数据传输不需要CPU干预，提高了CPU利用率", "C": "适用于少量数据的慢速传输场景", "D": "比程序查询方式的CPU占用率更高"}, "answer": "B", "analysis": "DMA（Direct Memory Access）方式允许外设直接与内存之间进行数据传输，整个传输过程无需CPU干预（仅在传输开始和结束时需要CPU参与），因此大大提高了CPU利用率。程序查询方式和中断方式都需要CPU参与数据传输过程。"}, {"id": "mock-2026年5月-模拟卷2-002", "index": 77, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 2, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "某系统由3个相同的部件并联组成，每个部件的可靠性为0.8，则该并联系统的可靠性为（ ）。", "options": {"A": "0.512", "B": "0.960", "C": "0.992", "D": "0.998"}, "answer": "C", "analysis": "并联系统的可靠性公式为 R = 1 - (1-Ri)^n。每个部件可靠性为0.8，3个并联：R = 1 - (1-0.8)³ = 1 - 0.2³ = 1 - 0.008 = 0.992。"}, {"id": "mock-2026年5月-模拟卷2-003", "index": 78, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 3, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在流水线技术中，假设一条指令的执行分为取指、译码、执行、写回4个阶段，每个阶段耗时分别为2ns、3ns、2ns、1ns。采用流水线方式执行100条指令，理论上最少需要（ ）ns。", "options": {"A": "303", "B": "305", "C": "306", "D": "800"}, "answer": "B", "analysis": "流水线时钟周期取各阶段最长时间Δt = max(2,3,2,1) = 3ns。总时间 = 第一条指令完整执行时间 + (n-1)×Δt = (2+3+2+1) + (100-1)×3 = 8 + 297 = 305ns。"}, {"id": "mock-2026年5月-模拟卷2-004", "index": 79, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 4, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "以下关于RISC和CISC的描述中，正确的是（ ）。", "options": {"A": "RISC指令数量多，寻址方式复杂", "B": "CISC强调硬件实现，减少指令数量", "C": "RISC指令长度固定，大多在一个时钟周期内完成", "D": "CISC处理器更适合流水线技术的实现"}, "answer": "C", "analysis": "RISC（精简指令集计算机）的特点：指令数量少、指令长度固定、寻址方式简单、大多数指令在一个时钟周期内完成、强调编译器优化、适合流水线实现。CISC指令数量多、长度不固定、寻址方式复杂。A说法颠倒了RISC特点；B说法颠倒了CISC特点；D错误，RISC更适合流水线。"}, {"id": "mock-2026年5月-模拟卷2-005", "index": 80, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 5, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "在IPv4协议中，某主机的IP地址为172.16.5.130/26，该主机所在子网的广播地址为（ ）。", "options": {"A": "172.16.5.127", "B": "172.16.5.191", "C": "172.16.5.255", "D": "172.16.5.159"}, "answer": "B", "analysis": "/26表示子网掩码有26位1，即255.255.255.192。子网块大小为256-192=64。IP地址172.16.5.130，主机部分为130。130÷64=2余2，所以该主机在第3个子网（从0开始计数为第2个），子网地址为172.16.5.128，广播地址 = 172.16.5.128 + 63 = 172.16.5.191。"}, {"id": "mock-2026年5月-模拟卷2-006", "index": 81, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 6, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在操作系统中，采用时间片轮转调度算法时，若时间片设置过大，该算法将退化为（ ）调度算法。", "options": {"A": "短作业优先", "B": "先来先服务", "C": "高优先级优先", "D": "多级反馈队列"}, "answer": "B", "analysis": "时间片轮转算法中，若时间片足够大（大于所有进程的运行时间），则每个进程都能在一个时间片内运行完毕，退化为先来先服务（FCFS）调度算法。"}, {"id": "mock-2026年5月-模拟卷2-007", "index": 82, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 7, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "CRC（循环冗余校验）的生成多项式为G(x) = x³+x+1，对应的除数二进制编码为（ ）。", "options": {"A": "1011", "B": "1101", "C": "1110", "D": "1010"}, "answer": "A", "analysis": "生成多项式G(x) = x³+x+1，各项系数从高到低为：x³的系数1，x²的系数0，x¹的系数1，x⁰的系数1，因此二进制编码为1011。"}, {"id": "mock-2026年5月-模拟卷2-008", "index": 83, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 8, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "中断响应时间是指（ ）。", "options": {"A": "从中断请求发出到中断处理程序执行完毕的时间", "B": "从中断请求发出到开始执行中断处理程序的第一条指令之间的时间", "C": "从中断处理程序开始执行到执行完毕的时间", "D": "从中断请求发出到中断返回的时间"}, "answer": "B", "analysis": "中断响应时间是指从CPU收到中断请求到开始执行中断处理程序的第一条指令之间的间隔时间。它包括中断请求检测、中断判优、保护断点和程序状态等所花费的时间。"}, {"id": "mock-2026年5月-模拟卷2-009", "index": 84, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 9, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在敏捷开发中，Scrum框架中的Sprint Review会议的主要目的是（ ）。", "options": {"A": "团队回顾过程改进措施", "B": "向产品负责人和干系人展示已完成的工作成果", "C": "计划下一个Sprint的待办事项", "D": "每日同步团队成员的工作进展"}, "answer": "B", "analysis": "Sprint Review在每个Sprint结束时举行，向产品负责人和干系人展示已完成的工作并收集反馈。A是Sprint Retrospective（回顾会议）；C是Sprint Planning（计划会议）；D是Daily Scrum（每日站会）。"}, {"id": "mock-2026年5月-模拟卷2-010", "index": 85, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 10, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在UML类图中，聚合关系与组合关系的核心区别是（ ）。", "options": {"A": "聚合关系中部分可以独立于整体存在，组合关系中部分不能脱离整体", "B": "聚合关系是单向的，组合关系是双向的", "C": "聚合关系用于描述继承，组合关系用于描述多态", "D": "两者在语义上完全等价，仅符号不同"}, "answer": "A", "analysis": "聚合（Aggregation）是弱关联，部分可以独立于整体存在（如班级与学生）；组合（Composition）是强关联，部分不能脱离整体（如人与心脏），整体销毁时部分也随之销毁。"}, {"id": "mock-2026年5月-模拟卷2-011", "index": 86, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 11, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "某项目采用功能点估算法，已知外部输入5个（加权因子4）、外部输出3个（加权因子5）、外部查询4个（加权因子4）、内部逻辑文件2个（加权因子10）、外部接口文件1个（加权因子7）。该项目的未调整功能点数为（ ）。", "options": {"A": "68", "B": "78", "C": "82", "D": "74"}, "answer": "B", "analysis": "UFP = 5×4 + 3×5 + 4×4 + 2×10 + 1×7 = 20 + 15 + 16 + 20 + 7 = 78。"}, {"id": "mock-2026年5月-模拟卷2-012", "index": 87, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 12, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在软件测试中，等价类划分法属于（ ）测试方法。", "options": {"A": "白盒测试", "B": "灰盒测试", "C": "黑盒测试", "D": "回归测试"}, "answer": "C", "analysis": "等价类划分法是经典的黑盒测试方法，不关注程序内部结构，只根据输入条件将数据划分为有效等价类和无效等价类来设计测试用例。"}, {"id": "mock-2026年5月-模拟卷2-013", "index": 88, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 13, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于软件维护的描述中，（ ）属于适应性维护。", "options": {"A": "修改系统中发现的潜在错误以提高可靠性", "B": "因操作系统升级而修改软件使其在新环境下正常运行", "C": "增加用户需求中未包含的新功能", "D": "修复用户报告的系统崩溃问题"}, "answer": "B", "analysis": "适应性维护是为了使软件适应外部环境变化（如操作系统升级、硬件更换）而进行的修改。A是预防性维护，C是完善性维护，D是改正性维护。"}, {"id": "mock-2026年5月-模拟卷2-014", "index": 89, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 14, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "GoF设计模式中，（ ）模式将一个复杂对象的构建与其表示分离，使得同样的构建过程可以创建不同的表示。", "options": {"A": "工厂方法（Factory Method）", "B": "原型（Prototype）", "C": "建造者（Builder）", "D": "单例（Singleton）"}, "answer": "C", "analysis": "建造者（Builder）模式将复杂对象的构建与表示分离，使同样的构建过程可以创建不同的表示。工厂方法让子类决定实例化哪个类；原型通过复制创建对象；单例确保唯一实例。"}, {"id": "mock-2026年5月-模拟卷2-015", "index": 90, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 15, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "某系统需要支持\"撤销/重做\"操作，将用户的每次操作封装为对象以便存储和回放。最适合使用的设计模式是（ ）。", "options": {"A": "策略（Strategy）", "B": "命令（Command）", "C": "状态（State）", "D": "观察者（Observer）"}, "answer": "B", "analysis": "命令（Command）模式将请求封装为对象，支持请求排队、日志记录以及可撤销操作。\"撤销/重做\"是命令模式的经典应用场景。"}, {"id": "mock-2026年5月-模拟卷2-016", "index": 91, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 16, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在UML中，用于描述对象之间交互的时间顺序的图是（ ）。", "options": {"A": "活动图", "B": "状态机图", "C": "顺序图", "D": "类图"}, "answer": "C", "analysis": "顺序图（Sequence Diagram）描述对象间交互的时间顺序，强调消息的时序关系。活动图描述工作流，状态机图描述状态转换，类图描述类结构。"}, {"id": "mock-2026年5月-模拟卷2-017", "index": 92, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 17, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在CI/CD流水线中，持续集成（CI）的核心实践是（ ）。", "options": {"A": "每次代码提交后自动构建并运行测试", "B": "将应用自动部署到生产环境", "C": "手动合并代码分支并进行人工测试", "D": "定期发布版本供用户下载"}, "answer": "A", "analysis": "持续集成（CI）的核心是每次代码提交后自动触发构建和测试，及早发现集成问题。B是持续部署（CD），C和D不属于CI实践。"}, {"id": "mock-2026年5月-模拟卷2-018", "index": 93, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 18, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于设计模式的描述中，正确的是（ ）。", "options": {"A": "抽象工厂模式仅能创建一种产品对象", "B": "适配器模式用于将一个类的接口转换成客户希望的另一个接口", "C": "中介者模式增加了对象之间的直接耦合", "D": "享元模式的目的是为每个对象创建独立副本以提高性能"}, "answer": "B", "analysis": "适配器模式将一个类的接口转换成客户希望的另一个接口，使不兼容的类可以协作。A错误：抽象工厂创建一系列相关产品；C错误：中介者减少耦合；D错误：享元通过共享节省内存。"}, {"id": "mock-2026年5月-模拟卷2-019", "index": 94, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 19, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "软件过程模型中，（ ）适用于需求不明确、需要快速验证技术可行性的项目。", "options": {"A": "瀑布模型", "B": "增量模型", "C": "原型模型", "D": "V模型"}, "answer": "C", "analysis": "原型模型适用于需求不明确的项目，通过快速构建原型让用户体验并反馈。瀑布模型适用于需求明确的项目，V模型强调测试与开发对应。"}, {"id": "mock-2026年5月-模拟卷2-020", "index": 95, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 20, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在面向对象设计原则中，\"一个软件实体应当对扩展开放，对修改关闭\"描述的是（ ）原则。", "options": {"A": "单一职责原则", "B": "里氏替换原则", "C": "开闭原则", "D": "依赖倒置原则"}, "answer": "C", "analysis": "开闭原则（OCP）：软件实体应当对扩展开放，对修改关闭。通过扩展实现变化，而不是修改已有代码。"}, {"id": "mock-2026年5月-模拟卷2-021", "index": 96, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 21, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在DevOps实践中，\"基础设施即代码\"（Infrastructure as Code）的核心理念是（ ）。", "options": {"A": "通过手动操作服务器来保证环境一致性", "B": "使用版本控制的代码定义和管理基础设施配置", "C": "仅在生产环境中应用自动化部署", "D": "用物理服务器替代虚拟化环境"}, "answer": "B", "analysis": "IaC的核心是使用版本控制的代码定义和管理基础设施，实现自动化、可重复、可审计的管理。典型工具如Terraform、Ansible、Pulumi。"}, {"id": "mock-2026年5月-模拟卷2-022", "index": 97, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 22, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "某类有8个方法，类的LCOM（方法内聚缺乏度）值为0表示（ ）。", "options": {"A": "该类的所有方法之间完全没有关联", "B": "该类具有最高内聚性，所有方法访问相同的属性集", "C": "该类应该被拆分为多个子类", "D": "该类的方法数量过多需要重构"}, "answer": "B", "analysis": "LCOM = 0 表示类具有最高内聚性，所有方法都访问相同的实例变量集合。LCOM值越大，内聚性越低，越需要考虑拆分。"}, {"id": "mock-2026年5月-模拟卷2-023", "index": 98, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 23, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在\"4+1\"视图模型中，描述系统并发和同步方面的是（ ）。", "options": {"A": "逻辑视图", "B": "进程视图", "C": "开发视图", "D": "物理视图"}, "answer": "B", "analysis": "4+1视图：逻辑视图→功能需求；进程视图→并发和同步；开发视图→模块组织；物理视图→硬件映射；场景（+1）→用例验证。"}, {"id": "mock-2026年5月-模拟卷2-024", "index": 99, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 24, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "ATAM（架构权衡分析方法）主要关注的质量属性不包括（ ）。", "options": {"A": "性能", "B": "安全性", "C": "可修改性", "D": "可复用性"}, "answer": "D", "analysis": "ATAM主要关注四类质量属性：性能、安全性、可修改性和可用性。可复用性不在其重点关注范围。"}, {"id": "mock-2026年5月-模拟卷2-025", "index": 100, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 25, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "微服务架构中，服务网格（Service Mesh）的数据平面（Data Plane）主要负责（ ）。", "options": {"A": "定义路由规则和安全策略", "B": "以Sidecar代理的形式拦截服务间的网络通信并执行流量管理", "C": "提供服务注册和发现功能", "D": "管理微服务的构建和部署流水线"}, "answer": "B", "analysis": "服务网格数据平面由Sidecar代理（如Envoy）组成，拦截所有服务间网络通信，执行流量管理、负载均衡、TLS加密等。控制平面（如Istio的istiod）负责定义规则和策略。"}, {"id": "mock-2026年5月-模拟卷2-026", "index": 101, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 26, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在Istio服务网格中，Envoy代理的部署方式是（ ）。", "options": {"A": "作为独立的集中式网关部署", "B": "以Sidecar方式与每个服务实例共同部署在同一个Pod中", "C": "作为操作系统内核模块加载", "D": "以DaemonSet方式在每个节点部署一个实例"}, "answer": "B", "analysis": "Istio中Envoy以Sidecar方式部署，与每个服务实例共同运行在同一个Pod中，自动注入到Pod内拦截所有进出流量。这是Service Mesh的典型Sidecar模式。"}, {"id": "mock-2026年5月-模拟卷2-027", "index": 102, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 27, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于事件驱动架构（EDA）的描述中，不正确的是（ ）。", "options": {"A": "事件生产者和消费者之间是松耦合的", "B": "事件驱动架构支持异步通信模式", "C": "事件溯源（Event Sourcing）要求将系统状态存储为事件序列", "D": "事件驱动架构中，消费者必须同步等待生产者的响应"}, "answer": "D", "analysis": "事件驱动架构（EDA）的核心特征是异步通信，事件生产者发布事件后不需要等待消费者响应。D选项说\"消费者必须同步等待\"恰好相反，是不正确的描述。"}, {"id": "mock-2026年5月-模拟卷2-028", "index": 103, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 28, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "CQRS（命令查询职责分离）模式的核心思想是（ ）。", "options": {"A": "使用同一个模型处理读操作和写操作", "B": "将读模型和写模型分离，各自优化", "C": "仅允许通过查询操作修改数据", "D": "将所有操作统一为命令操作"}, "answer": "B", "analysis": "CQRS将系统的读操作和写操作分离，使用独立的模型分别优化。写模型（命令端）负责处理业务逻辑和数据变更，读模型（查询端）针对查询进行优化。"}, {"id": "mock-2026年5月-模拟卷2-029", "index": 104, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 29, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "Serverless架构中，以下关于FaaS（函数即服务）的描述中，正确的是（ ）。", "options": {"A": "函数实例需要开发者手动管理生命周期和扩缩容", "B": "函数按调用次数和执行时间计费，空闲时不产生费用", "C": "函数的执行时间没有限制", "D": "FaaS不支持事件触发，只能通过HTTP调用"}, "answer": "B", "analysis": "FaaS的特点是按需执行、自动扩缩容、按调用计费。A错误：生命周期由平台自动管理；C错误：通常有执行时间限制（如AWS Lambda 15分钟）；D错误：FaaS支持多种事件触发源。"}, {"id": "mock-2026年5月-模拟卷2-030", "index": 105, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 30, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某大型电商系统采用微服务架构，需要保证跨多个服务的数据一致性。以下方案中，最适合的是（ ）。", "options": {"A": "采用两阶段提交（2PC）实现强一致性分布式事务", "B": "采用Saga模式通过一系列本地事务和补偿操作实现最终一致性", "C": "在所有微服务中共享同一个数据库", "D": "取消事务支持，由用户手动处理数据不一致"}, "answer": "B", "analysis": "微服务架构中，2PC会阻塞资源且不适合高并发场景；共享数据库违背微服务原则。Saga模式通过编排一系列本地事务和对应的补偿操作实现最终一致性，是微服务分布式事务的主流方案。"}, {"id": "mock-2026年5月-模拟卷2-031", "index": 106, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 31, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "在软件架构评估中，SAAM（软件架构分析方法）主要用于分析架构的（ ）。", "options": {"A": "性能和安全性的权衡", "B": "可修改性", "C": "成本效益比", "D": "架构与硬件的映射关系"}, "answer": "B", "analysis": "SAAM（Software Architecture Analysis Method）是最早的架构评估方法，主要用于分析架构的可修改性。ATAM是SAAM的改进版，可以分析多个质量属性之间的权衡。"}, {"id": "mock-2026年5月-模拟卷2-032", "index": 107, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 32, "sourceType": "mock", "module_code": "new_technology", "module_name": "🚀 前沿新兴技术", "knowledge": "", "stem": "以下关于边缘计算的描述中，正确的是（ ）。", "options": {"A": "边缘计算将所有计算任务集中在云端数据中心处理", "B": "边缘计算在靠近数据源的位置进行计算，降低延迟", "C": "边缘计算不适用于物联网场景", "D": "边缘计算完全替代了云计算的所有功能"}, "answer": "B", "analysis": "边缘计算在靠近数据源头的位置（如IoT网关、边缘服务器）进行数据处理，降低延迟、减少带宽消耗。它与云计算是互补关系，而非替代关系。"}, {"id": "mock-2026年5月-模拟卷2-033", "index": 108, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 33, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在微服务架构中，API网关的主要职责不包括（ ）。", "options": {"A": "请求路由和负载均衡", "B": "身份认证和授权", "C": "直接实现业务逻辑", "D": "请求限流和熔断"}, "answer": "C", "analysis": "API网关负责请求路由、负载均衡、认证授权、限流熔断、协议转换等横切关注点，但不应直接实现业务逻辑。业务逻辑应由后端微服务实现。"}, {"id": "mock-2026年5月-模拟卷2-034", "index": 109, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 34, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于架构风格的描述中，（ ）采用了\"隐式调用\"机制。", "options": {"A": "管道-过滤器风格", "B": "事件驱动风格", "C": "客户端-服务器风格", "D": "主程序-子程序风格"}, "answer": "B", "analysis": "事件驱动风格采用隐式调用（Implicit Invocation）机制。构件不直接调用其他构件，而是发布事件，由系统的事件分发机制通知注册了该事件的构件。管道-过滤器是数据流风格，C/S和主程序-子程序是调用/返回风格。"}, {"id": "mock-2026年5月-模拟卷2-035", "index": 110, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 35, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "某系统需要支持多种数据导出格式（PDF、Excel、CSV），且未来可能新增格式。为了避免修改已有代码，最适合使用的设计模式是（ ）。", "options": {"A": "单例模式", "B": "策略模式", "C": "代理模式", "D": "装饰器模式"}, "answer": "B", "analysis": "策略模式定义算法族，将每种算法封装起来，使它们可以互相替换。增加新的导出格式只需新增策略类，无需修改已有代码，符合开闭原则。"}, {"id": "mock-2026年5月-模拟卷2-036", "index": 111, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 36, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "在容器编排平台Kubernetes中，Pod的特点不包括（ ）。", "options": {"A": "Pod是最小的部署单元", "B": "一个Pod中的多个容器共享网络和存储", "C": "Pod一旦创建便永久运行，不会被销毁", "D": "Pod中的容器通过localhost相互通信"}, "answer": "C", "analysis": "Pod是Kubernetes最小部署单元，同一Pod中的容器共享网络命名空间和存储卷，通过localhost通信。但Pod并非永久运行，可以被终止、重建、重调度，是短暂的（ephemeral）。"}, {"id": "mock-2026年5月-模拟卷2-037", "index": 112, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 37, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于REST和GraphQL的对比中，正确的是（ ）。", "options": {"A": "REST每个资源对应一个端点，GraphQL通常使用单一端点", "B": "GraphQL只能获取固定格式的数据，不支持按需查询", "C": "REST天然支持数据订阅和实时推送", "D": "GraphQL不支持数据的修改操作"}, "answer": "A", "analysis": "REST为每个资源定义端点URL，GraphQL通常使用单一端点，客户端通过查询语句指定需要的数据结构。GraphQL支持mutation修改数据、subscription实时推送。B、C、D均错误。"}, {"id": "mock-2026年5月-模拟卷2-038", "index": 113, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 38, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在分布式系统中，CAP定理指出一个分布式系统最多同时满足以下三个特性中的两个：一致性（C）、可用性（A）和（ ）。", "options": {"A": "持久性（Durability）", "B": "分区容错性（Partition tolerance）", "C": "可扩展性（Scalability）", "D": "隔离性（Isolation）"}, "answer": "B", "analysis": "CAP定理（Brewer's theorem）：一个分布式系统最多同时满足一致性（Consistency）、可用性（Availability）、分区容错性（Partition tolerance）中的两个。持久性和隔离性是ACID属性。"}, {"id": "mock-2026年5月-模拟卷2-039", "index": 114, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 39, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某物联网系统需要在设备端对传感器数据进行实时预处理和过滤，仅将关键数据上传到云端。该系统的架构模式属于（ ）。", "options": {"A": "纯云计算架构", "B": "边缘-云协同架构", "C": "单体架构", "D": "客户端-服务器架构"}, "answer": "B", "analysis": "设备端预处理过滤数据、仅上传关键数据到云端，这是典型的边缘-云协同架构模式。边缘层负责实时计算和数据过滤，云端负责存储和深度分析。"}, {"id": "mock-2026年5月-模拟卷2-040", "index": 115, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 40, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在Serverless架构中，\"冷启动\"（Cold Start）问题是指（ ）。", "options": {"A": "服务器硬件在低温环境下性能下降", "B": "函数实例首次创建时需要初始化运行环境，导致响应延迟增大", "C": "数据库连接池耗尽导致服务不可用", "D": "网络传输中数据包丢失导致的重传延迟"}, "answer": "B", "analysis": "Serverless冷启动是指当没有空闲的函数实例时，平台需要创建新实例并初始化运行环境（加载代码、依赖、建立连接等），这个过程导致首次请求的响应延迟显著增大。"}, {"id": "mock-2026年5月-模拟卷2-041", "index": 116, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 41, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在微服务治理中，熔断器（Circuit Breaker）模式处于\"半开\"（Half-Open）状态时的行为是（ ）。", "options": {"A": "允许所有请求通过", "B": "拒绝所有请求", "C": "允许少量探测请求通过，根据结果决定恢复或继续熔断", "D": "将请求转发到备用服务"}, "answer": "C", "analysis": "熔断器三种状态：关闭（正常通过）→开启（全部拒绝）→半开（允许少量探测请求通过，若成功则关闭熔断器恢复正常，若失败则重新开启熔断）。半开状态是一种试探性恢复机制。"}, {"id": "mock-2026年5月-模拟卷2-042", "index": 117, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 42, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在软件架构设计中，质量属性场景由六个部分组成，以下不属于其组成部分的是（ ）。", "options": {"A": "刺激源", "B": "响应度量", "C": "代码行数", "D": "环境"}, "answer": "C", "analysis": "质量属性场景由六部分组成：刺激源（Source）、刺激（Stimulus）、环境（Environment）、制品（Artifact）、响应（Response）、响应度量（Response Measure）。代码行数不属于其中。"}, {"id": "mock-2026年5月-模拟卷2-043", "index": 118, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 43, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "某公司核心业务系统面临高并发写入场景，采用事件溯源（Event Sourcing）模式的主要优势不包括（ ）。", "options": {"A": "完整的审计追踪能力", "B": "可以回放事件重建任意历史时刻的状态", "C": "查询当前状态时性能始终优于传统CRUD模式", "D": "天然支持事件驱动和异步处理"}, "answer": "C", "analysis": "事件溯源将状态变更存为事件序列，优势包括审计追踪、历史状态重建、支持事件驱动。但查询当前状态需要回放事件或维护物化视图，性能不一定优于传统CRUD的直接查询，特别是事件量大时。"}, {"id": "mock-2026年5月-模拟卷2-044", "index": 119, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 44, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在云原生架构的十二要素（Twelve-Factor App）方法论中，以下关于\"配置\"要素的描述正确的是（ ）。", "options": {"A": "配置应该硬编码在代码中以确保一致性", "B": "配置应存储在环境变量中，与代码严格分离", "C": "不同环境应使用相同的配置", "D": "配置文件应该存储在版本控制中与代码一起管理"}, "answer": "B", "analysis": "十二要素中\"配置\"要素要求：配置存储在环境变量中，与代码严格分离。不同环境（开发、测试、生产）使用不同的配置，配置不应硬编码或存储在版本控制中。"}, {"id": "mock-2026年5月-模拟卷2-045", "index": 120, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 45, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于反应式架构（Reactive Architecture）核心特性的描述中，不正确的是（ ）。", "options": {"A": "即时响应性（Responsive）：系统在各种条件下都能及时响应", "B": "回弹性（Resilient）：系统在出现故障时仍保持响应", "C": "弹性（Elastic）：系统在不同工作负载下保持响应", "D": "同步消息驱动（Synchronous Message Driven）：组件间通过同步阻塞调用通信"}, "answer": "D", "analysis": "反应式宣言（Reactive Manifesto）四大特性：即时响应性、回弹性、弹性、消息驱动（Message Driven）。消息驱动强调异步非阻塞的消息传递，而非\"同步阻塞调用\"。D选项描述相反，是不正确的。"}, {"id": "mock-2026年5月-模拟卷2-046", "index": 121, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 46, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "零信任安全架构的核心原则是（ ）。", "options": {"A": "内网环境默认可信，仅对外网访问进行验证", "B": "永不信任，始终验证——对每次访问请求都进行身份认证和授权", "C": "信任一次后长期有效，减少认证频率以提升用户体验", "D": "仅依赖网络边界防火墙实现安全防护"}, "answer": "B", "analysis": "零信任（Zero Trust）的核心原则是\"永不信任，始终验证\"（Never Trust, Always Verify）。不论请求来自内网还是外网，都需要进行身份认证和授权验证。传统安全模型基于网络边界的\"城堡护城河\"思维已不适应现代威胁环境。"}, {"id": "mock-2026年5月-模拟卷2-047", "index": 122, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 47, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "SBOM（Software Bill of Materials，软件物料清单）在软件供应链安全中的主要作用是（ ）。", "options": {"A": "提供软件的营销和定价信息", "B": "记录软件中所有组件、依赖和版本信息，便于漏洞追踪和合规审计", "C": "替代软件测试流程", "D": "仅用于开源软件的许可证管理"}, "answer": "B", "analysis": "SBOM记录软件中所有组件、库、依赖及其版本信息，类似于食品的成分表。在供应链安全中，SBOM帮助组织快速定位受漏洞影响的组件（如Log4Shell事件），进行合规审计和许可证管理。"}, {"id": "mock-2026年5月-模拟卷2-048", "index": 123, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 48, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在DevSecOps实践中，\"安全左移\"（Shift Left Security）是指（ ）。", "options": {"A": "将安全测试推迟到上线前集中进行", "B": "在软件开发生命周期的早期阶段就引入安全实践和自动化安全测试", "C": "由运维团队独立负责所有安全工作", "D": "仅在代码审查阶段检查安全问题"}, "answer": "B", "analysis": "\"安全左移\"是DevSecOps的核心理念，指在软件开发生命周期（SDLC）的早期阶段（需求、设计、编码）就引入安全实践，而非等到上线前才进行安全测试。越早发现安全问题，修复成本越低。"}, {"id": "mock-2026年5月-模拟卷2-049", "index": 124, "term": "2026年5月 模拟卷2", "paper": "模拟卷2", "questionNo": 49, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "以下关于等保2.0（网络安全等级保护2.0）的描述中，正确的是（ ）。", "options": {"A": "等保2.0仅适用于政府机关的信息系统", "B": "等保2.0将保护对象扩展到云计算、物联网、移动互联和工控系统", "C": "等保2.0取消了等级划分，所有系统采用统一标准", "D": "等保2.0不要求定期进行安全评估和测评"}, "answer": "B", "analysis": "等保2.0（GB/T 22239-2019）相比1.0的重要变化：将保护对象从传统信息系统扩展到云计算、物联网、移动互联网、工业控制系统和大数据平台，同时保留五个等级划分。"}, {"id": "mock-2026年5月-模拟卷2-050", "index": 125, "term": "2026
