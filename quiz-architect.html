 60, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "在数据库设计中，将ER模型转换为关系模型时，对于1:N联系的处理方法通常是（）。", "options": {"A": "将联系转换为一个独立的关系", "B": "将联系的属性和\"1\"方的主键合并到\"N\"方的关系中", "C": "将联系的属性和\"N\"方的主键合并到\"1\"方的关系中", "D": "不做任何处理"}, "answer": "B", "analysis": "ER模型转关系模型时，1:N联系的处理方法：将联系的属性和\"1\"方的主键作为外键合并到\"N\"方的关系中。例如，一个部门有多名员工（1:N），将部门号作为外键加入员工关系中。对于1:1联系，可以合并到任一方；对于M:N联系，必须转换为独立关系。"}, {"id": "mock-2026年5月-模拟卷4-061", "index": 286, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 61, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "在数据库并发控制中，两阶段封锁协议（2PL）要求事务分为两个阶段：扩展阶段和收缩阶段。以下关于2PL的描述中，正确的是（）。", "options": {"A": "遵守2PL协议的事务不会发生死锁", "B": "遵守2PL协议可以保证事务调度的可串行化", "C": "扩展阶段可以释放锁", "D": "收缩阶段可以申请新锁"}, "answer": "B", "analysis": "两阶段封锁协议保证事务调度的可串行化（B正确），但不能防止死锁（A不正确）。扩展阶段只能申请锁不能释放锁（C不正确），收缩阶段只能释放锁不能申请新锁（D不正确）。"}, {"id": "mock-2026年5月-模拟卷4-062", "index": 287, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 62, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "以下关于NoSQL数据库的描述中，不正确的是（）。", "options": {"A": "文档数据库（如MongoDB）以JSON/BSON文档为存储单位", "B": "键值存储（如Redis）适合缓存和会话管理场景", "C": "列族数据库（如HBase）适合处理大规模稀疏数据", "D": "NoSQL数据库都不支持事务处理"}, "answer": "D", "analysis": "\"NoSQL数据库都不支持事务处理\"是不正确的（D不正确）。现代NoSQL数据库如MongoDB 4.0+支持多文档ACID事务，Redis也支持事务操作。文档数据库以JSON/BSON为存储单位（A正确），键值存储适合缓存场景（B正确），列族数据库适合大规模稀疏数据（C正确）。"}, {"id": "mock-2026年5月-模拟卷4-063", "index": 288, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 63, "sourceType": "mock", "module_code": "new_technology", "module_name": "🚀 前沿新兴技术", "knowledge": "", "stem": "在大数据技术栈中，（）是分布式计算框架，采用MapReduce编程模型进行大规模数据处理。", "options": {"A": "HDFS", "B": "Hadoop MapReduce", "C": "Zookeeper", "D": "Kafka"}, "answer": "B", "analysis": "Hadoop MapReduce是分布式计算框架，采用MapReduce编程模型处理大规模数据集。HDFS是分布式文件存储系统，ZooKeeper是分布式协调服务，Kafka是分布式消息队列系统。"}, {"id": "mock-2026年5月-模拟卷4-064", "index": 289, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 64, "sourceType": "mock", "module_code": "new_technology", "module_name": "🚀 前沿新兴技术", "knowledge": "", "stem": "在区块链技术中，共识机制是保证分布式节点达成一致的关键。以下（）共识机制通过大量计算来竞争记账权，能耗较高。", "options": {"A": "PoS（权益证明）", "B": "PoW（工作量证明）", "C": "DPoS（委托权益证明）", "D": "PBFT（实用拜占庭容错）"}, "answer": "B", "analysis": "PoW（Proof of Work，工作量证明）要求矿工通过大量计算找到满足条件的哈希值来竞争记账权，能耗极高。PoS（权益证明）基于持币量竞争，DPoS通过投票选举记账节点，PBFT适合联盟链，都不需要大量计算。"}, {"id": "mock-2026年5月-模拟卷4-065", "index": 290, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 65, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在云计算的服务模式中，用户可以在平台上开发、运行和管理应用程序，无需关心底层基础设施的管理和维护的是（）。", "options": {"A": "IaaS（基础设施即服务）", "B": "PaaS（平台即服务）", "C": "SaaS（软件即服务）", "D": "FaaS（函数即服务）"}, "answer": "B", "analysis": "PaaS（Platform as a Service）为用户提供开发、运行和管理应用程序的平台，用户无需管理底层基础设施。IaaS提供虚拟化的计算资源，用户需管理操作系统以上的部分；SaaS提供完整的应用软件；FaaS是函数级别的服务，用户只编写函数代码。"}, {"id": "mock-2026年5月-模拟卷4-066", "index": 291, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 66, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "用线性规划求解以下问题：目标函数max z=2x+3y，约束条件为x+y≤4，x+3y≤6，x≥0，y≥0。则z的最大值为（）。", "options": {"A": "8", "B": "9", "C": "10", "D": "12"}, "answer": "B", "analysis": "线性规划的可行域顶点为(0,0)、(4,0)、(3,1)、(0,2)。在各顶点处计算目标函数值：z(0,0)=0，z(4,0)=8，z(3,1)=2×3+3×1=9，z(0,2)=6。最大值z=9，在顶点(3,1)处取得。其中(3,1)是x+y=4和x+3y=6的交点。"}, {"id": "mock-2026年5月-模拟卷4-067", "index": 292, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 67, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "一个袋中有3个白球和2个黑球，从中不放回地依次取2个球，两个球都是白球的概率是（）。", "options": {"A": "9/25", "B": "3/5", "C": "3/10", "D": "2/5"}, "answer": "C", "analysis": "不放回抽取，两球都是白球的概率P=C(3,2)/C(5,2)=3/10。也可以用条件概率：P=P(第一个白)×P(第二个白|第一个白)=(3/5)×(2/4)=6/20=3/10。"}, {"id": "mock-2026年5月-模拟卷4-068", "index": 293, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 68, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "一个无向连通图有6个顶点，各边的权值如下表所示。使用Kruskal算法求最小生成树，其权值之和为（）。\n\n| 边   | AB | BC | CD | BE | CF | DE | EF | AF | AE | BD |\n|------|----|----|----|----|----|----|----|----|----|----|\n| 权值 | 1  | 3  | 2  | 2  | 4  | 4  | 5  | 6  | 7  | 5  |", "options": {"A": "10", "B": "12", "C": "13", "D": "15"}, "answer": "B", "analysis": "Kruskal算法按权值从小到大选边，避免形成环。排序：AB=1, BE=2, CD=2, BC=3, CF=4, DE=4, EF=5, BD=5, AF=6, AE=7。依次选：AB=1（连A-B）, BE=2（连A-B-E）, CD=2（连C-D）, BC=3（连A-B-E-C-D）, CF=4（连F，生成树完成）。权值和=1+2+2+3+4=12。"}, {"id": "mock-2026年5月-模拟卷4-069", "index": 294, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 69, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在M/M/1排队系统中，顾客到达率λ=4人/分钟，服务率μ=6人/分钟。系统中平均顾客数L为（）。", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "answer": "B", "analysis": "M/M/1排队系统中，系统利用率ρ=λ/μ=4/6=2/3。系统中平均顾客数L=ρ/(1-ρ)=(2/3)/(1/3)=2。也可以用公式L=λ/(μ-λ)=4/(6-4)=4/2=2。"}, {"id": "mock-2026年5月-模拟卷4-070", "index": 295, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 70, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "对关键字序列{49, 38, 65, 97, 76, 13, 27, 49}进行快速排序，以第一个元素为基准进行第一趟划分后的结果是（）。", "options": {"A": "{27, 38, 13, 49, 76, 97, 65, 49}", "B": "{38, 27, 13, 49, 65, 97, 76, 49}", "C": "{13, 27, 38, 49, 76, 97, 65, 49}", "D": "{27, 38, 13, 49, 97, 76, 65, 49}"}, "answer": "A", "analysis": "快速排序以49为基准，从右向左找比49小的数，从左向右找比49大的数，交换直到相遇。过程：初始{49,38,65,97,76,13,27,49}。右→左：27<49，停；左→右：65>49，停；交换65和27→{49,38,27,97,76,13,65,49}。右→左：13<49，停；左→右：97>49，停；交换97和13→{49,38,27,13,76,97,65,49}。右→左：13处left=right相遇，将基准49与13交换→{13,38,27,49,76,97,65,49}...\n\n实际上使用标准的Lomuto或Hoare分区方案，第一趟划分结果为{27,38,13,49,76,97,65,49}，基准49位于正确位置，左边都比49小，右边都比49大或等于49。答案为A。"}, {"id": "mock-2026年5月-模拟卷4-071", "index": 296, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 71, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "According to the passage, software architecture primarily refers to （）.", "options": {"A": "the programming languages used to build the system", "B": "the fundamental organization of a system including its components and their relationships", "C": "the detailed design of each software module", "D": "the testing strategy for the software system"}, "answer": "B", "analysis": "文章第一句明确指出：\"Software architecture is the fundamental organization of a system, embodied in its components, their relationships to each other and to the environment\"。软件架构指系统的基本组织结构，包括组件及其关系。"}, {"id": "mock-2026年5月-模拟卷4-072", "index": 297, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 72, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "The \"4+1\" view model was proposed by （）.", "options": {"A": "Garlan and Shaw", "B": "Philippe Kruchten", "C": "Erich Gamma", "D": "Grady Booch"}, "answer": "B", "analysis": "文中明确提到\"the '4+1' view model proposed by Philippe Kruchten\"，4+1视图模型由Philippe Kruchten提出。"}, {"id": "mock-2026年5月-模拟卷4-073", "index": 298, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 73, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "According to the passage, which of the following is NOT mentioned as a quality attribute?", "options": {"A": "Performance", "B": "Security", "C": "Usability", "D": "Modifiability"}, "answer": "C", "analysis": "文中提到的质量属性包括performance（性能）、security（安全性）、availability（可用性）和modifiability（可修改性）。Usability（易用性）在文中没有提到。"}, {"id": "mock-2026年5月-模拟卷4-074", "index": 299, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 74, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "ATAM is used to （）.", "options": {"A": "generate source code automatically", "B": "test software for bugs", "C": "systematically identify and analyze architecture trade-offs", "D": "manage project schedules"}, "answer": "C", "analysis": "文中指出\"ATAM (Architecture Tradeoff Analysis Method), help architects systematically identify and analyze these trade-offs\"，ATAM用于系统地识别和分析架构权衡。"}, {"id": "mock-2026年5月-模拟卷4-075", "index": 300, "term": "2026年5月 模拟卷4", "paper": "模拟卷4", "questionNo": 75, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "Which of the following best describes the trend in modern software architecture?", "options": {"A": "Moving from distributed systems back to monolithic designs", "B": "Focusing solely on performance optimization", "C": "Shifting from monolithic designs to distributed systems with independent scalability", "D": "Eliminating the need for architecture evaluation"}, "answer": "C", "analysis": "文中最后一段描述：\"The rise of cloud computing and microservices has shifted the focus from monolithic designs to distributed systems that can scale independently\"，现代架构趋势是从单体设计转向可独立扩展的分布式系统。"}, {"id": "mock-2026年5月-模拟卷5-001", "index": 301, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 1, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在计算机系统中，Cache（高速缓冲存储器）对（）是透明的，主存与辅存之间的数据交换对（）是透明的。", "options": {"A": "程序员、操作系统", "B": "操作系统、程序员", "C": "程序员、应用程序", "D": "应用程序、操作系统"}, "answer": "C", "analysis": "Cache对程序员透明，由硬件自动管理；主存与辅存之间的数据交换（虚拟存储）对应用程序透明，由操作系统负责管理。\n\n押题理由: 2025年下半年第7题直接考了Cache透明性，属于连续高频考点，2026必考存储层次。"}, {"id": "mock-2026年5月-模拟卷5-002", "index": 302, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 2, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "某系统的MTBF为999小时，MTTR为1小时。该系统的稳态可用性最接近（）。", "options": {"A": "99.0%", "B": "99.5%", "C": "99.9%", "D": "99.99%"}, "answer": "C", "analysis": "稳态可用性 = MTBF/(MTBF+MTTR) = 999/(999+1) = 99.9%。注意MTBF = MTTF + MTTR，此处MTBF已包含修复时间。但题目给出的是MTBF，所以直接计算。实际上更精确的是A = MTTF/(MTTF+MTTR)。如果MTBF≈MTTF（当MTTR远小于MTTF时），则A ≈ 999/1000 = 99.9%。\n\n押题理由: MTTF/MTTR/MTBF几乎每年必考1题，2024上半年考了MTTD，预计2026继续出可靠性计算。"}, {"id": "mock-2026年5月-模拟卷5-003", "index": 303, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 3, "sourceType": "mock", "module_code": "new_technology", "module_name": "🚀 前沿新兴技术", "knowledge": "", "stem": "某数字信道的带宽为4000Hz，采用16种不同的信号状态，在无噪声条件下，根据奈奎斯特定理，该信道的最大数据传输速率为（）kbps。", "options": {"A": "16", "B": "32", "C": "64", "D": "128"}, "answer": "B", "analysis": "根据奈奎斯特定理：C = 2W × log₂(N) = 2 × 4000 × log₂(16) = 2 × 4000 × 4 = 32000bps = 32kbps。\n\n押题理由: 2025年下半年第14题考了奈奎斯特公式（3000Hz, 32状态），几乎年年变换数字出题。"}, {"id": "mock-2026年5月-模拟卷5-004", "index": 304, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 4, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "在流水线处理器中，若指令流水线分为取指、译码、执行、访存、写回5个阶段，每个阶段耗时分别为2ns、1ns、2ns、1ns、1ns，则该流水线的最大吞吐率为（）。", "options": {"A": "1/7ns", "B": "1/2ns", "C": "1/5ns", "D": "5/7ns"}, "answer": "B", "analysis": "流水线最大吞吐率 = 1/Δt，其中Δt为流水线中最慢阶段的时间。最慢阶段为2ns，故最大吞吐率 = 1/2ns = 500MIPS。\n\n押题理由: 流水线计算是计算机组成原理高频题，2024-2025连续出现。"}, {"id": "mock-2026年5月-模拟卷5-005", "index": 305, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 5, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在进程管理中，下列进程状态转换中不可能发生的是（）。", "options": {"A": "就绪态→运行态", "B": "运行态→就绪态", "C": "阻塞态→运行态", "D": "运行态→阻塞态"}, "answer": "C", "analysis": "阻塞态（等待态）不能直接转为运行态，必须先转为就绪态，再由调度程序调度为运行态。此知识点在2024上半年第15题和2024下半年第7题连续考过。\n\n押题理由: 进程状态转换是连续3年必考题，2024上、2024下都考了，2026极大概率继续考。"}, {"id": "mock-2026年5月-模拟卷5-006", "index": 306, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 6, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "某系统有5个进程共享同一类资源，每个进程最多需要3个该类资源，则系统不会发生死锁的最少资源数为（）。", "options": {"A": "10", "B": "11", "C": "12", "D": "15"}, "answer": "B", "analysis": "公式：最少资源数 = 进程数 × (最大需求 - 1) + 1 = 5 × (3-1) + 1 = 11。\n\n押题理由: 2025年下半年第23题考了\"5个进程每个需要2个资源\"的死锁题，预计2026换数字再考。"}, {"id": "mock-2026年5月-模拟卷5-007", "index": 307, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 7, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "", "stem": "在OSI参考模型中，负责数据加密和解密、数据压缩和解压缩的是（）。", "options": {"A": "应用层", "B": "表示层", "C": "会话层", "D": "传输层"}, "answer": "B", "analysis": "表示层负责数据的编码转换、加密解密、压缩解压缩等功能，确保不同系统之间的数据可以正确解释。\n\n押题理由: OSI七层模型是网络基础高频考点，2024上半年考交换机（数据链路层），2024下半年考传输层协议。"}, {"id": "mock-2026年5月-模拟卷5-008", "index": 308, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 8, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "嵌入式实时操作系统（RTOS）与通用操作系统的核心区别在于RTOS必须满足（）。", "options": {"A": "多任务并发能力", "B": "任务调度的时间确定性", "C": "大容量存储管理", "D": "丰富的人机交互界面"}, "answer": "B", "analysis": "RTOS的核心特征是时间确定性（Determinism），即任务必须在严格的时间约束内完成。通用OS追求吞吐量，RTOS追求确定性响应时间。\n\n押题理由: 2025上半年考了芯片温度级别（工业级），2025下半年考了VxWorks实时OS，嵌入式连续高频。"}, {"id": "mock-2026年5月-模拟卷5-009", "index": 309, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 9, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在GoF的23种设计模式中，以下属于结构型模式的是（）。", "options": {"A": "策略模式（Strategy）", "B": "观察者模式（Observer）", "C": "装饰器模式（Decorator）", "D": "命令模式（Command）"}, "answer": "C", "analysis": "GoF设计模式分三类——创建型5种（单例/原型/工厂方法/抽象工厂/建造者）、结构型7种（适配器/桥接/组合/装饰器/外观/享元/代理）、行为型11种（策略/观察者/命令/模板方法/迭代器/中介者/备忘录/状态/访问者/职责链/解释器）。装饰器是结构型。\n\n押题理由: 设计模式分类是年年必考题，2024上半年、2024下半年、2025上半年、2025下半年连续4次出题。"}, {"id": "mock-2026年5月-模拟卷5-010", "index": 310, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 10, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "某电商系统需要支持多种支付方式（微信支付、支付宝、银联），并且未来可能新增其他支付渠道。为了使支付算法可以独立于客户端变化而变化，最适合采用（）设计模式。", "options": {"A": "工厂方法模式（Factory Method）", "B": "策略模式（Strategy）", "C": "模板方法模式（Template Method）", "D": "状态模式（State）"}, "answer": "B", "analysis": "策略模式定义一系列算法，将每个算法封装起来，并使它们可以互换。支付方式可作为不同策略独立变化，新增支付渠道只需新增策略类。\n\n押题理由: 策略模式的应用场景题是近年高频出题方向，考查对设计模式的理解而非死记硬背。"}, {"id": "mock-2026年5月-模拟卷5-011", "index": 311, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 11, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "（）设计模式的意图是将抽象部分与其实现部分分离，使它们都可以独立变化。", "options": {"A": "适配器模式（Adapter）", "B": "桥接模式（Bridge）", "C": "代理模式（Proxy）", "D": "外观模式（Facade）"}, "answer": "B", "analysis": "桥接模式将抽象部分与实现部分分离，使它们可以独立变化。适配器是接口转换，代理是控制访问，外观是简化接口。\n\n押题理由: 2024上半年考了Bridge不属于创建型，桥接模式的意图描述属于常考知识点。"}, {"id": "mock-2026年5月-模拟卷5-012", "index": 312, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 12, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "某图形编辑器中，图形对象（如圆形、矩形）需要被序列化为多种格式（JSON、XML、二进制）。为了动态地给图形对象增加序列化能力而不修改原有类层次结构，应使用（）模式。", "options": {"A": "访问者模式（Visitor）", "B": "装饰器模式（Decorator）", "C": "适配器模式（Adapter）", "D": "组合模式（Composite）"}, "answer": "A", "analysis": "访问者模式适合在不修改已有类层次结构的情况下，为其增加新的操作。装饰器是动态增加职责但通常限于同类型接口扩展；访问者专门解决对多种类型对象施加不同操作的问题。本题中需要对不同图形对象施加多种序列化操作，适合访问者。\n\n押题理由: 行为型模式的场景应用题，测试对访问者/装饰器区别的深度理解，属于中高难度出题方向。"}, {"id": "mock-2026年5月-模拟卷5-013", "index": 313, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 13, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在UML用例图中，用例之间的关系不包括（）。", "options": {"A": "包含（include）", "B": "扩展（extend）", "C": "泛化（generalization）", "D": "聚合（aggregation）"}, "answer": "D", "analysis": "UML用例图中用例之间的关系只有三种：包含（include）、扩展（extend）和泛化（generalization）。聚合（aggregation）是类图中的关系。\n\n押题理由: 2025上半年第36题考了用例模型不包含的关系（聚合），2026极可能再考UML关系辨析。"}, {"id": "mock-2026年5月-模拟卷5-014", "index": 314, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 14, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "RUP（统一过程）将软件开发分为初始、细化、构建和交付四个阶段。其中，确定系统架构、制定项目计划和配置资源的阶段是（）。", "options": {"A": "初始阶段", "B": "细化阶段", "C": "构建阶段", "D": "交付阶段"}, "answer": "B", "analysis": "RUP细化阶段的主要目标是确定系统架构、制定项目计划、评估风险。\n\n押题理由: 2024下半年第14题考了RUP用例驱动，2025下半年第46题考了RUP细化阶段，连续高频。"}, {"id": "mock-2026年5月-模拟卷5-015", "index": 315, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 15, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "在软件维护类型中，为了适应软件运行环境（如操作系统升级、硬件更换）的变化而进行的修改属于（）。", "options": {"A": "改正性维护", "B": "适应性维护", "C": "完善性维护", "D": "预防性维护"}, "answer": "B", "analysis": "四种维护类型：改正性（修bug）、适应性（适应环境变化）、完善性（新增功能/优化性能）、预防性（为未来变化做准备）。操作系统升级属于环境变化，故选适应性维护。\n\n押题理由: 2024下半年第24题考了完善性维护，维护类型辨析几乎年年出。"}, {"id": "mock-2026年5月-模拟卷5-016", "index": 316, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 16, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于白盒测试覆盖标准的描述中，错误的是（）。", "options": {"A": "语句覆盖是最弱的覆盖标准", "B": "判定覆盖一定包含语句覆盖", "C": "条件覆盖一定包含判定覆盖", "D": "路径覆盖是最强的覆盖标准"}, "answer": "C", "analysis": "条件覆盖不一定包含判定覆盖。条件覆盖要求每个条件的真假值至少出现一次，但不保证每个判定的整体取真/取假分支都被覆盖。\n\n押题理由: 白盒测试覆盖标准在2024下半年第23题、2025下半年第13题和第47题反复考，2026必出。"}, {"id": "mock-2026年5月-模拟卷5-017", "index": 317, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 17, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在结构化分析方法中，用（）表示功能模型，用E-R图表示数据模型，用状态转换图表示行为模型。", "options": {"A": "用例图", "B": "类图", "C": "数据流图（DFD）", "D": "活动图"}, "answer": "C", "analysis": "结构化分析三大模型：功能模型用DFD（数据流图）、数据模型用E-R图、行为模型用STD（状态转换图）。\n\n押题理由: 2025下半年第10题直接考了此知识点，属于反复出题的基础知识。"}, {"id": "mock-2026年5月-模拟卷5-018", "index": 318, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 18, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在面向对象的继承分类中，一个对象在完全继承父对象的能力与特点之后，又继承了其他对象的内容，使其能力大于等于父对象，这种继承称为（）。", "options": {"A": "取代继承", "B": "包含继承", "C": "受限继承", "D": "特化继承"}, "answer": "B", "analysis": "包含继承：子对象完全继承父对象并额外继承其他对象内容，能力≥父对象。取代继承：子对象取代父对象；受限继承：限制父类接口可见性；特化继承：更具体化。\n\n押题理由: 2025上半年第39题原题考了包含继承的定义，2026可能换表述再考。"}, {"id": "mock-2026年5月-模拟卷5-019", "index": 319, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 19, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "螺旋模型是在（）的基础上扩展而成的，其核心特征是引入了（）环节。", "options": {"A": "瀑布模型、测试验证", "B": "原型模型、风险分析", "C": "增量模型、迭代开发", "D": "V模型、需求追踪"}, "answer": "B", "analysis": "螺旋模型是在原型模型基础上扩展，核心引入风险分析环节。四个象限：目标设定→风险分析→开发验证→评审。\n\n押题理由: 2025上半年第37题和2025下半年第12题都考了螺旋模型，连续高频。"}, {"id": "mock-2026年5月-模拟卷5-020", "index": 320, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 20, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "以下关于需求跟踪的描述中，正确的是（）。", "options": {"A": "正向跟踪是从工作产品追溯到需求规格说明", "B": "逆向跟踪是从需求规格说明追踪到工作产品", "C": "需求跟踪矩阵记录了需求与设计、编码、测试之间的对应关系", "D": "需求跟踪仅在需求分析阶段使用"}, "answer": "C", "analysis": "A错（正向是从需求追踪到工作产品），B错（逆向是从工作产品追溯到需求），D错（需求跟踪贯穿整个生命周期）。C正确，需求跟踪矩阵记录需求与设计、编码、测试的对应关系。\n\n押题理由: 2025下半年第25题考了需求跟踪正向/逆向区分，高频考点。"}, {"id": "mock-2026年5月-模拟卷5-021", "index": 321, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 21, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在软件架构评估方法中，（）是最早形成文档并得到广泛使用的架构分析方法，主要关注可修改性这一质量属性。", "options": {"A": "ATAM", "B": "SAAM", "C": "CBAM", "D": "SAEM"}, "answer": "B", "analysis": "SAAM是最早形成文档并被广泛使用的架构分析方法，主要关注可修改性。ATAM是SAAM的后续发展，关注多个质量属性间的权衡。\n\n押题理由: 2024上半年第18题直接考了\"最早形成文档的架构分析方法是SAAM\"，几乎年年考。"}, {"id": "mock-2026年5月-模拟卷5-022", "index": 322, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 22, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "ATAM（架构权衡分析方法）采用（）工具来对质量属性进行分类和优先级排序。该工具的结构为：树根—质量属性—属性分类—（）。", "options": {"A": "场景矩阵、架构决策", "B": "效用树、质量属性场景（叶子节点）", "C": "权衡矩阵、风险点", "D": "决策树、架构策略"}, "answer": "B", "analysis": "ATAM使用效用树（Utility Tree）对质量属性进行优先级排序。结构为：树根→质量属性→属性分类→质量属性场景（叶子节点）。场景用(H,M,L)标注重要性和难度。\n\n押题理由: 2024下半年第19题和2025下半年第9题都考了ATAM效用树，年年必考。"}, {"id": "mock-2026年5月-模拟卷5-023", "index": 323, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 23, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "CBAM（成本效益分析法）在（）的基础上，针对多个质量属性之间进行（）分析。", "options": {"A": "SAAM、可修改性", "B": "ATAM、成本效益折中", "C": "DSSA、领域适配", "D": "ABSD、功能分解"}, "answer": "B", "analysis": "CBAM在ATAM基础上，增加了经济维度的考量，分析架构策略的成本和效益，在多个质量属性之间进行成本效益折中分析。\n\n押题理由: ATAM/SAAM/CBAM三者对比是年年必考知识点，2025下半年第9题考了ATAM与CBAM的区别。"}, {"id": "mock-2026年5月-模拟卷5-024", "index": 324, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 24, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "质量属性场景由6部分组成：刺激源、刺激、环境、制品、响应和响应度量。其中，以下不属于可用性质量属性场景响应度量的是（）。", "options": {"A": "系统可用时间", "B": "故障修复时间", "C": "数据延迟时间", "D": "降级模式运行时间间隔"}, "answer": "C", "analysis": "可用性响应度量包括：系统可用时间、可用时间间隔、降级模式运行时间间隔、故障修复时间。\"数据延迟时间\"属于性能质量属性的度量，不属于可用性。\n\n押题理由: 2024下半年第11题原题考了可用性响应度量中不包含\"数据延迟时间\"，2026很可能换角度再考。"}, {"id": "mock-2026年5月-模拟卷5-025", "index": 325, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 25, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于质量属性的描述中，正确的是（）。", "options": {"A": "性能关注系统对事件的响应时间或单位时间内处理的事务数", "B": "可用性仅指系统不出故障的时间占比", "C": "安全性只需考虑数据加密即可满足", "D": "可修改性与系统架构无关，仅取决于代码质量"}, "answer": "A", "analysis": "A正确：性能关注响应时间、吞吐量。B错：可用性还包括容错恢复能力，不仅是\"不出故障时间\"。C错：安全性包含机密性、完整性、不可否认性、可控性，远不止加密。D错：可修改性高度依赖架构设计。\n\n押题理由: 质量属性辨析题在2024-2025每次考试至少出2-3题，2026必考。"}, {"id": "mock-2026年5月-模拟卷5-026", "index": 326, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 26, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某物联网平台需要处理来自数百万传感器的实时数据流，数据经过多个阶段的清洗、转换、聚合后存入数据库。该平台最适合采用（）架构风格。", "options": {"A": "仓库风格", "B": "管道-过滤器风格", "C": "主程序-子程序风格", "D": "面向对象风格"}, "answer": "B", "analysis": "管道-过滤器风格适合数据流经多个处理阶段（清洗→转换→聚合→存储）的场景，每个阶段是独立的过滤器。\n\n押题理由: 2024上半年第6-7题连续考了数据流风格，架构风格应用场景匹配是高频题型。"}, {"id": "mock-2026年5月-模拟卷5-027", "index": 327, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 27, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于架构风格脆弱性的描述中，错误的是（）。", "options": {"A": "管道-过滤器风格中构件不能并行执行是其脆弱性", "B": "层次风格中分层过多可能导致性能下降", "C": "事件驱动风格中构件间逻辑关系复杂可能导致死循环", "D": "微内核风格中核心功能过于精简可能影响扩展性"}, "answer": "A", "analysis": "管道-过滤器风格的过滤器可以并行执行（不同过滤器处理不同数据段），\"不能并行执行\"不是其脆弱性。其脆弱性是每个过滤器需要完整解析输入数据，可能造成性能瓶颈。\n\n押题理由: 2025下半年第29题原题考了架构风格脆弱性，管道-过滤器的并行性描述是易错点。"}, {"id": "mock-2026年5月-模拟卷5-028", "index": 328, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 28, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "ABSD（基于架构的软件设计）方法有三个基础，分别是对系统进行功能分解、采用（）实现质量属性和商业需求、采用软件模板设计软件结构。", "options": {"A": "设计模式", "B": "架构风格", "C": "领域模型", "D": "构件技术"}, "answer": "B", "analysis": "ABSD三个基础：功能分解、架构风格实现质量属性和商业需求、软件模板设计结构。\n\n押题理由: 2025下半年第16题直接考了ABSD三个基础，连续出现的高频知识点。"}, {"id": "mock-2026年5月-模拟卷5-029", "index": 329, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 29, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "", "stem": "4+1视图模型中，描述软件系统到硬件节点的映射关系的是（），关注系统运行时进程间交互和同步的是（）。", "options": {"A": "逻辑视图、开发视图", "B": "部署视图、进程视图", "C": "开发视图、逻辑视图", "D": "进程视图、部署视图"}, "answer": "B", "analysis": "4+1视图：逻辑视图（功能需求）、开发视图（软件组织）、进程视图（运行时并发/同步）、物理/部署视图（软件到硬件映射）、场景（+1）。\n\n押题理由: 2024下半年第17题和2025下半年第19-20题都考了4+1视图，年年必考。"}, {"id": "mock-2026年5月-模拟卷5-030", "index": 330, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 30, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在云原生架构中，Service Mesh的数据面（Data Plane）主要负责（）。", "options": {"A": "服务注册与发现", "B": "流量策略配置和下发", "C": "代理服务间的网络通信、执行流量控制和安全策略", "D": "容器编排和自动伸缩"}, "answer": "C", "analysis": "Service Mesh数据面（如Envoy Sidecar）以代理形式部署在每个服务旁边，负责服务间网络通信的代理转发、流量控制、负载均衡、安全认证等。控制面（如Istio）负责策略配置和下发。\n\n押题理由: 云原生深水区是2026新增热点，Service Mesh架构已进入教材范围。"}, {"id": "mock-2026年5月-模拟卷5-031", "index": 331, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 31, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于eBPF（extended Berkeley Packet Filter）技术的描述中，错误的是（）。", "options": {"A": "eBPF程序可以在Linux内核中安全运行而无需修改内核源代码", "B": "eBPF可用于网络监控、安全策略执行和性能分析等场景", "C": "eBPF程序运行在用户态，通过系统调用与内核交互", "D": "eBPF程序在加载前需要通过验证器（Verifier）的安全检查"}, "answer": "C", "analysis": "eBPF程序运行在内核态（kernel space），不是用户态。这是eBPF的核心特征——能在内核中安全执行程序。eBPF通过bpf()系统调用从用户态加载到内核态执行。\n\n押题理由: eBPF是2025-2026云原生领域最热门技术之一，预计首次进入考试范围。"}, {"id": "mock-2026年5月-模拟卷5-032", "index": 332, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 32, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "GitOps是一种以Git仓库为唯一事实来源（Single Source of Truth）的运维实践。以下关于GitOps的描述中，错误的是（）。", "options": {"A": "基础设施和应用配置以声明式方式存储在Git中", "B": "通过Git的Pull Request流程实现变更审批", "C": "GitOps Agent会持续监控集群状态并与Git中的期望状态保持一致", "D": "GitOps要求所有部署必须采用命令式（imperative）操作"}, "answer": "D", "analysis": "GitOps强调声明式（declarative）配置，而非命令式（imperative）操作。声明式描述期望状态，由GitOps Agent自动调谐实际状态与期望状态一致。\n\n押题理由: GitOps/IaC是云原生运维的最新实践，2026年教材更新可能纳入。"}, {"id": "mock-2026年5月-模拟卷5-033", "index": 333, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 33, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "混沌工程（Chaos Engineering）的核心思想是（）。", "options": {"A": "通过随机关闭生产服务来测试系统容错能力", "B": "在受控条件下主动向系统注入故障，验证系统在异常情况下的韧性", "C": "使用模糊测试工具发现系统安全漏洞", "D": "通过压力测试确定系统的性能瓶颈"}, "answer": "B", "analysis": "混沌工程不是随机破坏（A），而是在受控条件下有计划地注入故障（如网络延迟、节点宕机），观察系统的韧性表现。代表工具：Netflix Chaos Monkey、LitmusChaos。\n\n押题理由: 混沌工程是系统韧性设计的重要实践，与架构设计师关注的可用性直接相关。"}, {"id": "mock-2026年5月-模拟卷5-034", "index": 334, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 34, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "OpenTelemetry是云原生可观测性（Observability）的统一标准，它将可观测性数据统一为三大支柱，即（）。", "options": {"A": "日志（Logs）、指标（Metrics）、链路追踪（Traces）", "B": "日志（Logs）、告警（Alerts）、仪表盘（Dashboards）", "C": "指标（Metrics）、事件（Events）、拓扑图（Topology）", "D": "链路追踪（Traces）、告警（Alerts）、日志（Logs）"}, "answer": "A", "analysis": "可观测性三大支柱：日志（Logs）记录离散事件、指标（Metrics）记录聚合度量、链路追踪（Traces）记录请求的端到端路径。OpenTelemetry统一了这三者的采集标准。\n\n押题理由: 可观测性是云原生架构的核心议题，OpenTelemetry已成为CNCF毕业项目。"}, {"id": "mock-2026年5月-模拟卷5-035", "index": 335, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 35, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某企业要构建一个分布式微服务系统，要求实现服务间调用的链路追踪和性能监控。以下技术组合中最适合的是（）。", "options": {"A": "Nginx + Zabbix + ELK", "B": "OpenTelemetry + Jaeger + Prometheus", "C": "Apache HTTP + Nagios + Splunk", "D": "HAProxy + Ganglia + Fluentd"}, "answer": "B", "analysis": "OpenTelemetry负责统一采集指标/日志/追踪数据，Jaeger是分布式链路追踪系统，Prometheus是时序数据库和告警引擎。三者组合是云原生监控的标准方案。\n\n押题理由: 技术选型题考查对云原生技术栈的整体理解，是架构师考试的重要题型。"}, {"id": "mock-2026年5月-模拟卷5-036", "index": 336, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 36, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在微服务架构中，断路器（Circuit Breaker）模式包含三种状态，分别是（）。", "options": {"A": "打开态、关闭态、半开态", "B": "激活态、关闭态、休眠态", "C": "就绪态、运行态、阻塞态", "D": "主动态、被动态、降级态"}, "answer": "A", "analysis": "断路器三种状态：关闭态（正常通过请求）→打开态（拒绝请求）→半开态（试探性放行部分请求）。\n\n押题理由: 2025上半年第12题和2025下半年都考了断路器模式状态，连续高频。"}, {"id": "mock-2026年5月-模拟卷5-037", "index": 337, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 37, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于Kubernetes中Pod的描述中，错误的是（）。", "options": {"A": "Pod是Kubernetes调度的最小单元", "B": "同一Pod内的容器共享网络命名空间和存储卷", "C": "一个Pod中只能包含一个容器", "D": "Pod的生命周期是短暂的，可能随时被重建"}, "answer": "C", "analysis": "一个Pod中可以包含一个或多个容器（如Sidecar模式），它们共享网络和存储。\"只能包含一个容器\"是错误的。\n\n押题理由: Kubernetes已纳入架构师考试范围，Pod是最基础概念，2026必考容器编排。"}, {"id": "mock-2026年5月-模拟卷5-038", "index": 338, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 38, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某在线教育系统需要同时满足高可用性（99.99%）和强一致性。根据CAP定理，该系统在发生网络分区时必须（）。", "options": {"A": "同时保证可用性和一致性", "B": "牺牲一致性以保证可用性", "C": "牺牲可用性以保证一致性", "D": "牺牲分区容错性"}, "answer": "C", "analysis": "CAP定理：在网络分区发生时，系统只能在一致性（C）和可用性（A）之间二选一。题目要求强一致性，则必须牺牲可用性。\n\n押题理由: CAP定理是分布式系统核心理论，与架构设计决策直接相关，属于高频考点。"}, {"id": "mock-2026年5月-模拟卷5-039", "index": 339, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 39, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "以下关于遗留系统演化策略的描述中，正确的是（）。", "options": {"A": "高水平、高价值的系统适合淘汰", "B": "低水平、低价值的系统适合继承", "C": "高水平、低价值的系统适合改造", "D": "低水平、高价值的系统适合淘汰"}, "answer": "C", "analysis": "遗留系统演化策略：高水平高价值→继承、低水平高价值→集成、低水平低价值→淘汰、高水平低价值→改造。\n\n押题理由: 2025下半年第6题直接考了遗留系统评价框架，年年必考。"}, {"id": "mock-2026年5月-模拟卷5-040", "index": 340, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 40, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在软件架构描述语言（ADL）中，以下不属于ADL的是（）。", "options": {"A": "Wright", "B": "Rapide", "C": "UML", "D": "Darwin"}, "answer": "C", "analysis": "UML是统一建模语言，不是架构描述语言（ADL）。ADL包括：Wright、Rapide、Darwin、UniCon、Aesop、ACME等。\n\n押题理由: 2024上半年第19题考了ADL包含哪些语言，ADL辨识是高频考点。"}, {"id": "mock-2026年5月-模拟卷5-041", "index": 341, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 41, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "在国家密码管理体系中，SM2算法是一种基于（）的公钥密码算法，主要用于数字签名、密钥交换和数据加密。", "options": {"A": "RSA大整数分解", "B": "椭圆曲线密码学（ECC）", "C": "离散对数问题", "D": "哈希函数"}, "answer": "B", "analysis": "SM2是基于椭圆曲线密码学（ECC）的公钥密码算法，由国家密码管理局发布，包含数字签名、密钥交换、公钥加密三部分。\n\n押题理由: 国密算法（SM2/SM3/SM4）是近年信息安全高频考点，2026必考。"}, {"id": "mock-2026年5月-模拟卷5-042", "index": 342, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 42, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "", "stem": "我国《数据安全法》规定，重要数据的处理者应当按照规定对其数据处理活动定期开展（）。", "options": {"A": "渗透测试", "B": "风险评估", "C": "等级保护测评", "D": "安全审计"}, "answer": "B", "analysis": "《数据安全法》第三十条规定，重要数据处理者应当按照规定对其数据处理活动定期开展风险评估。\n\n押题理由: 数据安全法相关法规是2024-2025新增考点，2026继续出法规题。"}, {"id": "mock-2026年5月-模拟卷5-043", "index": 343, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 43, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "以下关于数据出境安全评估的描述中，错误的是（）。", "options": {"A": "关键信息基础设施运营者向境外提供个人信息须申报安全评估", "B": "处理100万人以上个人信息的处理者向境外提供个人信息须申报安全评估", "C": "所有企业向境外传输任何类型的数据都必须经过安全评估", "D": "数据出境安全评估由国家网信部门负责"}, "answer": "C", "analysis": "并非所有数据出境都需要安全评估。触发条件包括：关键信息基础设施运营者、处理100万人以上个人信息的处理者、累计向境外提供10万人以上个人信息等特定情形。\n\n押题理由: 数据出境安全评估是2025年热点法规，预计2026首次进入考试。"}, {"id": "mock-2026年5月-模拟卷5-044", "index": 344, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 44, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在访问控制模型中，（）基于用户在组织中的角色来分配权限，是最早形成文档并被广泛使用的模型。", "options": {"A": "DAC（自主访问控制）", "B": "MAC（强制访问控制）", "C": "RBAC（基于角色的访问控制）", "D": "ABAC（基于属性的访问控制）"}, "answer": "C", "analysis": "RBAC（基于角色的访问控制）是最早形成文档并被广泛使用的访问控制模型，由Ferraiolo和Kuhn于1992年提出。\n\n押题理由: 2024上半年第16-17题连续考了TBAC和RBAC，访问控制模型年年必考。"}, {"id": "mock-2026年5月-模拟卷5-045", "index": 345, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 45, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "TBAC（基于任务的访问控制）模型由（）四部分组成，适用于工作流环境中的访问控制。", "options": {"A": "用户集、角色集、权限集、会话集", "B": "工作流、授权结构体、受托人集、许可集", "C": "主体、客体、操作、约束", "D": "身份、凭证、策略、审计"}, "answer": "B", "analysis": "TBAC由工作流、授权结构体、受托人集、许可集四部分组成。\n\n押题理由: 2024上半年第16题直接考了TBAC组成，高频考点。"}, {"id": "mock-2026年5月-模拟卷5-046", "index": 346, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 46, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "以下关于AI安全治理的描述中，不属于我国《生成式人工智能服务管理暂行办法》要求的是（）。", "options": {"A": "生成式AI服务提供者应当对训练数据的合法性负责", "B": "提供者应当采取措施防止生成虚假信息", "C": "所有AI模型必须开源以接受公众监督", "D": "提供者应当按照规定进行算法备案"}, "answer": "C", "analysis": "《生成式人工智能服务管理暂行办法》并未要求所有AI模型开源。该办法要求训练数据合法性、防止虚假信息、算法备案等，但不要求开源。\n\n押题理由: AI治理法规是2026年最大热点，生成式AI管理办法是必考内容。"}, {"id": "mock-2026年5月-模拟卷5-047", "index": 347, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 47, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "零信任安全架构（Zero Trust Architecture）的核心原则是（）。", "options": {"A": "内网可信，仅对外网访问进行验证", "B": "永不信任，始终验证（Never Trust, Always Verify）", "C": "一次认证，处处可用", "D": "基于IP地址进行访问控制"}, "answer": "B", "analysis": "零信任架构的核心原则是\"永不信任，始终验证\"（Never Trust, Always Verify），不基于网络位置授予信任，每次访问都需要身份验证和授权。\n\n押题理由: 零信任是2025-2026安全架构热门话题，预计首次或第二次进入考试。"}, {"id": "mock-2026年5月-模拟卷5-048", "index": 348, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 48, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "SM3算法是我国自主设计的密码杂凑算法，其输出摘要值的长度为（）位。", "options": {"A": "128", "B": "160", "C": "256", "D": "512"}, "answer": "C", "analysis": "SM3算法输出256位（32字节）的摘要值。SM3的设计安全性等价于SHA-256。\n\n押题理由: 国密系列算法参数（SM2=ECC、SM3=256位杂凑、SM4=128位分组密码）是安全基础知识。"}, {"id": "mock-2026年5月-模拟卷5-049", "index": 349, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 49, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "", "stem": "在信息安全等级保护体系中，第三级系统的安全保护能力要求是（）。", "options": {"A": "用户自主保护级", "B": "系统审计保护级", "C": "安全标记保护级", "D": "结构化保护级"}, "answer": "C", "analysis": "等级保护五级：第一级用户自主保护级、第二级系统审计保护级、第三级安全标记保护级、第四级结构化保护级、第五级访问验证保护级。\n\n押题理由: 等级保护制度是信息安全基础考点，2024-2025连续出题。"}, {"id": "mock-2026年5月-模拟卷5-050", "index": 350, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 50, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "以下关于AI算法备案制度的描述中，正确的是（）。", "options": {"A": "只有在国内上市的AI公司才需要备案", "B": "具有舆论属性或社会动员能力的算法推荐服务提供者应当进行备案", "C": "算法备案后即获得永久使用许可，无需更新", "D": "算法备案由工信部独立负责"}, "answer": "B", "analysis": "根据《互联网信息服务算法推荐管理规定》，具有舆论属性或社会动员能力的算法推荐服务提供者应当进行备案。并非只有上市公司需要，也非永久有效。\n\n押题理由: 算法备案制度是2025年法规热点，与AI治理紧密相关。"}, {"id": "mock-2026年5月-模拟卷5-051", "index": 351, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 51, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "在关系数据库的三级模式中，描述数据的全局逻辑结构、记录间的联系、完整性和安全性约束的是（），表示用户可见的局部数据视图的是（）。", "options": {"A": "内模式、概念模式", "B": "概念模式、外模式", "C": "外模式、内模式", "D": "概念模式、内模式"}, "answer": "B", "analysis": "概念模式（逻辑模式）描述全局逻辑结构、约束和安全性；外模式（用户模式）描述用户可见的局部数据视图；内模式描述物理存储结构。\n\n押题理由: 2025下半年第27-28题考了三级模式，数据库基础年年出。"}, {"id": "mock-2026年5月-模拟卷5-052", "index": 352, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 52, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "在关系代数中，对关系R(a, b, c)和S(b, c, d)进行自然连接，结果关系包含（）个属性列。", "options": {"A": "3", "B": "4", "C": "5", "D": "6"}, "answer": "B", "analysis": "自然连接找出同名属性（b, c），等值连接后去除重复列。结果包含(a, b, c, d) = 4列。\n\n押题理由: 2024下半年第27题原题考了自然连接列数，2026极大概率再考关系代数。"}, {"id": "mock-2026年5月-模拟卷5-053", "index": 353, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 53, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "向量数据库（Vector Database）与传统关系数据库的核心区别在于，向量数据库主要针对（）进行优化存储和检索。", "options": {"A": "结构化表格数据", "B": "高维向量的相似性搜索", "C": "文本全文检索", "D": "图结构数据的遍历查询"}, "answer": "B", "analysis": "向量数据库（如Milvus、Pinecone、Weaviate）专门针对高维向量的相似性搜索（ANN近似最近邻检索）进行优化，是RAG系统的核心基础设施。\n\n押题理由: 向量数据库随AI大模型和RAG技术的普及成为2026年热点，预计首次入考。"}, {"id": "mock-2026年5月-模拟卷5-054", "index": 354, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 54, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在数据架构中，数据网格（Data Mesh）的核心理念是（）。", "options": {"A": "将所有数据集中到统一的数据湖进行管理", "B": "按业务领域划分数据所有权，每个领域团队作为数据产品的Owner", "C": "使用单一ETL管道处理所有数据转换", "D": "将数据治理完全自动化，不需要人工参与"}, "answer": "B", "analysis": "Data Mesh核心理念：去中心化数据架构，按业务领域划分数据所有权，每个领域团队既是数据的生产者也是管理者，将数据作为产品（Data as a Product）交付。\n\n押题理由: Data Mesh是2025-2026数据架构最热门概念，与架构设计直接相关。"}, {"id": "mock-2026年5月-模拟卷5-055", "index": 355, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 55, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "数据编织（Data Fabric）架构的关键特征是（）。", "options": {"A": "仅支持批量数据处理", "B": "通过智能元数据层实现跨异构数据源的统一访问和自动化数据集成", "C": "要求所有数据源使用相同的数据格式", "D": "仅适用于云环境，不支持混合部署"}, "answer": "B", "analysis": "Data Fabric通过智能元数据层（利用AI/ML技术）实现跨异构数据源的统一访问、自动化数据发现和集成，支持混合云/多云环境。\n\n押题理由: Data Fabric与Data Mesh是2026年数据架构两大热点，对比辨析可能出题。"}, {"id": "mock-2026年5月-模拟卷5-056", "index": 356, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 56, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在实时数据流处理中，Apache Flink相比Apache Spark Streaming的核心优势在于（）。", "options": {"A": "Flink支持批处理而Spark不支持", "B": "Flink原生支持事件时间（Event Time）语义和精确一次（Exactly-Once）处理", "C": "Flink只能处理结构化数据", "D": "Flink不需要集群即可运行"}, "answer": "B", "analysis": "Flink原生支持事件时间语义（基于事件产生时间而非处理时间），支持Exactly-Once状态一致性保证。Spark Streaming基于微批处理模型，事件时间支持较晚引入。\n\n押题理由: 实时数据流处理是架构师必备技能，Flink vs Spark对比是热门技术选型题。"}, {"id": "mock-2026年5月-模拟卷5-057", "index": 357, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 57, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "某电商公司使用Kafka作为消息中间件。当某个消费者组（Consumer Group）中的消费者实例增加时，Kafka会触发（）机制来重新分配分区。", "options": {"A": "主从复制（Replication）", "B": "再均衡（Rebalance）", "C": "分区合并（Partition Merge）", "D": "日志压缩（Log Compaction）"}, "answer": "B", "analysis": "当Consumer Group的成员变化（新增/移除消费者）时，Kafka触发Rebalance机制，重新将分区分配给组内消费者。\n\n押题理由: Kafka是分布式系统常考中间件，Consumer Group和Rebalance是核心概念。"}, {"id": "mock-2026年5月-模拟卷5-058", "index": 358, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 58, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "在数据库规范化理论中，如果关系R中的每个非主属性都完全函数依赖于主键且不存在传递依赖，则R至少满足（）。", "options": {"A": "1NF", "B": "2NF", "C": "3NF", "D": "BCNF"}, "answer": "C", "analysis": "3NF要求：满足1NF、所有非主属性完全函数依赖于主键（满足2NF）、不存在非主属性对主键的传递依赖。\n\n押题理由: 数据库规范化是基础高频考点，NF判断题几乎年年出。"}, {"id": "mock-2026年5月-模拟卷5-059", "index": 359, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 59, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在大语言模型（LLM）的Transformer架构中，自注意力机制（Self-Attention）的计算复杂度与输入序列长度n的关系为（）。", "options": {"A": "O(n)", "B": "O(n log n)", "C": "O(n²)", "D": "O(n³)"}, "answer": "C", "analysis": "标准Self-Attention需要计算n×n的注意力矩阵，时间和空间复杂度均为O(n²)。这也是长序列处理的主要瓶颈。\n\n押题理由: Transformer架构是2025下半年第24题考过的新增考点（大模型基础架构），2026必考。"}, {"id": "mock-2026年5月-模拟卷5-060", "index": 360, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 60, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "RAG（Retrieval-Augmented Generation）技术的核心思想是（）。", "options": {"A": "仅依赖模型参数中存储的知识进行回答", "B": "在生成回答前先检索外部知识库中的相关文档，将其作为上下文输入模型", "C": "通过持续微调模型来更新知识", "D": "将所有知识预先编码到提示词模板中"}, "answer": "B", "analysis": "RAG = 检索（Retrieval）+ 增强（Augmented）+ 生成（Generation）。先从外部知识库检索相关文档，将其拼接到提示词中作为上下文，再由LLM生成回答。\n\n押题理由: RAG是2025-2026年AI落地最热门的技术方案，预计2026首次入考。"}, {"id": "mock-2026年5月-模拟卷5-061", "index": 361, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 61, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在大模型推理优化技术中，KV Cache的作用是（）。", "options": {"A": "缓存模型的权重参数以减少加载时间", "B": "缓存注意力机制中已计算的Key和Value，避免自回归生成时的重复计算", "C": "缓存用户的历史查询以加速检索", "D": "缓存训练数据以加速模型微调"}, "answer": "B", "analysis": "KV Cache缓存自注意力机制中已计算的Key和Value张量。在自回归生成时，每生成一个新Token只需计算新Token的QKV，历史Token的K和V从缓存读取，避免重复计算。\n\n押题理由: 大模型推理优化是2026年AI工程化热点，KV Cache是核心概念。"}, {"id": "mock-2026年5月-模拟卷5-062", "index": 362, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 62, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于大模型部署架构的描述中，错误的是（）。", "options": {"A": "模型量化（Quantization）可以将FP32权重压缩为INT8/INT4，减少显存占用", "B": "张量并行（Tensor Parallelism）将模型的不同层分配到不同GPU上", "C": "vLLM框架通过PagedAttention技术优化显存管理", "D": "模型蒸馏（Distillation）使用大模型指导训练小模型"}, "answer": "B", "analysis": "张量并行（Tensor Parallelism）是将同一层的权重矩阵切分到多GPU上并行计算。将不同层分到不同GPU是流水线并行（Pipeline Parallelism）。\n\n押题理由: 大模型部署的并行策略是高难度考点，考查对分布式训练/推理架构的深度理解。"}, {"id": "mock-2026年5月-模拟卷5-063", "index": 363, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 63, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "", "stem": "AI Agent编排框架中，ReAct（Reasoning + Acting）范式的核心特点是（）。", "options": {"A": "仅进行推理，不执行任何外部动作", "B": "将推理（Thought）和行动（Action）交替进行，根据观察结果决定下一步", "C": "将所有工具调用预先编排为固定流程", "D": "仅依赖检索增强生成，不需要额外的推理步骤"}, "answer": "B", "analysis": "ReAct范式交替执行推理（Thought：分析当前情况）和行动（Action：调用工具），获取观察结果（Observation）后继续推理，直到得出最终答案。\n\n押题理由: AI Agent是2026年最大热点之一，ReAct作为经典Agent框架必然入考。"}, {"id": "mock-2026年5月-模拟卷5-064", "index": 364, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 64, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在多模态大模型中，视觉编码器（Vision Encoder）的主要作用是（）。", "options": {"A": "将文本转换为向量表示", "B": "将图像转换为与文本嵌入空间对齐的特征向量", "C": "生成图像像素", "D": "对音频信号进行频谱分析"}, "answer": "B", "analysis": "视觉编码器（如ViT、CLIP的视觉部分）将图像转换为与文本嵌入空间对齐的特征向量，使模型能够在统一空间中处理图文信息。\n\n押题理由: 多模态大模型是2026年AI发展方向，视觉编码器是核心组件。"}, {"id": "mock-2026年5月-模拟卷5-065", "index": 365, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 65, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "以下关于LoRA（Low-Rank Adaptation）微调技术的描述中，正确的是（）。", "options": {"A": "LoRA需要更新模型的全部参数", "B": "LoRA在原始权重矩阵旁添加低秩分解矩阵，只训练新增的少量参数", "C": "LoRA只能用于文本生成模型，不适用于图像模型", "D": "LoRA微调后的模型无法与原始模型合并"}, "answer": "B", "analysis": "LoRA冻结预训练模型权重，在每个目标层旁边注入低秩矩阵（A和B），只训练A和B的参数（通常不到原模型参数的1%）。训练后可将LoRA矩阵合并回原始权重。\n\n押题理由: LoRA是2025-2026年最流行的高效微调技术，是大模型实际应用的必备知识。"}, {"id": "mock-2026年5月-模拟卷5-066", "index": 366, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 66, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "模型推理中的投机解码（Speculative Decoding）技术的核心思想是（）。", "options": {"A": "使用多个大模型进行集成推理", "B": "用小模型快速生成候选Token序列，再由大模型并行验证", "C": "将输入分成多段并行处理", "D": "跳过部分Transformer层以加速推理"}, "answer": "B", "analysis": "投机解码用一个小而快的Draft模型自回归生成多个候选Token，然后大模型一次性并行验证这些Token，接受正确的、拒绝错误的。可以在不损失质量的情况下加速推理。\n\n押题理由: 推理加速是大模型工程化的核心挑战，投机解码是2025-2026年热门优化技术。"}, {"id": "mock-2026年5月-模拟卷5-067", "index": 367, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 67, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "在AI工程化实践中，MLOps的核心目标是（）。", "options": {"A": "仅关注模型的训练精度", "B": "实现机器学习模型从开发到生产部署的自动化全生命周期管理", "C": "替代传统的DevOps实践", "D": "仅用于数据标注和清洗"}, "answer": "B", "analysis": "MLOps实现ML模型从开发（数据准备→训练→评估）到部署（模型服务→监控→迭代）的全生命周期自动化管理，是DevOps在ML领域的延伸而非替代。\n\n押题理由: AI工程化/MLOps是2026年重点方向，与架构设计直接相关。"}, {"id": "mock-2026年5月-模拟卷5-068", "index": 368, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 68, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "以下关于MoE（Mixture of Experts）架构的描述中，正确的是（）。", "options": {"A": "推理时所有专家网络都参与计算", "B": "每个输入Token只激活部分专家网络，从而在模型参数量大的情况下控制计算量", "C": "MoE只能用于NLP任务", "D": "MoE不需要路由器（Router）组件"}, "answer": "B", "analysis": "MoE架构中，路由器（Router/Gating Network）根据输入决定激活哪些专家。每个Token只经过少数几个专家（如Top-2），从而在保持大参数量（知识容量）的同时控制实际计算量。\n\n押题理由: MoE是GPT-4/Mixtral等主流模型的核心架构，是2026年必考AI知识。"}, {"id": "mock-2026年5月-模拟卷5-069", "index": 369, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 69, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "", "stem": "在Prompt Engineering中，Chain-of-Thought（思维链）提示的核心作用是（）。", "options": {"A": "减少模型的推理延迟", "B": "通过引导模型展示中间推理步骤来提高复杂推理任务的准确性", "C": "减少模型参数量", "D": "替代模型微调"}, "answer": "B", "analysis": "Chain-of-Thought提示通过在示例或指令中展示中间推理步骤，引导模型\"步步思考\"，显著提高数学推理、逻辑推理等复杂任务的准确性。\n\n押题理由: Prompt Engineering是AI应用的基础技能，CoT是最重要的提示技术之一。"}, {"id": "mock-2026年5月-模拟卷5-070", "index": 370, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 70, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "", "stem": "某企业需要在私有数据上构建问答系统，但不希望将数据发送到外部API。以下最适合的方案是（）。", "options": {"A": "直接调用OpenAI API", "B": "使用本地部署的开源大模型 + RAG架构", "C": "仅使用传统关键词搜索", "D": "将所有数据上传到公有云训练专属模型"}, "answer": "B", "analysis": "本地部署开源大模型（如LLaMA、Qwen）+ RAG架构可以在不将私有数据发送到外部的情况下，利用私有知识库增强回答质量。这是企业AI落地的主流方案。\n\n押题理由: 企业AI落地架构选型是2026年最实际的考点，结合数据安全和AI技术。"}, {"id": "mock-2026年5月-模拟卷5-071", "index": 371, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 71, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "According to the passage, which of the following is NOT a key dimension of AI governance?", "options": {"A": "Accountability", "B": "Transparency", "C": "Profitability", "D": "Fairness"}, "answer": "C", "analysis": "文中明确列出AI治理的四个关键维度：accountability（问责）、transparency（透明）、fairness（公平）、safety（安全）。Profitability（盈利性）未被提及。\n\n押题理由: AI Governance是2026年全球热点话题，英语阅读极大概率选此主题。"}, {"id": "mock-2026年5月-模拟卷5-072", "index": 372, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 72, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "The EU AI Act adopts a（）approach to regulate artificial intelligence.", "options": {"A": "size-based", "B": "risk-based", "C": "cost-based", "D": "industry-based"}, "answer": "B", "analysis": "原文明确指出\"It adopts a risk-based approach\"，即基于风险的方法。\n\n押题理由: EU AI Act是2025年生效的里程碑法规，英语阅读材料的理想来源。"}, {"id": "mock-2026年5月-模拟卷5-073", "index": 373, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 73, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "According to the passage, high-risk AI systems include those used in all of the following EXCEPT（）.", "options": {"A": "Critical infrastructure", "B": "Education", "C": "Entertainment", "D": "Employment"}, "answer": "C", "analysis": "原文列出高风险AI系统应用领域包括\"critical infrastructure, education, and employment\"。Entertainment（娱乐）未被提及。\n\n押题理由: 高风险AI系统分类是AI治理的核心知识点。"}, {"id": "mock-2026年5月-模拟卷5-074", "index": 374, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 74, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "", "stem": "Model cards are used to（）.", "options": {"A": "Store the training data of AI models", "B": "Document a model's intended use, performance metrics, and known limitations", "C": "Replace the need for bias audits", "D": "Automate the deployment process"}, "answer": "B", "analysis": "原文明确指出\"establishing model cards that document a model's intended use, performance metrics, and known limitations\"。\n\n押题理由: Model Card是AI工程化实践的重要文档，体现负责任AI的具体做法。"}, {"id": "mock-2026年5月-模拟卷5-075", "index": 375, "term": "2026年5月 模拟卷5", "paper": "模拟卷5", "questionNo": 75, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "", "stem": "The concept of \"responsible AI\" as described in the passage（）.", "options": {"A": "Is limited to legal compliance only", "B": "Extends beyond compliance to include ethical considerations", "C": "Focuses solely on technical performance", "D": "Applies only to high-risk AI systems"}, "answer": "B", "analysis": "原文最后一句\"The concept of responsible AI extends beyond mere compliance to embrace ethical considerations\"，即负责任AI超越了单纯的合规要求，包含伦理考量。\n\n押题理由: Responsible AI是AI治理的核心概念，理解其内涵对架构师至关重要。"}, {"id": "mock-2026年5月-模拟卷6-001", "index": 376, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 1, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "操作系统—进程调度", "stem": "在操作系统的进程调度中，某系统采用时间片轮转调度算法，时间片大小为20ms。若就绪队列中有5个进程，且不考虑进程切换开销，则每个进程每100ms内获得的CPU时间为（ ）。", "options": {"A": "10ms", "B": "20ms", "C": "25ms", "D": "50ms"}, "answer": "B", "analysis": "时间片轮转调度中，5个进程轮流执行，每个进程获得20ms的时间片。一轮总耗时为5×20=100ms，每个进程在100ms内获得1个时间片即20ms的CPU时间。"}, {"id": "mock-2026年5月-模拟卷6-002", "index": 377, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 2, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "计算机网络—TCP流量控制", "stem": "在计算机网络中，TCP协议使用滑动窗口机制进行流量控制。若发送方的拥塞窗口大小为8KB，接收方通告的接收窗口大小为6KB，则发送方实际可发送的最大数据量为（ ）。", "options": {"A": "6KB", "B": "8KB", "C": "14KB", "D": "2KB"}, "answer": "A", "analysis": "发送方实际可发送的数据量取min(拥塞窗口, 接收窗口) = min(8KB, 6KB) = 6KB。发送窗口大小取拥塞窗口和接收窗口中的较小值，以同时满足网络和接收方的限制。"}, {"id": "mock-2026年5月-模拟卷6-003", "index": 378, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 3, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "操作系统—虚拟存储", "stem": "某系统采用虚拟存储器管理，页面大小为4KB，进程的逻辑地址空间为32位，则页表中最多包含（ ）个页表项。", "options": {"A": "2^10", "B": "2^12", "C": "2^20", "D": "2^32"}, "answer": "C", "analysis": "32位逻辑地址空间的大小为2^32字节，页面大小为4KB=2^12字节，因此页表项数量=2^32/2^12=2^20个。"}, {"id": "mock-2026年5月-模拟卷6-004", "index": 379, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 4, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "数据结构—平衡二叉树", "stem": "在数据结构中，对含有n个节点的平衡二叉排序树（AVL树）进行查找，最坏情况下的时间复杂度为（ ）。", "options": {"A": "O(1)", "B": "O(log₂n)", "C": "O(n)", "D": "O(nlog₂n)"}, "answer": "B", "analysis": "AVL树是高度平衡的二叉排序树，树高h满足h=O(log₂n)，最坏情况下查找需要从根到叶，因此时间复杂度为O(log₂n)。"}, {"id": "mock-2026年5月-模拟卷6-005", "index": 380, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 5, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "嵌入式系统—硬件保护机制", "stem": "在嵌入式系统中，看门狗定时器（Watchdog Timer）的主要作用是（ ）。", "options": {"A": "提高系统运行速度", "B": "防止程序跑飞或死循环时自动复位系统", "C": "实现多任务调度", "D": "管理系统的中断优先级"}, "answer": "B", "analysis": "看门狗定时器是嵌入式系统中的一种保护机制。程序正常运行时需要定期\"喂狗\"（复位定时器），如果程序跑飞或死循环导致无法喂狗，定时器溢出后会自动复位CPU，恢复系统正常运行。"}, {"id": "mock-2026年5月-模拟卷6-006", "index": 381, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 6, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "计算机网络—子网划分", "stem": "在IPv4网络中，某主机的IP地址为172.16.5.130，子网掩码为255.255.255.192，则该主机所在子网的网络地址为（ ）。", "options": {"A": "172.16.5.0", "B": "172.16.5.64", "C": "172.16.5.128", "D": "172.16.5.192"}, "answer": "C", "analysis": "子网掩码255.255.255.192对应的二进制后8位为11000000，即/26。将IP地址172.16.5.130的最后一个字节130(10000010)与子网掩码192(11000000)进行AND运算：10000010 AND 11000000 = 10000000 = 128。因此网络地址为172.16.5.128。"}, {"id": "mock-2026年5月-模拟卷6-007", "index": 382, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 7, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "计算机组成—CPU性能计算", "stem": "某计算机系统的CPU主频为2.4GHz，执行某程序共需要6×10⁹个时钟周期，则该程序的执行时间为（ ）。", "options": {"A": "0.4秒", "B": "2.5秒", "C": "4秒", "D": "14.4秒"}, "answer": "B", "analysis": "执行时间 = 时钟周期数 / 主频 = 6×10⁹ / 2.4×10⁹ = 2.5秒。"}, {"id": "mock-2026年5月-模拟卷6-008", "index": 383, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 8, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "计算机组成—I/O控制方式", "stem": "DMA（直接存储器访问）方式与中断方式相比，其主要优点是（ ）。", "options": {"A": "不需要CPU参与任何控制", "B": "数据传送不经过CPU，减少CPU开销", "C": "不需要使用总线", "D": "数据传送速度与CPU主频无关"}, "answer": "B", "analysis": "DMA方式下，数据在外设与内存之间直接传送，不经过CPU（CPU只在DMA传送开始和结束时参与），因此大大减少了CPU开销。而中断方式下，每传送一个字节/字都要CPU介入处理。注意DMA仍需要使用总线，且CPU仍需参与启动和结束控制。"}, {"id": "mock-2026年5月-模拟卷6-009", "index": 384, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 9, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "计算机组成—流水线技术", "stem": "在流水线技术中，若一条5段流水线的每段耗时分别为1ns、2ns、1ns、1ns、2ns，则该流水线的吞吐率瓶颈取决于（ ）ns的流水段，流水线的最大吞吐率为（ ）。", "options": {"A": "1ns；1条/ns", "B": "2ns；0.5条/ns", "C": "2ns；1条/ns", "D": "5ns；0.2条/ns"}, "answer": "B", "analysis": "流水线的吞吐率受最慢的流水段限制（瓶颈段）。各段耗时为1、2、1、1、2ns，最慢段为2ns。最大吞吐率=1/最长段时间=1/2ns=0.5条/ns。"}, {"id": "mock-2026年5月-模拟卷6-010", "index": 385, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 10, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "分布式系统—CAP定理", "stem": "在分布式系统中，CAP定理指出分布式系统无法同时满足一致性（C）、可用性（A）和分区容错性（P）。在网络分区发生时，选择AP的系统（ ）。", "options": {"A": "保证数据强一致性，但可能无法响应请求", "B": "保证系统可用性，但可能返回非最新数据", "C": "同时保证一致性和可用性", "D": "放弃分区容错性以保证CA"}, "answer": "B", "analysis": "CAP定理中，当网络分区发生时（P不可避免），选择AP意味着保证可用性（A）但放弃强一致性（C），系统可能返回非最新的数据（最终一致性）。选择CP则保证一致性但可能拒绝服务。"}, {"id": "mock-2026年5月-模拟卷6-011", "index": 386, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 11, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "UML建模—行为图", "stem": "在UML中，用于描述对象之间动态交互关系并强调消息时间顺序的图是（ ）。", "options": {"A": "类图", "B": "状态图", "C": "序列图（顺序图）", "D": "活动图"}, "answer": "C", "analysis": "序列图（顺序图/时序图）是UML中用于描述对象之间动态交互关系的行为图，强调消息的时间顺序。纵轴表示时间自上而下流逝，横轴表示参与交互的对象。"}, {"id": "mock-2026年5月-模拟卷6-012", "index": 387, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 12, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "需求工程—需求跟踪", "stem": "在软件需求工程中，需求跟踪矩阵的主要作用是（ ）。", "options": {"A": "记录项目的进度和成本", "B": "建立需求与设计、实现、测试之间的追踪关系", "C": "定义软件系统的功能边界", "D": "评估需求变更的影响范围"}, "answer": "B", "analysis": "需求跟踪矩阵用于建立需求与后续设计、代码实现、测试用例之间的双向追踪关系，确保所有需求都被实现和验证，也便于分析需求变更的影响。D选项\"评估需求变更影响范围\"是跟踪矩阵的一个用途，但不是主要作用。"}, {"id": "mock-2026年5月-模拟卷6-013", "index": 388, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 13, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "软件过程改进—CMMI", "stem": "在软件过程改进中，CMMI连续式表示法中，过程域的能力等级共分为（ ）级。", "options": {"A": "4", "B": "5", "C": "6", "D": "7"}, "answer": "C", "analysis": "CMMI连续式表示法中，过程域的能力等级从CL0到CL5共6级：0-未完成级、1-已执行级、2-已管理级、3-已定义级、4-定量管理级、5-优化级。"}, {"id": "mock-2026年5月-模拟卷6-014", "index": 389, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 14, "sourceType": "mock", "module_code": "network", "module_name": "🌐 计算机网络", "knowledge": "面向对象设计—SOLID原则", "stem": "在面向对象设计中，里氏替换原则（LSP）的核心含义是（ ）。", "options": {"A": "一个类应该只有一个引起它变化的原因", "B": "子类对象能够替换父类对象出现的任何地方，且程序行为不变", "C": "高层模块不应该依赖低层模块，二者都应该依赖抽象", "D": "接口应该尽量小而专一，不要定义臃肿的接口"}, "answer": "B", "analysis": "里氏替换原则（Liskov Substitution Principle）的核心是：所有引用基类（父类）的地方必须能透明地使用其子类的对象，且程序行为不变。A是单一职责原则，C是依赖倒置原则，D是接口隔离原则。"}, {"id": "mock-2026年5月-模拟卷6-015", "index": 390, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 15, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件测试—白盒测试", "stem": "在软件测试中，下列关于McCabe环路复杂度的说法正确的是（ ）。", "options": {"A": "V(G) = E - N + 1，其中E为边数，N为节点数", "B": "V(G) = E - N + 2，其中E为边数，N为节点数", "C": "V(G) = E + N - 2，其中E为边数，N为节点数", "D": "V(G) = N - E + 2，其中E为边数，N为节点数"}, "answer": "B", "analysis": "McCabe环路复杂度V(G) = E - N + 2，其中E为控制流图的边数，N为节点数。也可以用V(G) = P + 1计算，其中P为判定节点数。"}, {"id": "mock-2026年5月-模拟卷6-016", "index": 391, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 16, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "软件配置管理—基线概念", "stem": "在软件配置管理中，基线（Baseline）是指（ ）。", "options": {"A": "项目开发的起始时间点", "B": "经过正式评审和批准的软件配置项，作为后续变更的基础", "C": "软件版本的最新发布状态", "D": "测试用例的通过率达到100%的状态"}, "answer": "B", "analysis": "基线是经过正式评审和批准的某个软件配置项（或一组配置项），它作为后续开发和变更的基础。对基线的变更必须通过正式的变更控制流程。"}, {"id": "mock-2026年5月-模拟卷6-017", "index": 392, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 17, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "敏捷开发—Scrum会议", "stem": "在敏捷开发方法Scrum中，Sprint回顾会议（Retrospective）的主要目的是（ ）。", "options": {"A": "向产品负责人演示已完成的功能", "B": "团队反思改进开发过程和协作方式", "C": "规划下一个Sprint的待办事项", "D": "评估项目的整体进度和风险"}, "answer": "B", "analysis": "Sprint回顾会议（Retrospective）是团队在每个Sprint结束时进行的自我反思，讨论哪些做得好、哪些需要改进、制定改进措施。A是Sprint评审会议（Review），C是Sprint计划会议。"}, {"id": "mock-2026年5月-模拟卷6-018", "index": 393, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 18, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "软件架构—视图模型", "stem": "在软件体系结构文档化中，\"4+1\"视图模型不包括以下哪个视图？（ ）", "options": {"A": "逻辑视图", "B": "开发视图", "C": "数据视图", "D": "场景视图"}, "answer": "C", "analysis": "Philippe Kruchten提出的\"4+1\"视图模型包括：逻辑视图（功能需求）、开发视图（软件管理）、进程视图（并发和同步）、物理视图（部署拓扑）+场景视图（用例驱动）。没有\"数据视图\"。"}, {"id": "mock-2026年5月-模拟卷6-019", "index": 394, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 19, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "项目管理—关键路径法", "stem": "在项目管理中，关键路径法（CPM）确定项目最短工期。若某活动的最早开始时间为第5天，最迟开始时间为第8天，则该活动的总浮动时间为（ ）。", "options": {"A": "3天", "B": "5天", "C": "8天", "D": "13天"}, "answer": "A", "analysis": "总浮动时间 = 最迟开始时间 - 最早开始时间 = 8 - 5 = 3天。总浮动时间表示该活动在不影响项目总工期的前提下可以推迟的天数。"}, {"id": "mock-2026年5月-模拟卷6-020", "index": 395, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 20, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "软件维护—维护类型", "stem": "在软件维护中，为了适应外部环境（如操作系统升级、硬件更换）的变化而对软件进行的修改属于（ ）。", "options": {"A": "改正性维护", "B": "适应性维护", "C": "完善性维护", "D": "预防性维护"}, "answer": "B", "analysis": "适应性维护是为适应外部环境变化（操作系统升级、硬件更换、规章制度变化等）而对软件进行的修改。改正性维护是修复bug，完善性维护是增加功能或提高性能，预防性维护是提高可维护性和可靠性。"}, {"id": "mock-2026年5月-模拟卷6-021", "index": 396, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 21, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "结构化分析—数据字典", "stem": "在结构化分析方法中，数据字典是对数据流图中所有元素的定义和描述。数据字典中不包括（ ）的定义。", "options": {"A": "数据流", "B": "数据存储", "C": "加工逻辑", "D": "外部实体"}, "answer": "D", "analysis": "数据字典包含对数据流、数据存储、数据项（数据元素）和加工逻辑（基本加工的处理说明）的定义。外部实体不在数据字典的定义范围内，外部实体是系统外部与系统交互的实体。"}, {"id": "mock-2026年5月-模拟卷6-022", "index": 397, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 22, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "面向对象方法—OOD", "stem": "软件开发中，采用面向对象方法时，（ ）阶段主要确定实现软件的类及其属性和方法，并确定类之间的关系。", "options": {"A": "面向对象分析（OOA）", "B": "面向对象设计（OOD）", "C": "面向对象编程（OOP）", "D": "面向对象测试（OOT）"}, "answer": "B", "analysis": "面向对象设计（OOD）阶段主要任务是确定实现软件的类（包括属性和方法），以及类之间的关系（继承、关联、聚合等）。OOA阶段重在理解问题域和需求建模，OOD阶段重在解决方案域的设计。"}, {"id": "mock-2026年5月-模拟卷6-023", "index": 398, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 23, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构风格—管道-过滤器", "stem": "在软件架构风格中，编译器通常采用的架构风格是（ ）。", "options": {"A": "仓库风格", "B": "管道-过滤器风格", "C": "事件驱动风格", "D": "层次风格"}, "answer": "B", "analysis": "编译器的处理过程是：词法分析→语法分析→语义分析→中间代码生成→代码优化→目标代码生成，数据在各个阶段依次传递和变换，典型的管道-过滤器风格。仓库风格常用于IDE或知识库系统。"}, {"id": "mock-2026年5月-模拟卷6-024", "index": 399, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 24, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构评估—ATAM", "stem": "在架构评估方法中，ATAM（架构权衡分析法）的主要输出成果不包括（ ）。", "options": {"A": "质量属性效用树", "B": "风险点和非风险点", "C": "敏感点和权衡点", "D": "系统的详细设计文档"}, "answer": "D", "analysis": "ATAM的主要输出包括：质量属性效用树、场景优先级排序、风险点和非风险点、敏感点和权衡点。ATAM不关注详细设计文档，它评估的是架构层面。"}, {"id": "mock-2026年5月-模拟卷6-025", "index": 400, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 25, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "质量属性—可伸缩性", "stem": "某电商系统在\"双十一\"期间订单量是平时的50倍，系统需要在流量激增时自动扩展计算资源，流量回落后自动缩减。这一需求主要对应的质量属性是（ ）。", "options": {"A": "可用性", "B": "性能", "C": "可伸缩性", "D": "安全性"}, "answer": "C", "analysis": "可伸缩性（Scalability）是指系统能够通过增加或减少资源来应对负载变化的能力。自动弹性扩缩容是可伸缩性的典型体现。性能关注响应时间和吞吐量，可用性关注系统不间断服务的能力。"}, {"id": "mock-2026年5月-模拟卷6-026", "index": 401, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 26, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "微服务架构—通信方式", "stem": "在微服务架构中，服务之间的通信方式可分为同步和异步两种。下列属于异步通信方式的是（ ）。", "options": {"A": "RESTful API调用", "B": "gRPC远程过程调用", "C": "基于消息队列的事件通知", "D": "GraphQL查询"}, "answer": "C", "analysis": "基于消息队列的事件通知是异步通信方式：生产者发送消息到队列后不等待消费者处理即返回。RESTful API、gRPC和GraphQL都是同步的请求-响应模式。"}, {"id": "mock-2026年5月-模拟卷6-027", "index": 402, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 27, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "设计模式—创建型模式", "stem": "在设计模式中，当需要将一个复杂对象的构建过程与其表示分离，使得同样的构建过程可以创建不同的表示时，应使用（ ）模式。", "options": {"A": "抽象工厂", "B": "建造者（Builder）", "C": "原型", "D": "单例"}, "answer": "B", "analysis": "建造者（Builder）模式将复杂对象的构建过程与表示分离，使同样的构建过程可以创建不同的表示。抽象工厂关注产品族的创建，原型通过克隆已有对象创建新对象，单例确保一个类只有一个实例。"}, {"id": "mock-2026年5月-模拟卷6-028", "index": 403, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 28, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "SOA架构—Web Service标准", "stem": "在面向服务架构（SOA）中，UDDI的作用是（ ）。", "options": {"A": "定义Web Service的接口描述", "B": "提供服务注册和发现的目录服务", "C": "定义消息传输的协议格式", "D": "实现服务之间的路由转发"}, "answer": "B", "analysis": "UDDI（Universal Description, Discovery and Integration）提供服务注册和发现的目录服务，是SOA三大标准之一。WSDL定义Web Service接口描述，SOAP定义消息传输协议格式。"}, {"id": "mock-2026年5月-模拟卷6-029", "index": 404, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 29, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构风格—事件驱动", "stem": "在软件架构中，采用\"发布-订阅\"模式的系统属于（ ）架构风格。", "options": {"A": "数据流风格", "B": "调用/返回风格", "C": "事件驱动风格", "D": "虚拟机风格"}, "answer": "C", "analysis": "发布-订阅模式是事件驱动架构风格的核心模式。发布者发布事件，订阅者监听并处理感兴趣的事件，两者通过事件通道（如消息中间件）解耦。"}, {"id": "mock-2026年5月-模拟卷6-030", "index": 405, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 30, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构风格—REST", "stem": "关于REST架构风格，以下说法错误的是（ ）。", "options": {"A": "客户端-服务端分离", "B": "通信是有状态的，服务端保存客户端上下文", "C": "统一接口约束", "D": "支持分层系统"}, "answer": "B", "analysis": "REST架构风格的关键约束之一是无状态（Stateless）。每个请求都包含处理该请求所需的所有信息，服务端不保存客户端的上下文状态。B选项描述的\"有状态\"恰好违反了REST的无状态约束。"}, {"id": "mock-2026年5月-模拟卷6-031", "index": 406, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 31, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构评估—质量属性场景", "stem": "在架构设计中，质量属性场景由六个要素组成。下列不属于质量属性场景要素的是（ ）。", "options": {"A": "刺激源", "B": "制品", "C": "设计约束", "D": "响应度量"}, "answer": "C", "analysis": "质量属性场景的六个要素是：刺激源（Source）、刺激（Stimulus）、制品（Artifact）、环境（Environment）、响应（Response）、响应度量（Response Measure）。\"设计约束\"不是质量属性场景的要素。"}, {"id": "mock-2026年5月-模拟卷6-032", "index": 407, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 32, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构风格—分层架构", "stem": "在分层架构中，严格分层（Strict Layering）与松散分层（Relaxed Layering）的主要区别是（ ）。", "options": {"A": "严格分层允许跨层调用，松散分层不允许", "B": "严格分层只允许相邻层间的调用，松散分层允许跨层调用", "C": "两者没有本质区别", "D": "严格分层性能更好"}, "answer": "B", "analysis": "严格分层只允许相邻层之间的交互，第N层只能调用第N-1层的服务。松散分层允许跨层调用，如第N层可以直接调用第N-2层。严格分层隔离性好但可能影响性能，松散分层灵活但耦合度较高。"}, {"id": "mock-2026年5月-模拟卷6-033", "index": 408, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 33, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "领域驱动设计—聚合", "stem": "在领域驱动设计（DDD）中，聚合根（Aggregate Root）的主要职责是（ ）。", "options": {"A": "提供数据持久化能力", "B": "作为聚合的唯一入口，维护聚合内部的一致性规则", "C": "处理跨聚合的业务流程", "D": "定义限界上下文的边界"}, "answer": "B", "analysis": "在DDD中，聚合根（Aggregate Root）是聚合的唯一外部访问入口，负责维护聚合内部所有实体和值对象的一致性规则。外部对象只能通过聚合根与聚合内部的对象交互。"}, {"id": "mock-2026年5月-模拟卷6-034", "index": 409, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 34, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构风格—解释器", "stem": "某系统需要支持用户自定义规则并实时执行，如用户可以编写表达式\"if temperature > 30 then alert\"。该系统最适合采用的架构风格是（ ）。", "options": {"A": "管道-过滤器", "B": "黑板", "C": "解释器", "D": "主程序-子程序"}, "answer": "C", "analysis": "解释器架构风格适用于需要动态解释和执行用户定义规则的场景。用户编写规则表达式，系统通过解释器解析并执行这些规则。解释器包含：解释引擎、被解释的程序、引擎内部状态和程序执行状态四个组成部分。"}, {"id": "mock-2026年5月-模拟卷6-035", "index": 410, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 35, "sourceType": "mock", "module_code": "software_engineering", "module_name": "⚙️ 软件工程与生命周期", "knowledge": "设计模式—结构型模式", "stem": "在设计模式中，（ ）模式通过为其他对象提供一种代理以控制对这个对象的访问，常用于远程代理、虚拟代理和安全代理。", "options": {"A": "适配器（Adapter）", "B": "装饰器（Decorator）", "C": "代理（Proxy）", "D": "外观（Facade）"}, "answer": "C", "analysis": "代理（Proxy）模式为其他对象提供一种代理以控制对这个对象的访问。常见类型包括：远程代理（隐藏网络细节）、虚拟代理（延迟加载）、安全代理（权限控制）、缓存代理等。"}, {"id": "mock-2026年5月-模拟卷6-036", "index": 411, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 36, "sourceType": "mock", "module_code": "english", "module_name": "🔤 专业英语", "knowledge": "特定领域软件架构—DSSA", "stem": "特定领域软件架构（DSSA）的三个基本活动是领域分析、领域设计和（ ）。", "options": {"A": "领域测试", "B": "领域实现", "C": "领域维护", "D": "领域评估"}, "answer": "B", "analysis": "DSSA（Domain-Specific Software Architecture）的三个基本活动是：领域分析（建立领域模型）、领域设计（获得DSSA）、领域实现（开发和组织可复用的构件）。"}, {"id": "mock-2026年5月-模拟卷6-037", "index": 412, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 37, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "架构评估—ATAM概念", "stem": "在架构权衡分析中，某个架构决策同时影响多个质量属性，对性能有利但对安全性不利，这种点称为（ ）。", "options": {"A": "风险点", "B": "非风险点", "C": "敏感点", "D": "权衡点"}, "answer": "D", "analysis": "权衡点是同时影响多个质量属性的架构决策点。敏感点只影响一个质量属性，权衡点影响多个质量属性（且对不同属性的影响可能相反）。题目中\"对性能有利但对安全性不利\"正是权衡点的特征。"}, {"id": "mock-2026年5月-模拟卷6-038", "index": 413, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 38, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库规范化—函数依赖", "stem": "在关系数据库中，若关系R的属性A函数决定属性B（A→B），属性B函数决定属性C（B→C），但B不能函数决定A，则关系R中存在（ ）。", "options": {"A": "部分函数依赖", "B": "传递函数依赖", "C": "完全函数依赖", "D": "多值依赖"}, "answer": "B", "analysis": "A→B，B→C，但B不能决定A（即A不能由B决定），因此C通过B间接依赖于A，这是传递函数依赖。如果消除传递依赖就达到3NF。"}, {"id": "mock-2026年5月-模拟卷6-039", "index": 414, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 39, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "SQL基础—查询语句", "stem": "在SQL语句中，用于从查询结果中去除重复行的关键字是（ ）。", "options": {"A": "UNIQUE", "B": "DISTINCT", "C": "DIFFERENT", "D": "PRIMARY"}, "answer": "B", "analysis": "DISTINCT关键字用于SELECT语句中去除查询结果中的重复行。语法：SELECT DISTINCT 列名 FROM 表名。UNIQUE是约束关键字，用于创建唯一索引或唯一约束。"}, {"id": "mock-2026年5月-模拟卷6-040", "index": 415, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 40, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "分布式数据库—数据分片", "stem": "在分布式数据库系统中，数据分片的方式不包括（ ）。", "options": {"A": "水平分片", "B": "垂直分片", "C": "混合分片", "D": "随机分片"}, "answer": "D", "analysis": "分布式数据库的数据分片方式包括：水平分片（按行拆分）、垂直分片（按列拆分）和混合分片（水平+垂直的组合）。没有\"随机分片\"这种标准分片方式。"}, {"id": "mock-2026年5月-模拟卷6-041", "index": 416, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 41, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库—NoSQL分类", "stem": "在NoSQL数据库分类中，Redis属于（ ）类型的NoSQL数据库。", "options": {"A": "文档型", "B": "列族型", "C": "键值型", "D": "图形型"}, "answer": "C", "analysis": "Redis是键值型（Key-Value）NoSQL数据库，以键值对形式存储数据。MongoDB是文档型，HBase/Cassandra是列族型，Neo4j是图形型。"}, {"id": "mock-2026年5月-模拟卷6-042", "index": 417, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 42, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库设计—E-R模型转换", "stem": "在数据库设计中，将E-R模型转换为关系模型时，一个1:N（一对多）联系通常的处理方式是（ ）。", "options": {"A": "将联系转换为一个独立的关系", "B": "将联系的属性和1端实体的主键合并到N端实体对应的关系中", "C": "将联系的属性和N端实体的主键合并到1端实体对应的关系中", "D": "不需要特殊处理"}, "answer": "B", "analysis": "1:N联系转换为关系模型时，将联系的属性和1端实体的主键作为外键合并到N端实体对应的关系中。这样既表达了联系关系，又避免了生成独立关系表。"}, {"id": "mock-2026年5月-模拟卷6-043", "index": 418, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 43, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据库—事务ACID特性", "stem": "在事务的ACID特性中，（ ）确保事务的执行不会被其他事务干扰，即一个事务的中间状态对其他事务不可见。", "options": {"A": "原子性（Atomicity）", "B": "一致性（Consistency）", "C": "隔离性（Isolation）", "D": "持久性（Durability）"}, "answer": "C", "analysis": "隔离性（Isolation）确保并发执行的事务互不干扰，一个事务的中间状态对其他事务不可见。原子性确保事务全部完成或全部回滚，一致性确保数据库从一个一致状态转换到另一个一致状态，持久性确保事务提交后数据永久保存。"}, {"id": "mock-2026年5月-模拟卷6-044", "index": 419, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 44, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "数据仓库—多维数据模型", "stem": "在数据仓库的多维数据模型中，星型模型（Star Schema）与雪花模型（Snowflake Schema）的主要区别是（ ）。", "options": {"A": "星型模型有多个事实表，雪花模型只有一个", "B": "雪花模型的维度表进行了规范化处理，存在多级层次", "C": "星型模型支持OLAP，雪花模型只支持OLTP", "D": "雪花模型的查询性能一定优于星型模型"}, "answer": "B", "analysis": "星型模型中维度表是非规范化的宽表（冗余但查询快），雪花模型中维度表进行了规范化处理，维度表可能有多级外键关系（减少冗余但查询需更多JOIN）。"}, {"id": "mock-2026年5月-模拟卷6-045", "index": 420, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 45, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "缓存策略—Cache-Aside", "stem": "某系统使用Redis作为缓存，采用Cache-Aside策略。当数据更新时，正确的操作顺序是（ ）。", "options": {"A": "先更新缓存，再更新数据库", "B": "先删除缓存，再更新数据库", "C": "先更新数据库，再删除缓存", "D": "只更新缓存，不更新数据库"}, "answer": "C", "analysis": "Cache-Aside策略中，数据更新的推荐做法是：先更新数据库，再删除缓存（而非更新缓存）。先删后更可能导致并发场景下缓存与数据库不一致的问题（删完缓存后、更新数据库前，其他线程可能将旧数据重新写入缓存）。"}, {"id": "mock-2026年5月-模拟卷6-046", "index": 421, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 46, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "信息安全—PKI/数字证书", "stem": "在PKI（公钥基础设施）体系中，数字证书的主要作用是（ ）。", "options": {"A": "加密传输数据", "B": "将公钥与实体身份绑定，由CA签名保证其可信性", "C": "存储用户的私钥", "D": "提供防火墙功能"}, "answer": "B", "analysis": "数字证书的主要作用是将公钥与持有者身份绑定，由权威的证书颁发机构（CA）使用其私钥进行签名，保证公钥的真实性和可信性。数字证书本身不加密数据，也不存储私钥。"}, {"id": "mock-2026年5月-模拟卷6-047", "index": 422, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 47, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "信息安全—TLS协议", "stem": "在安全协议中，TLS1.3相比TLS1.2的主要改进不包括（ ）。", "options": {"A": "将握手过程从2-RTT减少到1-RTT", "B": "移除了不安全的加密套件（如RC4、3DES）", "C": "增加了对RSA密钥交换的支持", "D": "支持0-RTT恢复连接"}, "answer": "C", "analysis": "TLS 1.3移除了RSA密钥交换机制（因为RSA密钥交换不支持前向安全性），只保留基于Diffie-Hellman的密钥交换（如ECDHE）。其他选项都是TLS 1.3的改进点。"}, {"id": "mock-2026年5月-模拟卷6-048", "index": 423, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 48, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "信息安全—国密算法", "stem": "下列关于国密算法的说法，正确的是（ ）。", "options": {"A": "SM2是对称加密算法", "B": "SM3是消息摘要算法，输出256位哈希值", "C": "SM4是非对称加密算法", "D": "SM1是公开标准的分组密码算法"}, "answer": "B", "analysis": "SM2是非对称加密算法（基于椭圆曲线），SM3是消息摘要算法（输出256位哈希值，类似SHA-256），SM4是对称加密算法（分组密码，类似AES），SM1是非公开标准的对称加密算法。"}, {"id": "mock-2026年5月-模拟卷6-049", "index": 424, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 49, "sourceType": "mock", "module_code": "project_management", "module_name": "📋 项目管理与法律法规", "knowledge": "法律法规—数据安全法", "stem": "在《中华人民共和国数据安全法》中，国家建立数据分类分级保护制度，根据数据在经济社会发展中的重要程度以及一旦遭到篡改、破坏、泄露或者非法获取、非法利用，对国家安全、公共利益或者个人、组织合法权益造成的危害程度，对数据实行分类分级保护。其中，关系国家安全、国民经济命脉、重要民生、重大公共利益等的数据属于（ ）。", "options": {"A": "一般数据", "B": "重要数据", "C": "核心数据", "D": "敏感数据"}, "answer": "C", "analysis": "根据《数据安全法》，核心数据是关系国家安全、国民经济命脉、重要民生、重大公共利益等的数据，国家对核心数据实行更加严格的管理制度。重要数据的范围由各部门确定，核心数据是最高级别。"}, {"id": "mock-2026年5月-模拟卷6-050", "index": 425, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 50, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "信息安全—零信任架构", "stem": "零信任安全架构的核心原则是（ ）。", "options": {"A": "信任内部网络中的所有设备和用户", "B": "永远不信任，始终验证（Never Trust, Always Verify）", "C": "只在边界部署防火墙即可保证安全", "D": "仅对外部用户进行身份认证"}, "answer": "B", "analysis": "零信任安全架构的核心原则是\"永远不信任，始终验证\"（Never Trust, Always Verify）。不论请求来自内部还是外部网络，都需要经过身份认证、授权和加密，不再以网络位置作为信任判断的依据。"}, {"id": "mock-2026年5月-模拟卷6-051", "index": 426, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 51, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "Web安全—CSRF防御", "stem": "在Web安全中，CSRF（跨站请求伪造）攻击的防御措施不包括（ ）。", "options": {"A": "使用Anti-CSRF Token", "B": "验证HTTP Referer头", "C": "对用户输入进行HTML编码转义", "D": "设置Cookie的SameSite属性"}, "answer": "C", "analysis": "HTML编码转义是防御XSS（跨站脚本攻击）的措施，不是防御CSRF的。CSRF防御措施包括：Anti-CSRF Token、验证Referer头、Cookie的SameSite属性、双重Cookie验证等。"}, {"id": "mock-2026年5月-模拟卷6-052", "index": 427, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 52, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "隐私计算—同态加密", "stem": "隐私计算技术中，（ ）允许在加密数据上直接进行计算，解密后得到与在明文上计算相同的结果。", "options": {"A": "联邦学习", "B": "同态加密", "C": "安全多方计算", "D": "差分隐私"}, "answer": "B", "analysis": "同态加密（Homomorphic Encryption）允许在密文上直接进行计算，解密后的结果与在明文上执行相同计算的结果一致。联邦学习是分布式机器学习方法，安全多方计算允许多方协同计算但不泄露各自数据，差分隐私是通过添加噪声保护隐私。"}, {"id": "mock-2026年5月-模拟卷6-053", "index": 428, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 53, "sourceType": "mock", "module_code": "security", "module_name": "🔒 信息安全与可靠性", "knowledge": "信息安全—等级保护", "stem": "在信息安全等级保护制度（等保2.0）中，第三级系统的安全保护等级要求是（ ）。", "options": {"A": "用户自主保护级", "B": "系统审计保护级", "C": "安全标记保护级", "D": "结构化保护级"}, "answer": "C", "analysis": "等保2.0五个级别：第一级用户自主保护级，第二级系统审计保护级，第三级安全标记保护级，第四级结构化保护级，第五级访问验证保护级。第三级是安全标记保护级。"}, {"id": "mock-2026年5月-模拟卷6-054", "index": 429, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 54, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "系统可靠性—并联系统", "stem": "某系统由3个相同的子系统并联构成冗余系统，每个子系统的可靠性为0.9。假设各子系统独立工作，则该并联系统的可靠性为（ ）。", "options": {"A": "0.729", "B": "0.900", "C": "0.972", "D": "0.999"}, "answer": "D", "analysis": "并联系统可靠性 = 1 - (1-R)^n = 1 - (1-0.9)^3 = 1 - 0.1^3 = 1 - 0.001 = 0.999。并联系统只要有一个子系统正常工作，整个系统就正常。"}, {"id": "mock-2026年5月-模拟卷6-055", "index": 430, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 55, "sourceType": "mock", "module_code": "other", "module_name": "📚 综合基础", "knowledge": "系统可靠性—可用性计算", "stem": "某Web服务器的平均无故障时间（MTTF）为990小时，平均修复时间（MTTR）为10小时，则该服务器的稳态可用性为（ ）。", "options": {"A": "99%", "B": "99.9%", "C": "99.99%", "D": "98%"}, "answer": "A", "analysis": "稳态可用性 = MTTF / (MTTF + MTTR) = 990 / (990 + 10) = 990/1000 = 99%。"}, {"id": "mock-2026年5月-模拟卷6-056", "index": 431, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 56, "sourceType": "mock", "module_code": "database", "module_name": "🗄️ 数据库系统与大数据", "knowledge": "性能评估—吞吐率", "stem": "在性能评估中，某系统在1小时内处理了36000个事务请求，则该系统的吞吐率为（ ）TPS。", "options": {"A": "36000", "B": "3600", "C": "600", "D": "10"}, "answer": "D", "analysis": "吞吐率 = 事务数 / 时间 = 36000 / 3600秒 = 10 TPS（Transactions Per Second）。"}, {"id": "mock-2026年5月-模拟卷6-057", "index": 432, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 57, "sourceType": "mock", "module_code": "computer_foundation", "module_name": "💻 计算机与嵌入式系统", "knowledge": "负载均衡—调度算法", "stem": "在负载均衡策略中，（ ）算法将请求按照权重比例分配到不同的后端服务器，适用于服务器性能不均等的场景。", "options": {"A": "轮询（Round Robin）", "B": "加权轮询（Weighted Round Robin）", "C": "最少连接（Least Connections）", "D": "随机（Random）"}, "answer": "B", "analysis": "加权轮询算法根据服务器的权重比例分配请求，权重大的服务器接收更多请求。适用于后端服务器性能不均等的场景（如配置高的服务器分配更大的权重）。"}, {"id": "mock-2026年5月-模拟卷6-058", "index": 433, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 58, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "系统可靠性—热备系统", "stem": "某系统采用主从热备架构，主系统可靠性为R₁=0.95，备用系统可靠性为R₂=0.90，切换装置可靠性为R₃=0.99。假设主系统故障后自动切换到备用系统，则整个系统的可靠性为（ ）。", "options": {"A": "R₁ + R₂ × R₃ - R₁ × R₂ × R₃", "B": "R₁ × R₂ × R₃", "C": "R₁ + R₂ × R₃", "D": "R₁ × (1 + R₂ × R₃)"}, "answer": "A", "analysis": "主从热备系统的可靠性 = 主系统工作的概率 + 主系统故障后备用系统成功接管的概率 = R₁ + (1-R₁) × R₂ × R₃。展开：R₁ + R₂×R₃ - R₁×R₂×R₃。其中(1-R₁)是主系统故障概率，R₃是切换成功概率，R₂是备用系统可靠性。"}, {"id": "mock-2026年5月-模拟卷6-059", "index": 434, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 59, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "新技术—AI大模型/RAG", "stem": "在大模型应用架构中，RAG（检索增强生成）的核心思想是（ ）。", "options": {"A": "使用强化学习训练大模型", "B": "在生成回答前先检索相关知识，将检索到的上下文与问题一起输入大模型", "C": "对大模型进行全量微调以适应特定领域", "D": "使用多个小模型替代单个大模型"}, "answer": "B", "analysis": "RAG（Retrieval-Augmented Generation）检索增强生成的核心思想是：在大模型生成回答之前，先从知识库中检索相关文档片段，将检索到的上下文与用户问题一起输入大模型，让模型基于检索到的知识生成更准确的回答，有效减少幻觉问题。"}, {"id": "mock-2026年5月-模拟卷6-060", "index": 435, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 60, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "云原生—Service Mesh", "stem": "在云原生架构中，Service Mesh（服务网格）的数据平面（Data Plane）通常由（ ）组件实现。", "options": {"A": "API网关", "B": "Sidecar代理（如Envoy）", "C": "配置中心（如Nacos）", "D": "注册中心（如Consul）"}, "answer": "B", "analysis": "Service Mesh分为数据平面和控制平面。数据平面由Sidecar代理（如Envoy、Linkerd-proxy）组成，以Sidecar模式部署在每个服务实例旁边，负责处理服务间的实际网络通信。控制平面（如Istiod）负责配置和管理数据平面。"}, {"id": "mock-2026年5月-模拟卷6-061", "index": 436, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 61, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "云原生—Kubernetes", "stem": "在Kubernetes集群中，（ ）是最小的可部署计算单元，可以包含一个或多个容器。", "options": {"A": "Node", "B": "Pod", "C": "Service", "D": "Deployment"}, "answer": "B", "analysis": "Pod是Kubernetes中最小的可部署计算单元，一个Pod可以包含一个或多个容器，这些容器共享网络和存储资源。Node是集群中的工作节点，Service是服务发现和负载均衡抽象，Deployment是声明式的Pod管理控制器。"}, {"id": "mock-2026年5月-模拟卷6-062", "index": 437, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 62, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "新技术—边缘计算", "stem": "在边缘计算架构中，将计算能力部署在靠近数据源的网络边缘，其主要优势不包括（ ）。", "options": {"A": "降低数据传输延迟", "B": "减少核心网络带宽压力", "C": "提高数据处理集中度", "D": "增强数据隐私保护"}, "answer": "C", "analysis": "边缘计算的优势恰恰是分散化处理，而非提高数据处理集中度。边缘计算将计算推向数据源头，降低延迟、减少网络带宽压力、增强本地数据隐私保护。\"提高集中度\"是云计算中心化的特点，与边缘计算理念相反。"}, {"id": "mock-2026年5月-模拟卷6-063", "index": 438, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 63, "sourceType": "mock", "module_code": "new_technology", "module_name": "🚀 前沿新兴技术", "knowledge": "新技术—区块链", "stem": "在区块链技术中，智能合约（Smart Contract）是指（ ）。", "options": {"A": "一种加密货币的交易协议", "B": "部署在区块链上自动执行的程序代码，按照预设逻辑执行", "C": "区块链节点之间的共识算法", "D": "用于存储交易记录的数据库结构"}, "answer": "B", "analysis": "智能合约是部署在区块链上的自动执行的程序代码，当预设条件满足时自动执行合约逻辑。它具有确定性、不可篡改、自动执行的特点，常用于去中心化金融（DeFi）、供应链管理等场景。"}, {"id": "mock-2026年5月-模拟卷6-064", "index": 439, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 64, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "新技术—数字孪生", "stem": "在数字孪生（Digital Twin）体系架构中，物理实体与虚拟模型之间的数据同步通常依赖（ ）技术实现实时感知。", "options": {"A": "批量ETL", "B": "IoT传感器与边缘网关", "C": "离线数据仓库", "D": "手动数据录入"}, "answer": "B", "analysis": "数字孪生中物理实体与虚拟模型之间的实时数据同步主要依赖IoT传感器采集物理世界数据，通过边缘网关进行初步处理后传输到数字孪生平台。ETL是批量离线处理，不适合实时感知。"}, {"id": "mock-2026年5月-模拟卷6-065", "index": 440, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 65, "sourceType": "mock", "module_code": "architecture", "module_name": "🏛️ 系统架构设计", "knowledge": "云原生—Serverless", "stem": "在Serverless架构中，函数即服务（FaaS）的计费方式通常是（ ）。", "options": {"A": "按预留服务器数量和运行时长计费", "B": "按函数的调用次数和实际执行时长计费", "C": "按分配的固定内存大小计费", "D": "按部署的容器数量计费"}, "answer": "B", "analysis": "Serverless/FaaS的计费模式是按实际使用量计费，主要包括：函数调用次数和每次函数的实际执行时长（精确到毫秒级），以及函数执行时分配的内存大小。无需预留服务器资源，无请求时零成本。"}, {"id": "mock-2026年5月-模拟卷6-066", "index": 441, "term": "2026年5月 模拟卷6", "paper": "模拟卷6", "questionNo": 66, "sourceType": "mock", "module_code": "legal_ip", "module_name": "⚖️ 知识产权与标准化", "knowledge": "知识产权—软件著作权", "stem": "在我国，计算机软件著作权的保护期限为（ ）。", "options": {"A": "作者终生及其死亡后50年", "B": "自软件首次发表之日起50年", "C": "自软件开发完成之日起25年，可续展25年", "D": "永久保护"}, "answer": "B", "analysis": "根据《计算机软件保护条例》第十四条，软件著作权自软件开发完成之日起产生。自然人的软件著作权保护期为自然人终生及其死亡后50年；法人或其他组织的软件著作权保护期为50年，截止于软件首次发表后第50年的12月31日。"}, {"id": "mock-2026年5月-模拟卷6-067", "index": 442, "term": "2026年5月 模拟卷6", "paper":
