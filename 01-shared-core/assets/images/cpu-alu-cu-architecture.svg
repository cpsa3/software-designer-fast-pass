<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" width="100%" height="100%" style="background:#ffffff; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="cuHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="aluHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 步骤卡片渐变 -->
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="shadowSm" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="shadowMd" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- 背景画布底板 -->
  <rect x="2" y="2" width="1056" height="716" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 顶部标题区 -->
  <g transform="translate(30, 18)">
    <rect x="0" y="0" width="6" height="42" rx="3" fill="#4f46e5"/>
    <text x="18" y="24" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="0.5">CPU 运算器与控制器部件谱系与协同机制全景图</text>
    <text x="18" y="44" font-size="13" fill="#64748b">冯·诺依曼架构下 CPU 内部两大核心阵营的物理分工、总线拓扑与数据/控制流交互</text>
  </g>

  <!-- ======================== 左侧：控制器阵营 (CU) ======================== -->
  <g transform="translate(30, 75)" filter="url(#shadowMd)">
    <rect width="460" height="465" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect width="460" height="34" rx="10" fill="url(#cuHeaderGrad)"/>
    <path d="M 0 24 Q 0 34 10 34 L 450 34 Q 460 34 460 24 L 460 34 L 0 34 Z" fill="#0284c7"/>
    <text x="16" y="22" font-size="13.5" font-weight="700" fill="#ffffff">🧠 控制器阵营 (CU - Control Unit) —— 决策与调度中枢</text>
    <text x="390" y="22" font-size="11" font-weight="600" fill="#e0f2fe">管“指挥”</text>

    <!-- 部件 1: 程序计数器 PC -->
    <g transform="translate(16, 48)" filter="url(#shadowSm)">
      <rect width="428" height="64" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
      <rect x="12" y="10" width="112" height="22" rx="4" fill="#0284c7"/>
      <text x="68" y="25" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">程序计数器 PC</text>
      <text x="134" y="25" font-size="12" font-weight="800" fill="#0369a1">存放：下一条将要执行指令的内存地址！</text>
      <text x="14" y="48" font-size="10.5" fill="#0c4a6e">⚙️ 运行机制：取指后自动自增（PC+1）；遇跳转指令（JMP/CALL）则被目标地址强行重写。</text>
    </g>

    <!-- 部件 2: 指令寄存器 IR -->
    <g transform="translate(16, 122)" filter="url(#shadowSm)">
      <rect width="428" height="64" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
      <rect x="12" y="10" width="112" height="22" rx="4" fill="#0284c7"/>
      <text x="68" y="25" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">指令寄存器 IR</text>
      <text x="134" y="25" font-size="12" font-weight="800" fill="#0369a1">存放：当前正在执行的整条机器指令！</text>
      <text x="14" y="48" font-size="10.5" fill="#0c4a6e">⚙️ 结构拆解：拆分为【操作码 OP】（干什么）与【地址码 ADDR】（对谁干，送MAR）。</text>
    </g>

    <!-- 部件 3: 指令译码器 ID 与 时序控制逻辑 -->
    <g transform="translate(16, 196)" filter="url(#shadowSm)">
      <rect width="428" height="76" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
      <rect x="12" y="10" width="112" height="22" rx="4" fill="#0284c7"/>
      <text x="68" y="25" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">指令译码器 ID</text>
      <text x="134" y="25" font-size="12" font-weight="800" fill="#0369a1">翻译：对 IR 中的操作码（OP）进行解码分析</text>
      <text x="14" y="48" font-size="10.5" fill="#0c4a6e">⚙️ 协同部件：配合【时序发生器】在时钟脉冲节拍下，向全机发出成百上千个微操作控制信号。</text>
      <text x="14" y="65" font-size="10" font-weight="600" fill="#0284c7">👉 控制实现技术：硬布线逻辑（RISC 纯组合逻辑） vs 微程序控制器（CISC 控制存储器 CS）</text>
    </g>

    <!-- 部件 4: 地址寄存器 AR / MAR -->
    <g transform="translate(16, 282)" filter="url(#shadowSm)">
      <rect width="428" height="64" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
      <rect x="12" y="10" width="112" height="22" rx="4" fill="#0284c7"/>
      <text x="68" y="25" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">地址寄存器 AR</text>
      <text x="134" y="25" font-size="12" font-weight="800" fill="#0369a1">存放：CPU 即将访问的主存物理单元地址</text>
      <text x="14" y="48" font-size="10.5" fill="#0c4a6e">⚙️ 硬件接口：直接驱动外部【地址总线 AB】；无论是取指令地址还是取操作数地址都经此流出。</text>
    </g>

    <!-- 控制器特征总结贴纸 -->
    <g transform="translate(16, 356)">
      <rect width="428" height="94" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,3"/>
      <text x="14" y="22" font-size="11.5" font-weight="800" fill="#0f172a">🎯 控制器阵营四大核心部件口诀：</text>
      <text x="14" y="42" font-size="11" font-weight="700" fill="#0369a1">【PC 寻址指向下，IR 藏身当前码，ID 译码时序走，AR 锁存地址出】</text>
      <text x="14" y="62" font-size="10.5" fill="#64748b">⚠️ 考场防坑：控制器里面绝对没有做加减乘除计算的部件，也没有用来存运算结果的累加器！</text>
      <text x="14" y="80" font-size="10" font-weight="700" fill="#ef4444">💥 错题 130 钓鱼项排除：PC、IR、ID、AR 均归控制器！</text>
    </g>
  </g>

  <!-- ======================== 中间：内部总线物理通道 (优化防重叠) ======================== -->
  <g transform="translate(505, 75)">
    <!-- 顶部总线徽章 -->
    <rect x="1" y="0" width="48" height="24" rx="5" fill="#0f172a"/>
    <text x="25" y="16" font-size="10.5" font-weight="800" fill="#38bdf8" text-anchor="middle">总线</text>

    <!-- 垂直总线主管道 (纯净通透，绝不侵入左右卡片内部) -->
    <rect x="8" y="30" width="34" height="425" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="25" y1="38" x2="25" y2="445" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- 垂直直排文字：内部总线与控制流 (单字纵向排列，彻底根除旋转重叠) -->
    <g font-size="11" font-weight="800" fill="#0369a1" text-anchor="middle">
      <text x="25" y="70">内</text>
      <text x="25" y="88">部</text>
      <text x="25" y="106">总</text>
      <text x="25" y="124">线</text>
    </g>

    <circle cx="25" cy="144" r="2.5" fill="#94a3b8"/>
    <circle cx="25" cy="154" r="2.5" fill="#94a3b8"/>

    <!-- 交互方向提示 -->
    <g font-size="9.5" font-weight="700" fill="#64748b" text-anchor="middle">
      <text x="25" y="180">数</text>
      <text x="25" y="196">据</text>
      <text x="25" y="212">通</text>
      <text x="25" y="228">路</text>
    </g>

    <!-- 控制信号发射标识 -->
    <path d="M 2 260 L -12 260" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <path d="M 48 260 L 62 260" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

    <g font-size="9.5" font-weight="700" fill="#7c3aed" text-anchor="middle">
      <text x="25" y="295">微</text>
      <text x="25" y="311">指</text>
      <text x="25" y="327">令</text>
      <text x="25" y="343">调</text>
      <text x="25" y="359">度</text>
    </g>

    <circle cx="25" cy="380" r="2.5" fill="#94a3b8"/>
    <circle cx="25" cy="390" r="2.5" fill="#94a3b8"/>

    <g font-size="9.5" font-weight="700" fill="#059669" text-anchor="middle">
      <text x="25" y="415">反</text>
      <text x="25" y="431">馈</text>
    </g>
  </g>

  <!-- ======================== 右侧：运算器阵营 (ALU) ======================== -->
  <g transform="translate(570, 75)" filter="url(#shadowMd)">
    <rect width="460" height="465" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect width="460" height="34" rx="10" fill="url(#aluHeaderGrad)"/>
    <path d="M 0 24 Q 0 34 10 34 L 450 34 Q 460 34 460 24 L 460 34 L 0 34 Z" fill="#6d28d9"/>
    <text x="16" y="22" font-size="13.5" font-weight="700" fill="#ffffff">⚡ 运算器阵营 (ALU - Arithmetic Logic Unit) —— 数据加工中枢</text>
    <text x="390" y="22" font-size="11" font-weight="600" fill="#ede9fe">管“计算”</text>

    <!-- 部件 1: 算术逻辑单元 ALU -->
    <g transform="translate(16, 48)" filter="url(#shadowSm)">
      <rect width="428" height="64" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
      <rect x="12" y="10" width="118" height="22" rx="4" fill="#7c3aed"/>
      <text x="71" y="25" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">算术逻辑单元 ALU</text>
      <text x="138" y="25" font-size="12" font-weight="800" fill="#5b21b6">核心算力引擎：专门负责各种运算</text>
      <text x="14" y="48" font-size="10.5" fill="#4c1d95">⚙️ 运算种类：算术运算（+、-、×、÷）与 逻辑运算（AND、OR、NOT、XOR、移位等）。</text>
    </g>

    <!-- 部件 2: 累加器 AC / ACC (错题 130 核心题眼) -->
    <g transform="translate(16, 122)" filter="url(#shadowSm)">
      <rect width="428" height="64" rx="8" fill="#fdf4ff" stroke="#e879f9" stroke-width="1.5"/>
      <rect x="12" y="10" width="118" height="22" rx="4" fill="#c026d3"/>
      <text x="71" y="25" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">🔥 累加器 AC / ACC</text>
      <text x="138" y="25" font-size="12" font-weight="800" fill="#a21caf">存放：ALU 输入的操作数与暂存运算结果！</text>
      <text x="14" y="48" font-size="10.5" fill="#701a75">⚙️ 为什么必须有它：单总线架构不能同时传两路数据，必须先将一个数放进 AC 蓄势待发！</text>
    </g>

    <!-- 部件 3: 数据缓冲寄存器 DR / MDR -->
    <g transform="translate(16, 196)" filter="url(#shadowSm)">
      <rect width="428" height="64" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
      <rect x="12" y="10" width="118" height="22" rx="4" fill="#7c3aed"/>
      <text x="71" y="25" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">数据寄存器 DR</text>
      <text x="138" y="25" font-size="12" font-weight="800" fill="#5b21b6">存放：CPU 与主存/外设进行数据交互的隔离门</text>
      <text x="14" y="48" font-size="10.5" fill="#4c1d95">⚙️ 硬件接口：双向连接外部【数据总线 DB】；抹平 CPU 超高速与外部内存低速之间的时序剪刀差。</text>
    </g>

    <!-- 部件 4: 状态条件寄存器 PSW / Flag (高危易错部件) -->
    <g transform="translate(16, 270)" filter="url(#shadowSm)">
      <rect width="428" height="76" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
      <rect x="12" y="10" width="118" height="22" rx="4" fill="#7c3aed"/>
      <text x="71" y="25" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">状态寄存器 PSW</text>
      <text x="138" y="25" font-size="12" font-weight="800" fill="#5b21b6">存放：记录算术逻辑运算后的标志与状态！</text>
      <text x="14" y="48" font-size="10.5" fill="#4c1d95">⚙️ 状态标志位：进位标志（CF）、零标志（ZF）、溢出标志（OF）、符号标志（SF）。</text>
      <text x="14" y="65" font-size="10" font-weight="700" fill="#7c3aed">⚠️ 极高频陷阱：PSW 虽为控制器跳转提供依据，但它记录运算状态，【官方大纲 100% 归属运算器】！</text>
    </g>

    <!-- 运算器特征总结贴纸 -->
    <g transform="translate(16, 356)">
      <rect width="428" height="94" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,3"/>
      <text x="14" y="22" font-size="11.5" font-weight="800" fill="#0f172a">🎯 运算器阵营核心成员口诀：</text>
      <text x="14" y="42" font-size="11" font-weight="700" fill="#6d28d9">【ALU 算逻辑，累加器 (AC) 存结果，数据缓冲 (DR) 倒内存，PSW 记溢出与零】</text>
      <text x="14" y="62" font-size="10.5" fill="#64748b">包含通用寄存器组（R0~Rn，暂存临时变量）；</text>
      <text x="14" y="80" font-size="10" font-weight="800" fill="#059669">✅ 错题 130 题眼定论：题干给出 ALU、PSW、通用寄存器，所缺必定是【累加器 AC】！</text>
    </g>
  </g>

  <!-- ======================== 底部：协同运转五部曲流水 & 考场速杀 ======================== -->
  <g transform="translate(30, 555)" filter="url(#shadowMd)">
    <rect width="1000" height="142" rx="10" fill="url(#footerGrad)"/>

    <!-- 顶部标题标签 -->
    <g transform="translate(16, 12)">
      <rect width="120" height="20" rx="4" fill="#f59e0b"/>
      <text x="60" y="14" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">协同运转五部曲</text>
      <text x="130" y="14" font-size="11" fill="#94a3b8">从内存取指到最终运算写回的完整硬件流水节拍：</text>
    </g>

    <!-- 五步曲卡片链 (全景卡片，彻底根除单行溢出截断问题) -->
    <!-- 步骤 1: 取指 -->
    <g transform="translate(16, 38)">
      <rect width="176" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="10" y="17" font-size="10.5" font-weight="800" fill="#38bdf8">① 取指 (Fetch)</text>
      <text x="10" y="32" font-size="9.5" fill="#cbd5e1">PC → AR → 内存 → IR</text>
      <text x="120" y="32" font-size="9" font-weight="700" fill="#38bdf8">[PC+1]</text>
    </g>
    <path d="M 197 59 L 206 59" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>

    <!-- 步骤 2: 译码 -->
    <g transform="translate(212, 38)">
      <rect width="176" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="10" y="17" font-size="10.5" font-weight="800" fill="#38bdf8">② 译码 (Decode)</text>
      <text x="10" y="32" font-size="9.5" fill="#cbd5e1">IR[OP] → ID 译码</text>
      <text x="110" y="32" font-size="9" fill="#94a3b8">[发生器发信号]</text>
    </g>
    <path d="M 393 59 L 402 59" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>

    <!-- 步骤 3: 取数 -->
    <g transform="translate(408, 38)">
      <rect width="176" height="42" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.2"/>
      <text x="10" y="17" font-size="10.5" font-weight="800" fill="#c084fc">③ 取数 (Operand)</text>
      <text x="10" y="32" font-size="9.5" fill="#cbd5e1">ADDR → AR → 访存入 DR</text>
      <text x="135" y="32" font-size="9" font-weight="700" fill="#e879f9">[送AC]</text>
    </g>
    <path d="M 589 59 L 598 59" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>

    <!-- 步骤 4: 执行 -->
    <g transform="translate(604, 38)">
      <rect width="176" height="42" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.2"/>
      <text x="10" y="17" font-size="10.5" font-weight="800" fill="#c084fc">④ 执行 (Execute)</text>
      <text x="10" y="32" font-size="9.5" fill="#cbd5e1">ALU 运算相加</text>
      <text x="100" y="32" font-size="9" font-weight="700" fill="#f43f5e">[状态打入PSW]</text>
    </g>
    <path d="M 785 59 L 794 59" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>

    <!-- 步骤 5: 写回 -->
    <g transform="translate(800, 38)">
      <rect width="184" height="42" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="10" y="17" font-size="10.5" font-weight="800" fill="#10b981">⑤ 写回 (Writeback)</text>
      <text x="10" y="32" font-size="9.5" fill="#cbd5e1">结果暂存 AC / 写回 R0 内存</text>
    </g>

    <!-- 下半部分：考场秒杀口诀通栏 -->
    <line x1="16" y1="90" x2="984" y2="90" stroke="#334155" stroke-width="1"/>

    <g transform="translate(16, 96)">
      <rect x="0" y="6" width="68" height="28" rx="4" fill="#f59e0b"/>
      <text x="34" y="24" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">秒杀口诀</text>

      <text x="80" y="18" font-size="11.5" font-weight="700" fill="#f8fafc">
        【运算器】算术逻辑配累加（<tspan fill="#e879f9">ALU + AC暂存</tspan>），状态条件（<tspan fill="#c084fc">PSW记溢零</tspan>），数据缓冲（<tspan fill="#c084fc">DR倒内存</tspan>）；
      </text>
      <text x="80" y="34" font-size="11.5" font-weight="700" fill="#38bdf8">
        【控制器】程序计数指下条（PC+1），当前指令躺中央（IR），译码时序号令发（ID），地址锁存（AR把路引）！
      </text>

      <!-- 右侧错题 130 专属标签 -->
      <g transform="translate(730, 2)">
        <rect width="238" height="34" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
