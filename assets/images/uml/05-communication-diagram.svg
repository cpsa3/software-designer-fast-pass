<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
      .box-head { fill: #f8fafc; }
      .line { stroke: #1e293b; stroke-width: 1.5; }
      .dash-line { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 5,4; }
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .txt-content { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; fill: #334155; }
      .txt-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .txt-multi { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .txt-role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-style: italic; fill: #2563eb; }
      .badge-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #d97706; font-weight: 600; }
    </style>
</defs>
  <rect width="750" height="360" fill="#ffffff" />
  <g transform="translate(60, 50)">
    <rect width="160" height="50" class="box" /><rect width="160" height="20" class="box-head" />
    <text x="80" y="15" class="txt-title" text-decoration="underline">读者 : Reader</text>
  </g>
  <g transform="translate(480, 50)">
    <rect width="180" height="50" class="box" /><rect width="180" height="20" class="box-head" />
    <text x="90" y="15" class="txt-title" text-decoration="underline">系统前台 : WebUI</text>
  </g>
  <g transform="translate(480, 240)">
    <rect width="180" height="50" class="box" /><rect width="180" height="20" class="box-head" />
    <text x="90" y="15" class="txt-title" text-decoration="underline">借阅服务 : OrderService</text>
  </g>
  <g transform="translate(100, 240)">
    <rect width="180" height="50" class="box" /><rect width="180" height="20" class="box-head" />
    <text x="90" y="15" class="txt-title" text-decoration="underline">库存系统 : StockService</text>
  </g>

  <!-- Network Links -->
  <line x1="220" y1="75" x2="480" y2="75" class="line" />
  <polygon points="340,65 355,70 340,75" fill="#1e293b" />
  <text x="350" y="60" class="txt-title">1: 提交借书申请()</text>

  <line x1="570" y1="100" x2="570" y2="240" class="line" />
  <polygon points="575,165 570,180 565,165" fill="#1e293b" />
  <text x="590" y="165" class="txt-title" text-anchor="start">1.1: 检查欠费()</text>
  <text x="590" y="185" class="txt-title" text-anchor="start">1.2: 扣减借阅限额()</text>

  <line x1="480" y1="265" x2="280" y2="265" class="line" />
  <polygon points="390,260 375,265 390,270" fill="#1e293b" />
  <text x="380" y="255" class="txt-title">1.2.1: 冻结在架库存()</text>
</svg>