<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
      .box-head { fill: #f8fafc; }
      .line { stroke: #1e293b; stroke-width: 1.5; }
      .dash-line { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 5,4; }
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .txt-content { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; fill: #334155; }
      .txt-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .txt-multi { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .txt-role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-style: italic; fill: #2563eb; }
      .badge-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #d97706; font-weight: 600; }
    </style>
</defs>
  <rect width="850" height="480" fill="#ffffff" />
  <!-- System Boundary -->
  <rect x="220" y="20" width="580" height="440" fill="#f8fafc" stroke="#334155" stroke-width="1.5" rx="4" />
  <text x="240" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">图书借阅管理系统 (System Boundary)</text>

  <!-- Actor Stickman: 图书管理员 -->
  <g transform="translate(80, 180)">
    <circle cx="25" cy="20" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    <line x1="25" y1="34" x2="25" y2="75" stroke="#1e293b" stroke-width="2" />
    <line x1="0" y1="50" x2="50" y2="50" stroke="#1e293b" stroke-width="2" />
    <line x1="25" y1="75" x2="5" y2="115" stroke="#1e293b" stroke-width="2" />
    <line x1="25" y1="75" x2="45" y2="115" stroke="#1e293b" stroke-width="2" />
    <text x="25" y="135" class="txt-title">图书管理员</text>
  </g>

  <!-- Use Cases (Ovals) -->
  <!-- UC1: 新增书籍信息 -->
  <g transform="translate(280, 60)">
    <ellipse cx="90" cy="24" rx="80" ry="22" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="90" y="29" class="txt-title">新增书籍信息</text>
  </g>

  <!-- UC2: 查询书籍信息 (Base UC for extend) -->
  <g transform="translate(420, 140)">
    <ellipse cx="90" cy="24" rx="80" ry="22" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="90" y="29" class="txt-title">查询书籍信息</text>
  </g>

  <!-- UC3: 修改书籍信息 (Extend UC) -->
  <g transform="translate(630, 210)">
    <ellipse cx="85" cy="24" rx="75" ry="22" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="85" y="29" class="txt-title">修改书籍信息</text>
  </g>

  <!-- UC4: 登记外借信息 -->
  <g transform="translate(330, 260)">
    <ellipse cx="90" cy="24" rx="80" ry="22" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="90" y="29" class="txt-title">登记外借信息</text>
  </g>

  <!-- UC5: 用户登录 (Included UC) -->
  <g transform="translate(540, 320)">
    <ellipse cx="90" cy="24" rx="80" ry="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="90" y="29" class="txt-title" fill="#1d4ed8">用户登录</text>
  </g>

  <!-- UC6: 统计借阅数据 -->
  <g transform="translate(280, 390)">
    <ellipse cx="90" cy="24" rx="80" ry="22" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="90" y="29" class="txt-title">统计借阅数据</text>
  </g>

  <!-- CONNECTIONS -->
  <!-- Actor to UC1, UC2, UC4, UC6 -->
  <line x1="135" y1="200" x2="280" y2="84" class="line" />
  <line x1="135" y1="210" x2="420" y2="160" class="line" />
  <line x1="135" y1="230" x2="330" y2="280" class="line" />
  <line x1="135" y1="240" x2="280" y2="405" class="line" />

  <!-- Extend: 修改书籍信息 ────▶ 查询书籍信息 (反向指向基础用例) -->
  <line x1="640" y1="215" x2="550" y2="180" class="dash-line" />
  <polygon points="553,174 540,175 548,185" fill="#475569" />
  <text x="630" y="180" class="badge-note">&lt;&lt;extend&gt;&gt;</text>

  <!-- Include: 登记外借信息 ────▶ 用户登录 (指向公共逻辑) -->
  <line x1="480" y1="295" x2="560" y2="325" class="dash-line" />
  <polygon points="552,320 564,327 555,330" fill="#475569" />
  <text x="475" y="325" class="badge-note">&lt;&lt;include&gt;&gt;</text>

  <!-- Include: 查询书籍信息 ────▶ 用户登录 -->
  <line x1="530" y1="185" x2="605" y2="300" class="dash-line" />
  <polygon points="600,290 608,305 608,295" fill="#475569" />
  <text x="590" y="250" class="badge-note">&lt;&lt;include&gt;&gt;</text>
</svg>