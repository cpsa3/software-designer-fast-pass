<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
      .box-head { fill: #f8fafc; }
      .line { stroke: #1e293b; stroke-width: 1.5; }
      .dash-line { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 5,4; }
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .txt-content { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; fill: #334155; }
      .txt-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .txt-multi { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .txt-role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-style: italic; fill: #2563eb; }
      .badge-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #d97706; font-weight: 600; }
    </style>
</defs>
  <rect width="850" height="380" fill="#ffffff" />

  <!-- Node 1: Client PC (3D Cube) -->
  <g transform="translate(60, 80)">
    <!-- Front Face -->
    <rect x="0" y="20" width="200" height="180" class="box" />
    <!-- Top Face -->
    <polygon points="0,20 25,0 225,0 200,20" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="200,20 225,0 225,180 200,200" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5" />
    
    <text x="100" y="55" class="txt-title">«device»</text>
    <text x="100" y="75" class="txt-title">客户端 PC</text>

    <!-- Nested Execution Env & Artifact -->
    <rect x="20" y="100" width="160" height="75" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="4" />
    <text x="100" y="125" class="txt-label">«execution env»</text>
    <text x="100" y="145" class="txt-content" text-anchor="middle">Chrome 浏览器</text>
  </g>

  <!-- Node 2: Web Server (3D Cube) -->
  <g transform="translate(520, 80)">
    <!-- Front Face -->
    <rect x="0" y="20" width="220" height="200" class="box" />
    <!-- Top Face -->
    <polygon points="0,20 25,0 245,0 220,20" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="220,20 245,0 245,200 220,220" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5" />

    <text x="110" y="55" class="txt-title">«device»</text>
    <text x="110" y="75" class="txt-title">应用服务器群</text>

    <!-- Nested Artifacts -->
    <rect x="25" y="95" width="170" height="50" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="4" />
    <text x="110" y="115" class="txt-label">«artifact»</text>
    <text x="110" y="132" class="txt-content" text-anchor="middle">app-service.jar</text>

    <rect x="25" y="155" width="170" height="50" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="4" />
    <text x="110" y="175" class="txt-label">«artifact»</text>
    <text x="110" y="192" class="txt-content" text-anchor="middle">order_db.ibd</text>
  </g>

  <!-- Physical Communication Path -->
  <line x1="285" y1="180" x2="520" y2="180" stroke="#1e293b" stroke-width="2" />
  <text x="400" y="165" class="txt-title" fill="#2563eb">HTTPS (端口: 443)</text>
  <text x="400" y="200" class="txt-label">物理网络链路 (TCP/IP)</text>
</svg>