<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
      .box-head { fill: #f8fafc; }
      .line { stroke: #1e293b; stroke-width: 1.5; }
      .dash-line { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 5,4; }
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .txt-content { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; fill: #334155; }
      .txt-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .txt-multi { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .txt-role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-style: italic; fill: #2563eb; }
      .badge-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #d97706; font-weight: 600; }
    </style>
</defs>
  <rect width="850" height="360" fill="#ffffff" />

  <!-- Initial State (Solid Circle) -->
  <circle cx="50" cy="160" r="12" fill="#0f172a" />
  <text x="50" y="195" class="txt-label">初态</text>

  <!-- State 1: 未支付 -->
  <g transform="translate(130, 130)">
    <rect width="130" height="60" rx="8" class="box" />
    <text x="65" y="35" class="txt-title">未支付</text>
  </g>

  <!-- State 2: 支付成功 -->
  <g transform="translate(380, 130)">
    <rect width="130" height="60" rx="8" class="box" />
    <text x="65" y="35" class="txt-title">支付成功</text>
  </g>

  <!-- State 3: 已发货 -->
  <g transform="translate(630, 130)">
    <rect width="130" height="60" rx="8" class="box" />
    <text x="65" y="35" class="txt-title">已发货</text>
  </g>

  <!-- State 4: 已关闭 (Bottom) -->
  <g transform="translate(250, 260)">
    <rect width="130" height="50" rx="8" class="box" />
    <text x="65" y="30" class="txt-title">已关闭</text>
  </g>

  <!-- Final State (Bullseye) -->
  <g transform="translate(800, 160)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#0f172a" />
    <text x="0" y="35" class="txt-label">终态</text>
  </g>

  <!-- Transitions -->
  <!-- Init to 未支付 -->
  <line x1="62" y1="160" x2="130" y2="160" class="line" />
  <polygon points="120,155 130,160 120,165" fill="#1e293b" />

  <!-- 未支付 to 支付成功 -->
  <line x1="260" y1="160" x2="380" y2="160" class="line" />
  <polygon points="370,155 380,160 370,165" fill="#1e293b" />
  <text x="320" y="145" class="txt-title" fill="#2563eb">付款 [余额充足] / 记账</text>

  <!-- 未支付 to 已关闭 -->
  <path d="M 195,190 L 195,285 L 250,285" class="line" fill="none" />
  <polygon points="240,280 250,285 240,290" fill="#1e293b" />
  <text x="140" y="245" class="badge-note">超时30分 / 释放库存</text>

  <!-- 支付成功 to 已发货 -->
  <line x1="510" y1="160" x2="630" y2="160" class="line" />
  <polygon points="620,155 630,160 620,165" fill="#1e293b" />
  <text x="570" y="145" class="txt-title">仓库拣货 / 通知物流</text>

  <!-- 已发货 to 终态 -->
  <line x1="760" y1="160" x2="786" y2="160" class="line" />
  <polygon points="776,155 786,160 776,165" fill="#1e293b" />
  <text x="770" y="145" class="txt-title">确认收货</text>
</svg>