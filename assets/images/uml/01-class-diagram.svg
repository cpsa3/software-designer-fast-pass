<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
      .box-head { fill: #f8fafc; }
      .line { stroke: #1e293b; stroke-width: 1.5; }
      .dash-line { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 5,4; }
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .txt-content { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; fill: #334155; }
      .txt-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .txt-multi { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .txt-role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-style: italic; fill: #2563eb; }
      .badge-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #d97706; font-weight: 600; }
    </style>
</defs>
  <rect width="850" height="480" fill="#ffffff" />
  <g transform="translate(320, 20)">
    <rect width="180" height="50" class="box" /><rect width="180" height="22" class="box-head" />
    <line x1="0" y1="22" x2="180" y2="22" stroke="#1e293b" stroke-width="1" />
    <text x="90" y="16" class="txt-title">Company</text>
    <text x="8" y="38" class="txt-content">+name: Name</text>
  </g>
  <g transform="translate(80, 140)">
    <rect width="180" height="70" class="box" /><rect width="180" height="22" class="box-head" />
    <line x1="0" y1="22" x2="180" y2="22" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="46" x2="180" y2="46" stroke="#1e293b" stroke-width="1" />
    <text x="90" y="16" class="txt-title">Department</text>
    <text x="8" y="38" class="txt-content">+name: Name</text>
  </g>
  <g transform="translate(560, 140)">
    <rect width="180" height="90" class="box" /><rect width="180" height="22" class="box-head" />
    <line x1="0" y1="22" x2="180" y2="22" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="68" x2="180" y2="68" stroke="#1e293b" stroke-width="1" />
    <text x="90" y="16" class="txt-title">Office</text>
    <text x="8" y="38" class="txt-content">+address: String</text>
    <text x="8" y="56" class="txt-content">+voice: Number</text>
    <text x="8" y="82" class="txt-content">Department</text>
  </g>
  <g transform="translate(560, 310)">
    <rect width="180" height="50" class="box" /><rect width="180" height="22" class="box-head" />
    <line x1="0" y1="22" x2="180" y2="22" stroke="#1e293b" stroke-width="1" />
    <text x="90" y="16" class="txt-title">Headquarters</text>
  </g>
  <g transform="translate(80, 290)">
    <rect width="200" height="110" class="box" /><rect width="200" height="22" class="box-head" />
    <line x1="0" y1="22" x2="200" y2="22" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="66" x2="200" y2="66" stroke="#1e293b" stroke-width="1" />
    <text x="100" y="16" class="txt-title">Person</text>
    <text x="8" y="38" class="txt-content">+name: Name</text>
    <text x="8" y="56" class="txt-content">+employeeID: Integer</text>
    <text x="8" y="82" class="txt-content">+getPersonalRecords()</text>
    <text x="8" y="98" class="txt-content">+getPhoto(p: Photo)</text>
  </g>
  <g transform="translate(360, 370)">
    <rect width="170" height="70" class="box" /><rect width="170" height="22" class="box-head" />
    <line x1="0" y1="22" x2="170" y2="22" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="68" x2="170" y2="68" stroke="#1e293b" stroke-width="1" />
    <text x="85" y="16" class="txt-title">PersonRecord</text>
    <text x="8" y="38" class="txt-content">+texID: Integer</text>
    <text x="8" y="56" class="txt-content">+salary: Real</text>
  </g>
  <line x1="530" y1="405" x2="580" y2="405" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="588" cy="405" r="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
  <text x="615" y="409" class="txt-label" text-anchor="start">接口 (Lollipop)</text>

  <line x1="340" y1="70" x2="340" y2="90" class="line" /><line x1="340" y1="90" x2="170" y2="90" class="line" /><line x1="170" y1="90" x2="170" y2="140" class="line" />
  <polygon points="340,70 334,77 340,84 346,77" fill="#1e293b" stroke="#1e293b" />
  <text x="350" y="85" class="txt-multi">1</text><text x="175" y="125" class="txt-multi">1..*</text>
  <text x="240" y="82" class="badge-note">组合 (实心菱形在整体端)</text>

  <line x1="480" y1="70" x2="480" y2="90" class="line" /><line x1="480" y1="90" x2="650" y2="90" class="line" /><line x1="650" y1="90" x2="650" y2="140" class="line" />
  <polygon points="480,70 474,77 480,84 486,77" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
  <text x="490" y="85" class="txt-multi">1</text><text x="655" y="125" class="txt-multi">1..*</text>
  <text x="540" y="82" class="badge-note">聚合 (空心菱形在整体端)</text>

  <line x1="260" y1="170" x2="560" y2="170" class="line" />
  <text x="410" y="162" class="txt-label">关联 (实线无箭头)</text>

  <line x1="120" y1="210" x2="120" y2="290" class="line" />
  <text x="105" y="230" class="txt-multi">1</text><text x="105" y="275" class="txt-multi">1..*</text>
  <text x="65" y="255" class="txt-role">member</text>

  <line x1="220" y1="210" x2="220" y2="290" class="line" />
  <text x="228" y="230" class="txt-multi">1</text><text x="228" y="275" class="txt-multi">1</text>
  <text x="235" y="255" class="txt-role">manager</text>

  <line x1="650" y1="310" x2="650" y2="245" class="line" />
  <polygon points="650,230 642,245 658,245" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
  <text x="695" y="275" class="badge-note">泛化 (继承)</text>

  <line x1="280" y1="360" x2="350" y2="385" class="dash-line" />
  <polygon points="346,380 358,388 349,391" fill="#475569" />
  <text x="330" y="355" class="badge-note">依赖</text>
</svg>