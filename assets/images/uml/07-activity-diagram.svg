<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
      .box-head { fill: #f8fafc; }
      .line { stroke: #1e293b; stroke-width: 1.5; }
      .dash-line { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 5,4; }
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .txt-content { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; fill: #334155; }
      .txt-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .txt-multi { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .txt-role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-style: italic; fill: #2563eb; }
      .badge-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #d97706; font-weight: 600; }
    </style>
</defs>
  <rect width="700" height="480" fill="#ffffff" />

  <!-- Start -->
  <circle cx="350" cy="30" r="12" fill="#0f172a" />
  <line x1="350" y1="42" x2="350" y2="70" class="line" />
  <polygon points="345,60 350,70 355,60" fill="#1e293b" />

  <!-- Action 1 -->
  <g transform="translate(260, 70)">
    <rect width="180" height="40" rx="10" class="box" />
    <text x="90" y="25" class="txt-title">提交出差审批单</text>
  </g>
  <line x1="350" y1="110" x2="350" y2="140" class="line" />
  <polygon points="345,130 350,140 355,130" fill="#1e293b" />

  <!-- Fork Bar (Thick Black Line) -->
  <rect x="150" y="140" width="400" height="6" fill="#0f172a" rx="2" />
  <text x="580" y="146" class="badge-note" fill="#0f172a">同步分叉条 (Fork)</text>

  <!-- Parallel Actions -->
  <line x1="200" y1="146" x2="200" y2="190" class="line" />
  <polygon points="195,180 200,190 205,180" fill="#1e293b" />
  <g transform="translate(130, 190)">
    <rect width="140" height="46" rx="8" class="box" />
    <text x="70" y="28" class="txt-title">财务部：预算审核</text>
  </g>

  <line x1="350" y1="146" x2="350" y2="190" class="line" />
  <polygon points="345,180 350,190 355,180" fill="#1e293b" />
  <g transform="translate(280, 190)">
    <rect width="140" height="46" rx="8" class="box" />
    <text x="70" y="28" class="txt-title">行政部：预订酒店</text>
  </g>

  <line x1="500" y1="146" x2="500" y2="190" class="line" />
  <polygon points="495,180 500,190 505,180" fill="#1e293b" />
  <g transform="translate(430, 190)">
    <rect width="140" height="46" rx="8" class="box" />
    <text x="70" y="28" class="txt-title">主管：工作交接</text>
  </g>

  <!-- Lines to Join Bar -->
  <line x1="200" y1="236" x2="200" y2="280" class="line" />
  <polygon points="195,270 200,280 205,270" fill="#1e293b" />
  <line x1="350" y1="236" x2="350" y2="280" class="line" />
  <polygon points="345,270 350,280 355,270" fill="#1e293b" />
  <line x1="500" y1="236" x2="500" y2="280" class="line" />
  <polygon points="495,270 500,280 505,270" fill="#1e293b" />

  <!-- Join Bar (Thick Black Line) -->
  <rect x="150" y="280" width="400" height="6" fill="#0f172a" rx="2" />
  <text x="580" y="286" class="badge-note" fill="#0f172a">同步汇合条 (Join)</text>

  <!-- Output Action -->
  <line x1="350" y1="286" x2="350" y2="330" class="line" />
  <polygon points="345,320 350,330 355,320" fill="#1e293b" />
  <g transform="translate(260, 330)">
    <rect width="180" height="40" rx="10" class="box" />
    <text x="90" y="25" class="txt-title">打印出差派遣通知</text>
  </g>

  <line x1="350" y1="370" x2="350" y2="410" class="line" />
  <polygon points="345,400 350,410 355,400" fill="#1e293b" />

  <!-- End Node -->
  <circle cx="350" cy="425" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
  <circle cx="350" cy="425" r="8" fill="#0f172a" />
</svg>