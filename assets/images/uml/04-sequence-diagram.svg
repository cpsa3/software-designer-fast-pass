<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
      .box-head { fill: #f8fafc; }
      .line { stroke: #1e293b; stroke-width: 1.5; }
      .dash-line { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 5,4; }
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .txt-content { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; fill: #334155; }
      .txt-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .txt-multi { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .txt-role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-style: italic; fill: #2563eb; }
      .badge-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #d97706; font-weight: 600; }
    </style>
</defs>
  <rect width="800" height="450" fill="#ffffff" />

  <!-- Lifeline Headers -->
  <g transform="translate(70, 30)">
    <rect width="100" height="36" class="box" rx="2" /><text x="50" y="22" class="txt-title">用户 : User</text>
    <line x1="50" y1="36" x2="50" y2="390" class="dash-line" />
  </g>
  <g transform="translate(250, 30)">
    <rect width="130" height="36" class="box" rx="2" /><text x="65" y="22" class="txt-title">前端 : Controller</text>
    <line x1="65" y1="36" x2="65" y2="390" class="dash-line" />
  </g>
  <g transform="translate(450, 30)">
    <rect width="130" height="36" class="box" rx="2" /><text x="65" y="22" class="txt-title">服务 : AuthService</text>
    <line x1="65" y1="36" x2="65" y2="390" class="dash-line" />
  </g>
  <g transform="translate(630, 30)">
    <rect width="120" height="36" class="box" rx="2" /><text x="60" y="22" class="txt-title">数据库 : DB</text>
    <line x1="60" y1="36" x2="60" y2="390" class="dash-line" />
  </g>

  <!-- Activation Boxes -->
  <rect x="310" y="90" width="10" height="240" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5" />
  <rect x="510" y="130" width="10" height="150" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5" />
  <rect x="685" y="170" width="10" height="60" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5" />

  <!-- Time Axis Label -->
  <line x1="30" y1="80" x2="30" y2="380" stroke="#94a3b8" stroke-width="1.5" />
  <polygon points="26,380 30,395 34,380" fill="#94a3b8" />
  <text x="20" y="230" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" transform="rotate(-90 20,230)">时间顺序流逝 (Time Axis)</text>

  <!-- Message 1: 同步调用 -->
  <line x1="120" y1="90" x2="310" y2="90" class="line" />
  <polygon points="300,85 310,90 300,95" fill="#1e293b" />
  <text x="210" y="82" class="txt-title">1: 提交登录表单()</text>

  <!-- Message 2: 同步调用 -->
  <line x1="320" y1="130" x2="510" y2="130" class="line" />
  <polygon points="500,125 510,130 500,135" fill="#1e293b" />
  <text x="415" y="122" class="txt-title">2: 校验用户凭据()</text>

  <!-- Message 3: 同步调用 -->
  <line x1="520" y1="170" x2="685" y2="170" class="line" />
  <polygon points="675,165 685,170 675,175" fill="#1e293b" />
  <text x="600" y="162" class="txt-title">3: 查询哈希()</text>

  <!-- Message 4: 返回消息 (虚线箭头) -->
  <line x1="685" y1="230" x2="520" y2="230" class="dash-line" />
  <polygon points="528,225 518,230 528,235" fill="#475569" />
  <text x="600" y="222" class="txt-label">4: 返回数据记录</text>

  <!-- Message 5: 返回消息 -->
  <line x1="510" y1="280" x2="320" y2="280" class="dash-line" />
  <polygon points="328,275 318,280 328,285" fill="#475569" />
  <text x="415" y="272" class="txt-label">5: 签发 Token</text>

  <!-- Message 6: 返回消息 -->
  <line x1="310" y1="330" x2="120" y2="330" class="dash-line" />
  <polygon points="128,325 118,330 128,335" fill="#475569" />
  <text x="210" y="322" class="txt-label">6: 登录成功页面</text>

  <!-- Destruction X on DB -->
  <line x1="680" y1="380" x2="700" y2="400" stroke="#dc2626" stroke-width="3" />
  <line x1="700" y1="380" x2="680" y2="400" stroke="#dc2626" stroke-width="3" />
  <text x="690" y="420" class="badge-note" fill="#dc2626">对象销毁 (X)</text>
</svg>