<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#ffffff; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 背景底板 -->
  <rect x="2" y="2" width="996" height="676" rx="12" fill="url(#bgGrad3)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 顶部标题区 -->
  <g transform="translate(40, 26)">
    <rect x="0" y="0" width="4" height="28" rx="2" fill="#2563eb"/>
    <text x="16" y="20" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="0.5">CPU 内部总线架构与运算器 vs 控制器通信拓扑模型</text>
    <text x="16" y="40" font-size="13" fill="#64748b">指令译码控制流 vs 算术逻辑数据流 &amp; 软考必考核心部件归属判定拓扑</text>
  </g>

  <!-- CPU 核心边界外框 (X: 40, Y: 98, 宽 920, 高 435) -->
  <rect x="40" y="98" width="920" height="435" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="52" y="86" width="130" height="24" rx="4" fill="#0f172a"/>
  <text x="117" y="102" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">CPU (中央处理器)</text>

  <!-- 左侧：控制器区域 (X: 60, Y: 122, 宽 380, 高 395) -->
  <g transform="translate(60, 122)">
    <rect width="380" height="395" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="0" y="0" width="380" height="36" rx="8" fill="#dbeafe"/>
    <path d="M 0 26 Q 0 36 10 36 L 370 36 Q 380 36 380 26 L 380 36 L 0 36 Z" fill="#dbeafe"/>
    <text x="16" y="23" font-size="14" font-weight="700" fill="#1e40af">🕹️ 控制器部件 (Controller — 大脑发号施令)</text>

    <!-- PC: 程序计数器 (必考) -->
    <g transform="translate(16, 50)" filter="url(#shadow3)">
      <rect width="348" height="56" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="12" y="10" width="36" height="36" rx="4" fill="url(#ctrlGrad)"/>
      <text x="30" y="32" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PC</text>
      <text x="56" y="24" font-size="13" font-weight="700" fill="#0f172a">程序计数器 (Program Counter)</text>
      <text x="56" y="44" font-size="11" font-weight="600" fill="#2563eb">★ 存放下一条指令的内存地址 (自动自增 +1)</text>
    </g>

    <!-- IR 与 ID (指令寄存器与译码器) 并行流 -->
    <g transform="translate(16, 120)">
      <!-- IR: 指令寄存器 -->
      <g filter="url(#shadow3)">
        <rect width="166" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="12" y="22" font-size="12" font-weight="700" fill="#1d4ed8">IR (指令寄存器)</text>
        <text x="12" y="40" font-size="10" fill="#64748b">暂存当前正执行指令</text>
        <text x="12" y="52" font-size="9" fill="#94a3b8">(包含操作码+地址码)</text>
      </g>
      <!-- 连接箭头 (垂直居中于 y=30) -->
      <path d="M 166 30 L 180 30" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
      <!-- ID: 指令译码器 -->
      <g transform="translate(182, 0)" filter="url(#shadow3)">
        <rect width="166" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="12" y="22" font-size="12" font-weight="700" fill="#1d4ed8">ID (指令译码器)</text>
        <text x="12" y="40" font-size="10" fill="#64748b">分析解释操作码字段</text>
        <text x="12" y="52" font-size="9" fill="#94a3b8">向 CU 传递操作信号</text>
      </g>
    </g>

    <!-- CU: 控制单元 (发号施令中枢) -->
    <g transform="translate(16, 196)" filter="url(#shadow3)">
      <rect width="348" height="64" rx="6" fill="url(#ctrlGrad)"/>
      <text x="16" y="26" font-size="14" font-weight="700" fill="#ffffff">CU (控制单元 / 微操作信号发生器)</text>
      <text x="16" y="48" font-size="11" fill="#e0e7ff">产生全机各部件操作的节拍脉冲，指挥运算器执行与总线协调</text>
    </g>

    <!-- MAR: 内存地址寄存器 -->
    <g transform="translate(16, 276)" filter="url(#shadow3)">
      <rect width="348" height="52" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#1e40af">MAR (内存地址寄存器)</text>
      <text x="16" y="42" font-size="11" fill="#475569">暂存 CPU 访问内存单元的物理地址 $\to$ 送往地址总线</text>
    </g>

    <!-- 考场极速得分提醒 -->
    <rect x="16" y="342" width="348" height="38" rx="6" fill="#dbeafe"/>
    <text x="26" y="365" font-size="11" font-weight="700" fill="#1d4ed8">💡 考点速记：PC、IR、ID、CU、MAR 全归控制器！</text>
  </g>

  <!-- 中间：CPU 内部共享数据/控制总线 (X: 460, Y: 122, 宽 80, 高 395) -->
  <g transform="translate(460, 122)">
    <rect width="80" height="395" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="40" y="32" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">CPU 内部</text>
    <text x="40" y="48" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">数据/控制</text>
    <text x="40" y="64" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">共享总线</text>
    <path d="M 40 85 L 40 375" stroke="#f59e0b" stroke-width="6" stroke-dasharray="6,4"/>
    <!-- 双向箭头示意 -->
    <path d="M 40 85 L 35 95 L 45 95 Z" fill="#d97706"/>
    <path d="M 40 375 L 35 365 L 45 365 Z" fill="#d97706"/>
  </g>

  <!-- 右侧：运算器区域 (X: 560, Y: 122, 宽 380, 高 395) -->
  <g transform="translate(560, 122)">
    <rect width="380" height="395" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="0" y="0" width="380" height="36" rx="8" fill="#dcfce7"/>
    <path d="M 0 26 Q 0 36 10 36 L 370 36 Q 380 36 380 26 L 380 36 L 0 36 Z" fill="#dcfce7"/>
    <text x="16" y="23" font-size="14" font-weight="700" fill="#166534">⚡ 运算器部件 (Datapath — 算术逻辑执行中枢)</text>

    <!-- ALU: 算术逻辑单元 (核心) -->
    <g transform="translate(16, 50)" filter="url(#shadow3)">
      <polygon points="0,0 200,0 220,30 200,60 0,60 20,30" fill="url(#dataGrad)"/>
      <text x="105" y="28" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">ALU (算术逻辑单元)</text>
      <text x="105" y="46" font-size="11" fill="#ecfdf5" text-anchor="middle">执行加减乘除与与或非判断</text>
    </g>

    <!-- AC: 累加寄存器 -->
    <g transform="translate(245, 50)" filter="url(#shadow3)">
      <rect width="118" height="60" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <text x="12" y="24" font-size="12" font-weight="700" fill="#047857">AC (累加器)</text>
      <text x="12" y="42" font-size="10" fill="#64748b">暂存源操作数</text>
      <text x="12" y="54" font-size="10" fill="#047857">及运算中间结果</text>
    </g>

    <!-- PSW: 程序状态字寄存器 (极高频必考混淆陷阱！) -->
    <g transform="translate(16, 126)" filter="url(#shadow3)">
      <rect width="348" height="64" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
      <rect x="250" y="8" width="86" height="20" rx="4" fill="#fee2e2"/>
      <text x="293" y="22" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">高频易错陷阱!</text>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#991b1b">PSW (程序状态字 / 标志寄存器)</text>
      <text x="16" y="44" font-size="11" font-weight="600" fill="#b91c1c">★ 归属运算器！记录标志位：进位CF、溢出OF、零标志ZF、符号SF</text>
    </g>

    <!-- MDR / DR: 数据缓冲寄存器 -->
    <g transform="translate(16, 206)" filter="url(#shadow3)">
      <rect width="348" height="54" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#047857">MDR / DR (内存数据缓冲寄存器)</text>
      <text x="16" y="42" font-size="11" fill="#475569">暂存 CPU 与外部内存总线交换的指令或数据</text>
    </g>

    <!-- 通用寄存器组 (R0 ~ Rn) -->
    <g transform="translate(16, 276)" filter="url(#shadow3)">
      <rect width="348" height="52" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#166534">通用寄存器组 (General Purpose Registers, GPRs)</text>
      <text x="16" y="42" font-size="11" fill="#475569">如 R0~R3，供汇编指令暂存快速操作数与寻址</text>
    </g>

    <!-- 考场极速得分提醒 -->
    <rect x="16" y="342" width="348" height="38" rx="6" fill="#dcfce7"/>
    <text x="26" y="365" font-size="11" font-weight="700" fill="#15803d">💡 考点速记：ALU、AC、PSW、MDR(DR) 全归运算器！</text>
  </g>

  <!-- 底部外部系统总线与主存储器 (X: 40, Y: 540, 宽 920, 高 110) -->
  <g transform="translate(40, 545)">
    <!-- 三总线区域 -->
    <rect width="640" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="16" y="22" font-size="12" font-weight="700" fill="#334155">系统外部三总线 (System Buses)：</text>

    <!-- 地址总线 AB -->
    <g transform="translate(16, 32)">
      <rect width="608" height="20" rx="4" fill="#dbeafe"/>
      <text x="10" y="14" font-size="11" font-weight="700" fill="#1d4ed8">地址总线 (Address Bus, AB)</text>
      <text x="320" y="14" font-size="10" fill="#1e40af">单向向外传输：由 CPU MAR 发出物理地址 $\to$ 寻址内存单元</text>
      <path d="M 590 10 L 602 10" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
    </g>

    <!-- 数据总线 DB -->
    <g transform="translate(16, 56)">
      <rect width="608" height="20" rx="4" fill="#dcfce7"/>
      <text x="10" y="14" font-size="11" font-weight="700" fill="#166534">数据总线 (Data Bus, DB)</text>
      <text x="320" y="14" font-size="10" fill="#15803d">双向传输：CPU 与内存相互传送数据/指令 (宽度等于字长)</text>
      <path d="M 586 10 L 602 10" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
    </g>

    <!-- 控制总线 CB -->
    <g transform="translate(16, 80)">
      <rect width="608" height="20" rx="4" fill="#fef3c7"/>
      <text x="10" y="14" font-size="11" font-weight="700" fill="#92400e">控制总线 (Control Bus, CB)</text>
      <text x="320" y="14" font-size="10" fill="#b45309">传输控制命令（读 Read / 写 Write / 中断响应 / 传输就绪）</text>
      <path d="M 586 10 L 602 10" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
    </g>

    <!-- 主存储器模块 (Memory) -->
    <g transform="translate(660, 0)" filter="url(#shadow3)">
      <rect width="260" height="110" rx="8" fill="#1e293b"/>
      <text x="130" y="32" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">主存储器 (Main Memory / RAM)</text>
      <text x="130" y="54" font-size="11" fill="#94a3b8" text-anchor="middle">存放当前运行的程序代码与数据</text>
      <rect x="20" y="68" width="220" height="28" rx="4" fill="#334155"/>
      <text x="130" y="86" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">接收 MAR 寻址，经由 MDR 读写数据</text>
    </g>
  </g>
</svg>
