<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#ffffff; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="blueTag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purpleIndex" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="amberSet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="greenOffset" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 背景底板 -->
  <rect x="2" y="2" width="996" height="676" rx="12" fill="url(#bgGrad2)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 顶部标题区 -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="4" height="28" rx="2" fill="#2563eb"/>
    <text x="16" y="20" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="0.5">主存—Cache 三大地址映射机制与地址格式对比模型</text>
    <text x="16" y="44" font-size="13" fill="#64748b">直接映射 vs 全相联映射 vs 组相联映射（地址切分字段、映射规则与考点性能权衡）</text>
  </g>

  <!-- 3 大机制横向并列卡片 (每列宽 288px, 间距 24px, 起点 X: 40, 352, 664; 高度 560px) -->

  <!-- ================= 模式 1: 直接映射 (Direct Mapping) ================= -->
  <g transform="translate(40, 96)" filter="url(#shadow2)">
    <rect width="288" height="540" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <rect width="288" height="38" rx="10" fill="#fef2f2"/>
    <path d="M 0 28 Q 0 38 10 38 L 278 38 Q 288 38 288 28 L 288 38 L 0 38 Z" fill="#fef2f2"/>
    <text x="16" y="24" font-size="14" font-weight="700" fill="#991b1b">1. 直接映射 (Direct Mapping)</text>
    
    <!-- 特征徽标 -->
    <rect x="16" y="50" width="80" height="22" rx="4" fill="#fee2e2"/>
    <text x="56" y="65" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">冲突率: 最高</text>
    <rect x="102" y="50" width="80" height="22" rx="4" fill="#f1f5f9"/>
    <text x="142" y="65" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">硬件: 最简单</text>

    <!-- 地址格式切分图 -->
    <text x="16" y="100" font-size="12" font-weight="700" fill="#334155">主存地址结构划分 (3 段式)：</text>
    <g transform="translate(16, 112)">
      <!-- 主存标记 Tag -->
      <rect x="0" y="0" width="100" height="32" rx="4" fill="url(#blueTag)"/>
      <text x="50" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">主存标记 Tag</text>
      <!-- Cache 行号 -->
      <rect x="104" y="0" width="90" height="32" rx="4" fill="url(#purpleIndex)"/>
      <text x="149" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Cache行号</text>
      <!-- 块内偏移 -->
      <rect x="198" y="0" width="58" height="32" rx="4" fill="url(#greenOffset)"/>
      <text x="227" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">偏移</text>
      <text x="50" y="44" font-size="10" fill="#64748b" text-anchor="middle">高位</text>
      <text x="149" y="44" font-size="10" fill="#64748b" text-anchor="middle">中位</text>
      <text x="227" y="44" font-size="10" fill="#64748b" text-anchor="middle">低位</text>
    </g>

    <!-- 映射几何原理示意图 -->
    <g transform="translate(16, 185)">
      <rect x="0" y="0" width="256" height="210" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#475569">映射示意（一对一固定取模）：</text>
      
      <!-- 主存块列表 -->
      <text x="16" y="45" font-size="11" fill="#64748b">主存块 (Memory Blocks)</text>
      <rect x="16" y="55" width="80" height="24" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="56" y="71" font-size="11" fill="#1e293b" text-anchor="middle">块 0 (i=0)</text>

      <rect x="16" y="85" width="80" height="24" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="56" y="101" font-size="11" fill="#1e293b" text-anchor="middle">块 1 (i=1)</text>

      <rect x="16" y="115" width="80" height="24" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="56" y="131" font-size="11" fill="#1e293b" text-anchor="middle">块 4 (i=4)</text>

      <rect x="16" y="145" width="80" height="24" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="56" y="161" font-size="11" fill="#1e293b" text-anchor="middle">块 8 (i=8)</text>

      <!-- Cache 行列表 (假设共4行) -->
      <text x="160" y="45" font-size="11" fill="#64748b">Cache 行 (4行)</text>
      <rect x="156" y="55" width="84" height="24" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="198" y="71" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Line 0 (必争)</text>

      <rect x="156" y="85" width="84" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="198" y="101" font-size="11" fill="#64748b" text-anchor="middle">Line 1</text>

      <rect x="156" y="115" width="84" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="198" y="131" font-size="11" fill="#64748b" text-anchor="middle">Line 2</text>

      <rect x="156" y="145" width="84" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="198" y="161" font-size="11" fill="#64748b" text-anchor="middle">Line 3</text>

      <!-- 冲突箭头线 -->
      <path d="M 96 67 L 150 67" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      <path d="M 96 127 Q 126 127 150 75" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrow-blue)"/>
      <path d="M 96 157 Q 136 157 150 78" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrow-blue)"/>
      
      <text x="128" y="195" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">块0、4、8全争夺Line 0 (冲突剧烈)</text>
    </g>

    <!-- 底部硬核结论总结 -->
    <g transform="translate(16, 412)">
      <rect x="0" y="0" width="256" height="112" rx="6" fill="#fef2f2"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#991b1b">核心规则公式：</text>
      <text x="10" y="38" font-size="11" fill="#7f1d1d">Cache 行号 = 主存块号 mod Cache行数</text>
      <text x="10" y="60" font-size="11" font-weight="700" fill="#991b1b">考场秒杀特征：</text>
      <text x="10" y="78" font-size="11" fill="#7f1d1d">• 位置完全固定，无需复杂比较电路</text>
      <text x="10" y="96" font-size="11" fill="#7f1d1d">• 相同余数的主存块频繁争位发生颠簸</text>
    </g>
  </g>

  <!-- ================= 模式 2: 全相联映射 (Fully Associative) ================= -->
  <g transform="translate(352, 96)" filter="url(#shadow2)">
    <rect width="288" height="540" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect width="288" height="38" rx="10" fill="#fff7ed"/>
    <path d="M 0 28 Q 0 38 10 38 L 278 38 Q 288 38 288 28 L 288 38 L 0 38 Z" fill="#fff7ed"/>
    <text x="16" y="24" font-size="14" font-weight="700" fill="#9a3412">2. 全相联映射 (Fully Associative)</text>
    
    <!-- 特征徽标 -->
    <rect x="16" y="50" width="80" height="22" rx="4" fill="#ffedd5"/>
    <text x="56" y="65" font-size="11" font-weight="600" fill="#c2410c" text-anchor="middle">冲突率: 最低</text>
    <rect x="102" y="50" width="80" height="22" rx="4" fill="#fee2e2"/>
    <text x="142" y="65" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">电路: 最昂贵</text>

    <!-- 地址格式切分图 (无行号) -->
    <text x="16" y="100" font-size="12" font-weight="700" fill="#334155">主存地址结构划分 (2 段式，无行号)：</text>
    <g transform="translate(16, 112)">
      <!-- 主存标记 Tag (极宽，全空间比对) -->
      <rect x="0" y="0" width="180" height="32" rx="4" fill="url(#blueTag)"/>
      <text x="90" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">主存标记 Tag (全范围比对)</text>
      <!-- 块内偏移 -->
      <rect x="184" y="0" width="72" height="32" rx="4" fill="url(#greenOffset)"/>
      <text x="220" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">块内偏移</text>
      <text x="90" y="44" font-size="10" fill="#64748b" text-anchor="middle">高位 (比直接映射长得多)</text>
      <text x="220" y="44" font-size="10" fill="#64748b" text-anchor="middle">低位</text>
    </g>

    <!-- 映射几何原理示意图 -->
    <g transform="translate(16, 185)">
      <rect x="0" y="0" width="256" height="210" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#475569">映射示意（任意空闲槽位皆可入驻）：</text>
      
      <!-- 主存块 -->
      <rect x="16" y="85" width="80" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="56" y="105" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">主存块 i</text>
      <text x="56" y="118" font-size="9" fill="#64748b" text-anchor="middle">(任意块)</text>

      <!-- Cache 行列表 (全自由映射) -->
      <rect x="160" y="45" width="80" height="24" rx="4" fill="#ffffff" stroke="#10b981"/>
      <text x="200" y="61" font-size="11" fill="#047857" text-anchor="middle">Line 0 (可放)</text>

      <rect x="160" y="77" width="80" height="24" rx="4" fill="#ffffff" stroke="#10b981"/>
      <text x="200" y="93" font-size="11" fill="#047857" text-anchor="middle">Line 1 (可放)</text>

      <rect x="160" y="109" width="80" height="24" rx="4" fill="#ffffff" stroke="#10b981"/>
      <text x="200" y="125" font-size="11" fill="#047857" text-anchor="middle">Line 2 (可放)</text>

      <rect x="160" y="141" width="80" height="24" rx="4" fill="#ffffff" stroke="#10b981"/>
      <text x="200" y="157" font-size="11" fill="#047857" text-anchor="middle">Line 3 (可放)</text>

      <!-- 放射性自由箭头 -->
      <path d="M 96 100 L 154 57" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrow-purple)"/>
      <path d="M 96 103 L 154 89" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <path d="M 96 107 L 154 121" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrow-purple)"/>
      <path d="M 96 110 L 154 153" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrow-purple)"/>

      <text x="128" y="195" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">极度自由：只要有空行就能放入</text>
    </g>

    <!-- 底部硬核结论总结 -->
    <g transform="translate(16, 412)">
      <rect x="0" y="0" width="256" height="112" rx="6" fill="#fff7ed"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#9a3412">核心规则机制：</text>
      <text x="10" y="38" font-size="11" fill="#7c2d12">主存块可映射到 Cache 的任意空闲行</text>
      <text x="10" y="60" font-size="11" font-weight="700" fill="#9a3412">考场秒杀特征：</text>
      <text x="10" y="78" font-size="11" fill="#7c2d12">• 空间利用率最高，块冲突率最低</text>
      <text x="10" y="96" font-size="11" fill="#7c2d12">• 查表需要昂贵的“相联存储器”并发检索</text>
    </g>
  </g>

  <!-- ================= 模式 3: 组相联映射 (Set Associative) ================= -->
  <g transform="translate(664, 96)" filter="url(#shadow2)">
    <rect width="288" height="540" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect width="288" height="38" rx="10" fill="#f0fdf4"/>
    <path d="M 0 28 Q 0 38 10 38 L 278 38 Q 288 38 288 28 L 288 38 L 0 38 Z" fill="#f0fdf4"/>
    <!-- 标为王道推荐 -->
    <rect x="220" y="8" width="56" height="20" rx="4" fill="#16a34a"/>
    <text x="248" y="22" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">最佳折中</text>
    <text x="16" y="24" font-size="14" font-weight="700" fill="#166534">3. 组相联映射 (Set Associative)</text>
    
    <!-- 特征徽标 -->
    <rect x="16" y="50" width="80" height="22" rx="4" fill="#dcfce7"/>
    <text x="56" y="65" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">冲突率: 较低</text>
    <rect x="102" y="50" width="80" height="22" rx="4" fill="#e0f2fe"/>
    <text x="142" y="65" font-size="11" font-weight="600" fill="#0369a1" text-anchor="middle">现代CPU标配</text>

    <!-- 地址格式切分图 (3 段式: 组号) -->
    <text x="16" y="100" font-size="12" font-weight="700" fill="#334155">主存地址结构划分 (Tag + 组号 + 偏移)：</text>
    <g transform="translate(16, 112)">
      <!-- 主存标记 Tag -->
      <rect x="0" y="0" width="104" height="32" rx="4" fill="url(#blueTag)"/>
      <text x="52" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">主存标记 Tag</text>
      <!-- 组号 (Set Index) -->
      <rect x="108" y="0" width="86" height="32" rx="4" fill="url(#amberSet)"/>
      <text x="151" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">组号 (Set)</text>
      <!-- 块内偏移 -->
      <rect x="198" y="0" width="58" height="32" rx="4" fill="url(#greenOffset)"/>
      <text x="227" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">偏移</text>
      <text x="52" y="44" font-size="10" fill="#64748b" text-anchor="middle">高位</text>
      <text x="151" y="44" font-size="10" fill="#64748b" text-anchor="middle">中位</text>
      <text x="227" y="44" font-size="10" fill="#64748b" text-anchor="middle">低位</text>
    </g>

    <!-- 映射几何原理示意图 (组间直接，组内全相联) -->
    <g transform="translate(16, 185)">
      <rect x="0" y="0" width="256" height="210" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#475569">映射示意（组间直接取模，组内全相联）：</text>
      
      <!-- 主存块 -->
      <rect x="12" y="85" width="70" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="47" y="105" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">主存块 i</text>
      <text x="47" y="118" font-size="9" fill="#b45309" text-anchor="middle">(mod 2 = 1)</text>

      <!-- 2路组相联 Cache 结构示意 -->
      <!-- Set 0 -->
      <rect x="115" y="40" width="130" height="60" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="125" y="55" font-size="10" font-weight="700" fill="#475569">组 0 (Set 0)</text>
      <rect x="125" y="62" width="52" height="28" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="151" y="80" font-size="9" fill="#64748b" text-anchor="middle">Way 0</text>
      <rect x="183" y="62" width="52" height="28" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="209" y="80" font-size="9" fill="#64748b" text-anchor="middle">Way 1</text>

      <!-- Set 1 (目标命中组) -->
      <rect x="115" y="112" width="130" height="60" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <text x="125" y="127" font-size="10" font-weight="700" fill="#15803d">组 1 (Set 1 命中组)</text>
      <rect x="125" y="134" width="52" height="28" rx="2" fill="#dcfce7" stroke="#22c55e"/>
      <text x="151" y="152" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">自由入驻</text>
      <rect x="183" y="134" width="52" height="28" rx="2" fill="#dcfce7" stroke="#22c55e"/>
      <text x="209" y="152" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">自由入驻</text>

      <!-- 定向连接箭头 -->
      <path d="M 82 105 L 115 142" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
      <text x="128" y="195" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">组间直接定位，组内2路任意放</text>
    </g>

    <!-- 底部硬核结论总结 -->
    <g transform="translate(16, 412)">
      <rect x="0" y="0" width="256" height="112" rx="6" fill="#f0fdf4"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#166534">核心黄金法则：</text>
      <text x="10" y="38" font-size="11" font-weight="700" fill="#15803d">“组间直接映射，组内全相联”</text>
      <text x="10" y="60" font-size="11" font-weight="700" fill="#166534">考场秒杀特征：</text>
      <text x="10" y="78" font-size="11" fill="#15803d">• 组号 = 主存块号 mod 组数 (S)</text>
      <text x="10" y="96" font-size="11" fill="#15803d">• 巧妙平衡了硬件成本与冲突率</text>
    </g>
  </g>
</svg>
