<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" width="1020" height="720">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #64748b; }
      .th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 700; fill: #1e293b; text-anchor: middle; dominant-baseline: middle; }
      .td { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #334155; dominant-baseline: middle; }
      .td-center { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
      .td-algo { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13.5px; font-weight: 600; fill: #0f172a; dominant-baseline: middle; }
      .td-math { font-family: "JetBrains Mono", Consolas, "SF Mono", monospace, -apple-system, sans-serif; font-size: 13px; text-anchor: middle; dominant-baseline: middle; }
      .stable-badge-bg { fill: #fef2f2; stroke: #f87171; stroke-width: 1; rx: 4; ry: 4; }
      .stable-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 12.5px; font-weight: 700; fill: #dc2626; text-anchor: middle; dominant-baseline: middle; }
      .unstable-badge-bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 4; ry: 4; }
      .unstable-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; dominant-baseline: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13.5px; font-weight: 700; dominant-baseline: middle; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 12px; fill: #475569; }
      .grid-line { stroke: #e2e8f0; stroke-width: 1; }
    </style>
    <filter id="shadow" x="-2%" y="-1%" width="104%" height="103%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1020" height="720" fill="#f8fafc"/>

  <!-- Main Card Container -->
  <rect x="24" y="20" width="972" height="680" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>

  <!-- Header Section -->
  <g transform="translate(48, 52)">
    <circle cx="16" cy="12" r="16" fill="#3b82f6" fill-opacity="0.12"/>
    <path d="M11 17L16 7L21 17M13 14H19" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="10" class="title">8 大经典内部排序算法时空复杂度与稳定性全景图谱</text>
    <text x="44" y="28" class="subtitle">全国计算机技术与软件专业技术资格考试（软件设计师）· 核心速记对比表</text>
  </g>

  <!-- Table Container -->
  <g transform="translate(48, 98)">
    <!-- Table Outer Box -->
    <rect x="0" y="0" width="924" height="428" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Table Header Background -->
    <path d="M 0 8 Q 0 0 8 0 L 916 0 Q 924 0 924 8 L 924 44 L 0 44 Z" fill="#f1f5f9"/>

    <!-- Header Grid Lines & Labels -->
    <!-- Col Boundaries: 0, 110, 240, 360, 480, 590, 680, 924 -->
    <line x1="110" y1="0" x2="110" y2="44" class="grid-line" stroke="#cbd5e1"/>
    <line x1="240" y1="0" x2="240" y2="44" class="grid-line" stroke="#cbd5e1"/>
    <line x1="480" y1="0" x2="480" y2="44" class="grid-line" stroke="#cbd5e1"/>
    <line x1="590" y1="0" x2="590" y2="44" class="grid-line" stroke="#cbd5e1"/>
    <line x1="680" y1="0" x2="680" y2="44" class="grid-line" stroke="#cbd5e1"/>

    <!-- Multi-level Header for Time Complexity -->
    <line x1="240" y1="22" x2="480" y2="22" class="grid-line" stroke="#cbd5e1"/>
    <line x1="360" y1="22" x2="360" y2="44" class="grid-line" stroke="#cbd5e1"/>

    <text x="55" y="22" class="th">类 别</text>
    <text x="175" y="22" class="th">排序方法</text>
    <text x="360" y="11" class="th">时间复杂度</text>
    <text x="300" y="33" class="th" font-size="12px" fill="#475569">平均情况</text>
    <text x="420" y="33" class="th" font-size="12px" fill="#475569">最坏情况</text>
    <text x="535" y="14" class="th">空间复杂度</text>
    <text x="535" y="32" class="th" font-size="11.5px" fill="#64748b">(辅助存储)</text>
    <text x="635" y="22" class="th">稳定性</text>
    <text x="802" y="22" class="th">考场核心特征与避坑题眼</text>

    <!-- Table Horizontal Grid Lines (8 data rows, each height 48px) -->
    <!-- y = 44, 92, 140, 188, 236, 284, 332, 380, 428 -->
    <line x1="0" y1="44" x2="924" y2="44" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="110" y1="92" x2="924" y2="92" class="grid-line"/>
    <line x1="0" y1="140" x2="924" y2="140" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="110" y1="188" x2="924" y2="188" class="grid-line"/>
    <line x1="0" y1="236" x2="924" y2="236" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="110" y1="284" x2="924" y2="284" class="grid-line"/>
    <line x1="0" y1="332" x2="924" y2="332" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="0" y1="380" x2="924" y2="380" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Vertical Column Grid Lines for Table Body -->
    <line x1="110" y1="44" x2="110" y2="428" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="240" y1="44" x2="240" y2="428" class="grid-line"/>
    <line x1="360" y1="44" x2="360" y2="428" class="grid-line"/>
    <line x1="480" y1="44" x2="480" y2="428" class="grid-line"/>
    <line x1="590" y1="44" x2="590" y2="428" class="grid-line"/>
    <line x1="680" y1="44" x2="680" y2="428" class="grid-line"/>

    <!-- ================= ROW 1: 直接插入排序 ================= -->
    <rect x="0" y="44" width="110" height="96" fill="#f0f9ff" fill-opacity="0.6"/>
    <text x="55" y="92" class="th" fill="#0284c7">插入排序</text>

    <text x="126" y="68" class="td-algo">直接插入排序</text>
    <text x="300" y="68" class="td-math" fill="#334155">O(n²)</text>
    <text x="420" y="68" class="td-math" fill="#334155">O(n²)</text>
    <text x="535" y="68" class="td-math" fill="#16a34a" font-weight="600">O(1)</text>
    <!-- 稳定 Badge -->
    <rect x="607" y="56" width="56" height="24" class="stable-badge-bg"/>
    <text x="635" y="68" class="stable-text">稳定</text>
    <text x="696" y="68" class="td" font-size="12px">基本有序时性能极高 <tspan fill="#16a34a" font-weight="600">O(n)</tspan>；初学首选</text>

    <!-- ================= ROW 2: Shell排序 ================= -->
    <text x="126" y="116" class="td-algo">Shell 排序</text>
    <text x="300" y="116" class="td-math" fill="#475569">O(n<tspan dy="-4" font-size="10px">1.3</tspan><tspan dy="4">) ~ O(n²)</tspan></text>
    <text x="420" y="116" class="td-math" fill="#334155">O(n²)</text>
    <text x="535" y="116" class="td-math" fill="#16a34a" font-weight="600">O(1)</text>
    <!-- 不稳定 Badge -->
    <rect x="602" y="104" width="66" height="24" class="unstable-badge-bg"/>
    <text x="635" y="116" class="unstable-text">不稳定</text>
    <text x="696" y="116" class="td" font-size="12px">缩小增量步长分组跳跃；突破 O(n²) 限制</text>

    <!-- ================= ROW 3: 直接选择排序 ================= -->
    <rect x="0" y="140" width="110" height="96" fill="#fefce8" fill-opacity="0.6"/>
    <text x="55" y="188" class="th" fill="#b45309">选择排序</text>

    <text x="126" y="164" class="td-algo">直接选择排序</text>
    <text x="300" y="164" class="td-math" fill="#334155">O(n²)</text>
    <text x="420" y="164" class="td-math" fill="#334155">O(n²)</text>
    <text x="535" y="164" class="td-math" fill="#16a34a" font-weight="600">O(1)</text>
    <!-- 不稳定 Badge -->
    <rect x="602" y="152" width="66" height="24" class="unstable-badge-bg"/>
    <text x="635" y="164" class="unstable-text">不稳定</text>
    <text x="696" y="164" class="td" font-size="12px">比较次数雷打不动恒为 <tspan font-weight="600">n(n-1)/2</tspan>；长距互换</text>

    <!-- ================= ROW 4: 堆排序 ================= -->
    <text x="126" y="212" class="td-algo">堆排序</text>
    <text x="300" y="212" class="td-math" fill="#2563eb" font-weight="600">O(n log₂ n)</text>
    <text x="420" y="212" class="td-math" fill="#2563eb" font-weight="600">O(n log₂ n)</text>
    <text x="535" y="212" class="td-math" fill="#16a34a" font-weight="600">O(1)</text>
    <!-- 不稳定 Badge -->
    <rect x="602" y="200" width="66" height="24" class="unstable-badge-bg"/>
    <text x="635" y="212" class="unstable-text">不稳定</text>
    <text x="696" y="212" class="td" font-size="12px"><tspan fill="#2563eb" font-weight="600">最坏依然稳健 O(n log n)</tspan>；求 Top-K 首选</text>

    <!-- ================= ROW 5: 冒泡排序 ================= -->
    <rect x="0" y="236" width="110" height="96" fill="#f0fdf4" fill-opacity="0.6"/>
    <text x="55" y="284" class="th" fill="#15803d">交换排序</text>

    <text x="126" y="260" class="td-algo">冒泡排序</text>
    <text x="300" y="260" class="td-math" fill="#334155">O(n²)</text>
    <text x="420" y="260" class="td-math" fill="#334155">O(n²)</text>
    <text x="535" y="260" class="td-math" fill="#16a34a" font-weight="600">O(1)</text>
    <!-- 稳定 Badge -->
    <rect x="607" y="248" width="56" height="24" class="stable-badge-bg"/>
    <text x="635" y="260" class="stable-text">稳定</text>
    <text x="696" y="260" class="td" font-size="12px">相邻两两比对沉底；带标志位正序 O(n)</text>

    <!-- ================= ROW 6: 快速排序 ================= -->
    <text x="126" y="308" class="td-algo">快速排序</text>
    <text x="300" y="308" class="td-math" fill="#2563eb" font-weight="600">O(n log₂ n)</text>
    <text x="420" y="308" class="td-math" fill="#dc2626" font-weight="600">O(n²)</text>
    <text x="535" y="308" class="td-math" fill="#2563eb">O(log₂ n)</text>
    <!-- 不稳定 Badge -->
    <rect x="602" y="296" width="66" height="24" class="unstable-badge-bg"/>
    <text x="635" y="308" class="unstable-text">不稳定</text>
    <text x="696" y="308" class="td" font-size="12px"><tspan fill="#2563eb" font-weight="600">综合平均速度王</tspan>；基本有序恶化为单支 O(n²)</text>

    <!-- ================= ROW 7: 归并排序 ================= -->
    <rect x="0" y="332" width="110" height="48" fill="#faf5ff" fill-opacity="0.6"/>
    <text x="55" y="356" class="th" fill="#7e22ce">归并排序</text>

    <text x="126" y="356" class="td-algo">二路归并排序</text>
    <text x="300" y="356" class="td-math" fill="#2563eb" font-weight="600">O(n log₂ n)</text>
    <text x="420" y="356" class="td-math" fill="#2563eb" font-weight="600">O(n log₂ n)</text>
    <text x="535" y="356" class="td-math" fill="#dc2626" font-weight="600">O(n)</text>
    <!-- 稳定 Badge -->
    <rect x="607" y="344" width="56" height="24" class="stable-badge-bg"/>
    <text x="635" y="356" class="stable-text">稳定</text>
    <text x="696" y="356" class="td" font-size="12px">分治合并；时效极稳；<tspan fill="#dc2626" font-weight="600">辅助内存消耗最大 O(n)</tspan></text>

    <!-- ================= ROW 8: 基数排序 ================= -->
    <rect x="0" y="380" width="110" height="48" fill="#fdf2f8" fill-opacity="0.6"/>
    <text x="55" y="404" class="th" fill="#be185d">基数排序</text>

    <text x="126" y="404" class="td-algo">基数排序 (桶排)</text>
    <text x="300" y="404" class="td-math" fill="#7c3aed" font-size="12px">O(d(r+n))</text>
    <text x="420" y="404" class="td-math" fill="#7c3aed" font-size="12px">O(d(r+n))</text>
    <text x="535" y="404" class="td-math" fill="#7c3aed" font-size="12px">O(r+n)</text>
    <!-- 稳定 Badge -->
    <rect x="607" y="392" width="56" height="24" class="stable-badge-bg"/>
    <text x="635" y="404" class="stable-text">稳定</text>
    <text x="696" y="404" class="td" font-size="12px">多关键字分配与收集；不基于数值直接大小比对</text>
  </g>

  <!-- Bottom Fast-Pass Arsenal (3 Strategy Cards) -->
  <g transform="translate(48, 542)">
    <!-- Card 1: 稳定性口诀 -->
    <g transform="translate(0, 0)">
      <rect width="296" height="116" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <circle cx="20" cy="22" r="10" fill="#ef4444" fill-opacity="0.15"/>
      <text x="20" y="26" text-anchor="middle" font-size="12px" fill="#dc2626" font-weight="700">稳</text>
      <text x="38" y="23" class="card-title" fill="#b91c1c">稳定性黄金口诀</text>
      <text x="14" y="52" class="card-desc" font-weight="700" fill="#991b1b">“考研插冒归，心情很稳定；</text>
      <text x="14" y="70" class="card-desc" font-weight="700" fill="#991b1b"> 希选快堆跳，顺序全乱套！”</text>
      <text x="14" y="96" class="card-desc" font-size="11.5px" fill="#64748b">★ 稳定：插入、冒泡、归并、基数 (红字)</text>
    </g>

    <!-- Card 2: 每趟最终位置 -->
    <g transform="translate(314, 0)">
      <rect width="296" height="116" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <circle cx="20" cy="22" r="10" fill="#3b82f6" fill-opacity="0.15"/>
      <text x="20" y="26" text-anchor="middle" font-size="12px" fill="#2563eb" font-weight="700">位</text>
      <text x="38" y="23" class="card-title" fill="#1d4ed8">每趟确定全局最终位置</text>
      <text x="14" y="52" class="card-desc" font-weight="700" fill="#1e40af">“快堆选冒定乾坤（能确定），</text>
      <text x="14" y="70" class="card-desc" font-weight="700" fill="#1e40af"> 插折希归全局懵（不能确定）！”</text>
      <text x="14" y="96" class="card-desc" font-size="11.5px" fill="#64748b">★ 每趟至少有 1 个元素落位：快、堆、选、冒</text>
    </g>

    <!-- Card 3: 复杂度与初始状态反差 -->
    <g transform="translate(628, 0)">
      <rect width="296" height="116" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <circle cx="20" cy="22" r="10" fill="#22c55e" fill-opacity="0.15"/>
      <text x="20" y="26" text-anchor="middle" font-size="12px" fill="#16a34a" font-weight="700">敏</text>
      <text x="38" y="23" class="card-title" fill="#15803d">初始状态有序度极端反差</text>
      <text x="14" y="52" class="card-desc" font-weight="700" fill="#166534">“正序插冒笑嘻嘻（飙升 O(n)），</text>
      <text x="14" y="70" class="card-desc" font-weight="700" fill="#166534"> 快排哭跌成单支（恶化 O(n²)）！”</text>
      <text x="14" y="96" class="card-desc" font-size="11.5px" fill="#64748b">★ 堆排/归并雷打不动 O(n log n)，脱敏抗压王</text>
    </g>
  </g>

  <!-- Watermark / Footer Attribution -->
  <text x="510" y="688" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11px" fill="#94a3b8">软考通关速记知识库 · 数据结构与算法专题图解 · 矢量高清图谱</text>
</svg>
